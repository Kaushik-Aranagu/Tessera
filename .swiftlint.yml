included:
  - App
  - DesignSystem
  - Core
  - Features
  - PilotTests
excluded:
  - DerivedData
  - .build
line_length:
  warning: 120
  error: 160
identifier_name:
  excluded: [id, s, m, l, xs, xl, xxs, xxl]
type_name:
  min_length: 2
disabled_rules:
  - trailing_comma # SwiftFormat owns formatting
