<title>Tessera Inspiration</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Outfit:wght@200;300;400&family=Newsreader:ital,wght@1,400&display=swap">
<style>
/* Layout: a gallery of small live tiles, each one effect. No app, no spec: things to react to and build on. */
:root{--bg:#EFEDE9;--fg:#1D1B1F;--fg2:#5E5A62;--line:rgba(29,27,31,.16);--acc:#8E4A78;
 --sans:'Figtree',system-ui,sans-serif;--num:'Outfit','Figtree',system-ui,sans-serif;--serif:'Newsreader',Georgia,serif;
 --p-bg:#F7F5F1;--ink:#242423;--ink2:#6E6A63;--ink3:#A9A49B;--hair:rgba(36,36,35,.16);
 --c1:#B5452B;--c2:#1E6E77;--c3:#7A5A12;--c4:#5A3F8E;--c5:#2F6A8F;--c6:#8A4570;--c7:#3F6B2A;--c8:#9A2541}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121114;--fg:#F1EEE8;--fg2:#A9A4AE;--line:rgba(241,238,232,.18);--acc:#D59AC4;color-scheme:dark;
 --p-bg:#000;--ink:#E8E3DA;--ink2:#A49E96;--ink3:#6B675F;--hair:rgba(232,227,218,.2);--c1:#F09A7E;--c2:#84C3C9;--c3:#E2C26A;--c4:#B4A3E6;--c5:#8DBAD6;--c6:#E3A3CB;--c7:#A9D48A;--c8:#F08E9C}}
:root[data-theme="dark"]{--bg:#121114;--fg:#F1EEE8;--fg2:#A9A4AE;--line:rgba(241,238,232,.18);--acc:#D59AC4;color-scheme:dark;
 --p-bg:#000;--ink:#E8E3DA;--ink2:#A49E96;--ink3:#6B675F;--hair:rgba(232,227,218,.2);--c1:#F09A7E;--c2:#84C3C9;--c3:#E2C26A;--c4:#B4A3E6;--c5:#8DBAD6;--c6:#E3A3CB;--c7:#A9D48A;--c8:#F08E9C}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;padding-block:36px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1{font-family:var(--num);font-weight:200;font-size:clamp(38px,7vw,64px);line-height:1.03;margin:0;text-wrap:balance}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--fg2);margin:0 0 6px}
h3{font-size:24px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
p{margin:0 0 10px;max-width:68ch}
.lede{font-size:19px;color:var(--fg2);max-width:64ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:30px 28px;margin-top:14px}
.tile{min-width:0}
.fr{width:100%;aspect-ratio:3/1.6;background:var(--p-bg);border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line);position:relative;cursor:pointer;color:var(--ink);font-family:var(--sans);user-select:none;-webkit-user-select:none;touch-action:none}
.fr canvas{position:absolute;inset:0;width:100%;height:100%}
.tile b{display:block;font-size:17px;font-weight:600;margin:10px 0 2px}
.tile p{font-size:14px;color:var(--fg2);margin:0}
.tile p i{color:var(--fg);font-style:normal}
.sec>p{color:var(--fg2)}
/* shared bits */
.big{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-weight:800;font-size:44px;letter-spacing:-.02em;line-height:1}
.ch{display:inline-block;will-change:transform}
.sent{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);font-size:21px;line-height:1.35;font-weight:400}
/* 1 breathing weight */
.wt .ch{font-variation-settings:'wght' var(--w,400);transition:font-variation-settings .6s}
/* 3 liquid fill */
.liq .big{-webkit-text-stroke:1.2px var(--c2);color:transparent}
.liq .fill{position:absolute;inset:0;color:var(--c2);clip-path:inset(var(--cut,70%) 0 0 0);transition:clip-path 1.2s cubic-bezier(.3,.9,.3,1)}
/* 5 fold */
.fold{perspective:900px}
.fold .pg{position:absolute;left:18px;right:18px;top:18px;bottom:18px;transform-style:preserve-3d}
.fold .half{position:absolute;left:0;right:0;height:50%;background:var(--p-bg);display:flex;align-items:center;padding:0 18px;font-size:19px;backface-visibility:hidden;transition:transform .8s cubic-bezier(.4,.1,.2,1)}
.fold .top{top:0;transform-origin:bottom;border-bottom:1px solid var(--hair)}
.fold .bot{bottom:0;transform-origin:top}
.fold.on .top{transform:rotateX(-178deg)}
.fold .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:italic 22px var(--serif);color:var(--c6);opacity:0;transition:opacity .3s .4s}
.fold.on .under{opacity:1}
/* 8 odometer */
.odo{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:var(--num);font-weight:200;font-size:72px;letter-spacing:-.01em;line-height:1}
.odo .d{display:inline-block;height:72px;overflow:hidden;vertical-align:top;width:.56em}
.odo .d span{display:block;transition:transform .7s cubic-bezier(.3,.9,.3,1)}
/* 10 lamp */
.lamp .sent{color:var(--ink);-webkit-mask:radial-gradient(circle 70px at var(--mx,50%) var(--my,50%),#000 30%,transparent 100%);mask:radial-gradient(circle 70px at var(--mx,50%) var(--my,50%),#000 30%,transparent 100%)}
.lamp .ghost{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);font-size:21px;line-height:1.35;color:var(--ink);opacity:.07}
/* 12 elastic rows */
.rows{position:absolute;inset:14px 18px}
.rows .r{height:32px;display:flex;align-items:center;font-size:17px;border-bottom:1px solid var(--hair);transform-origin:left center;will-change:transform}
/* 14 strike that drips */
.drip .sent span{position:relative}
.drip .sent span i{position:absolute;left:0;top:52%;height:1.5px;background:var(--c8);width:0;transition:width .4s ease-out}
.drip .sent span em{position:absolute;top:56%;width:2px;height:0;background:var(--c8);border-radius:1px;transition:height 1.1s cubic-bezier(.5,0,.8,.3)}
/* 16 depth words */
.deep .lay{position:absolute;left:0;right:0;top:50%;text-align:center;font-weight:800;letter-spacing:-.02em;will-change:transform}
/* 17 ribbon */
.rib{position:absolute;inset:0}
/* 18 accordion list */
.acc{position:absolute;inset:14px 18px;perspective:700px}
.acc .row{height:30px;display:flex;align-items:center;font-size:16px;transform-origin:top;transition:transform .5s cubic-bezier(.3,.9,.3,1),opacity .4s;border-bottom:1px solid var(--hair)}
.acc.closed .row:not(:first-child){transform:rotateX(-90deg);opacity:0;height:0;border:0}
/* 19 handwriting */
.hand svg{position:absolute;inset:0;width:100%;height:100%}
</style>

<main>
<header>
<h2>Tessera / inspiration / sheet 252</h2>
<h1>Things that move, for the sake of it.</h1>
<p class="lede">Not tied to any app. A gallery of effects, text treatments and UI moves, each one live, to see what sparks something. Tap or drag any tile. If one feels like Tessera, say so and we build on it; the rest can go.</p>
</header>
<div id="g"></div>
</main>

<script>
(function(){
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COLS=['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'];
const ease=u=>u<0?0:u>1?1:u*u*(3-2*u);
const SECS=[{k:'Words',p:'Ways of putting text together and making it move.'},{k:'Moves',p:'Ways a thing on screen can open, close, finish or change.'},{k:'Textures',p:'Backgrounds and atmospheres that keep a page alive.'}];
const T=[];const add=t=>T.push(t);
const spans=(host,text,cls)=>{host.innerHTML='';return [...text].map(ch=>{const s=document.createElement('span');s.className=cls||'ch';s.textContent=ch===' '?' ':ch;host.appendChild(s);return s})};
const local=(e,el)=>{const r=el.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
function cvs(fr){const c=document.createElement('canvas');fr.appendChild(c);const fit=()=>{c.width=fr.clientWidth*2;c.height=fr.clientHeight*2};fit();new ResizeObserver(fit).observe(fr);return c}

/* ---------------- WORDS ---------------- */
add({sec:'Words',n:'Breathing weight',d:'Letters breathe between light and black with a slow wave. Weight could carry meaning: how recent, how important, how sure.',
 make(fr){fr.classList.add('wt');const b=document.createElement('div');b.className='big';fr.appendChild(b);const S=spans(b,'breathing');let on=true;fr.onclick=()=>on=!on;
  return t=>S.forEach((s,i)=>s.style.setProperty('--w',on?Math.round(300+300*(.5+.5*Math.sin(t*1.6-i*.5))):400))}});
add({sec:'Words',n:'Letter rain',d:'A sentence assembles from letters falling into place. Tap to scatter and rebuild. Could greet you with the day’s sentence.',
 make(fr){const b=document.createElement('div');b.className='sent';b.style.textAlign='center';fr.appendChild(b);const S=spans(b,'Three done, two to go.');let t0=0;fr.onclick=()=>t0=performance.now()/1000;
  return t=>S.forEach((s,i)=>{const u=ease((t-t0-i*.05)*1.4);s.style.display='inline-block';s.style.transform='translateY('+(-120*(1-u))+'px) rotate('+(1-u)*(i%2?40:-40)+'deg)';s.style.opacity=u})}});
add({sec:'Words',n:'Liquid fill',d:'An outlined word fills from the bottom like a glass. Tap to pour. A progress you can read in one glance, with no bar.',
 make(fr){fr.classList.add('liq');const b=document.createElement('div');b.className='big';b.textContent='PACKING';const f=document.createElement('div');f.className='big fill';f.textContent='PACKING';fr.append(b,f);let lvl=.7;fr.onclick=()=>{lvl=lvl>.2?lvl-.25:.95;f.style.setProperty('--cut',(lvl*100)+'%')};f.style.setProperty('--cut','70%');
  return t=>{f.style.clipPath='inset(calc('+(lvl*100)+'% + '+(Math.sin(t*3)*2)+'px) 0 0 0)'}}});
add({sec:'Words',n:'Ripple',d:'Touch a sentence and the letters ripple away from your finger like water. Drag across it.',
 make(fr){const b=document.createElement('div');b.className='sent';fr.appendChild(b);const S=spans(b,'Stretch at eight, then read ten pages.');let drops=[];fr.onpointerdown=fr.onpointermove=e=>{if(e.type==='pointermove'&&e.buttons===0)return;const r=fr.getBoundingClientRect();drops.push({x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()/1000})};
  return t=>{drops=drops.filter(d=>t-d.t<2.2);S.forEach(s=>{const r=s.getBoundingClientRect(),fr0=fr.getBoundingClientRect(),x=r.left-fr0.left+r.width/2,y=r.top-fr0.top+r.height/2;let dy=0;drops.forEach(d=>{const dist=Math.hypot(x-d.x,y-d.y),age=t-d.t,wave=dist-age*220;if(Math.abs(wave)<40)dy+=Math.cos(wave/40*Math.PI/2)*14*(1-age/2.2)});s.style.display='inline-block';s.style.transform='translateY('+(-dy)+'px)'})}}});
add({sec:'Words',n:'Odometer',d:'Numbers roll like a car’s mileage, each digit turning only as far as it must. Tap to change the number.',
 make(fr){const o=document.createElement('div');o.className='odo';fr.appendChild(o);const vals=[185,190,205,185,210];let vi=0;const digs=[];for(let k=0;k<3;k++){const d=document.createElement('div');d.className='d';const s=document.createElement('span');s.innerHTML=Array.from({length:10},(_,i)=>'<div style="height:72px">'+i+'</div>').join('');d.appendChild(s);o.appendChild(d);digs.push(s)}
  const show=v=>{String(v).padStart(3,' ').split('').forEach((ch,k)=>{digs[k].style.transform=ch===' '?'translateY(-720px)':'translateY('+(-72*+ch)+'px)'})};show(vals[0]);fr.onclick=()=>{vi=(vi+1)%vals.length;show(vals[vi])};
  const u=document.createElement('div');u.style.cssText='position:absolute;right:18px;bottom:14px;font:400 14px var(--sans);color:var(--ink2)';u.textContent='lb';fr.appendChild(u);return null}});
add({sec:'Words',n:'Lamp',d:'The page is dark; your finger is a lamp. Only what is under it reads. Drag around. A way to make a long text feel like exploring.',
 make(fr){fr.classList.add('lamp');const g=document.createElement('div');g.className='ghost';g.textContent='Passports in the blue folder. Chargers, the adapter, the book. Leave the big umbrella. Call Asha about Sunday.';const s=document.createElement('div');s.className='sent';s.textContent=g.textContent;fr.append(g,s);
  fr.onpointermove=fr.onpointerdown=e=>{const [x,y]=local(e,fr);s.style.setProperty('--mx',(x*100)+'%');s.style.setProperty('--my',(y*100)+'%')};return null}});
add({sec:'Words',n:'Depth stack',d:'The same word at three depths, drifting with your finger as if the page were a box. Tilt by dragging.',
 make(fr){fr.classList.add('deep');const L=[[88,.06,-1],[60,.25,0],[36,1,1]].map(([sz,a,z])=>{const d=document.createElement('div');d.className='lay';d.style.fontSize=sz+'px';d.style.opacity=a;d.style.color=z>0?'var(--c4)':'var(--ink)';d.textContent='Sunday';fr.appendChild(d);d._z=z;return d});let mx=.5,my=.5;fr.onpointermove=e=>{[mx,my]=local(e,fr)};
  return t=>L.forEach(d=>{const k=d._z*18;d.style.transform='translate('+((mx-.5)*k)+'px,calc(-50% + '+((my-.5)*k)+'px))'})}});
add({sec:'Words',n:'Text on a path',d:'A sentence that walks around a circle and never ends. Could ring a number, a face, or Tess.',
 make(fr){const c=cvs(fr),g=c.getContext('2d');const txt='stretch at eight • read ten pages • water the plants • ';return t=>{const W=c.width/2,H=c.height/2;g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,W,H);g.font='600 15px Figtree';g.fillStyle=css('--ink');const R=Math.min(W,H)*.36,cx=W/2,cy=H/2;let a=-t*.4;[...txt].forEach(ch=>{const w=g.measureText(ch).width;g.save();g.translate(cx+Math.cos(a)*R,cy+Math.sin(a)*R);g.rotate(a+Math.PI/2);g.fillText(ch,-w/2,0);g.restore();a+=w/R});g.font='200 40px Outfit';g.textAlign='center';g.fillText('8',cx,cy+14);g.textAlign='left'}}});
add({sec:'Words',n:'Handwriting',d:'A line writes itself in one stroke, as if by hand, then sits still. Tap to write it again. For Tess’s own words, perhaps.',
 make(fr){fr.classList.add('hand');fr.innerHTML='<svg viewBox="0 0 300 160"><path id="p" d="M20 95 c10 -30 25 -35 30 -10 s-5 30 10 15 s20 -40 30 -20 s-2 35 15 20 s25 -45 35 -25 s0 30 15 18 s10 -30 25 -20 s5 25 20 15 s15 -35 30 -22 s5 30 20 20" fill="none" stroke="var(--c6)" stroke-width="2.2" stroke-linecap="round"/></svg>';const p=fr.querySelector('#p');const L=p.getTotalLength();p.style.strokeDasharray=L;let t0=0;fr.onclick=()=>t0=performance.now()/1000;
  return t=>{p.style.strokeDashoffset=L*(1-ease((t-t0)/2.2))}}});

/* ---------------- MOVES ---------------- */
add({sec:'Moves',n:'Fold',d:'A line of text folds down like paper to show what is under it. Tap to fold and unfold. Different from the Folio: one row, one crease.',
 make(fr){fr.classList.add('fold');fr.innerHTML='<div class="pg"><div class="under">Six kept in the last seven days.</div><div class="half top">Evening stretch</div><div class="half bot" style="color:var(--ink2);font-size:15px">5 steps, about 9 min</div></div>';fr.onclick=()=>fr.classList.toggle('on');return null}});
add({sec:'Moves',n:'Elastic rows',d:'List rows are rubber. Drag down and they stretch and snap back in a wave. A list that feels like a material, not a table.',
 make(fr){const rw=document.createElement('div');rw.className='rows';fr.appendChild(rw);const names=['Passports','Charger','The adapter','The book'];const R=names.map(n=>{const r=document.createElement('div');r.className='r';r.textContent=n;rw.appendChild(r);return r});let y0=null,pull=0,v=0;fr.onpointerdown=e=>{y0=e.clientY};fr.onpointermove=e=>{if(y0!=null)pull=(e.clientY-y0)*.6};fr.onpointerup=()=>{y0=null};
  return t=>{if(y0==null){v+=-pull*.25;v*=.78;pull+=v}R.forEach((r,i)=>{r.style.transform='translateY('+(pull*(i+1)/4)+'px) scaleY('+(1+Math.max(-.5,pull/160))+')'})}}});
add({sec:'Moves',n:'Strike that drips',d:'Checking a thing strikes it through, then the ink drips. Tap a word. A small reward for finishing.',
 make(fr){fr.classList.add('drip');const b=document.createElement('div');b.className='sent';fr.appendChild(b);b.innerHTML=['Passports','Charger','The book'].map(w=>'<span>'+w+'<i></i><em></em></span>').join('<br>');
  b.querySelectorAll('span').forEach(s=>s.onclick=()=>{const on=s.classList.toggle('on');s.querySelector('i').style.width=on?'100%':'0';const e=s.querySelector('em');e.style.left=(30+Math.random()*50)+'%';e.style.height=on?'34px':'0';s.style.color=on?'var(--ink2)':''});return null}});
add({sec:'Moves',n:'Accordion',d:'A section opens by unfolding its rows one after another, each hinged on the one above. Tap to open and close.',
 make(fr){fr.classList.add('acc');const a=document.createElement('div');a.className='acc closed';a.innerHTML=['Body <span style="color:var(--ink2);font-size:13px;margin-left:8px">7</span>','Drink water','Evening stretch','Take screen breaks','Stretch my neck'].map((x,i)=>'<div class="row" style="transition-delay:'+(i*70)+'ms;font-weight:'+(i?400:600)+'">'+x+'</div>').join('');fr.appendChild(a);fr.onclick=()=>a.classList.toggle('closed');return null}});
add({sec:'Moves',n:'Dust off',d:'A panel under dust. Rub it with a finger to read what is there. Something you have not opened in a while could gather dust.',
 make(fr){const c=cvs(fr),g=c.getContext('2d');const txt=document.createElement('div');txt.className='sent';txt.innerHTML='<b>Spanish</b><br><span style="font-size:15px;color:var(--ink2)">Twenty minutes, three times a week.</span>';fr.insertBefore(txt,c);let drawn=false;
  const dust=()=>{g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';g.clearRect(0,0,c.width,c.height);g.fillStyle=css('--p-bg');g.fillRect(0,0,c.width,c.height);for(let i=0;i<9000;i++){g.fillStyle='rgba('+(120+Math.random()*60|0)+','+(110+Math.random()*50|0)+','+(90+Math.random()*40|0)+','+(.15+Math.random()*.35)+')';g.fillRect(Math.random()*c.width,Math.random()*c.height,2,2)}drawn=true};
  const rub=e=>{if(e.type==='pointermove'&&e.buttons===0)return;const r=fr.getBoundingClientRect(),x=(e.clientX-r.left)*2,y=(e.clientY-r.top)*2;g.globalCompositeOperation='destination-out';const gr=g.createRadialGradient(x,y,2,x,y,46);gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-46,y-46,92,92)};fr.onpointerdown=fr.onpointermove=rub;
  return t=>{if(!drawn&&c.width)dust()}}});
add({sec:'Moves',n:'Pull apart',d:'Your keeper from round one. A name pulls apart into what is inside it. Tap or pull down.',
 make(fr){const c=cvs(fr),g=c.getContext('2d');let p=0,goal=0;fr.onpointerdown=()=>goal=goal?0:1;const inside=['tortillas','cilantro','limes','chicken','onions','peppers'];
  return t=>{const W=c.width/2,H=c.height/2;g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,W,H);p+=(goal-p)*(RM?1:.09);const e=ease(p);g.font='900 '+(H*.36)+'px Figtree';const w=g.measureText('TACOS').width;let x=(W-w)/2;[...'TACOS'].forEach((ch,i)=>{const cw=g.measureText(ch).width;g.fillStyle=css('--c3');g.fillText(ch,x+(i-2)*e*W*.09,H*.6-e*H*.18);x+=cw});
   if(e>.04){g.font='500 13px Figtree';inside.forEach((n,i)=>{const col=i%2,row=i>>1;g.globalAlpha=e;g.fillStyle=i<3?css('--c8'):css('--ink');g.fillText(n,W*.22+col*W*.4+(1-e)*(col?-30:30),H*.56+row*16*e+12);g.globalAlpha=1})}}}});
add({sec:'Moves',n:'Undo pendulum',d:'Ten seconds of Undo as a pendulum that slows and stops. Tap to start it. No numbers, no shrinking bar; you can feel the time left.',
 make(fr){const c=cvs(fr),g=c.getContext('2d');let t0=-99;fr.onclick=()=>t0=performance.now()/1000;return t=>{const W=c.width/2,H=c.height/2;g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,W,H);const age=t-t0,left=Math.max(0,1-age/10);const a=Math.sin(age*3.2)*.6*left;const px=W/2+Math.sin(a)*H*.55,py=18+Math.cos(a)*H*.55;g.strokeStyle=css('--ink2');g.lineWidth=1;g.beginPath();g.moveTo(W/2,18);g.lineTo(px,py);g.stroke();g.fillStyle=left>0?css('--c6'):css('--ink3');g.beginPath();g.arc(px,py,9,0,7);g.fill();g.fillStyle=css('--ink2');g.font='500 14px Figtree';g.fillText(left>0?'Passports, done. Undo':'Done.',18,H-18)}}});
add({sec:'Moves',n:'Shuffle to sort',d:'Rows swap places with a real shuffle: each one lifts, slides and drops, so your eye can follow where it went. Tap to sort another way.',
 make(fr){const rw=document.createElement('div');rw.className='rows';fr.appendChild(rw);const D=[['Drink water',7],['Evening stretch',20],['Read ten pages',21],['Tidy a little',17]];const R=D.map(([n,h],i)=>{const r=document.createElement('div');r.className='r';r.style.cssText='position:absolute;left:0;right:0;transition:transform .55s cubic-bezier(.3,.9,.3,1),top .55s cubic-bezier(.3,.9,.3,1)';r.innerHTML=n+'<span style="margin-left:auto;font:300 14px var(--num);color:var(--ink2)">'+h+':00</span>';r.style.top=(i*32)+'px';rw.appendChild(r);r._h=h;r._n=n;return r});let byTime=false;
  fr.onclick=()=>{byTime=!byTime;const order=[...R].sort((a,b)=>byTime?a._h-b._h:a._n.localeCompare(b._n));order.forEach((r,i)=>{const from=parseFloat(r.style.top),to=i*32;if(from!==to){r.style.transform='scale(1.04)';r.style.zIndex=2;setTimeout(()=>{r.style.top=to+'px'},60);setTimeout(()=>{r.style.transform='';r.style.zIndex=''},600)}})};return null}});

/* ---------------- TEXTURES ---------------- */
add({sec:'Textures',n:'Paper grain',d:'A faint moving grain, like paper under changing light. Almost nothing, but the page is never dead.',
 make(fr){const c=cvs(fr),g=c.getContext('2d');return t=>{if(RM&&t>1)return;const W=c.width,H=c.height;g.setTransform(1,0,0,1,0,0);g.fillStyle=css('--p-bg');g.fillRect(0,0,W,H);const id=g.getImageData(0,0,W,H),d=id.data;const dark=css('--p-bg')==='#000';for(let i=0;i<d.length;i+=16){const n=(Math.random()-.5)*(dark?18:14);d[i]+=n;d[i+1]+=n;d[i+2]+=n}g.putImageData(id,0,0);g.fillStyle=css('--ink');g.font='600 20px Figtree';g.fillText('Notes',36,H/2+8)}}});
add({sec:'Textures',n:'Heat shimmer',d:'The thing that is live wavers like air over a road. Nothing else moves. One way to say “this one is running” without a color or a dot.',
 make(fr){const b=document.createElement('div');b.className='sent';b.innerHTML='<div style="color:var(--ink2);font-size:14px">Running</div><div id="hs" style="font-size:28px;font-weight:600">Push A</div><div style="color:var(--ink2);font-size:15px">Bench press, set 2</div>';fr.appendChild(b);const S=spans(b.querySelector('#hs'),'Push A');return t=>S.forEach((s,i)=>{s.style.transform='translate('+Math.sin(t*7+i*1.3)*.8+'px,'+Math.sin(t*9+i)*1.4+'px) skewX('+Math.sin(t*5+i)*3+'deg)';s.style.filter='blur('+(.2+.3*Math.abs(Math.sin(t*6+i)))+'px)'})}});
add({sec:'Textures',n:'Hairline web',d:'Hold a thing and fine threads reach out to everything related to it: the note that mentions it, the list it is on, the day it happens. Press and hold.',
 make(fr){const c=cvs(fr),g=c.getContext('2d');const N=[['Tacos',.5,.5,1],['Groceries',.18,.3,0],['Kitchen',.82,.28,0],['Tonight',.22,.78,0],['Cilantro note',.8,.78,0]];let hold=0,down=false;fr.onpointerdown=()=>down=true;fr.onpointerup=fr.onpointerleave=()=>down=false;
  return t=>{const W=c.width/2,H=c.height/2;g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,W,H);hold+=((down?1:0)-hold)*(RM?1:.08);N.forEach(([n,x,y,hub],i)=>{if(!hub){const u=ease(hold*1.6-i*.12);g.strokeStyle='rgba(138,69,112,'+(.7*u)+')';g.lineWidth=.8;g.beginPath();g.moveTo(W*.5,H*.5);g.lineTo(W*.5+(x-.5)*W*u,H*.5+(y-.5)*H*u);g.stroke()}g.fillStyle=hub?css('--c3'):css('--ink2');g.globalAlpha=hub?1:.35+.65*hold;g.font=(hub?'700 24px':'500 14px')+' Figtree';g.textAlign='center';g.fillText(n,x*W,y*H+5);g.globalAlpha=1});g.textAlign='left'}}});
add({sec:'Textures',n:'Embers',d:'When something finishes, embers lift from it and go out, instead of confetti. Tap. Could be petals, leaves, sparks or snow by room.',
 make(fr){const c=cvs(fr),g=c.getContext('2d');let ps=[];const b=document.createElement('div');b.className='big';b.style.fontSize='30px';b.textContent='Push A, done.';fr.appendChild(b);fr.onclick=()=>{for(let i=0;i<40;i++)ps.push({x:.3+Math.random()*.4,y:.55,vx:(Math.random()-.5)*.08,vy:-.1-Math.random()*.25,l:1,s:1+Math.random()*2})};
  return t=>{const W=c.width/2,H=c.height/2;g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,W,H);ps=ps.filter(p=>{p.l-=.012;p.x+=p.vx*.016+Math.sin(t*5+p.y*20)*.001;p.y+=p.vy*.016;p.vy+=.02*.016;if(p.l<=0)return false;g.fillStyle='rgba(255,'+(140+p.l*90|0)+',60,'+p.l+')';g.beginPath();g.arc(p.x*W,p.y*H,p.s*p.l,0,7);g.fill();return true})}}});
add({sec:'Textures',n:'Time of day',d:'The page ground slowly takes the color of the hour: morning, noon, evening, night. Tap to move four hours. Everything on it stays the same.',
 make(fr){const c=cvs(fr),g=c.getContext('2d');let h=8;fr.onclick=()=>h=(h+4)%24;let cur=8;const stops={2:['#1C2240','#2A3658'],8:['#F6D4B4','#CFE0E8'],14:['#CFE3F0','#F7F2E3'],20:['#F2B07A','#B16B8C']};const mix=(a,b,u)=>{const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const x=p(a),y=p(b);return 'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*u))+')'};
  return t=>{const W=c.width/2,H=c.height/2;g.setTransform(2,0,0,2,0,0);cur+=(h-cur)*(RM?1:.03);const keys=[2,8,14,20,26];let k=0;while(cur>=keys[k+1])k++;const a=stops[keys[k]],bq=stops[keys[k+1]%24===2?2:keys[k+1]],u=(cur-keys[k])/6;const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,mix(a[0],bq[0],u));gr.addColorStop(1,mix(a[1],bq[1],u));g.fillStyle=gr;g.fillRect(0,0,W,H);g.fillStyle=cur>21||cur<6?'#E8E3DA':'#242423';g.font='600 22px Figtree';g.fillText(['Night','Morning','Afternoon','Evening'][Math.floor(((cur+2)%24)/6)],24,H/2+8);g.font='200 40px Outfit';g.fillText(Math.round(cur)%12||12,W-70,H/2+14)}}});

/* ---------------- build ---------------- */
const g=document.getElementById('g');SECS.forEach(S=>{const sec=document.createElement('section');sec.className='sec';sec.innerHTML='<h3>'+S.k+'</h3><p>'+S.p+'</p>';const gr=document.createElement('div');gr.className='grid';sec.appendChild(gr);g.appendChild(sec);
 T.filter(t=>t.sec===S.k).forEach(t=>{const tile=document.createElement('div');tile.className='tile';const fr=document.createElement('div');fr.className='fr';tile.appendChild(fr);tile.insertAdjacentHTML('beforeend','<b>'+t.n+'</b><p>'+t.d+'</p>');gr.appendChild(tile);t.fr=fr;t.tick=t.make(fr);new IntersectionObserver(es=>es.forEach(en=>{t.vis=en.isIntersecting})).observe(fr)})});
let t0=performance.now();function loop(now){const t=(now-t0)/1000;T.forEach(x=>{if(x.tick&&x.vis){try{x.tick(t)}catch(e){if(!x.err){x.err=1;console.error(x.n,e)}}}});requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
