<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>No dots</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Before/after for docs/design/no-dots.md, in Porcelain. Left: today's coloured markers. Right: no markers; colour arrives through moments (ink drying, a strike painted in the class colour, a wash when a row becomes next, day marks landing wet and drying, the habit thread). -->
<style>
:root{--ink:23,20,31;--ctx:#6A4C9C;--tess:#2450D8;--live:226,67,42;--now:240,165,0;--health:18,147,106;--training:204,63,104;--house:cubic-bezier(.2,.8,.2,1);--settle:cubic-bezier(.3,1.3,.5,1)}
html,body{margin:0;background:#E9E6EE}
body{font-family:'Inter Tight',sans-serif;width:860px;height:960px;color:rgb(var(--ink));transform-origin:0 0}
body.x2{transform:scale(2)}
.pair{position:absolute;left:30px;top:36px;display:flex;gap:40px}
.col{width:390px}
.cap{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(var(--ink),.66);height:34px}
.ph{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;border-radius:0}
.scene{position:absolute;inset:0;transition:opacity .5s var(--house)}
.abs{position:absolute}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;white-space:nowrap}
.sec{color:rgba(var(--ink),.66)}
.hero{font-size:56px;font-weight:500;letter-spacing:-.035em;line-height:60px;text-wrap:balance}
.row{position:absolute;left:22px;right:22px;height:48px;display:flex;align-items:center;gap:16px;font-size:21px;transition:transform .42s var(--house),opacity .42s var(--house)}
.row .t{position:relative;white-space:nowrap}
.row .tm{margin-left:auto;font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(var(--ink),.66)}
.dab{width:18px;height:15px;flex:none;border-radius:52% 48% 60% 40%/55% 45% 55% 45%;filter:blur(.6px);transform:rotate(-6deg);transition:background .5s,opacity .5s}
.wash{position:absolute;left:-30px;top:-20px;right:-10px;bottom:-20px;background:radial-gradient(60% 50% at 30% 50%,rgba(106,76,156,.16),rgba(106,76,156,0) 70%);opacity:0;transform:scale(.7);pointer-events:none}
.strike{position:absolute;left:-4px;top:50%;overflow:visible;pointer-events:none}
.strike path{fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .42s var(--house),stroke 1s var(--house)}
.ink-over{position:absolute;left:0;top:0;color:rgb(var(--ink));clip-path:inset(0 100% 0 0);transition:clip-path .7s var(--house)}
.soul{position:absolute;right:30px;bottom:44px;width:46px;height:40px}
.soul i{position:absolute;width:20px;height:17px;border-radius:52% 48% 60% 40%/55% 45% 55% 45%;filter:blur(1.2px)}
/* review */
.week{position:absolute;left:22px;right:22px;display:flex}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.slot{position:relative;width:34px;height:30px}
.fill{position:absolute;inset:0;border-radius:52% 48% 60% 40%/55% 45% 55% 45%;filter:blur(1px);transition:opacity .9s var(--house),transform .42s var(--settle)}
.day .l{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(var(--ink),.66)}
.day.today .l{color:rgb(var(--ink))}
.hab{position:absolute;left:22px;right:22px;height:44px}
.hab .name{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(var(--ink),.66)}
.thread{position:absolute;left:0;top:28px;width:346px;height:12px;overflow:visible}
.thread path{transition:stroke-dashoffset .5s var(--house),stroke 1s var(--house)}
.dots{position:absolute;left:0;right:0;top:28px;display:flex}
.dots span{flex:1;display:flex;justify-content:center}
.dots b{width:12px;height:12px;border-radius:50%;transition:background .3s}
.tessline{font-size:21px;line-height:28px;color:var(--tess);transition:opacity .42s var(--house),transform .42s var(--house)}
.note{position:absolute;left:30px;top:930px;width:800px;font-size:16px;font-weight:700;letter-spacing:.08em;color:rgba(var(--ink),.66)}
</style>
</head>
<body>
<div class="pair">
 <div class="col"><div class="cap">BEFORE · TODAY'S BUILD</div><div class="ph" id="L"></div></div>
 <div class="col"><div class="cap">AFTER · NO DOTS, COLOUR IN MOMENTS</div><div class="ph" id="R"></div></div>
</div>
<div class="note" id="note"></div>
<script>
if(location.search.includes('x2'))document.body.classList.add('x2');
const C={live:'rgb(var(--live))',ctx:'var(--ctx)',tess:'var(--tess)',now:'rgb(var(--now))',health:'rgb(var(--health))'};
const ROWS=[['Push Day A','6:00 PM','live'],['Stretch & mobility','7:15 PM','ctx'],['Read','9:00 PM','ctx']];
const SOUL=`<div class="soul"><i style="left:0;top:4px;background:radial-gradient(closest-side,#2450D8,rgba(36,80,216,.2))"></i><i style="left:22px;top:2px;background:radial-gradient(closest-side,#E2432A,rgba(226,67,42,.2))"></i><i style="left:12px;top:20px;background:radial-gradient(closest-side,#F0A500,rgba(240,165,0,.2))"></i></div>`;
const stroke=(w,col)=>`<svg class="strike" width="${w+8}" height="10" style="margin-top:-5px"><path d="M0 5 C ${w*.3} 3, ${w*.6} 6.5, ${w+8} 4" stroke="${col}" stroke-dasharray="${w+20}" stroke-dashoffset="${w+20}"/></svg>`;
function home(side){
  const dots=side==='L';
  let h=`<div class="scene" id="${side}home">
  <div class="abs lbl sec" style="left:22px;top:58px">THURSDAY 16 OCT</div>
  <div class="abs hero" style="left:22px;top:118px;width:340px">Three things left today</div>
  <div class="abs lbl sec" style="left:22px;top:318px">NEXT</div>`;
  ROWS.forEach(([t,tm,c],i)=>{h+=`<div class="row" id="${side}r${i}" style="top:${352+i*48}px">${dots?`<div class="dab" style="background:radial-gradient(closest-side,${C[c]},${C[c]} 55%,transparent)"></div>`:''}<div class="t" style="font-weight:${i===0?500:400}">${!dots&&i===1?'<div class="wash"></div>':''}${t}</div><div class="tm">${tm}</div></div>`});
  h+=`<div class="row" id="${side}ghost" style="top:${352+3*48}px">${dots?`<div class="dab" id="${side}gd" style="background:radial-gradient(closest-side,var(--tess),var(--tess) 55%,transparent);filter:blur(1.5px)"></div>`:''}<div class="t" style="color:var(--tess)"><span>Call Mom</span>${dots?'':'<span class="ink-over">Call Mom</span>'}</div><div class="tm" id="${side}gt" style="color:var(--tess)">9:30 PM</div></div>`;
  h+=`<div class="abs tessline" id="${side}said" style="left:22px;top:600px;width:330px;opacity:0;transform:translateY(10px)">Added Call Mom at 9:30.</div>`;
  return h+SOUL+`</div>`;
}
// review
const WEEK=[['M','tr'],['T','rest'],['W','tr'],['T','tr'],['F',''],['S',''],['S','']];
const HABITS=[['READ','r',['d','d','d','',null,null,null],'now'],['TRAIN','t',['d','','d','d',null,null,null],'health']];
function seg(a,b){const x0=a*49.4+8,x1=b*49.4+41.4;return `M${x0} 6 C ${x0+(x1-x0)*.3} 4.2, ${x0+(x1-x0)*.7} 7.4, ${x1} 5.2 L ${x1-1} 8.4 C ${x0+(x1-x0)*.6} 9.6, ${x0+(x1-x0)*.3} 9, ${x0+1} 8.6 Z`}
function runs(days){const out=[];let s=-1;days.forEach((d,i)=>{if(d==='d'&&s<0)s=i;if(d!=='d'&&s>=0){out.push([s,i-1]);s=-1}});if(s>=0)out.push([s,days.length-1]);return out}
function review(side){
  const dots=side==='L';
  let h=`<div class="scene" id="${side}rev" style="opacity:0">
  <div class="abs lbl sec" style="left:22px;top:58px">‹ HOME</div>
  <div class="abs" style="left:22px;top:150px;font-size:21px;color:var(--ctx)">the week so far</div>
  <div class="abs hero" style="left:22px;top:186px;width:340px">Three sessions in</div>
  <div class="week" style="top:330px">`;
  WEEK.forEach(([l,k],i)=>{h+=`<div class="day${i===3?' today':''}"><div class="slot">${k==='tr'?`<div class="fill" id="${side}w${i}" style="background:radial-gradient(closest-side,rgba(var(--health),.92),rgba(var(--health),.7) 50%,rgba(var(--health),0));opacity:0;transform:scale(.6)"></div>`:k==='rest'?`<svg width="34" height="30" id="${side}w${i}" style="opacity:0;transition:opacity .6s"><path d="M1 17.5 C 9 15.2, 22 14.8, 33 16.2 L 32.2 21.4 C 22 22.6, 10 22.4, 1.8 21.6 Z" fill="rgba(var(--ink),.5)"/></svg>`:''}</div><div class="l">${l}</div></div>`});
  h+=`</div>`;
  HABITS.forEach(([n,id,days,col],j)=>{
    const done=days.filter(d=>d==='d').length, target=id==='r'?5:4;
    h+=`<div class="hab" style="top:${420+j*64}px"><div class="name"><span id="${side}${id}n">${n} · ${done} OF ${target}</span></div>`;
    if(dots){h+=`<div class="dots">${days.map((d,i)=>`<span><b id="${side}${id}d${i}" style="background:${d==='d'?`rgb(var(--${col}))`:`rgba(var(--${col}),.14)`};opacity:0;transition:opacity .3s, background .3s"></b></span>`).join('')}</div>`}
    else{h+=`<svg class="thread" viewBox="0 0 346 12">${runs(days).map(([a,b],k)=>`<path id="${side}${id}s${k}" d="${seg(a,b)}" fill="rgb(var(--${col}))" style="clip-path:inset(0 100% 0 0);transition:clip-path .55s var(--house),fill 1.1s var(--house),opacity 1.1s var(--house)"/>`).join('')}</svg>`}
    h+=`</div>`;
  });
  h+=`<div class="abs tessline" id="${side}tess" style="left:22px;top:572px;width:330px;opacity:0;transform:translateY(10px)">Read, 4 of 5 this week.</div>`;
  return h+SOUL+`</div>`;
}
for(const s of ['L','R'])document.getElementById(s).innerHTML=home(s)+review(s);
const $=id=>document.getElementById(id);
const at=(t,f)=>setTimeout(f,t);
const note=t=>$('note').textContent=t;
function ghostBreath(on){for(const s of['L','R']){$(s+'ghost').animate([{opacity:.5},{opacity:.66},{opacity:.5}],{duration:3200,iterations:on?Infinity:0})}}
document.fonts.ready.then(()=>{
 document.body.dataset.start='1';
 // widths for strikes
 for(const s of['L','R']){const t=$(s+'r0').querySelector('.t');t.insertAdjacentHTML('beforeend',stroke(t.offsetWidth,s==='L'?'rgba(23,20,31,.85)':'rgb(226,67,42)'))}
 ghostBreath(true);
 note('A TESS GHOST DRIES INTO INK. NO COBALT DOT BEFORE IT.');
 at(1500,()=>{ // accept the ghost
   $('Lgd').style.background='radial-gradient(closest-side,var(--ctx),var(--ctx) 55%,transparent)';$('Lgd').style.filter='blur(.6px)';
   $('Lghost').querySelector('.t').style.color='rgb(var(--ink))';$('Lgt').style.color='rgba(var(--ink),.66)';
   $('Rghost').querySelector('.ink-over').style.clipPath='inset(0 0 0 0)';
   setTimeout(()=>{$('Rgt').style.transition='color .7s';$('Rgt').style.color='rgba(var(--ink),.66)'},250);
   $('Lghost').getAnimations().forEach(a=>a.cancel());$('Rghost').getAnimations().forEach(a=>a.cancel());
   $('Rsaid').style.opacity=1;$('Rsaid').style.transform='none';
 });
 at(3100,()=>{note('FINISHING: THE STRIKE IS PAINTED IN THE ROW\'S COLOUR, THEN DRIES TO INK.');
   for(const s of['L','R'])$(s+'r0').querySelector('path').style.strokeDashoffset=0;});
 at(3700,()=>{$('Rr0').querySelector('path').style.stroke='rgba(23,20,31,.45)';$('Rr0').querySelector('.t').style.transition='color 1s';$('Rr0').querySelector('.t').style.color='rgba(23,20,31,.45)';$('Lr0').querySelector('.t').style.color='rgba(23,20,31,.45)'});
 at(4500,()=>{note('THE NEW NEXT ROW GETS ONE FAINT WASH, THEN RESTS IN INK.');
   for(const s of['L','R']){$(s+'r0').style.opacity=0;$(s+'r0').style.transform='translateX(24px)';
     ['r1','r2','ghost'].forEach(r=>{$(s+r).style.transform='translateY(-48px)'});
     $(s+'r1').querySelector('.t').style.fontWeight=500;}
   $('Rsaid').style.opacity=0;
   const w=$('Rr1').querySelector('.wash');w.animate([{opacity:0,transform:'scale(.7)'},{opacity:1,transform:'scale(1)',offset:.3},{opacity:0,transform:'scale(1.08)'}],{duration:1500,easing:'cubic-bezier(.2,.8,.2,1)'});
 });
 at(7000,()=>{note('');for(const s of['L','R']){$(s+'home').style.opacity=0;$(s+'rev').style.opacity=1}});
 at(7500,()=>{note('DAY MARKS STAY: THEY ARE THE DATA. THEY LAND WET, THEN DRY TO A QUIET TINT.');
   WEEK.forEach(([l,k],i)=>{if(!k)return;
     at(i*90,()=>{for(const s of['L','R']){const e=$(s+'w'+i);e.style.opacity=1;e.style.transform='none'}});
     if(k==='tr')at(1100+i*90,()=>{$('Rw'+i).style.opacity=.45});
   });
 });
 at(8900,()=>{note('HABITS: ONE PAINTED THREAD UNDER THE WEEK, NOT A ROW OF DOTS.');
   HABITS.forEach(([n,id,days,col],j)=>{
     days.forEach((d,i)=>at(j*200+i*50,()=>{const b=$('L'+id+'d'+i);if(b)b.style.opacity=1}));
     runs(days).forEach((r,k)=>at(j*200+r[0]*80,()=>{const p=$('R'+id+'s'+k);p.style.clipPath='inset(0 0 0 0)';setTimeout(()=>{p.style.opacity=.45},900)}));
   });
 });
 at(11000,()=>{note('A CHECK-IN: TODAY JOINS THE THREAD WET, THE COUNT TICKS, TESS SAYS IT ONCE.');
   $('Lrd3').style.background='rgb(var(--now))';$('Lrn').textContent='READ · 4 OF 5';
   const p=$('Rrs0');p.style.transition='none';p.style.opacity=1;p.style.clipPath='inset(0 0 0 0)';
   // extend the run to Thursday, painting the new stretch wet
   const svg=p.ownerSVGElement;svg.insertAdjacentHTML('beforeend',`<path id="Rext" d="${seg(2.6,3)}" fill="rgb(var(--now))" style="clip-path:inset(0 100% 0 0);transition:clip-path .5s var(--house),opacity 1.1s var(--house)"/>`);
   requestAnimationFrame(()=>requestAnimationFrame(()=>{$('Rext').style.clipPath='inset(0 0 0 0)'}));
   setTimeout(()=>{$('Rrn').textContent='READ · 4 OF 5';$('Rrn').animate([{transform:'translateY(-4px)',opacity:.4},{transform:'none',opacity:1}],{duration:360,easing:'cubic-bezier(.3,1.3,.5,1)'});
     $('Rtess').style.opacity=1;$('Rtess').style.transform='none'},420);
   setTimeout(()=>{p.style.transition='opacity 1.1s var(--house)';p.style.opacity=.45;$('Rext').style.opacity=.45},1500);
 });
 at(14200,()=>{document.body.dataset.done='1'});
});
</script>
</body>
</html>
