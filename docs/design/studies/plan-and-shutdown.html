<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Plan and Shutdown</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Motion study for M4 slices 6, 10b and 7 (docs/design/m4-steers.md). Plays once on load; add ?x2 to render at 2x. -->
<style>
:root{--ink:#2B2440;--mute:#A39AAE;--ctx:#7A5C8E;--sub:#6E6480;--verm:#C8452F;--cobalt:#2E6DA4;--amber:#E0A35C}
body{margin:0;background:#EFE7DC}
.ph{position:relative;width:390px;height:844px;overflow:hidden;color:var(--ink);font-family:'Inter Tight',sans-serif;
 background:radial-gradient(60% 40% at 85% 6%,#F7E6B8 0%,rgba(247,230,184,0) 70%),radial-gradient(70% 45% at 0% 30%,#D8CBE6 0%,rgba(216,203,230,0) 70%),radial-gradient(80% 50% at 100% 70%,#BFD8E2 0%,rgba(191,216,226,0) 70%),radial-gradient(70% 40% at 10% 95%,#F2D3C4 0%,rgba(242,211,196,0) 70%),#F4EEE4}
.abs{position:absolute}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;color:var(--sub)}
.ctx{font-size:21px;font-weight:400;color:var(--ctx)}
.hero{font-weight:500;font-size:56px;line-height:1;letter-spacing:-.04em}
.key{border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 .5px rgba(43,36,64,.5),0 6px 18px rgba(43,36,64,.14);overflow:hidden}
.row{position:absolute;left:22px;right:22px;height:48px;display:grid;grid-template-columns:30px 1fr auto;align-items:center}
.dab{width:18px;height:15px;border-radius:55% 45% 60% 40%/50% 60% 40% 50%;filter:blur(.4px)}
.nm{font-size:21px;white-space:nowrap}
#finger{width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(43,36,64,.16);box-shadow:0 0 0 1.5px rgba(255,255,255,.7);opacity:0;z-index:20;pointer-events:none}
.d{position:absolute;width:76px;height:70px;margin:-35px 0 0 -38px;border-radius:52% 48% 60% 40%/55% 45% 55% 45%;background:radial-gradient(closest-side,rgba(var(--c),.8) 0%,rgba(var(--c),.6) 40%,rgba(var(--c),0) 100%);mix-blend-mode:multiply;filter:blur(4px)}
.r{--c:200,69,47;--x:-14px;--y:-8px}.b{--c:46,109,164;--x:14px;--y:-8px}.y{--c:224,179,65;--x:0px;--y:13px}
@keyframes idle{0%,100%{transform:translate(var(--x),calc(var(--y) - 6px)) scale(.78)}50%{transform:translate(var(--x),calc(var(--y) + 6px)) scale(.86)}}
@keyframes wet{0%,100%{opacity:.5}50%{opacity:.68}}
@keyframes wetTip{0%,100%{transform:scale(1);opacity:.75;filter:blur(3px)}50%{transform:scale(1.35);opacity:.4;filter:blur(6px)}}
</style>
</head>
<body>
<div class="ph" id="ph">
  <div id="dusk" class="abs" style="inset:0;opacity:0;background:radial-gradient(70% 45% at 90% 0%,rgba(200,69,47,.32),rgba(200,69,47,0) 70%),radial-gradient(80% 55% at 0% 45%,rgba(122,92,142,.42),rgba(122,92,142,0) 70%),radial-gradient(70% 45% at 100% 95%,rgba(224,163,92,.3),rgba(224,163,92,0) 70%),rgba(214,200,224,.55)"></div>
  <svg width="390" height="844" class="abs" style="inset:0;mix-blend-mode:multiply;opacity:.3;pointer-events:none" aria-hidden="true">
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .45  0 0 0 .55 0"/></filter>
    <rect width="390" height="844" filter="url(#grain)"/>
  </svg>

  <div class="abs lbl" style="left:22px;right:22px;top:58px;display:grid;grid-template-columns:1fr 1fr 1fr">
    <span style="color:var(--mute)">REVIEW</span><span style="color:var(--ink);text-align:center">TODAY</span><span style="color:var(--mute);text-align:right">TRAINING</span>
  </div>
  <span class="abs" style="left:163px;top:84px;width:64px;height:4px;border-radius:2px 6px 3px 5px;background:var(--verm);filter:blur(.5px)"></span>

  <span id="dayLabel" class="abs ctx" style="left:22px;top:100px;color:var(--ink)">Thursday morning</span>
  <svg id="daySvg" width="346" height="56" viewBox="0 0 346 56" class="abs" style="left:22px;top:134px;overflow:visible" aria-hidden="true">
    <defs><filter id="wetF" filterUnits="userSpaceOnUse" x="-20" y="-20" width="390" height="96"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
    <linearGradient id="day" x1="0" x2="1"><stop offset="0" stop-color="#9EC3D6"/><stop offset=".3" stop-color="#8FB58A"/><stop offset=".55" stop-color="#7A5C8E"/><stop offset=".8" stop-color="#E0A35C"/><stop offset="1" stop-color="#C8452F"/></linearGradient></defs>
    <path id="guide" d="M4 28 L 342 28" fill="none" stroke="#2B2440" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="2 6"/>
    <g id="marks"></g>
    <path id="dayStroke" d="M4 28 C 120 25, 230 31, 342 27" fill="none" stroke="url(#day)" stroke-width="20" stroke-linecap="round" filter="url(#wetF)" opacity=".85" stroke-dasharray="340" stroke-dashoffset="340"/>
  </svg>
  <span id="tip" class="abs" style="left:43px;top:149px;width:26px;height:26px;border-radius:50%;background:var(--amber);opacity:0"></span>
  <span id="tmrw" class="abs" style="left:352px;top:147px;width:30px;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(224,163,92,.9),rgba(224,163,92,0));filter:blur(3px);opacity:0"></span>

  <div id="nowLine" class="abs ctx" style="left:22px;top:222px">this morning, three meetings</div>
  <div id="hero" class="abs hero" style="left:20px;right:20px;top:252px">Four hours<br>free</div>
  <div id="sub" class="abs ctx" style="left:22px;top:382px;color:var(--ink)">slept 6h40</div>

  <!-- energy: the rep drum, 1 to 5 -->
  <div id="energy" class="abs" style="left:236px;top:344px;width:132px;height:96px">
    <span class="lbl abs" style="left:0;top:38px">ENERGY</span>
    <div class="abs" style="left:92px;top:0;width:40px;height:96px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)">
      <div id="drum" class="abs" style="left:0;top:0;width:40px;transform:translateY(-72px)">
        <div style="height:48px;font-size:48px;font-weight:300;line-height:48px;text-align:center;font-variant-numeric:tabular-nums">5</div>
        <div style="height:48px;font-size:48px;font-weight:300;line-height:48px;text-align:center">4</div>
        <div style="height:48px;font-size:48px;font-weight:300;line-height:48px;text-align:center">3</div>
        <div style="height:48px;font-size:48px;font-weight:300;line-height:48px;text-align:center">2</div>
        <div style="height:48px;font-size:48px;font-weight:300;line-height:48px;text-align:center">1</div>
      </div>
    </div>
    <span id="eWord" class="lbl abs" style="left:0;top:62px;color:var(--ink)">OKAY</span>
  </div>

  <div id="key" class="abs key" style="left:22px;width:346px;top:452px;height:58px;background:var(--cobalt);color:#F6F0E6">
    <span id="fill" class="abs" style="inset:-30px;background:radial-gradient(closest-side,#1F4E78 0%,#1F4E78 70%,rgba(31,78,120,0) 100%);transform-origin:10% 50%;transform:scale(0);filter:blur(4px)"></span>
    <span id="keyText" style="position:relative;display:flex;height:100%;align-items:center;padding:0 20px;font-size:21px;font-weight:400">Start with&nbsp;<b style="font-weight:600">Call the dentist</b></span>
  </div>

  <div id="qHead" class="abs" style="left:22px;top:540px;font-size:34px;font-weight:500;letter-spacing:-.035em;line-height:40px">Plan</div>
  <div id="rows"></div>

  <div class="abs" style="left:14px;right:14px;bottom:18px;height:74px;border-radius:20px;background:rgba(250,246,239,.62);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 .5px rgba(43,36,64,.2),0 10px 28px rgba(43,36,64,.12)">
    <span id="tess" class="abs" style="left:78px;right:20px;top:24px;font-size:21px;color:#8A7F96;white-space:nowrap;overflow:hidden">Ask Tess…</span>
  </div>
  <div id="soul" class="abs" style="left:50px;top:789px;width:0;height:0;transform:scale(.5)">
    <span class="d r" style="animation:idle 7s ease-in-out infinite"></span><span class="d b" style="animation:idle 8.5s ease-in-out -3s infinite"></span><span class="d y" style="animation:idle 10s ease-in-out -6s infinite"></span>
  </div>
  <div id="clock" class="abs lbl" style="right:22px;top:14px;color:#7A6E86">08:00</div>
  <div id="finger" class="abs"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const HOUSE = 'cubic-bezier(.2,.8,.2,1)';
const anim = (el, kf, o) => el.animate(kf, { fill: 'forwards', ...o }).finished;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const tween = (dur, fn) => new Promise((res) => { const t0 = performance.now(); const st = (n) => { const t = Math.min(1, (n - t0) / dur); fn(ease(t)); t < 1 ? requestAnimationFrame(st) : res(); }; requestAnimationFrame(st); });
const rel = (r) => { const p = $('ph').getBoundingClientRect(), k = p.width / 390; return { left: (r.left - p.left) / k, top: (r.top - p.top) / k, width: r.width / k, height: r.height / k }; };
const finger = $('finger');
const fingerAt = (x, y) => { finger.style.left = x + 'px'; finger.style.top = y + 'px'; };
const fingerOn = async (x, y) => { fingerAt(x, y); await anim(finger, [{ opacity: 0, transform: 'scale(1.3)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 160 }); };
const fingerOff = () => anim(finger, [{ opacity: 1 }, { opacity: 0 }], { duration: 160 });
// the stroke's clock: 07:00 at x 4, 23:00 at x 342
const X = (h) => 4 + (h - 7) / 16 * 338;
const NS = 'http://www.w3.org/2000/svg';
function seg(h0, h1, colour, op, id) {
  const p = document.createElementNS(NS, 'path'); p.setAttribute('d', `M${X(h0)} 28 L ${X(h1)} 28`);
  p.setAttribute('stroke', colour); p.setAttribute('stroke-opacity', op); p.setAttribute('stroke-width', 6); p.setAttribute('stroke-linecap', 'round');
  if (id) p.id = id; $('marks').appendChild(p); return p;
}
async function tessSay(text, colour = '#2E6DA4') {
  const t = $('tess'); await anim(t, [{ opacity: 1 }, { opacity: 0 }], { duration: 120 });
  t.textContent = text; t.style.color = colour;
  anim(t, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: HOUSE });
}
const soulDone = () => anim($('soul'), [{ transform: 'scale(.5)' }, { transform: 'scale(.66)' }, { transform: 'scale(.5)' }], { duration: 900, easing: 'ease-in-out' });
function setClock(t) { $('clock').textContent = t; }

// ---- rows ----
let rows = [];
function addRow(o) {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<span class="dab" style="background:${o.c}"></span><span class="nm">${o.n}</span><span class="lbl tm" style="color:${o.tc || '#5E5470'}">${o.t || ''}</span>`;
  r.style.top = o.y + 'px'; $('rows').appendChild(r); o.el = r; rows.push(o); return o;
}
async function closeUp(dur = 420) {
  rows = rows.filter((r) => !r.gone);
  await Promise.all(rows.map((r, k) => { const to = 588 + k * 48; const from = parseFloat(r.el.style.top); r.el.style.top = to + 'px'; return anim(r.el, [{ transform: `translateY(${from - to}px)` }, { transform: 'none' }], { duration: dur, easing: HOUSE }); }));
}
async function flyDab(dabEl, h, colour) {
  const d = rel(dabEl.getBoundingClientRect());
  const fly = document.createElement('span'); fly.className = 'abs';
  Object.assign(fly.style, { left: d.left + 'px', top: d.top + 'px', width: '18px', height: '15px', borderRadius: '55% 45% 60% 40%/50% 60% 40% 50%', background: colour, zIndex: 10 });
  $('ph').appendChild(fly); dabEl.style.opacity = 0;
  const tx = 22 + X(h) - 9 - d.left, ty = 134 + 28 - 7 - d.top;
  await fly.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${tx * .5}px,${ty * .4}px) scale(1.3)`, offset: .45 }, { transform: `translate(${tx}px,${ty}px) scale(.8)` }], { duration: 620, easing: 'cubic-bezier(.5,0,.2,1)', fill: 'forwards' }).finished;
  return fly;
}

// accept: swipe right, the ghost dries into ink, its dab flies to its time on the stroke
async function accept(o) {
  const y = parseFloat(o.el.style.top) + 24; await fingerOn(80, y);
  await tween(420, (t) => { fingerAt(lerp(80, 300, t), y); o.el.style.transform = `translateX(${t * 14}px)`; });
  fingerOff();
  o.el.style.animation = 'none';
  anim(o.el, [{ transform: 'translateX(14px)', color: '#2E6DA4', opacity: .6 }, { transform: 'none', color: '#2B2440', opacity: 1 }], { duration: 360, easing: HOUSE });
  o.el.querySelector('.nm').style.color = '#2B2440'; o.el.querySelector('.tm').style.color = '#5E5470';
  const fly = await flyDab(o.el.querySelector('.dab'), o.h, o.c);
  fly.style.borderRadius = '50%';
}

(async () => {
  if (location.search.includes('x2')) { const ph = $('ph'); ph.style.transform = 'scale(2)'; ph.style.transformOrigin = '0 0'; }
  seg(10, 11, '#2B2440', .55); seg(13, 13.5, '#2B2440', .55); seg(15, 16, '#2B2440', .55); seg(18, 19, '#C8452F', .85);
  const plan = [
    { n: 'Call the dentist', t: '09:15', c: '#E0A35C', h: 9.25 },
    { n: 'Draft the push‑day plan', t: '11:15', c: '#7A5C8E', h: 11.25 },
    { n: 'Renew passport', t: '16:15', c: '#E0A35C', h: 16.25 }
  ];
  plan.forEach((p, k) => { p.y = 588 + k * 48; p.tc = '#2E6DA4'; const o = addRow(p); o.el.style.color = '#2E6DA4'; o.el.querySelector('.nm').style.color = '#2E6DA4'; o.el.querySelector('.dab').style.background = 'radial-gradient(closest-side,rgba(46,109,164,.9),rgba(46,109,164,.25))'; o.el.style.animation = 'wet 1.6s ease-in-out infinite'; o.el.style.opacity = 0; });
  await document.fonts.ready; await sleep(400); document.body.dataset.start = '1';

  // ---- morning: Plan my day arrives as Now ----
  $('dayStroke').animate([{ strokeDashoffset: 340 }, { strokeDashoffset: 340 - X(8) }], { duration: 700, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' });
  anim($('tip'), [{ opacity: 0 }, { opacity: .75 }], { duration: 300, delay: 600 }).then(() => $('tip').style.animation = 'wetTip 3.6s ease-in-out infinite');
  [...$('marks').children].forEach((m, k) => anim(m, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 500 + k * 80 }));
  for (const [k, id] of ['nowLine', 'hero', 'sub', 'energy', 'key', 'qHead'].entries()) anim($(id), [{ opacity: 0, transform: 'translateY(14px)', filter: 'blur(4px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 340, easing: HOUSE, delay: 120 + k * 50 });
  rows.forEach((o, k) => { o.el.style.opacity = ''; o.el.animate([{ opacity: 0, transform: 'translateY(-10px)', filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 420, easing: HOUSE, delay: 500 + k * 60, fill: 'backwards' }); });
  await sleep(1500);

  // energy: drum from 3 to 2, the plan re-flows to two lines
  await fingerOn(332, 392);
  await tween(380, (t) => { $('drum').style.transform = `translateY(${-72 - 48 * t}px)`; fingerAt(332, 392 - 30 * t); });
  fingerOff(); $('eWord').textContent = 'LOW';
  const third = rows[2]; third.gone = true;
  await anim(third.el, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(-18px)' }], { duration: 320, easing: HOUSE });
  tessSay('Short night. Two things today.');
  await sleep(1300);

  // accept both lines
  await accept(rows[0]); await sleep(250);
  await accept(rows[1]); await sleep(500);

  // Start with: hold the cobalt key, the plan lifts, the first item rises into the hero
  await fingerOn(160, 481);
  await anim($('fill'), [{ transform: 'scale(0)' }, { transform: 'scale(1.3)' }], { duration: 600, easing: 'cubic-bezier(.3,.6,.4,1)' });
  fingerOff(); soulDone(); tessSay('Starting with the dentist.');
  anim($('fill'), [{ transform: 'scale(1.3)' }, { transform: 'scale(0)' }], { duration: 220 });
  ['hero', 'sub', 'energy'].forEach((id) => anim($(id), [{ opacity: 1, transform: 'none', filter: 'blur(0)' }, { opacity: 0, transform: 'translateY(-14px)', filter: 'blur(4px)' }], { duration: 260, easing: 'ease-in' }));
  await sleep(260);
  const first = rows[0]; const r = rel(first.el.querySelector('.nm').getBoundingClientRect());
  const ghost = document.createElement('div'); ghost.className = 'abs'; ghost.textContent = first.n;
  Object.assign(ghost.style, { left: r.left + 'px', top: r.top + 'px', fontSize: '21px', fontWeight: 500, lineHeight: r.height + 'px', whiteSpace: 'nowrap', zIndex: 10 });
  $('ph').appendChild(ghost); first.el.style.visibility = 'hidden'; first.gone = true;
  anim($('nowLine'), [{ opacity: 1 }, { opacity: 0 }], { duration: 160 }).then(() => { $('nowLine').textContent = 'now, until half nine'; anim($('nowLine'), [{ opacity: 0, transform: 'translateX(12px)' }, { opacity: 1, transform: 'none' }], { duration: 280, easing: HOUSE }); });
  anim($('qHead'), [{ opacity: 1 }, { opacity: 0 }], { duration: 160 }).then(() => { $('qHead').textContent = 'Next'; anim($('qHead'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240 }); });
  anim($('key'), [{ opacity: 1 }, { opacity: 0 }], { duration: 200 }).then(() => { $('key').style.width = '220px'; $('key').style.background = '#2B2440'; $('keyText').innerHTML = '<b style="font-weight:600">Hold to finish</b>'; anim($('key'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240 }); });
  closeUp(460);
  await anim(ghost, [{ left: r.left + 'px', top: r.top + 'px', fontSize: '21px', lineHeight: r.height + 'px', letterSpacing: '-.005em' }, { left: '20px', top: '252px', fontSize: '56px', lineHeight: '56px', letterSpacing: '-.04em' }], { duration: 460, easing: HOUSE });
  $('hero').textContent = 'Call the dentist'; $('hero').getAnimations().forEach((a) => a.cancel()); ghost.remove();
  await sleep(1400);

  // ---- evening: Shutdown ----
  await Promise.all(['nowLine', 'hero', 'key', 'qHead', 'rows', 'tess'].map((id) => anim($(id), [{ opacity: 1 }, { opacity: 0 }], { duration: 300 })));
  setClock('21:00');
  $('dayLabel').textContent = 'Thursday evening';
  anim($('dusk'), [{ opacity: 0 }, { opacity: 1 }], { duration: 1200, easing: 'ease-in-out' });
  $('dayStroke').animate([{ strokeDashoffset: 340 - X(8) }, { strokeDashoffset: 340 - X(21) }], { duration: 900, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' });
  $('tip').style.transition = 'left 900ms cubic-bezier(.3,.7,.2,1)'; $('tip').style.left = (43 + X(21) - X(8)) + 'px';
  $('rows').innerHTML = ''; rows = [];
  $('nowLine').textContent = 'this evening';
  $('hero').innerHTML = 'Four tasks,<br>one workout,<br>cooked once';
  $('key').style.width = '260px'; $('keyText').innerHTML = '<b style="font-weight:600">Shutdown complete</b>';
  $('qHead').className = 'abs lbl'; $('qHead').style.fontSize = '16px'; $('qHead').style.letterSpacing = '.08em'; $('qHead').style.top = '552px'; $('qHead').textContent = 'GOING TO TOMORROW';
  [{ n: 'Renew passport', c: '#2E6DA4' }, { n: 'Book the car service', c: '#2E6DA4' }].forEach((p, k) => { p.y = 588 + k * 48; addRow(p).el.querySelector('.nm').style.fontWeight = 500; });
  $('rows').style.opacity = 1; $('tess').textContent = 'Ask Tess…'; $('tess').style.color = '#8A7F96';
  await sleep(700);
  for (const [k, id] of ['nowLine', 'hero', 'key', 'qHead', 'rows', 'tess'].entries()) anim($(id), [{ opacity: 0, transform: 'translateY(14px)', filter: 'blur(4px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 340, easing: HOUSE, delay: k * 50 });
  await sleep(1300);

  // tap the second row to keep it off tomorrow: its dab drains, it reads TO LATER
  const keep = rows[1]; const ky = parseFloat(keep.el.style.top) + 24;
  await fingerOn(150, ky); await sleep(120); fingerOff();
  anim(keep.el.querySelector('.dab'), [{ opacity: 1, transform: 'scale(1)' }, { opacity: .15, transform: 'scale(.6)' }], { duration: 300 });
  keep.el.querySelector('.tm').textContent = 'TO LATER';
  anim(keep.el.querySelector('.tm'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240 });
  anim(keep.el.querySelector('.nm'), [{ opacity: 1 }, { opacity: .6 }], { duration: 240 });
  await sleep(900);

  // Shutdown complete: hold, the day paints to its end, the rolled dab flies to tomorrow, Done for today
  $('fill').style.background = 'radial-gradient(closest-side,#C8452F 0%,#C8452F 70%,rgba(200,69,47,0) 100%)';
  $('key').style.background = '#2B2440';
  await fingerOn(150, 481);
  await anim($('fill'), [{ transform: 'scale(0)' }, { transform: 'scale(1.4)' }], { duration: 700, easing: 'cubic-bezier(.3,.6,.4,1)' });
  fingerOff();
  $('dayStroke').animate([{ strokeDashoffset: 340 - X(21) }, { strokeDashoffset: 0 }], { duration: 700, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' });
  anim($('tip'), [{ opacity: .75 }, { opacity: 0 }], { duration: 400 });
  const go = rows[0];
  flyDab(go.el.querySelector('.dab'), 23, '#2E6DA4').then((f) => { f.remove(); anim($('tmrw'), [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1.25)' }, { opacity: 0, transform: 'scale(1)' }], { duration: 700 }); });
