<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day log v1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Board and recording for docs/design/day-log-v1.md (Design item 14), drawn to Research's day-log-acceptance.md. Phones: late night (Thu 22 00:45, Push Day B running under TODAY), travel and the fall-back night (read in New York), the rest day and the faint row, the first day. ?play records the 04:00 turnover: TODAY relabels WED 21 in place and a new empty TODAY opens under it. Porcelain, one base, no dabs. Add ?x2 for 2x. -->
<style>
:root{--ink:23,20,31;--house:cubic-bezier(.2,.8,.2,1)}
html,body{margin:0;background:#E9E6EE}
body{font-family:'Inter Tight',sans-serif;color:rgb(var(--ink));transform-origin:0 0;padding:28px 30px 30px}
body.x2{transform:scale(2)}
.row{display:flex;gap:36px}
.cap{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(var(--ink),.66);height:48px;width:390px;line-height:22px}
.ph{position:relative;width:390px;height:844px;overflow:hidden;background:#fff}
.abs{position:absolute}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;white-space:nowrap}
.s2{color:rgba(var(--ink),.66)}
.win{position:absolute;left:0;right:0;top:150px;bottom:76px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 48px)}
.stack{position:absolute;left:0;right:0;bottom:0}
.day{padding:0 22px 30px}
.date{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(var(--ink),.66);height:34px}
.date.today{color:rgb(var(--ink))}
.date.empty{color:rgba(var(--ink),.45)}
.ln{display:grid;grid-template-columns:64px 1fr;min-height:30px;margin-bottom:4px}
.t{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:rgba(var(--ink),.5);padding-top:5px}
.x{font-size:21px;line-height:28px}
.faint .x{color:rgba(var(--ink),.66)}
.also .x{color:rgba(var(--ink),.7)}
.soul{position:absolute;left:322px;top:782px;width:46px;height:40px}
.soul i{position:absolute;width:20px;height:17px;border-radius:52% 48% 60% 40%/55% 45% 55% 45%;filter:blur(1.2px)}
.note{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(var(--ink),.66);margin-top:20px;max-width:1650px;line-height:24px}
</style>
</head>
<body>
<div class="row" id="row"></div>
<div class="note" id="note"></div>
<script>
const Q=location.search;if(Q.includes('x2'))document.body.classList.add('x2');
const soul=`<div class="soul"><i style="left:0;top:4px;background:radial-gradient(closest-side,#2450D8,rgba(36,80,216,.2))"></i><i style="left:22px;top:2px;background:radial-gradient(closest-side,#E2432A,rgba(226,67,42,.2))"></i><i style="left:12px;top:20px;background:radial-gradient(closest-side,#F0A500,rgba(240,165,0,.2))"></i></div>`;
const L=(t,x,cls='')=>`<div class="ln ${cls}"><div class="t">${t||''}</div><div class="x">${x}</div></div>`;
const D=(date,lines,cls='',id='')=>`<div class="day" ${id?`id="${id}"`:''}><div class="date ${cls}">${date}</div>${lines.join('')}</div>`;
const phone=(cap,month,days,extra='')=>`<div><div class="cap">${cap}</div><div class="ph"><div class="abs lbl s2" style="left:22px;top:58px">‹ HOME</div><div class="abs" style="left:22px;top:84px;font-size:44px;font-weight:500;letter-spacing:-.035em;line-height:50px">${month}</div><div class="win"><div class="stack">${days.join('')}</div></div>${extra}${soul}</div></div>`;
const P1=phone('LATE NIGHT · THU 22 00:45 · STILL WEDNESDAY','October',[
 D('TUE 20',[L('07:10','Added 2 tasks'),L('18:40','Cooked ramen, 40 min')]),
 D('TODAY',[L('19:05','Added 2 tasks'),L('23:20','Push Day B, 5 sets'),L('00:31','Note: hotel ideas')],'today')]);
const P2=phone('TRAVEL · READ IN NEW YORK · AND THE FALL-BACK NIGHT','October',[
 D('MON 26',[L('10:30','Done: water the plants'),L('00:40','Mobility, 35 min'),L('04:30','Note: seat 14C, no sleep')]),
 D('TUE 27 TO FRI 30',[],'empty'),
 D('SAT 31',[L('20:00','Cooked dal tadka, 50 min'),L('00:50','Push Day B, 90 min. Bench 82.5&nbsp;×&nbsp;8.'),L('01:30','Note: hall light out'),L('01:30','Done: bins')])]);
const P3=phone('THE REST DAY ROW · AND THE FAINT ROW (A WORKOUT NEVER FINISHED)','October',[
 D('SUN 11',[L('','Rest day','faint'),L('09:15','Added 3 tasks'),L('18:05','Ticked 2 on Home')]),
 D('MON 12',[L('06:55','Pull Day A, 3 sets. Row 60&nbsp;×&nbsp;10.','faint'),L('12:40','Done: call the bank')]),
 D('WED 14',[L('07:10','Push Day A, 52 min. Bench 82.5&nbsp;×&nbsp;8, PR.'),L('19:30','Cooked carbonara, 35 min'),L('','Also: 3 notes, 5 groceries, ticked 4 on Lisbon packing.','also')])]);
const P4=phone('THE FIRST DAY · NOTHING LOGGED YET','October',[
 D('TODAY',[`<div class="x" style="color:rgba(23,20,31,.55);font-weight:400">Your days write themselves here.</div>`],'today')]);
const PLAY=Q.includes('play');
if(PLAY){
 document.getElementById('row').innerHTML=phone('04:00 · TODAY BECOMES WED 21 IN PLACE','October',[
  D('TUE 20',[L('07:10','Added 2 tasks'),L('18:40','Cooked ramen, 40 min')]),
  D('<span id="lab">TODAY</span>',[L('19:05','Added 2 tasks'),L('23:20','Push Day B, 92 min. Incline 30&nbsp;×&nbsp;10, PR.'),L('02:10','Note: hotel ideas')],'today','wed'),
  `<div id="newday" style="height:0;overflow:hidden"><div class="day"><div class="date today" id="nt" style="opacity:0">TODAY</div></div></div>`]);
}else{
 document.getElementById('row').innerHTML=P1+P2+P3+P4;
 document.getElementById('note').innerHTML='NO DABS ANYWHERE: TIME, THEN TEXT. A WORKOUT NEVER FINISHED IS THE FAINT ROW (TEXT IN INK SECONDARY, NO WORDS ADDED). "REST DAY" HAS NO TIME AND RESTS IN INK SECONDARY. LINES SORT BY INSTANT, SO A NEW YORK READ CAN SHOW 10:30 BEFORE 00:40; NO ZONE TAG, NO "TRAVEL DAY". TWO 01:30 LINES STAY TWO LINES.';
}
document.fonts.ready.then(()=>{document.body.dataset.start='1';
 if(!PLAY){document.body.dataset.done='1';return}
 const lab=document.getElementById('lab'),date=lab.parentNode;
 setTimeout(()=>{
  lab.animate([{filter:'blur(0)',opacity:1},{filter:'blur(4px)',opacity:0}],{duration:110,fill:'forwards'}).onfinish=()=>{lab.textContent='WED 21';date.classList.remove('today');lab.animate([{filter:'blur(4px)',opacity:0},{filter:'blur(0)',opacity:1}],{duration:110,fill:'forwards'})};
  const nd=document.getElementById('newday');nd.animate([{height:'0px'},{height:'64px'}],{duration:420,delay:260,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
  document.getElementById('nt').animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:360,delay:420,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
 },1400);
 setTimeout(()=>document.body.dataset.done='1',3600);
});
</script>
</body>
</html>
