<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200..700&display=swap" rel="stylesheet">
<!-- Board and recording for docs/design/lockscreen.md (Design item 36): everything Tessera puts on the Lock Screen. The rest Live Activity in Cobalt sky (resting, Go with the rest notification, Always-On, after Done, after the last set), the cook timers, the focus block, the three local notifications (N1 task, N2 rest, N3 kitchen timer) in Research's words (tess-voice M54 to M58), quiet hours, and the Island. ?play records the rest face: counting down, Go with the notification, Done, UNDO. -->
<style>
:root{--house:cubic-bezier(.2,.8,.2,1)}
html,body{margin:0;background:#E9E6EE}
body{font-family:'Inter Tight',sans-serif;transform-origin:0 0;padding:28px 30px 30px}
body.x2{transform:scale(2)}
.row{display:flex;gap:36px;margin-bottom:28px}
.cap{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(23,20,31,.66);height:34px;width:390px;white-space:nowrap}
.ph{position:relative;width:390px;height:844px;overflow:hidden;background:linear-gradient(165deg,#2B3446 0%,#1E2433 45%,#141821 100%);color:#F6EFE4}
.ph.aod{background:#000}
.abs{position:absolute}
.date{position:absolute;left:0;right:0;top:66px;text-align:center;font-size:20px;font-weight:500;color:rgba(246,239,228,.82)}
.clock{position:absolute;left:0;right:0;top:86px;text-align:center;font-size:96px;font-weight:600;letter-spacing:-.02em;line-height:1;color:rgba(246,239,228,.9);font-variant-numeric:tabular-nums}
.aod .clock,.aod .date{color:rgba(246,239,228,.45)}
.qa{position:absolute;bottom:36px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.14)}
.la{position:absolute;left:12px;right:12px;height:160px;border-radius:24px;overflow:hidden;background:rgba(28,30,38,.78);backdrop-filter:blur(20px)}
.wash{position:absolute;width:240px;height:200px;border-radius:50%;filter:blur(34px);transition:background 1.4s}
.cd{position:absolute;left:20px;top:22px;font-size:48px;font-weight:250;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#F6EFE4;line-height:56px}
.cd .c{opacity:.55}
.col{position:absolute;left:206px;top:18px;right:16px;bottom:52px;border-left:1px solid rgba(246,239,228,.16);padding-left:16px}
.ex{font-size:17px;color:rgba(246,239,228,.62);line-height:22px;margin-top:8px}
.ps{font-size:24px;color:#F6EFE4;line-height:30px}
.tick{position:absolute;right:0;top:4px}
.hz{position:absolute;left:20px;right:20px;top:104px;height:6px}
.bot{position:absolute;left:20px;right:20px;bottom:12px;height:24px;font-size:17px;color:rgba(246,239,228,.58);line-height:24px}
.bot .r{position:absolute;right:0;top:0;font-size:18px;font-weight:500;color:#F6EFE4}
.bot .r i{display:inline-block;width:1px;height:16px;background:rgba(246,239,228,.25);margin:0 12px;vertical-align:-2px}
.nt{position:absolute;left:12px;right:12px;border-radius:22px;background:rgba(40,43,52,.72);backdrop-filter:blur(20px);padding:13px 14px 13px 62px;min-height:44px}
.nt .ic{position:absolute;left:14px;top:14px;width:36px;height:36px;border-radius:9px;background:#0B0B0F;overflow:hidden}
.nt .ic i{position:absolute;width:15px;height:13px;border-radius:52% 48% 60% 40%/55% 45% 55% 45%;filter:blur(1px)}
.nt .t{font-size:16px;font-weight:600;color:#F6EFE4;line-height:21px}
.nt .b{font-size:16px;color:rgba(246,239,228,.86);line-height:21px}
.nt .w{position:absolute;right:14px;top:13px;font-size:16px;color:rgba(246,239,228,.5)}
.menu{position:absolute;left:12px;width:250px;border-radius:16px;background:rgba(48,50,60,.86);backdrop-filter:blur(20px);overflow:hidden}
.menu div{padding:12px 16px;font-size:17px;color:#F6EFE4;border-top:.5px solid rgba(246,239,228,.14)}
.menu div:first-child{border-top:0}
.isl{position:absolute;background:#000;color:#F6EFE4}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;white-space:nowrap}
.note{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(23,20,31,.66);max-width:2200px;line-height:24px}
#fing{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(246,239,228,.22);box-shadow:0 0 0 1.5px rgba(246,239,228,.6);opacity:0;z-index:20;transition:opacity .15s}
</style>
</head>
<body>
<div id="rows"></div>
<script>
const Q=location.search;if(Q.includes('x2'))document.body.classList.add('x2');
const PLAY=Q.includes('play');
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const icon=`<div class="ic"><i style="left:4px;top:7px;background:radial-gradient(closest-side,#86B4FF,rgba(134,180,255,.15))"></i><i style="left:17px;top:6px;background:radial-gradient(closest-side,#FF5B3A,rgba(255,91,58,.15))"></i><i style="left:10px;top:18px;background:radial-gradient(closest-side,#FFC23D,rgba(255,194,61,.15))"></i></div>`;
const tick=`<svg class="tick" width="18" height="14"><path d="M2 8 Q5 10 7 12 Q11 5 16 2" fill="none" stroke="#E2603F" stroke-width="2.6" stroke-linecap="round"/></svg>`;
const back=`<svg class="tick" width="18" height="14"><path d="M15 3 Q16 11 8 11 L4 11 M7 8 L4 11 L7 14" fill="none" stroke="#FFB896" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const horizon=(f,warm)=>`<svg class="hz" width="326" height="6" style="overflow:visible"><rect y="2.25" width="326" height="1.5" rx=".75" fill="rgba(246,239,228,.14)"/><rect id="hzl" y="1.75" width="${326*f}" height="2.5" rx="1.25" fill="#F6EFE4"/>${f>0&&f<1?`<circle cx="${326*f}" cy="3" r="7" fill="rgba(246,239,228,.35)" style="filter:blur(3px)"/>`:''}</svg>`;
const washes=(warm)=>`<div class="wash" id="w1" style="left:-80px;top:-110px;background:${warm?'rgba(232,189,76,.75)':'rgba(63,127,192,.75)'}"></div><div class="wash" id="w2" style="right:-90px;top:-120px;background:${warm?'rgba(226,96,63,.6)':'rgba(122,92,160,.45)'}"></div>`;
// the rest Live Activity, Cobalt sky in every look
function rest(s,top=470,id='la'){
 const go=s==='go',aod=s==='aod',undo=s==='undo',end=s==='end';
 const left=end?`<div class="abs" style="left:20px;top:22px;font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:40px;color:#F6EFE4">All 22 sets in.</div><div class="abs" style="left:20px;top:66px;font-size:17px;color:rgba(246,239,228,.62)">Push A, ready to finish</div>`
  :aod?`<div class="abs" style="left:20px;top:26px;font-size:17px;color:rgba(246,239,228,.62)">Ready at</div><div class="cd" style="top:46px;font-size:40px">18:12</div>`
  :`<div class="cd" id="${id}cd">${go?'Go':undo?'2<span class="c">:</span>30':'1<span class="c">:</span>32'}</div>`;
 const col=end?'':undo?`<div class="col"><div class="ex" style="font-size:21px;line-height:28px;color:#F6EFE4;margin-top:6px">Set 3 logged.</div><div class="lbl" style="color:#FF7A5C;margin-top:6px">UNDO</div></div>`
  :`<div class="col"><div class="ex">Bench</div><div class="ps">82.5 × 8</div>${tick}${go?'<div class="abs" style="right:-6px;top:-4px;width:30px;height:30px;border-radius:50%;background:rgba(226,96,63,.35);filter:blur(8px)"></div>':''}</div>`;
 const bot=end?`<div class="bot"><span class="lbl" style="color:rgba(246,239,228,.58)">ENDS IN A MINUTE</span></div>`
  :`<div class="bot">${go?'Rested 2:30':undo?'Rest, then set 4':'Rest, then set 4'}${aod?'':`<span class="r"><span style="${go?'opacity:.25':''}">+15</span><i></i>Skip</span>`}</div>`;
 return `<div class="la" id="${id}" style="top:${top}px;${aod?'background:rgba(20,20,24,.9)':''}">${aod?'':washes(go)}${left}${col}${aod?'':horizon(go?0:end?1:undo?1:.62)}${bot}</div>`}
function cook(top=470){return `<div class="la" style="top:${top}px">${washes(0)}
 <div class="abs" style="left:20px;top:20px;font-size:17px;color:rgba(246,239,228,.62)">Soften</div>
 <div class="cd" style="top:40px">4<span class="c">:</span>12</div>
 <div class="abs" style="left:138px;top:56px;font-size:21px;font-weight:600;color:rgba(246,239,228,.8)">+1</div>
 <div class="col"><div class="ex">Weeknight dal</div><div class="ps">Stop</div></div>
 ${horizon(.4)}<div class="bot">Step 2 of 3</div></div>`}
function focus(top=470){return `<div class="la" style="top:${top}px">${washes(0)}
 <div class="abs" style="left:20px;top:22px;font-size:21px;font-weight:600;color:#F6EFE4">The deck outline</div>
 <div class="abs lbl" style="left:20px;top:62px;color:rgba(246,239,228,.58)">18:04 LEFT</div>
 ${horizon(.72)}<div class="bot">Focus, 25 min<span class="r">Done</span></div></div>`}
const notif=(t,b,top,w='now')=>`<div class="nt" style="top:${top}px">${icon}<div class="t">${t}</div><div class="b">${b}</div><div class="w">${w}</div></div>`;
const lock=(clock,date,inner,cls='')=>`<div class="ph ${cls}"><div class="date">${date}</div><div class="clock">${clock}</div>${inner}${cls?'':'<div class="qa" style="left:46px"></div><div class="qa" style="right:46px"></div>'}</div>`;
const cell=(c,html)=>`<div><div class="cap">${c}</div>${html}</div>`;
function islands(){return `<div class="ph" style="background:#F4F2EE;color:#17141F">
 <div class="abs lbl" style="left:22px;top:40px;color:rgba(23,20,31,.66)">REST · COMPACT</div>
 <div class="isl" style="left:95px;top:70px;width:200px;height:37px;border-radius:19px"><svg class="abs" style="left:14px;top:12px" width="18" height="14"><path d="M2 8 Q5 10 7 12 Q11 5 16 2" fill="none" stroke="#E2603F" stroke-width="2.6" stroke-linecap="round"/></svg><div class="abs" style="right:14px;top:8px;font-size:17px;font-variant-numeric:tabular-nums">1:32</div></div>
 <div class="abs lbl" style="left:22px;top:130px;color:rgba(23,20,31,.66)">REST · MINIMAL</div>
 <div class="isl" style="left:170px;top:160px;width:37px;height:37px;border-radius:50%"><svg class="abs" style="left:10px;top:12px" width="18" height="14"><path d="M2 8 Q5 10 7 12 Q11 5 16 2" fill="none" stroke="#E2603F" stroke-width="2.6" stroke-linecap="round"/></svg></div>
 <div class="abs lbl" style="left:22px;top:222px;color:rgba(23,20,31,.66)">REST · EXPANDED</div>
 <div class="isl" style="left:10px;top:252px;width:370px;height:150px;border-radius:44px">
  <div class="abs" style="left:28px;top:26px;font-size:40px;font-weight:250;font-variant-numeric:tabular-nums">1<span style="opacity:.55">:</span>32</div>
  <div class="abs" style="left:206px;top:26px;font-size:16px;color:rgba(246,239,228,.62)">Bench</div><div class="abs" style="left:206px;top:46px;font-size:21px">82.5 × 8</div>
  <svg class="abs" style="left:28px;top:104px" width="314" height="6"><rect y="2.25" width="314" height="1.5" fill="rgba(246,239,228,.14)"/><rect y="1.75" width="195" height="2.5" rx="1.25" fill="#F6EFE4"/></svg></div>
 <div class="abs lbl" style="left:22px;top:430px;color:rgba(23,20,31,.66)">COOK · COMPACT</div>
 <div class="isl" style="left:95px;top:460px;width:200px;height:37px;border-radius:19px"><div class="abs" style="left:16px;top:8px;font-size:17px;color:rgba(246,239,228,.7)">Soften</div><div class="abs" style="right:14px;top:8px;font-size:17px;font-variant-numeric:tabular-nums">4:12</div></div>
 <div class="abs lbl" style="left:22px;top:520px;color:rgba(23,20,31,.66)">FOCUS · COMPACT</div>
 <div class="isl" style="left:95px;top:550px;width:200px;height:37px;border-radius:19px"><div class="abs" style="left:16px;top:8px;font-size:17px;color:rgba(246,239,228,.7)">Deck</div><div class="abs" style="right:14px;top:8px;font-size:17px;font-variant-numeric:tabular-nums">18:04</div></div>
 <div class="abs" style="left:22px;top:620px;width:346px;font-size:17px;line-height:24px;color:rgba(23,20,31,.66)">The Island is always the system's black, in every look. Nothing inside it is a pill.</div>
</div>`}
if(PLAY){
 $('rows').innerHTML=`<div class="row">${cell('<span id="cap">18:11 · RESTING, PHONE LOCKED</span>',`<div class="ph" id="P">${lock('18:11','Thursday, October 15',rest('rest',470,'P')).replace(/^<div class="ph ">|<\/div>$/g,'')}<div id="fing"></div></div>`)}</div>`;
}else{
 $('rows').innerHTML=`<div class="row">`+
  cell('18:10 · RESTING',lock('18:10','Thursday, October 15',rest('rest')))+
  cell('18:12 · REST IS UP, THE NOTIFICATION RINGS',lock('18:12','Thursday, October 15',rest('go')+notif('Set 4 is up','Bench, 82.5 × 8',642)))+
  cell('ALWAYS-ON · NO TICKING',lock('18:11','Thursday, October 15',rest('aod'),'aod'))+
  cell('AFTER DONE ON THE LOCK SCREEN',lock('18:13','Thursday, October 15',rest('undo')))+
  cell('AFTER THE LAST SET · 60 S',lock('18:41','Thursday, October 15',rest('end')))+`</div><div class="row">`+
  cell('19:20 · COOKING, A TIMER RINGS',lock('19:20','Thursday, October 15',cook(380)+notif('Pasta is done','Carbonara, step 3',552)+`<div class="menu" style="top:636px"><div>Stop</div></div>`))+
  cell('09:00 · A TIMED TASK, PRESSED',lock('09:00','Friday, October 16',notif('Call mom','It’s 9 am. 30 min.',500,'now')+`<div class="menu" style="top:584px"><div>Done</div><div>Not now</div></div>`))+
  cell('23:40 · QUIET HOURS: ONLY WHAT HE TIMED',lock('23:40','Thursday, October 15',notif('Rice is done','18 min.',560)))+
  cell('14:10 · A FOCUS BLOCK',lock('14:10','Friday, October 16',focus()))+
  cell('THE ISLAND',islands())+`</div><div class="note">COBALT SKY IN EVERY LOOK. ONE NUMBER, ONE ACTION. THREE NOTIFICATIONS ONLY: A TIMED TASK, REST UP WITH THE APP CLOSED, A KITCHEN TIMER. 23:00 TO 07:00 ONLY TIMERS HE STARTED RING. NO BADGES, NO STREAKS, NO CHECK-INS, NO REPEATS.</div>`;
}
async function tap(x,y,hold=160){const f=$('fing');f.style.left=x+'px';f.style.top=y+'px';f.style.opacity=1;await sleep(hold);f.style.opacity=0}
const setCap=t=>{const c=$('cap');c.animate([{opacity:1},{opacity:0}],{duration:120,fill:'forwards'}).onfinish=()=>{c.textContent=t;c.animate([{opacity:0},{opacity:1}],{duration:200,fill:'forwards'})}};
async function play(){
 const P=$('P'),la=$('Pla')||P.querySelector('.la'),cd=P.querySelector('.cd'),hz=P.querySelector('#hzl');
 // count down the last 6 seconds
 let s=6;hz.setAttribute('width',326*6/150);
 for(;s>0;s--){cd.innerHTML=`0<span class="c">:</span>0${s}`;hz.animate([{width:326*s/150+'px'},{width:326*(s-1)/150+'px'}],{duration:1000,fill:'forwards'});await sleep(1000)}
 // Go: pushes in from below, the sky warms, the notification rings (the activity stays silent)
 setCap('18:12 · GO, AND THE NOTIFICATION RINGS');
 cd.animate([{transform:'none',opacity:1},{transform:'translateY(-14px)',opacity:0}],{duration:250,fill:'forwards'}).onfinish=()=>{cd.innerHTML='Go';cd.animate([{transform:'translateY(14px)',opacity:0,filter:'blur(6px)'},{transform:'none',opacity:1,filter:'blur(0)'}],{duration:700,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'})};
 P.querySelector('#w1').style.background='rgba(232,189,76,.75)';P.querySelector('#w2').style.background='rgba(226,96,63,.6)';
 const b=P.querySelector('.bot');b.firstChild.textContent='Rested 2:30';b.querySelector('.r span').style.opacity=.25;
 P.querySelector('.col').insertAdjacentHTML('beforeend','<div class="abs" id="glow" style="right:-6px;top:-4px;width:30px;height:30px;border-radius:50%;background:rgba(226,96,63,.35);filter:blur(8px)"></div>');
 $('glow').animate([{opacity:.4},{opacity:1}],{duration:1100,iterations:Infinity,direction:'alternate'});
 await sleep(500);P.insertAdjacentHTML('beforeend',notif('Set 4 is up','Bench, 82.5 × 8',642));
 const n=P.lastElementChild;n.animate([{transform:'translateY(30px)',opacity:0},{transform:'none',opacity:1}],{duration:420,easing:'cubic-bezier(.3,1.3,.5,1)',fill:'forwards'});
 await sleep(3000);
 // Done on the set column: logs set 4 without unlocking; the face shows the receipt with UNDO, the next rest starts full
 setCap('TAP THE SET · LOGGED WITHOUT UNLOCKING');await tap(290,520);
 n.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'});
 const col=P.querySelector('.col');col.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}).onfinish=()=>{col.innerHTML=`<div class="ex" style="font-size:21px;line-height:28px;color:#F6EFE4;margin-top:6px">Set 4 logged.</div><div class="lbl" style="color:#FF7A5C;margin-top:6px">UNDO</div>`;col.animate([{opacity:0},{opacity:1}],{duration:300,fill:'forwards'})};
 cd.innerHTML='2<span class="c">:</span>30';b.firstChild.textContent='Rest, then set 5';b.querySelector('.r span').style.opacity=1;
 P.querySelector('#w1').style.background='rgba(63,127,192,.75)';P.querySelector('#w2').style.background='rgba(122,92,160,.45)';
 hz.getAnimations().forEach(a=>a.cancel());hz.setAttribute('width',326);
 for(let k=0;k<3;k++){await sleep(1000);cd.innerHTML=`2<span class="c">:</span>${29-k}`;hz.setAttribute('width',326*(149-k)/150)}
 // UNDO
 setCap('UNDO · SET 4 TAKEN BACK');await tap(300,524);
 col.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}).onfinish=()=>{col.innerHTML=`<div class="ex" style="font-size:21px;line-height:28px;color:#F6EFE4;margin-top:6px">Set 4 taken back.</div>`;col.animate([{opacity:0},{opacity:1}],{duration:300,fill:'forwards'})};
 await sleep(1800);
 col.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}).onfinish=()=>{col.innerHTML=`<div class="ex">Bench</div><div class="ps">82.5 × 8</div>${tick}`;col.animate([{opacity:0},{opacity:1}],{duration:300,fill:'forwards'})};
 cd.innerHTML='Go';b.firstChild.textContent='Rested 2:30';P.querySelector('#w1').style.background='rgba(232,189,76,.75)';P.querySelector('#w2').style.background='rgba(226,96,63,.6)';hz.setAttribute('width',0);
 await sleep(2400);document.body.dataset.done='1';
}
document.fonts.ready.then(()=>{document.body.dataset.start='1';if(!PLAY){document.body.dataset.done='1';return}play()});
</script>
</body>
</html>
