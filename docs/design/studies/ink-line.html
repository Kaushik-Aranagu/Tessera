<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink line</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Before/after for docs/design/ink-line.md: the 19pt PaintKey stroke and 20pt day stroke (before) vs the ink line, a tapered 2.5pt swash under the word, and an 8pt day stroke (after). Porcelain. Arrival, tap, hold. -->
<style>
:root{--ink:23,20,31;--house:cubic-bezier(.2,.8,.2,1)}
html,body{margin:0;background:#E9E6EE}
body{font-family:'Inter Tight',sans-serif;width:860px;height:960px;color:rgb(var(--ink));transform-origin:0 0}
body.x2{transform:scale(2)}
.pair{position:absolute;left:30px;top:36px;display:flex;gap:40px}
.col{width:390px}
.cap{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(var(--ink),.66);height:34px}
.ph{position:relative;width:390px;height:844px;overflow:hidden;background:#fff}
.abs{position:absolute}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;white-space:nowrap}
.s2{color:rgba(var(--ink),.66)}
.ctx{font-size:21px;color:#6A4C9C}
.hero{font-size:56px;font-weight:500;letter-spacing:-.035em;line-height:60px}
.key{position:absolute;left:22px;display:flex;align-items:baseline;gap:16px}
.word{position:relative;font-size:34px;font-weight:500;letter-spacing:-.02em;transition:transform .12s}
.word svg{position:absolute;overflow:visible;pointer-events:none}
.q{position:absolute;left:22px;right:22px;height:48px;display:flex;align-items:center;font-size:21px}
.q .tm{margin-left:auto;font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(var(--ink),.66)}
.note{position:absolute;left:30px;top:930px;width:800px;font-size:16px;font-weight:700;letter-spacing:.08em;color:rgba(var(--ink),.66)}
.finger{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(23,20,31,.10);border:1.5px solid rgba(23,20,31,.18);transform:translate(-50%,-50%) scale(.6);opacity:0;transition:opacity .15s,transform .15s;pointer-events:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
 <filter id="rough" x="-10%" y="-80%" width="120%" height="260%"><feTurbulence type="fractalNoise" baseFrequency="0.9 0.3" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
 <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs></svg>
<div class="pair">
 <div class="col"><div class="cap">BEFORE · 19 PT STROKE, 20 PT DAY BAND</div><div class="ph" id="L"></div></div>
 <div class="col"><div class="cap">AFTER · THE INK LINE</div><div class="ph" id="R"></div></div>
</div>
<div class="note" id="note"></div>
<script>
if(location.search.includes('x2'))document.body.classList.add('x2');
const LIVE='226,67,42', GRAD='linear-gradient(90deg,#509BD5,#12936A 30%,#6A4C9C 60%,#C58700 85%,#E2432A)';
const ROUGH='M0 8 C 14 4.5, 50 3, 100 4 S 176 3.5, 200 5.5 L 197 9.5 C 150 12, 80 11.5, 34 11 S 8 10.5, 0 8 Z';
// the ink line: a lens-shaped swash, thickest just left of centre, tapering to hairline ends
const swash=(w,t)=>{const c=6;return `M0 ${c} Q ${w*.42} ${c-t} ${w} ${c-.4} Q ${w*.58} ${c+t} 0 ${c} Z`};
function phone(side){
 const after=side==='R';
 const band=after?`<div class="abs" style="left:22px;top:122px;width:200px;height:6px;border-radius:3px;background:${GRAD};opacity:.6;filter:blur(.3px)"></div><div class="abs" style="left:218px;top:120px;width:10px;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(197,135,0,.0),rgba(197,135,0,0))"></div>`
  :`<div class="abs" style="left:22px;top:115px;width:200px;height:20px;border-radius:10px;background:${GRAD};opacity:.85;filter:blur(.6px)"></div><div class="abs" style="left:16px;top:113px;width:212px;height:24px;border-radius:12px;background:${GRAD};opacity:.25;filter:blur(2.5px)"></div><div class="abs" style="left:205px;top:112px;width:26px;height:26px;border-radius:50%;background:#F0A500;opacity:.7;filter:blur(3px)"></div>`;
 return `<div class="abs lbl s2" style="left:22px;top:58px">TODAY</div>${band}
 <div class="abs ctx" style="left:22px;top:170px">now, until twenty to seven</div>
 <div class="abs hero" style="left:22px;top:204px;width:340px">Groceries for the week</div>
 <div class="key" style="top:352px"><span class="word" id="${side}fin">Finish</span><span class="lbl s2">HOLD · 30 MIN LEFT</span></div>
 <div class="abs lbl s2" style="left:22px;top:450px">NEXT</div>
 <div class="q" style="top:478px">Push Day A<span class="tm">7:00 PM</span></div>
 <div class="q" style="top:526px">Stretch &amp; mobility<span class="tm">8:30 PM</span></div>
 <div class="abs ctx" style="left:22px;top:640px">today's training</div>
 <div class="abs" style="left:22px;top:672px;font-size:34px;font-weight:500;letter-spacing:-.03em">Push day A</div>
 <div class="key" style="top:730px"><span class="word" id="${side}start">Start</span><span class="lbl s2">5 EXERCISES · 18 SETS</span></div>
 <div class="finger" id="${side}f"></div>`;
}
for(const s of['L','R'])document.getElementById(s).innerHTML=phone(s);
const $=id=>document.getElementById(id), at=(t,f)=>setTimeout(f,t), note=t=>$('note').textContent=t;
// install strokes
function before(el){const w=el.offsetWidth+14;el.insertAdjacentHTML('afterbegin',`<svg width="${w}" height="19" viewBox="0 0 200 14" preserveAspectRatio="none" style="left:-7px;bottom:-3px;z-index:-1;transition:transform .12s, opacity .2s"><g filter="url(#rough)"><path class="tr" d="${ROUGH}" fill="rgba(${LIVE},.2)" opacity="0"/><path class="p" d="${ROUGH}" fill="rgba(${LIVE},.82)" style="clip-path:inset(0 0 0 0)"/></g></svg>`);el.style.zIndex=1;return el.querySelector('svg')}
function after(el){const w=el.offsetWidth+6;el.insertAdjacentHTML('beforeend',`<svg width="${w}" height="14" style="left:-2px;bottom:-12px"><path class="tr" d="${swash(w,.9)}" fill="rgba(${LIVE},.35)" opacity="0"/><path class="p" d="${swash(w,2.6)}" fill="rgb(${LIVE})" style="clip-path:inset(0 100% 0 0);transition:clip-path .36s var(--house), opacity 1.1s var(--house)"/><rect class="sh" x="-40" y="0" width="40" height="12" fill="url(#sheen)" opacity="0"/><circle class="bead" cx="${w}" cy="5.6" r="0" fill="rgb(${LIVE})"/></svg>`);return {svg:el.querySelector('svg'),w}}
document.fonts.ready.then(()=>{
 const Lf=before($('Lfin')),Ls=before($('Lstart'));
 const Rf=after($('Rfin')),Rs=after($('Rstart'));
 Ls.querySelector('.p').setAttribute('fill','rgba(204,63,104,.82)');
 Rs.svg.querySelector('.p').setAttribute('fill','rgb(204,63,104)');Rs.svg.querySelector('.bead').setAttribute('fill','rgb(204,63,104)');
 document.body.dataset.start='1';
 note('ARRIVAL: THE INK LINE PAINTS IN UNDER THE WORD, THEN DRIES TO 75%.');
 at(400,()=>{[Rf,Rs].forEach((r,i)=>at(i*160,()=>{const p=r.svg.querySelector('.p');p.style.clipPath='inset(0 0 0 0)';at(800,()=>{p.style.opacity=.75})}))});
 // tap Start
 at(2600,()=>{note('TAP: THE LINE WETS, THICKENS FROM 2.5 TO 4 PT, AND A SHEEN RUNS ALONG IT.');
  const fl=$('Lf'),fr=$('Rf');[fl,fr].forEach((f,i)=>{const w=$(i?'Rstart':'Lstart');const r=w.getBoundingClientRect(),pr=w.closest('.ph').getBoundingClientRect(),k=document.body.classList.contains('x2')?2:1;f.style.left=((r.left-pr.left)/k+40)+'px';f.style.top=((r.top-pr.top)/k+20)+'px';f.style.opacity=1;f.style.transform='translate(-50%,-50%) scale(1)'});
  Ls.style.transform='scaleY(1.65)';Ls.style.filter='blur(1px)';$('Lstart').style.transform='translateY(1px)';
  const p=Rs.svg.querySelector('.p');p.style.transition='opacity .12s, d .12s';p.style.opacity=1;p.setAttribute('d',swash(Rs.w,4));$('Rstart').style.transform='translateY(1px)';});
 at(3000,()=>{['Lf','Rf'].forEach(f=>{$(f).style.opacity=0});Ls.style.transform='none';Ls.style.filter='none';$('Lstart').style.transform='none';$('Rstart').style.transform='none';
  const p=Rs.svg.querySelector('.p');p.setAttribute('d',swash(Rs.w,2.6));
  const sh=Rs.svg.querySelector('.sh');sh.setAttribute('opacity',1);sh.animate([{transform:'translateX(0)'},{transform:`translateX(${Rs.w+40}px)`}],{duration:520,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>sh.setAttribute('opacity',0);
  at(700,()=>{p.style.transition='opacity 1.1s var(--house)';p.style.opacity=.75});});
 // hold Finish
 at(4600,()=>{note('HOLD: EMPTIES TO A HAIRLINE, REPAINTS UNDER THE THUMB, BEADS AT THE TIP.');
  [['Lf','Lfin'],['Rf','Rfin']].forEach(([f,w])=>{const e=$(w),r=e.getBoundingClientRect(),pr=e.closest('.ph').getBoundingClientRect(),k=document.body.classList.contains('x2')?2:1;$(f).style.left=((r.left-pr.left)/k+40)+'px';$(f).style.top=((r.top-pr.top)/k+20)+'px';$(f).style.opacity=1;$(f).style.transform='translate(-50%,-50%) scale(1)'});
  const lp=Lf.querySelector('.p'),lt=Lf.querySelector('.tr');lt.setAttribute('opacity',1);lp.style.transition='none';lp.style.clipPath='inset(0 100% 0 0)';
  const rp=Rf.svg.querySelector('.p'),rt=Rf.svg.querySelector('.tr');rt.setAttribute('opacity',1);rp.style.transition='none';rp.style.opacity=1;rp.style.clipPath='inset(0 100% 0 0)';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{lp.style.transition='clip-path 1.2s cubic-bezier(.2,.6,.35,1)';lp.style.clipPath='inset(0 0 0 0)';rp.style.transition='clip-path 1.2s cubic-bezier(.2,.6,.35,1), d 1.2s';rp.style.clipPath='inset(0 0 0 0)';rp.setAttribute('d',swash(Rf.w,3.6))}));});
 at(5850,()=>{['Lf','Rf'].forEach(f=>{$(f).style.opacity=0});Lf.style.transform='scaleY(1.3)';at(200,()=>Lf.style.transform='none');
  const b=Rf.svg.querySelector('.bead');b.animate([{r:0,opacity:1},{r:5,opacity:.9,offset:.4},{r:7,opacity:0}],{duration:520,easing:'cubic-bezier(.2,.8,.2,1)'});
  const rp=Rf.svg.querySelector('.p');rp.style.transition='d .4s, opacity 1.1s var(--house)';rp.setAttribute('d',swash(Rf.w,2.6));Rf.svg.querySelector('.tr').setAttribute('opacity',0);Lf.querySelector('.tr').setAttribute('opacity',0);
  ['Lfin','Rfin'].forEach(w=>{$(w).style.transition='color .6s';$(w).style.color='rgba(23,20,31,.45)'});});
 at(7600,()=>{note('THE DAY BAND GOES FROM 20 PT TO 6 PT, WITH NO SOFT PASS AND NO AMBER DOT.');});
 at(9600,()=>{document.body.dataset.done='1'});
});
</script>
</body>
</html>
