<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Show and hints</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Motion study for docs/design/show-and-hints.md: Tess's Show layer reading a receipt photo from the recent-photos row, then Write with a phrase hint that fills the field, a G line under the drying ghost, and an H line beside the soul swiped away. Add ?x2 to render at 2x. -->
<style>
:root{--ink:#2B2440;--ctx:#7A5C8E;--sub:#6E6480;--verm:#C8452F;--cobalt:#2E6DA4;--cad:#E0A35C}
body{margin:0;background:#EFE7DC}
.ph{position:relative;width:390px;height:844px;overflow:hidden;color:var(--ink);font-family:'Inter Tight',sans-serif;
 background:radial-gradient(60% 40% at 85% 6%,#F7E6B8 0%,rgba(247,230,184,0) 70%),radial-gradient(70% 45% at 0% 35%,#D8CBE6 0%,rgba(216,203,230,0) 70%),radial-gradient(80% 50% at 100% 75%,#F2E2C8 0%,rgba(242,226,200,0) 70%),#F4F0EC}
.abs{position:absolute}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;color:var(--sub);white-space:nowrap}
.d{position:absolute;width:40px;height:36px;margin:-18px 0 0 -20px;border-radius:52% 48% 60% 40%/55% 45% 55% 45%;background:radial-gradient(closest-side,rgba(var(--c),.85) 0%,rgba(var(--c),.6) 42%,rgba(var(--c),0) 100%);mix-blend-mode:multiply;filter:blur(2.5px)}
.mode{position:absolute;right:76px;font-size:34px;font-weight:500;letter-spacing:-.035em;line-height:40px;opacity:0;white-space:nowrap;z-index:12}
.big{font-size:34px;font-weight:500;letter-spacing:-.035em;line-height:40px;white-space:nowrap}
.thumb{position:absolute;top:0;width:60px;height:80px;overflow:hidden;box-shadow:0 1px 3px rgba(43,36,64,.18)}
.rc{background:#FBFAF6}
.rc i{position:absolute;left:8px;height:2px;background:rgba(43,36,64,.35)}
#finger{width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(43,36,64,.16);box-shadow:0 0 0 1.5px rgba(255,255,255,.7);opacity:0;z-index:30;pointer-events:none}
.la .line{position:absolute;left:0;right:0;bottom:-6px;height:1.5px;transform:scaleX(0)}
</style>
</head>
<body>
<div class="ph" id="ph">
  <section id="page" class="abs" style="inset:0;transform-origin:50% 30%">
    <div class="abs lbl" style="left:22px;top:58px;display:flex;gap:22px"><span>REVIEW</span><span style="color:var(--ink)">TODAY</span><span>TRAINING</span><span>KITCHEN</span></div>
    <div class="abs" style="left:107px;top:80px;width:56px;height:4px;background:var(--verm);border-radius:2px 1px 2.4px 1.2px;transform:rotate(-1.2deg)"></div>
    <div class="abs" style="left:22px;top:250px;font-size:21px;color:var(--ctx)">now, until twenty to seven</div>
    <div class="abs" style="left:20px;top:282px;font-size:56px;font-weight:500;line-height:1.02;letter-spacing:-.04em">Groceries for<br>the week</div>
    <div class="abs lbl" style="left:22px;top:500px">NEXT</div>
    <div class="abs" style="left:22px;top:530px;font-size:21px;line-height:48px">Push Day A<br><span style="opacity:.88">Stretch and mobility</span></div>
  </section>

  <div id="veil" class="abs" style="left:0;right:0;bottom:0;height:470px;opacity:0;z-index:10;pointer-events:none;
    background:radial-gradient(120% 90% at 92% 100%,rgba(244,240,236,.97) 0%,rgba(244,240,236,.93) 55%,rgba(244,240,236,0) 100%),radial-gradient(60% 50% at 90% 95%,rgba(224,163,92,.12),rgba(224,163,92,0));
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(transparent,#000 30%);mask-image:linear-gradient(transparent,#000 30%)"></div>
  <div id="ask" class="abs" style="left:22px;right:22px;top:440px;font-size:21px;color:var(--cobalt);opacity:0;z-index:12">What's next?</div>
  <div id="fast" class="abs" style="left:22px;right:22px;top:476px;font-size:21px;opacity:0;z-index:12;color:rgba(43,36,64,.75)"><b style="font-weight:600;color:var(--ink)">Start Push Day A</b> · <b style="font-weight:600;color:var(--ink)">Groceries</b></div>
  <div id="mSpeak" class="mode" style="top:594px">Speak</div>
  <div id="mWrite" class="mode" style="top:664px">Write</div>
  <div id="mShow" class="mode" style="top:734px">Show</div>
  <div id="sPhotos" class="mode" style="top:594px">Photos</div>
  <div id="sCamera" class="mode" style="top:664px">Camera</div>
  <div id="sFile" class="mode" style="top:734px">File</div>
  <div id="row" class="abs" style="left:0;right:0;top:476px;height:80px;z-index:12;opacity:0"></div>
  <section id="layer" class="abs" style="inset:0;z-index:12;pointer-events:none"></section>

  <div id="kb" class="abs" style="left:0;right:0;bottom:0;height:291px;background:#D3D0D8;z-index:14;transform:translateY(291px)"><div class="abs lbl" style="left:0;right:0;top:120px;text-align:center;opacity:.5">SYSTEM KEYBOARD</div></div>
  <div id="say" class="abs" style="right:78px;bottom:43px;width:262px;font-size:21px;line-height:28px;color:var(--cobalt);text-align:right;opacity:0;z-index:12"></div>
  <span id="undo" class="abs la lbl" style="right:78px;top:808px;color:var(--verm);opacity:0;z-index:12">UNDO<span class="line" style="background:var(--verm)"></span></span>
  <div id="soul" class="abs" style="left:346px;top:788px;width:0;height:0;z-index:13">
    <div class="d" id="dR" style="--c:200,69,47"></div><div class="d" id="dB" style="--c:46,109,164"></div><div class="d" id="dY" style="--c:224,179,65"></div>
  </div>
  <div id="finger" class="abs"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const HOUSE = 'cubic-bezier(.2,.8,.2,1)';
const SPRING = 'cubic-bezier(.3,1.3,.5,1)';
const anim = (el, kf, o) => el.animate(kf, { fill: 'forwards', ...o }).finished;
const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const tween = (dur, fn, e = ease) => new Promise((res) => { const t0 = performance.now(); const st = (n) => { const t = Math.min(1, (n - t0) / dur); fn(e(t)); t < 1 ? requestAnimationFrame(st) : res(); }; requestAnimationFrame(st); });
const rel = (r) => { const p = $('ph').getBoundingClientRect(), k = p.width / 390; return { left: (r.left - p.left) / k, top: (r.top - p.top) / k, width: r.width / k, height: r.height / k }; };
const finger = $('finger');
const fingerAt = (x, y) => { finger.style.left = x + 'px'; finger.style.top = y + 'px'; };
const fingerOn = async (x, y) => { fingerAt(x, y); await anim(finger, [{ opacity: 0, transform: 'scale(1.3)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 160 }); };
const fingerOff = () => anim(finger, [{ opacity: 1 }, { opacity: 0 }], { duration: 160 });
const tapAt = async (x, y) => { await fingerOn(x, y); await sleep(110); fingerOff(); };
const centre = (el) => { const r = rel(el.getBoundingClientRect()); return [r.left + r.width / 2, r.top + r.height / 2]; };
const layer = $('layer');
const add = (html) => { layer.insertAdjacentHTML('beforeend', html); return layer.lastElementChild; };
function fadeTo(el, o, dur, delay = 0, extra) { const from = getComputedStyle(el).opacity; el.getAnimations().forEach((a) => a.cancel()); el.style.opacity = from; el.animate([{ opacity: from, ...(extra || {}) }, { opacity: o, transform: 'none' }], { duration: dur, delay, fill: 'forwards' }); }
function say(t, undo) { const s = $('say'); fadeTo(s, 0, 0); s.innerHTML = t; fadeTo(s, 1, 300, 0, { transform: 'translateX(12px)' }); if (undo) fadeTo($('undo'), 1, 240, 120); }
const hush = () => { fadeTo($('say'), 0, 160); fadeTo($('undo'), 0, 160); };
async function swapText(el, t) { await anim(el, [{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(3px)' }], { duration: 120 }); el.innerHTML = t; await anim(el, [{ opacity: 0, filter: 'blur(3px)' }, { opacity: 1, filter: 'blur(0)' }], { duration: 180, easing: HOUSE }); }

const D = { R: $('dR'), B: $('dB'), Y: $('dY') };
const REST = { R: [-10, -6, .72], B: [10, -6, .72], Y: [0, 9, .72] };
const OPEN = { R: [0, -180, 1], B: [0, -110, 1], Y: [0, -40, 1] };
const pos = {};
function place(k, [x, y, s]) { pos[k] = [x, y, s]; D[k].style.transform = `translate(${x}px,${y}px) scale(${s})`; }
function move(k, to, dur, easing = SPRING, delay = 0) { const from = pos[k]; pos[k] = to; return anim(D[k], [{ transform: `translate(${from[0]}px,${from[1]}px) scale(${from[2]})` }, { transform: `translate(${to[0]}px,${to[1]}px) scale(${to[2]})` }], { duration: dur, easing, delay }); }
Object.keys(D).forEach((k) => place(k, REST[k]));
const breathe = $('soul').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 3200, iterations: Infinity, easing: 'ease-in-out' });
const setC = (k, c) => D[k].style.setProperty('--c', c);

async function open() {
  breathe.pause();
  anim($('page'), [{ opacity: 1, filter: 'blur(0)', transform: 'scale(1)' }, { opacity: .22, filter: 'blur(3px)', transform: 'scale(.985)' }], { duration: 420, easing: HOUSE });
  anim($('veil'), [{ opacity: 0, transform: 'translateY(60px)' }, { opacity: 1, transform: 'none' }], { duration: 460, easing: HOUSE });
  await anim($('soul'), [{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out' });
  move('Y', OPEN.Y, 480, SPRING, 0); move('B', OPEN.B, 480, SPRING, 40); move('R', OPEN.R, 480, SPRING, 80);
  [['mShow', 120], ['mWrite', 160], ['mSpeak', 200]].forEach(([id, d]) => anim($(id), [{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: 360, delay: d, easing: HOUSE }));
  $('ask').textContent = "What's next?";
  anim($('ask'), [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 320, delay: 220, easing: HOUSE });
  anim($('fast'), [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 320, delay: 280, easing: HOUSE });
  await sleep(560);
}
async function close() {
  ['mSpeak', 'mWrite', 'mShow', 'sPhotos', 'sCamera', 'sFile', 'ask', 'fast', 'row'].forEach((id) => { const e = $(id); const o = +getComputedStyle(e).opacity; e.getAnimations().forEach((a) => a.cancel()); e.style.opacity = o; if (o > 0) anim(e, [{ opacity: o }, { opacity: 0 }], { duration: 180 }); });
  [...layer.children].forEach((e) => anim(e, [{ opacity: getComputedStyle(e).opacity }, { opacity: 0 }], { duration: 180 }));
  setC('R', '200,69,47'); setC('B', '46,109,164'); setC('Y', '224,179,65');
  Object.keys(D).forEach((k, i) => { D[k].getAnimations().forEach((a) => a.cancel()); D[k].style.opacity = 1; move(k, REST[k], 420, HOUSE, i * 30); });
  anim($('veil'), [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(60px)' }], { duration: 380, delay: 80, easing: HOUSE });
  await anim($('page'), [{ opacity: .22, filter: 'blur(3px)', transform: 'scale(.985)' }, { opacity: 1, filter: 'blur(0)', transform: 'scale(1)' }], { duration: 420, delay: 80, easing: HOUSE });
  ['sPhotos', 'sCamera', 'sFile', 'mSpeak', 'mWrite', 'mShow', 'row'].forEach((id) => { $(id).getAnimations().forEach((a) => a.cancel()); $(id).style.opacity = 0; });
  layer.innerHTML = '';
  breathe.play();
}

// recent photos: a receipt, a recipe screenshot, a page, two photos
function thumbs() {
  const T = [
    `<div class="thumb rc" style="left:22px">${[10, 16, 22, 28, 34, 46, 52, 64].map((y, i) => `<i style="top:${y}px;width:${i === 7 ? 30 : 24 + (i * 7) % 18}px"></i><i style="top:${y}px;left:44px;width:8px"></i>`).join('')}</div>`,
    `<div class="thumb" style="left:90px;background:linear-gradient(#F3E3C6 0 30%,#FBF7EE 30%)"><i style="position:absolute;left:8px;top:30px;width:40px;height:2px;background:rgba(43,36,64,.35)"></i><i style="position:absolute;left:8px;top:38px;width:30px;height:2px;background:rgba(43,36,64,.3)"></i><i style="position:absolute;left:8px;top:46px;width:36px;height:2px;background:rgba(43,36,64,.3)"></i></div>`,
    `<div class="thumb" style="left:158px;background:radial-gradient(60% 50% at 40% 40%,#7FA7C9,#3F6A8F)"></div>`,
    `<div class="thumb" style="left:226px;background:#FAF8F2">${[12, 18, 24, 30, 36, 42, 48, 54, 60].map((y) => `<i style="position:absolute;left:7px;top:${y}px;width:46px;height:1.5px;background:rgba(43,36,64,.3)"></i>`).join('')}</div>`,
    `<div class="thumb" style="left:294px;background:radial-gradient(70% 60% at 60% 60%,#C98F6A,#7A4E3A)"></div>`,
    `<div class="thumb" style="left:362px;background:radial-gradient(70% 60% at 50% 40%,#9DB98A,#4F6B42)"></div>`];
  $('row').innerHTML = T.join('');
}

(async () => {
  if (location.search.includes('x2')) { const ph = $('ph'); ph.style.transform = 'scale(2)'; ph.style.transformOrigin = '0 0'; }
  await document.fonts.ready; await sleep(400); document.body.dataset.start = '1';
  await sleep(700);

  // 1 · Show: the cadmium dab rises to the top and the column becomes Photos · Camera · File; recent photos rise in the wash
  await tapAt(346, 788); await open(); await sleep(700);
  await tapAt(...centre($('mShow')));
  ['mSpeak', 'mWrite', 'mShow'].forEach((id) => anim($(id), [{ opacity: 1 }, { opacity: 0, transform: 'translateX(-12px)' }], { duration: 200 }));
  anim($('fast'), [{ opacity: 1 }, { opacity: 0 }], { duration: 180 });
  move('Y', OPEN.R, 420, SPRING); move('R', OPEN.B, 420, SPRING, 40); move('B', OPEN.Y, 420, SPRING, 80);
  setTimeout(() => { setC('R', '224,179,65'); setC('B', '224,179,65'); }, 220);
  [['sPhotos', 160], ['sCamera', 200], ['sFile', 240]].forEach(([id, d]) => anim($(id), [{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: 360, delay: d, easing: HOUSE }));
  swapText($('ask'), 'Show me something');
  thumbs();
  anim($('row'), [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { duration: 380, delay: 120, easing: HOUSE });
  await sleep(1500);

  // tap the receipt: it grows into a reading view; the brush passes; the total row is marked
  const rc = $('row').children[0]; const [rx, ry] = centre(rc); await tapAt(rx, ry);
  const r0 = rel(rc.getBoundingClientRect());
  const big = add(`<div class="abs rc" style="left:${r0.left}px;top:${r0.top}px;width:60px;height:80px;transform-origin:0 0;box-shadow:0 2px 10px rgba(43,36,64,.2);overflow:hidden"></div>`);
  const RL = [['TESCO EXTRA', ''], ['Milk 2L', '1.55'], ['Eggs x12', '3.20'], ['Lemons', '0.90'], ['Spaghetti', '1.10'], ['Parmesan', '3.85'], ['…', ''], ['SUBTOTAL', '36.40'], ['VAT', '1.80'], ['TOTAL', '£38.20'], ['VISA ****4411', '38.20']];
  big.innerHTML = RL.map(([a, b], i) => `<div style="position:absolute;left:14px;right:14px;top:${14 + i * 24}px;display:flex;justify-content:space-between;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:rgba(43,36,64,.8);${a === 'TOTAL' ? 'font-weight:700' : ''}"><span>${a}</span><span>${b}</span></div>`).join('') + `<div id="hl" style="position:absolute;left:10px;right:10px;top:${14 + 9 * 24 + 15}px;height:3px;background:var(--cad);opacity:.85;transform:scaleX(0);transform-origin:left"></div><div id="band" style="position:absolute;left:0;right:0;top:-80px;height:80px;background:linear-gradient(rgba(224,163,92,0),rgba(224,163,92,.5) 55%,rgba(224,163,92,0));mix-blend-mode:multiply;filter:blur(6px)"></div>`;
  rc.style.visibility = 'hidden';
  ['sPhotos', 'sCamera', 'sFile'].forEach((id) => anim($(id), [{ opacity: 1 }, { opacity: 0 }], { duration: 200 }));
  anim($('row'), [{ opacity: 1 }, { opacity: 0, transform: 'translateY(10px)' }], { duration: 220 });
  anim($('ask'), [{ opacity: 1 }, { opacity: 0 }], { duration: 160 });
  // the dabs gather into a small thinking cluster in the corner while she reads
  Object.keys(D).forEach((k, i) => move(k, REST[k], 360, HOUSE, i * 30));
  await anim(big, [{ left: `${r0.left}px`, top: `${r0.top}px`, width: '60px', height: '80px' }, { left: '75px', top: '120px', width: '240px', height: '300px' }], { duration: 460, easing: HOUSE });
  say('Reading the receipt…');
  const think = Object.values(D).map((d, k) => d.animate([{ opacity: 1 }, { opacity: .35 }, { opacity: 1 }], { duration: 600, delay: k * 200, iterations: 2 }));
  await anim($('band'), [{ transform: 'translateY(0)' }, { transform: 'translateY(390px)' }], { duration: 800, easing: 'linear' });
  await anim($('hl'), [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 220, easing: HOUSE });
  hush(); await sleep(500);

  // it settles as a thumbnail beside the ghost: "Tesco, £38.20?", with the route as words under it
  anim(big, [{ left: '75px', top: '120px', width: '240px', height: '300px', opacity: 1 }, { left: '22px', top: '548px', width: '36px', height: '48px', opacity: 1 }], { duration: 460, easing: HOUSE });
  big.querySelectorAll('div').forEach((d) => anim(d, [{ opacity: 1 }, { opacity: 0 }], { duration: 200 }));
  await sleep(240);
  const ghost = add(`<div class="abs big" style="left:72px;top:552px;opacity:.45">Tesco, <b style="font-weight:600">£38.20</b>?</div>`);
  const routes = add(`<div class="abs lbl" style="left:72px;top:612px;display:flex;gap:18px"><span style="color:var(--ink);position:relative">TOTAL<i style="position:absolute;left:0;right:0;bottom:-6px;height:3px;background:var(--cad);opacity:.85"></i></span><span>RECIPE</span><span>NOTE</span></div>`);
  anim(ghost, [{ opacity: 0, transform: 'translateX(10px)' }, { opacity: .45, transform: 'none' }], { duration: 300, easing: HOUSE });
  anim(routes, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 120 });
  const dry = add(`<div class="abs" style="left:72px;top:596px;height:1.5px;width:0;background:var(--cobalt)"></div>`);
  await sleep(400);
  await tween(2000, (t) => { dry.style.width = (240 * t) + 'px'; }, (t) => t);
  await close();
  say('Groceries, £38.20. Logged.', true);
  await sleep(2000); hush(); await sleep(400);

  // 2 · Write with a phrase hint: the hint sits between the question and the field; a tap drops it into the field
  await tapAt(346, 788); await open(); await sleep(500);
  await tapAt(...centre($('mWrite')));
  ['mSpeak', 'mShow', 'fast'].forEach((id) => anim($(id), [{ opacity: getComputedStyle($(id)).opacity }, { opacity: 0 }], { duration: 180 }));
  anim($('mWrite'), [{ opacity: 1 }, { opacity: 0, transform: 'translateX(-12px)' }], { duration: 220, delay: 80 });
  move('R', [-6, -3, .45], 300, HOUSE); move('Y', [3, 5, .45], 300, HOUSE);
  const fromB = pos.B; pos.B = [-160, -238, 1];
  anim(D.B, [{ transform: `translate(${fromB[0]}px,${fromB[1]}px) scale(1)` }, { transform: 'translate(-160px,-238px) scale(9,.18)', opacity: .4 }], { duration: 380, easing: HOUSE });
  anim($('kb'), [{ transform: 'translateY(291px)' }, { transform: 'none' }], { duration: 380, easing: HOUSE });
  const wline = add(`<div class="abs" style="left:22px;width:346px;top:548px;height:.5px;background:rgba(46,109,164,.6);transform-origin:100% 50%"></div>`);
  const field = add(`<div class="abs big" style="left:22px;right:22px;top:504px"><span id="plc" style="color:rgba(43,36,64,.28)">bench 80x8, or ask</span><span id="tx"></span><span id="caret" style="display:inline-block;width:2px;height:30px;background:var(--cobalt);vertical-align:-4px;margin-left:1px"></span></div>`);
  const hint = add(`<div class="abs" style="left:22px;top:468px;font-size:21px;color:rgba(43,36,64,.55);white-space:nowrap">milk, eggs, 2 lemons</div>`);
  await sleep(240);
  anim(D.B, [{ opacity: .4 }, { opacity: 0 }], { duration: 200 });
  anim(wline, [{ opacity: 0, transform: 'scaleX(.3)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: HOUSE });
  anim(field, [{ opacity: 0 }, { opacity: 1 }], { duration: 240 });
  anim(hint, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 160 });
  const caret = field.querySelector('#caret'); const blink = caret.animate([{ opacity: 1 }, { opacity: 0 }, { opacity: 1 }], { duration: 900, iterations: Infinity });
  await sleep(1300);
  await tapAt(...centre(hint));
  // the phrase travels into the field and inks; the placeholder steps aside; nothing is sent
  const hr = rel(hint.getBoundingClientRect());
  anim(field.querySelector('#plc'), [{ opacity: 1 }, { opacity: 0 }], { duration: 160 });
  await anim(hint, [{ transform: 'none', fontSize: '21px', color: 'rgba(43,36,64,.55)' }, { transform: `translateY(${504 - hr.top}px)`, fontSize: '34px', color: 'rgba(43,36,64,1)', fontWeight: 500, letterSpacing: '-.035em', lineHeight: '40px' }], { duration: 360, easing: HOUSE });
  field.querySelector('#plc').remove(); field.querySelector('#tx').textContent = 'milk, eggs, 2 lemons'; hint.remove();
  await sleep(1100);
  // Return: the ghost dries for 2s; a G line offers another way to say the same kind of thing
  blink.cancel(); caret.remove();
  anim($('kb'), [{ transform: 'none' }, { transform: 'translateY(291px)' }], { duration: 320, easing: HOUSE });
  await anim(field, [{ opacity: 1 }, { opacity: .45 }], { duration: 200 });
  const g = add(`<div class="abs" style="left:22px;right:22px;top:566px;font-size:21px;color:var(--sub)">You can also say <b style="font-weight:600;color:var(--ink)">buy milk and eggs</b>.</div>`);
  anim(g, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 300 });
  const dry2 = add(`<div class="abs" style="left:22px;top:552px;height:1.5px;width:0;background:var(--cobalt)"></div>`);
  await tween(2000, (t) => { dry2.style.width = (346 * t) + 'px'; }, (t) => t);
  D.B.getAnimations().forEach((a) => a.cancel()); pos.B = [0, -40, .3]; D.B.style.transform = 'translate(0px,-40px) scale(.3)';
  await close();
  say('Milk, eggs, 2 lemons, on Groceries.', true);
  await sleep(2200); hush(); await sleep(900);

  // 3 · an H line after something done by hand: once, beside the soul; swiping it away retires it
  say('Next time, this works: <b style="font-weight:600">book physio fri 9am</b>.');
  await sleep(2200);
  await fingerOn(200, 770);
  await tween(300, (k) => { fingerAt(200 + 150 * k, 770); $('say').style.transform = `translateX(${120 * k}px)`; });
  fingerOff();
  fadeTo($('say'), 0, 200);
  await sleep(900);
  document.body.dataset.done = '1';
})();
