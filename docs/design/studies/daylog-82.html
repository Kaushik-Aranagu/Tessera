<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day log first day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{--board:#E9E6EE}
*{box-sizing:border-box}
body{margin:0;background:var(--board);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transform-origin:0 0;color:#1c1a20}
body.x2{transform:scale(2)}
.wrap{padding:34px 40px 40px}
.head{display:flex;gap:30px;margin-bottom:22px}
.head h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.015em;flex:none;width:420px}
.head p{margin:0;font-size:17px;line-height:24px;color:#4a4652;max-width:1000px}
.grid{display:grid;grid-template-columns:repeat(4,393px);gap:22px 22px;align-items:start}
.cap{margin-top:12px}
.cap .opt{font-size:13px;font-weight:700;letter-spacing:.08em;color:#6b6674}
.cap h2{margin:4px 0 6px;font-size:22px;font-weight:600;letter-spacing:-.01em}
.cap p{margin:0;font-size:16px;line-height:22px;color:#4a4652}
.ph{position:relative;width:393px;height:852px;background:var(--bg);color:rgb(var(--ink));overflow:hidden;border-radius:44px}
body.playing .ph{border-radius:0}
.por{--ink:18,16,22;--bg:#FBFAF7;--bg0:rgba(251,250,247,0);--tess:#2450D8;--ctx:#5A3DAF;--pan:#A4601A;--today:rgb(18,16,22);--train:#C23A22;--kit:#12936A;--rev:#5A3DAF;--glass:rgba(251,250,247,.66)}
.obs{--ink:245,242,236;--bg:#121014;--bg0:rgba(18,16,20,0);--tess:#86B4FF;--ctx:#B8A3FF;--pan:#E3A857;--today:rgb(245,242,236);--train:#FF7D62;--kit:#52D3A3;--rev:#B8A3FF;--glass:rgba(30,27,34,.62)}
.abs{position:absolute}
.body{position:absolute;inset:0}
.name{left:22px;top:52px;font-weight:700;font-size:15px;letter-spacing:.08em}
.ttl{left:22px;top:84px;font-size:44px;line-height:50px;font-weight:500;letter-spacing:-.02em}
.sw{right:22px;top:104px;font-weight:700;font-size:13px;letter-spacing:.08em;color:rgba(var(--ink),.55)}
.win{position:absolute;left:22px;right:22px;top:150px;bottom:84px;padding-bottom:64px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent,#000 48px);mask-image:linear-gradient(180deg,transparent,#000 48px)}
.dy{margin-top:30px}
.dy:first-child{margin-top:0}
.dt{font-weight:700;font-size:13px;letter-spacing:.08em;height:26px;line-height:26px;color:rgba(var(--ink),.66)}
.dt.now{color:rgb(var(--ink))}
.dt.mt{color:rgba(var(--ink),.45)}
.dl{position:relative;padding-left:64px;margin-top:6px;font-size:21px;line-height:28px;min-height:30px;max-height:120px;overflow:hidden;transition:max-height .32s cubic-bezier(.2,.9,.25,1),opacity .36s,transform .36s cubic-bezier(.2,.9,.25,1),margin .3s}
.dl:first-of-type{margin-top:8px}
.dl.hid{max-height:0;opacity:0;margin-top:0;transform:translateY(10px)}
.dl .t{position:absolute;left:0;top:3px;font-size:16px;font-weight:600;line-height:22px;font-variant-numeric:tabular-nums;color:rgba(var(--ink),.66)}
.dl.wash{background:linear-gradient(90deg,rgba(36,80,216,0) 0,rgba(36,80,216,.13) 60px,rgba(36,80,216,.13) 100%);border-radius:2px}
.obs .dl.wash{background:linear-gradient(90deg,rgba(134,180,255,0) 0,rgba(134,180,255,.16) 60px,rgba(134,180,255,.16) 100%)}
.qt{font-size:21px;line-height:28px;margin-top:6px;color:rgba(var(--ink),.66);transition:opacity .22s,max-height .3s;max-height:60px;overflow:hidden}
.qt.hid{opacity:0;max-height:0;margin:0}
.ax .dt{font-size:20px;height:36px;line-height:36px}
.ax .dl{padding-left:0;font-size:32px;line-height:38px;margin-top:10px;max-height:none}
.ax .dl .t{position:static;display:block;font-size:24px;line-height:30px}
.ax .qt{font-size:32px;line-height:38px}
.ax .name,.ax .sw{font-size:20px}
.ax .ttl{font-size:56px;line-height:62px;top:88px}
.ax .sw{top:120px}
.gl{position:absolute;left:150px;right:0;top:186px;bottom:96px;padding:20px 22px 0 46px;background:linear-gradient(90deg,var(--bg0),var(--bg) 34px)}
.gl .gk{font-weight:700;font-size:13px;letter-spacing:.08em;color:rgba(var(--ink),.55)}
.gl .big{font-size:56px;line-height:62px;white-space:nowrap;font-weight:500;letter-spacing:-.02em;margin-top:10px}
.gl .big small{font-size:21px;font-weight:400;letter-spacing:0;margin-left:6px}
.gl .gr{font-size:19px;line-height:26px;margin-top:12px}
.gl .gr em{font-style:normal;color:rgba(var(--ink),.62)}
.gl .more{position:absolute;left:46px;bottom:22px;font-weight:700;font-size:13px;letter-spacing:.08em}
.gl .more i{display:block;height:2px;margin-top:5px;background:currentColor}
.ctxl{left:22px;right:22px;top:146px;font-size:17px;color:var(--ctx);display:flex;justify-content:space-between}
.ctxl b{font-weight:700;font-size:13px;letter-spacing:.08em;color:rgb(var(--ink));padding-top:2px}
.sf{position:absolute;left:22px;width:350px;top:200px}
.sf .lbl{font-weight:700;font-size:13px;letter-spacing:.08em;color:rgba(var(--ink),.55);height:26px;line-height:26px;margin-top:22px}
.sf .lbl:first-child{margin-top:0}
.sf .r{display:flex;justify-content:space-between;align-items:center;height:40px;font-size:21px}
.sf .r em{font-style:normal;font-size:19px;color:rgba(var(--ink),.62);font-variant-numeric:tabular-nums}
.sf .qq{font-size:21px;line-height:28px;color:rgba(var(--ink),.66)}
.soul{left:323px;top:759px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 40%,#E2432A 0 28%,transparent 46%),radial-gradient(circle at 66% 38%,#2450D8 0 30%,transparent 50%),radial-gradient(circle at 50% 70%,#F0A500 0 28%,transparent 46%);filter:blur(3px)}
.tl{position:absolute;right:71px;width:270px;top:779px;transform:translateY(-50%);text-align:right;font-size:19px;line-height:25px;color:var(--tess)}
.finger{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(18,16,22,.16);border:1.5px solid rgba(18,16,22,.25);opacity:0;pointer-events:none;z-index:9}
.vo{position:absolute;left:14px;right:14px;border:3px solid #0A64D8;border-radius:8px;pointer-events:none}
</style></head>
<body>
<div class="wrap" id="board"></div>
<script>

const play = location.search.includes('play');
if (location.search.includes('x2')) document.body.classList.add('x2');
const band = line => `<div class="abs soul"></div>${line ? `<div class="tl">${line}</div>` : ''}`;
const QUIET = 'Your days write themselves here.';
const TESS_SIDE = '3 of 4 came after 6 pm.';
const TODAY = [
  ['07:10', 'Push Day A, 52 min. Bench 82.5 × 8, best.'],
  ['12:40', 'Done: call the bank'],
  ['18:20', 'Cooked dal tadka, 50 min'],
  ['21:05', 'Added 2 tasks'],
];
const ln = (r, c = '') => `<div class="dl ${c}"><span class="t">${r[0]}</span>${r[1]}</div>`;
const back = '<div class="abs name">‹ TODAY</div><div class="abs ttl">October</div><div class="abs sw">THE DAY</div>';
// y 150 to 768 window; today sits at the bottom, a 64pt foot under it.
const front = o => {
  const past = o.past ? `<div class="dy"><div class="dt mt">TUE 13</div></div><div class="dy"><div class="dt">WED 14</div>${ln(['19:30', 'Cooked carbonara, 35 min'])}</div>` : '';
  const n = o.n === undefined ? 0 : o.n;
  const lines = TODAY.map((r, i) => ln(r, i < n ? '' : 'hid')).join('');
  const q = `<div class="qt${n > 0 ? ' hid' : ''}" id="qt">${QUIET}</div>`;
  return back + `<div class="win" id="win">${past}<div class="dy"><div class="dt now">TODAY</div>${q}<div id="ls">${lines}</div></div></div>`;
};
const frontOne = () => back + `<div class="win"><div class="dy"><div class="dt now">TODAY</div>${ln(['18:40', 'Done: call the bank'])}</div></div>`;
const glance = (kind, big) => kind === 'empty'
  ? `<div class="gl"><div class="gk">THE DAY</div><div class="gr" style="font-size:19px">Nothing yet.</div></div>`
  : kind === 'one'
  ? `<div class="gl"><div class="gk">THE DAY</div><div class="big">1<small>thing</small></div><div class="gr">Call the bank</div><div class="more">ALL OF TODAY<i></i></div></div>`
  : `<div class="gl"><div class="gk">THE DAY</div><div class="big">4<small>things</small></div><div class="gr">Push Day A</div><div class="gr">Dal tadka</div><div class="gr"><em>and 2 more</em></div><div class="more">ALL OF TODAY<i></i></div></div>`;
const sideFull = () => `<div class="abs name">‹ TODAY</div><div class="abs ttl">Thursday</div><div class="abs ctxl"><span>4 things</span><b>DAY LOG</b></div>
  <div class="sf"><div class="lbl">TRAINED</div><div class="r"><span>Push Day A</span><em>52 min, 9 sets</em></div>
  <div class="lbl">COOKED</div><div class="r"><span>Dal tadka</span><em>50 min</em></div>
  <div class="lbl">TASKS</div><div class="r"><span>Done</span><em>1</em></div><div class="r"><span>Added</span><em>2</em></div></div>`;
const ph = (cls, inner, opt, h, p) => `<div><div class="ph ${cls}">${inner}</div><div class="cap"><div class="opt">${opt}</div><h2>${h}</h2><p>${p}</p></div></div>`;
const dim = h => `<div class="body" style="opacity:.3">${h}</div>`;
const fin = (x, y) => `<div class="finger" style="left:${x}px;top:${y}px;opacity:1"></div>`;

if (!play) {
  let b = `<div class="head"><h1>Sheet 82: Day log, empty and first day</h1><p>Nothing is ever missing here: an empty log is TODAY and one quiet line, the first entry takes that line's place, and a normal day is the same page with more under the date. No dots, no streak, no count of anything that has not happened, no line from Tess. The side THE DAY opens by its word (or the right edge) and shows what the day was, never what it was not.</p></div><div class="grid">`;
  b += ph('por', front({}) + band(''), '1 TRULY EMPTY', 'First use', 'TODAY in ink at the bottom, the quiet line under it, nothing above. The frame is complete: back word, October, the word THE DAY. No Tess line, no Try line: the page fills itself.');
  b += ph('por', frontOne() + band(''), '2 FIRST ENTRY', 'One line, no fuss', 'The quiet line fades (220 ms) and "18:40 Done: call the bank" rises 10 pt in its place. No "first", no day count, no praise. The page looks like a normal day with one line.');
  b += ph('por', front({ past: 1, n: 4 }) + band(''), '3 A NORMAL DAY', 'Thursday, four lines', 'Same frame. WED 14 above in the quiet tier, TUE 13 as a 45% label. Same type, same x 86 column. The first day is just this page early.');
  b += ph('por ax', `<div class="abs name">‹ TODAY</div><div class="abs ttl">October</div><div class="abs sw">THE DAY</div><div class="win"><div class="dy"><div class="dt now">TODAY</div>${ln(TODAY[2])}${ln(TODAY[3])}</div></div>` + band(''), '4 DYNAMIC TYPE, AX3', 'Time above text', 'Times sit above their text, the text goes to 32/38, nothing truncates and the window scrolls. The empty quiet line wraps at 32/38 in the same place.');
  b += ph('por', dim(front({ past: 1, n: 4 })) + glance('many') + fin(372, 420) + band(TESS_SIDE), '5 THE SIDE, STOP 1', 'The glance: 4 things', 'From the word or the right edge. The big fact is the day in view, two named from four and "and 2 more", foot word ALL OF TODAY. Tess: "3 of 4 came after 6 pm."');
  b += ph('por', sideFull() + band(TESS_SIDE), '6 THE SIDE, STOP 2', 'THE DAY, as facts', 'Grouped by kind with a figure at the right. Trained, cooked and tasks only: money and weight never appear here, and a private note is never counted by its words.');
  b += ph('por', dim(frontOne()) + glance('one') + fin(372, 420) + band(''), '7 THE SIDE, FIRST DAY', 'The glance: 1 thing', '"1 thing", the line named, ALL OF TODAY. Tess has nothing to say about one entry, and a first is not hers to announce.');
  b += ph('por', dim(front({})) + glance('empty') + fin(372, 420) + band(''), '8 THE SIDE, EMPTY', 'Nothing yet.', 'The side is still declared and opens. One quiet line, no big fact, no foot word, no zero.');
  b += ph('obs', front({}) + band(''), '9 OBSIDIAN', 'Truly empty', 'Quiet line at the secondary ink, TODAY at full ink. Nothing glows.');
  b += ph('obs', frontOne() + band(''), '10 OBSIDIAN', 'First entry', 'Same page, 245,242,236 on #121014.');
  b += ph('obs', front({ past: 1, n: 4 }) + band(''), '11 OBSIDIAN', 'A normal day', 'The Tess wash on a line she wrote would be #86B4FF at 16%, behind the text, dried by 2.8 s.');
  b += ph('obs', sideFull() + band(TESS_SIDE), '12 OBSIDIAN', 'The side', 'Tess in #86B4FF is the only colour.');
  b += `</div>`;
  document.getElementById('board').innerHTML = b;
  document.fonts.ready.then(() => { document.body.dataset.done = '1'; });
} else {
  document.body.classList.add('playing');
  const w = document.getElementById('board'); w.className = '';
  w.innerHTML = `<div class="ph por" id="ph"><div class="body" id="fr">${front({ past: 1, n: 0 })}</div>
    <div class="body" id="gb" style="opacity:0">${glance('many')}</div>
    <div class="body" id="fb" style="opacity:0;background:var(--bg)">${sideFull()}</div>
    <div class="abs soul"></div><div class="tl" id="t3" style="opacity:0">${TESS_SIDE}</div><div class="finger" id="fg"></div></div>`;
  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const tween = (ms, f) => new Promise(r => { const t0 = performance.now(); (function k(n) { const q = Math.min((n - t0) / ms, 1); f(ease(q)); q < 1 ? requestAnimationFrame(k) : r(); })(t0); });
  const fg = $('fg'), fr = $('fr'), gb = $('gb'), fb = $('fb');
  const finger = (x, y, on = 1) => { fg.style.left = x + 'px'; fg.style.top = y + 'px'; fg.style.opacity = on; };
  const lines = [...document.querySelectorAll('#ls .dl')];
  const land = async (i, tess) => { if (i === 0) $('qt').classList.add('hid'); await wait(i === 0 ? 220 : 0); lines[i].classList.remove('hid'); if (tess) { lines[i].classList.add('wash'); setTimeout(() => lines[i].classList.remove('wash'), 2800); } };
  const inn = p => { const p1 = Math.min(p, 1), p2 = Math.max(0, p - 1);
    fr.style.opacity = 1 - .7 * p1 - .3 * p2; fr.style.transform = `translateX(${-44 * p2}px)`;
    gb.style.opacity = p <= 1 ? p1 : 1 - p2; gb.style.transform = `translateX(${60 * (1 - p1) - 40 * p2}px)`;
    fb.style.opacity = p2; fb.style.transform = `translateX(${60 * (1 - p2)}px)`; $('t3').style.opacity = p1; };
  document.fonts.ready.then(async () => {
    document.body.dataset.start = '1';
    await wait(2200);            // 1. truly empty: only the quiet line
    await land(0, true); await wait(3000);   // 2. first entry, Tess wrote it: wash, dries
    await land(1); await wait(900); await land(2); await wait(900); await land(3); await wait(1800);  // 3. the day fills
    await tween(380, q => { finger(386 - 150 * q, 420); inn(q); }); finger(0, 0, 0); await wait(2300);   // 4. glance
    await tween(380, q => { finger(300 - 170 * q, 420); inn(1 + q); }); finger(0, 0, 0); await wait(2800);  // full side
    document.body.dataset.done = '1';
  });
}
</script>
</body></html>
