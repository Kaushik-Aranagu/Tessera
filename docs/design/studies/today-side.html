<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Design item 74 (Kaushik 2:06 PM PT Oct 16): with the index (73) moving between areas, a side swipe is each screen's own. Today's is THE DAY: the day in four strands, one per area, from 7 am to 11 pm, done marks struck, what's ahead tinted, one now line across. ?play records the swipe in and back, Porcelain. -->
<style>
:root{--board:#E9E6EE}
*{box-sizing:border-box}
body{margin:0;background:var(--board);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transform-origin:0 0;color:#1c1a20}
body.x2{transform:scale(2)}
.wrap{padding:34px 40px 40px}
.head{display:flex;gap:30px;margin-bottom:22px}
.head h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.015em;flex:none;width:380px}
.head p{margin:0;font-size:17px;line-height:24px;color:#4a4652;max-width:860px}
.row{display:flex;gap:22px;align-items:flex-start}
.col{width:393px;flex:none}
.cap{margin-top:14px}
.cap .opt{font-size:13px;font-weight:700;letter-spacing:.08em;color:#6b6674}
.cap h2{margin:4px 0 6px;font-size:23px;font-weight:600;letter-spacing:-.01em}
.cap p{margin:0 0 6px;font-size:16px;line-height:22px;color:#4a4652}
.map{width:430px;flex:none;padding-top:4px}
.map h2{margin:0 0 12px;font-size:23px;font-weight:600}
.map table{border-collapse:collapse;font-size:16px;line-height:22px;color:#36323c}
.map td{padding:0 0 14px;vertical-align:top}
.map td:first-child{font-weight:700;font-size:13px;letter-spacing:.08em;width:110px;padding-top:2px}
.ph{position:relative;width:393px;height:852px;background:var(--bg);color:rgb(var(--ink));overflow:hidden;flex:none;border-radius:44px}
body.playing .ph{border-radius:0}
.por{--ink:18,16,22;--bg:#FBFAF7;--tess:#2450D8;--today:#2450D8;--train:#C23A22;--kit:#12936A;--hab:#5A3DAF;--ctx:#5A3DAF}
.obs{--ink:245,242,236;--bg:#121014;--tess:#86B4FF;--today:#86B4FF;--train:#FF7D62;--kit:#52D3A3;--hab:#B8A3FF;--ctx:#B8A3FF}
.abs{position:absolute}
.body{position:absolute;inset:0}
.name{left:22px;top:52px;font-weight:700;font-size:15px;letter-spacing:.08em;line-height:20px}
.day{left:22px;top:138px;font-size:17px;color:rgba(var(--ink),.66)}
.ctxl{left:22px;right:22px;top:186px;font-size:17px;color:var(--ctx);display:flex;justify-content:space-between}
.ctxl b{font-weight:700;font-size:13px;letter-spacing:.08em;color:rgb(var(--ink));padding-top:2px}
.hero{left:22px;top:212px;width:350px;font-size:44px;line-height:50px;font-weight:500;letter-spacing:-.02em}
.key{left:22px;font-weight:700;font-size:15px;letter-spacing:.08em}
.key i{display:block;height:2px;margin-top:5px;background:currentColor}
.lbl{left:22px;font-weight:700;font-size:13px;letter-spacing:.08em;color:rgba(var(--ink),.55)}
.next{left:22px;width:350px;font-size:19px;line-height:26px}
.next div{display:flex;justify-content:space-between;gap:16px;margin-bottom:14px}
.next em{font-style:normal;color:rgba(var(--ink),.62);white-space:nowrap}
.w{color:color-mix(in oklab,var(--train) 72%,rgb(var(--ink)))}
.soul{left:323px;top:759px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 40%,#E2432A 0 28%,transparent 46%),radial-gradient(circle at 66% 38%,#2450D8 0 30%,transparent 50%),radial-gradient(circle at 50% 70%,#F0A500 0 28%,transparent 48%);filter:blur(2px)}
/* THE DAY */
.hr{left:22px;font-size:13px;color:rgba(var(--ink),.45);transform:translateY(-8px)}
.ch{font-weight:700;font-size:12px;letter-spacing:.08em}
.ch small{display:block;font-weight:400;font-size:13px;letter-spacing:0;color:rgba(var(--ink),.55);margin-top:2px}
.strand{width:2px;margin-left:-.25px;top:330px;height:370px;background:linear-gradient(color-mix(in oklab,var(--a) 46%,var(--bg)) 0 var(--n),color-mix(in oklab,var(--a) 16%,var(--bg)) var(--n))}
.seg{width:6px;border-radius:3px;margin-left:-2px;transform-origin:50% 0}
.seg.done{background:color-mix(in oklab,var(--a) 72%,rgb(var(--ink)))}
.seg.ahead{background:color-mix(in oklab,var(--a) 34%,var(--bg))}
.seg.run{background:color-mix(in oklab,var(--a) 80%,rgb(var(--ink)));box-shadow:0 0 0 3px color-mix(in oklab,var(--a) 18%,transparent)}
.it{font-size:13px;line-height:16px;width:66px}
.it.done{color:rgba(var(--ink),.5);text-decoration:line-through;text-decoration-thickness:1px}
.it.ahead{color:rgba(var(--ink),.86)}
.it.run{color:color-mix(in oklab,var(--a) 72%,rgb(var(--ink)));font-weight:600}
.now{left:22px;right:22px;height:1.5px;background:var(--tess)}
.nowl{left:22px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--tess);background:var(--bg);padding-right:6px}
.finger{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(18,16,22,.16);border:1.5px solid rgba(18,16,22,.25);opacity:0;pointer-events:none;z-index:9}
</style></head>
<body>
<div class="wrap" id="board"></div>
<script>
const play = location.search.includes('play');
if (location.search.includes('x2')) document.body.classList.add('x2');
const Y = h => 330 + (h - 7) * (370 / 16);   // 7 am at 330 to 11 pm at 700
const NOW = 18 + 10 / 60;
// Friday, 6:10 pm. [label, start hour, end hour]; state from the clock.
const COLS = [
  { k: 'TASKS', a: 'var(--today)', items: [['Reply to landlord', 8.25, 8.5], ['Book physio', 10, 10.25], ['Groceries', 11.83, 12.3], ['Stretch', 20.5, 20.83], ['Read', 21.5, 22]] },
  { k: 'TRAINING', a: 'var(--train)', items: [['Push Day A, 7 of 20', 17.5, 19]] },
  { k: 'KITCHEN', a: 'var(--kit)', items: [['Oats', 7.5, 7.75], ['Tacos at 7&nbsp;pm', 18.5, 19.25]] },
  { k: 'HABITS', a: 'var(--hab)', items: [['Walk', 12.5, 13], ['Water', 15, 15.2], ['Read', 21.17, 21.5]] },
];
const state = (s, e) => e <= NOW ? 'done' : s <= NOW ? 'run' : 'ahead';
const count = c => c.items.some(i => state(i[1], i[2]) === 'run') ? 'on now' : `${c.items.filter(i => state(i[1], i[2]) === 'done').length} of ${c.items.length}`;

function today() {
  return `<div class="abs day">Friday evening</div><div class="abs ctxl"><span>now, 7 of 20 sets</span><b>THE DAY</b></div>
    <div class="abs hero" style="font-weight:542">Push Day A, <span class="w">bench set 4</span></div>
    <div class="abs key" style="top:332px">RESUME<i></i></div><div class="abs lbl" style="top:400px">NEXT</div>
    <div class="abs next" style="top:428px"><div><span>Stretch &amp; mobility</span><em>8:30 pm</em></div><div><span>Read Designing Data-Intensive Applications</span><em>9:10 pm</em></div></div>`;
}
function theDay() {
  let h = `<div class="abs day">Friday</div><div class="abs ctxl"><span>6 done, 1 on now</span><b>NOW</b></div>
    <div class="abs hero">4 to go</div>`;
  for (const [t, l] of [[9, '9 am'], [12, 'noon'], [15, '3 pm'], [21, '9 pm']]) h += `<div class="abs hr" style="top:${Y(t)}px">${l}</div>`;
  COLS.forEach((c, i) => {
    const x = 78 + i * 76;
    h += `<div class="abs ch" style="left:${x - 2}px;top:282px;color:color-mix(in oklab,${c.a} 80%,rgb(var(--ink)))">${c.k}<small>${count(c)}</small></div>`;
    h += `<div class="abs strand" style="left:${x}px;--a:${c.a};--n:${Y(NOW) - 330}px"></div>`;
    c.items.forEach(([n, s, e], j) => {
      const st = state(s, e), top = Y(s), ht = Math.max(16, (st === 'run' ? Y(NOW) : Y(e)) - top);
      h += `<div class="abs seg ${st}" data-t="${s}" style="left:${x}px;top:${top}px;height:${ht}px;--a:${c.a}"></div>`;
      if (st === 'run') h += `<div class="abs seg ahead" data-t="${s}" style="left:${x}px;top:${Y(NOW)}px;height:${Y(e) - Y(NOW)}px;--a:${c.a}"></div>`;
      h += `<div class="abs it ${st}" data-t="${s}" style="left:${x + 9}px;top:${top - 3}px;--a:${c.a}">${n}</div>`;
    });
  });
  h += `<div class="abs now" id="now" style="top:${Y(NOW)}px"></div><div class="abs nowl" style="top:${Y(NOW) - 8}px">6:10</div>`;
  return h;
}
const band = `<div class="abs soul"></div>`;

if (!play) {
  const col = (ph, opt, h, ps) => `<div class="col">${ph}<div class="cap"><div class="opt">${opt}</div><h2>${h}</h2>${ps.map(p => `<p>${p}</p>`).join('')}</div></div>`;
  let b = `<div class="head"><h1>A side swipe is the screen’s own</h1><p>The index (73) now moves between areas, so a left swipe on a tab page is free. Each screen gets the “more” that fits it. Today’s is THE DAY: the whole day in four strands, one per area, so you can see at a glance what’s done, what’s running and what’s ahead.</p></div><div class="row">`;
  b += col(`<div class="ph por"><div class="abs name">TODAY</div>${today()}${band}</div>`, 'TODAY', 'The word', ['THE DAY sits at the right of the context line. Swipe left anywhere above the band, or tap it.']);
  b += col(`<div class="ph por"><div class="abs name">TODAY</div>${theDay()}${band}</div>`, 'THE DAY', 'Four strands, one now line', ['7 am at the top, 11 pm at the bottom. Done is solid and struck through, running glows to the now line, and ahead is a tint. Tap any mark to open it.']);
  b += col(`<div class="ph obs"><div class="abs name">TODAY</div>${theDay()}${band}</div>`, 'OBSIDIAN', 'The same, in Obsidian', ['Each strand is its area’s colour. There are no new colours, and nothing is red for late.']);
  b += `<div class="map"><h2>Each tab page’s side swipe</h2><table>
    <tr><td>TODAY</td><td><b>THE DAY</b>, drawn here.</td></tr>
    <tr><td>TRAINING</td><td><b>THE WEEK</b>: the routines on their fixed days and what each did last time. It’s the routine page’s LAST TIMES (71), one level up.</td></tr>
    <tr><td>KITCHEN</td><td><b>THE WEEK’S COOKS</b> (Kitchen week, 67) now. PANTRY takes this place when Pantry arrives.</td></tr>
    <tr><td>REVIEW</td><td>Unchanged: x already moves by week (46), so it gets no side page.</td></tr>
    <tr><td>EVERY PAGE</td><td>71’s order still holds: edge = back, Tess’s band is hers, a row’s own swipe stays the row’s, then the page’s. The word always works.</td></tr>
    <tr><td>LATER</td><td>With many more areas, the index needs an order (pinned, recent, grouped by kind) and maybe typing a name. That’s parked for its own sheet.</td></tr></table></div>`;
  b += `</div>`;
  document.getElementById('board').innerHTML = b;
  document.fonts.ready.then(() => { document.body.dataset.done = '1'; });
} else {
  document.body.classList.add('playing');
  const w = document.getElementById('board'); w.className = '';
  w.innerHTML = `<div class="ph por" id="ph"><div class="abs name">TODAY</div>
    <div class="body" id="a">${today()}</div><div class="body" id="b" style="opacity:0">${theDay()}</div>${band}<div class="finger" id="fg"></div></div>`;
  const $ = id => document.getElementById(id);
  const a = $('a'), b = $('b'), fg = $('fg');
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const tween = (ms, f, e = ease) => new Promise(r => { const t0 = performance.now(); (function k(n) { const q = Math.min((n - t0) / ms, 1); f(e(q)); q < 1 ? requestAnimationFrame(k) : r(); })(t0); });
  const marks = [...b.querySelectorAll('[data-t]')], now = $('now');
  const draw = q => {   // the strands draw down the day to now, then what's ahead tints in
    const h = 7 + q * 14.5;
    marks.forEach(m => { const t = +m.dataset.t, on = Math.max(0, Math.min(1, (h - t) / 1.2)); m.style.opacity = on; if (m.classList.contains('seg')) m.style.transform = `scaleY(${.3 + .7 * on})`; });
    now.style.transform = `scaleX(${Math.max(0, Math.min(1, (h - 17.5) / 2))})`; now.style.transformOrigin = '0 0';
  };
  const slide = q => {   // 71's spine move: the body 44 pt left and out, the side page in from 60 pt, 40 ms behind
    a.style.transform = `translateX(${-44 * q}px)`; a.style.opacity = 1 - q;
    const q2 = Math.max(0, (q - .12) / .88); b.style.transform = `translateX(${60 * (1 - q2)}px)`; b.style.opacity = q2;
  };
  draw(0);
  document.fonts.ready.then(async () => {
    document.body.dataset.start = '1';
    await wait(1500);
    fg.style.opacity = 1;
    await tween(320, q => { fg.style.left = 300 - 180 * q + 'px'; fg.style.top = '270px'; slide(q); });
    fg.style.opacity = 0;
    await tween(1100, q => draw(q), x => 1 - Math.pow(1 - x, 3));
    await wait(1200);
    const run = b.querySelector('.seg.run');
    await tween(1600, q => { run.style.filter = `brightness(${1 + .18 * Math.sin(q * Math.PI * 2)})`; }, x => x);
    await wait(800);
    fg.style.opacity = 1;
    await tween(320, q => { fg.style.left = 100 + 180 * q + 'px'; slide(1 - q); });
    fg.style.opacity = 0;
    await wait(1500);
    document.body.dataset.done = '1';
  });
}
</script>
</body></html>
