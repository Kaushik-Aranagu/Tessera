<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Routine editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Motion study for v1 slice 10 (routine editing), drawn to docs/design/no-buttons.md: no list rows, no edit mode. Add ?x2 to render at 2x. -->
<style>
:root{--ink:#2B2440;--ctx:#7A5C8E;--sub:#6E6480;--verm:#C8452F;--cobalt:#2E6DA4}
body{margin:0;background:#EFE7DC}
.ph{position:relative;width:390px;height:844px;overflow:hidden;color:var(--ink);font-family:'Inter Tight',sans-serif;
 background:radial-gradient(60% 40% at 85% 6%,#F6D9CF 0%,rgba(246,217,207,0) 70%),radial-gradient(70% 45% at 0% 35%,#D8CBE6 0%,rgba(216,203,230,0) 70%),radial-gradient(80% 50% at 100% 75%,#F2E2C8 0%,rgba(242,226,200,0) 70%),#F4F0EC}
.abs{position:absolute}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;color:var(--sub)}
.ex{position:absolute;left:0;right:0;height:84px}
.ex .in{position:absolute;left:22px;right:22px;top:0}
.ex .n{font-size:34px;font-weight:500;letter-spacing:-.035em;line-height:40px;white-space:nowrap}
.ex .s{font-size:21px;line-height:30px;color:rgba(43,36,64,.75);white-space:nowrap}
.ex .s b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ex .trk{position:absolute;right:22px;top:24px;opacity:0;color:var(--verm)}
.seam{position:absolute;left:22px;right:22px;height:1px;background:rgba(43,36,64,.3);opacity:0}
#finger{width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(43,36,64,.16);box-shadow:0 0 0 1.5px rgba(255,255,255,.7);opacity:0;z-index:30;pointer-events:none}
.horizon{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:8;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);-webkit-mask-image:linear-gradient(transparent,#000 55%);mask-image:linear-gradient(transparent,#000 55%)}
.la .line{position:absolute;left:0;right:0;bottom:-6px;height:1.5px;transform:scaleX(0)}
</style>
</head>
<body>
<div class="ph" id="ph">
  <section id="page" class="abs" style="inset:0">
    <div class="abs lbl" style="left:22px;top:58px">TRAINING › ROUTINES</div>
    <div class="abs" style="left:20px;top:84px;font-size:56px;font-weight:500;line-height:1;letter-spacing:-.04em">Push Day A</div>
    <div id="ctx" class="abs" style="left:22px;top:150px;font-size:21px;color:var(--ctx)">5 exercises, about <span id="min">55</span> min</div>
    <div id="list"></div>
    <div id="add" class="abs" style="left:22px;font-size:21px;color:rgba(43,36,64,.7)">Add an exercise</div>
  </section>

  <div class="horizon"></div>
  <div class="abs" style="left:76px;right:22px;top:788px;height:.5px;background:rgba(43,36,64,.28);z-index:9"></div>
  <span id="tess" class="abs" style="left:78px;top:756px;font-size:21px;color:#8A7F96;z-index:9">Ask Tess…</span>
  <span id="undo" class="abs la lbl" style="right:22px;top:762px;color:var(--verm);opacity:0;z-index:9">UNDO<span class="line" style="background:var(--verm)"></span></span>
  <div class="abs" style="left:36px;top:760px;width:28px;height:24px;border-radius:52% 48% 60% 40%;background:radial-gradient(closest-side,rgba(46,109,164,.7),rgba(46,109,164,0));filter:blur(2px);z-index:9"></div>
  <div id="finger" class="abs"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const HOUSE = 'cubic-bezier(.2,.8,.2,1)';
const anim = (el, kf, o) => el.animate(kf, { fill: 'forwards', ...o }).finished;
const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const tween = (dur, fn, e = ease) => new Promise((res) => { const t0 = performance.now(); const st = (n) => { const t = Math.min(1, (n - t0) / dur); fn(e(t)); t < 1 ? requestAnimationFrame(st) : res(); }; requestAnimationFrame(st); });
const rel = (r) => { const p = $('ph').getBoundingClientRect(), k = p.width / 390; return { left: (r.left - p.left) / k, top: (r.top - p.top) / k, width: r.width / k, height: r.height / k }; };
const finger = $('finger');
const fingerAt = (x, y) => { finger.style.left = x + 'px'; finger.style.top = y + 'px'; };
const fingerOn = async (x, y) => { fingerAt(x, y); await anim(finger, [{ opacity: 0, transform: 'scale(1.3)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 160 }); };
const fingerOff = () => anim(finger, [{ opacity: 1 }, { opacity: 0 }], { duration: 160 });
const centre = (el) => { const r = rel(el.getBoundingClientRect()); return [r.left + r.width / 2, r.top + r.height / 2]; };
async function swap(el, html, colour) {
  await anim(el, [{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(3px)' }], { duration: 120 });
  el.innerHTML = html; if (colour) el.style.color = colour;
  await anim(el, [{ opacity: 0, filter: 'blur(3px)' }, { opacity: 1, filter: 'blur(0)' }], { duration: 180, easing: HOUSE });
}
const tessSay = (t, c = '#2E6DA4') => swap($('tess'), t, c);
function wash(el) {
  const w = document.createElement('span'); Object.assign(w.style, { position: 'absolute', left: '-10px', right: '-8px', top: '2px', bottom: '2px', borderRadius: '40% 60% 50% 50% / 60% 40% 60% 40%', background: 'rgba(46,109,164,.22)', filter: 'blur(5px)', zIndex: -1 });
  el.style.position = 'relative'; el.appendChild(w); anim(w, [{ opacity: 0 }, { opacity: 1, offset: .3 }, { opacity: 0 }], { duration: 700 }).then(() => w.remove());
}

const Y0 = 196, P = 84;
const EX = [
  { n: 'Bench press', sets: 4, s: '6–8 · 82.5 kg' },
  { n: 'Overhead press', sets: 3, s: '8–10 · 45 kg' },
  { n: 'Incline press', sets: 3, s: '10–12 · 26 kg' },
  { n: 'Dips', sets: 3, s: '8–12 · body weight' },
  { n: 'Cable fly', sets: 3, s: '12–15 · 15 kg' }
];
const order = [];
for (const x of EX) {
  const e = document.createElement('div'); e.className = 'ex';
  e.innerHTML = `<div class="trk lbl" style="color:var(--verm)">DROP</div><div class="in"><div class="n">${x.n}</div><div class="s"><b class="sets">${x.sets}</b> × ${x.s}</div></div>`;
  $('list').appendChild(e); x.el = e; order.push(x);
}
const seamA = document.createElement('div'), seamB = document.createElement('div'); seamA.className = seamB.className = 'seam'; $('list').append(seamA, seamB);
function layout(animate, skip) {
  order.forEach((x, k) => { const y = Y0 + k * P; const from = x.y; x.y = y; if (x === skip) return; x.el.style.top = y + 'px'; if (animate && from !== undefined && from !== y) x.el.animate([{ transform: `translateY(${from - y}px)` }, { transform: 'none' }], { duration: 320, easing: HOUSE }); });
  const ya = Y0 + order.length * P + 4; const fa = parseFloat($('add').style.top) || ya; $('add').style.top = ya + 'px';
  if (animate && fa !== ya) $('add').animate([{ transform: `translateY(${fa - ya}px)` }, { transform: 'none' }], { duration: 320, easing: HOUSE });
}
layout(false);
const rollMin = async (to) => { const el = $('min'); await anim(el, [{ transform: 'none', opacity: 1 }, { transform: 'translateY(-10px)', opacity: 0 }], { duration: 160 }); el.textContent = to; await anim(el, [{ transform: 'translateY(10px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 220, easing: HOUSE }); };
$('min').style.display = 'inline-block';

(async () => {
  if (location.search.includes('x2')) { const ph = $('ph'); ph.style.transform = 'scale(2)'; ph.style.transformOrigin = '0 0'; }
  await document.fonts.ready; await sleep(400); document.body.dataset.start = '1';
  // z: the routine opens from its name on Training; exercises come in down the y axis
  anim($('page'), [{ opacity: 0, transform: 'scale(.95)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: HOUSE });
  order.forEach((x, k) => anim(x.el.querySelector('.in'), [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 340, delay: 140 + k * 45, easing: HOUSE, fill: 'backwards' }));
  await sleep(1500);

  // 1 · reorder: hold a name, it lifts off the page (shadow on the type, seams above and below), the others make room
  const inc = order[2]; const nm = inc.el.querySelector('.n'); const [hx, hy] = centre(nm);
  await fingerOn(hx, hy); await sleep(380);
  anim(inc.el.querySelector('.in'), [{ transform: 'none', textShadow: '0 0 0 rgba(43,36,64,0)' }, { transform: 'scale(1.03)', textShadow: '0 10px 18px rgba(43,36,64,.28)' }], { duration: 200, easing: HOUSE });
  inc.el.style.zIndex = 3;
  [seamA, seamB].forEach((s) => anim(s, [{ opacity: 0 }, { opacity: 1 }], { duration: 200 }));
  const startY = inc.y; let swapped = false;
  await tween(700, (t) => {
    const dy = -P * 1.05 * t; inc.el.style.top = (startY + dy) + 'px'; fingerAt(hx, hy + dy);
    seamA.style.top = (startY + dy - 6) + 'px'; seamB.style.top = (startY + dy + 76) + 'px';
    if (!swapped && dy < -P / 2) { swapped = true; order.splice(2, 1); order.splice(1, 0, inc); layout(true, inc); }
  });
  fingerOff();
  [seamA, seamB].forEach((s) => anim(s, [{ opacity: 1 }, { opacity: 0 }], { duration: 200 }));
  anim(inc.el.querySelector('.in'), [{ transform: 'scale(1.03)', textShadow: '0 10px 18px rgba(43,36,64,.28)' }, { transform: 'none', textShadow: '0 0 0 rgba(43,36,64,0)' }], { duration: 260, easing: HOUSE });
  const fromTop = parseFloat(inc.el.style.top); inc.el.style.top = inc.y + 'px';
  inc.el.animate([{ transform: `translateY(${fromTop - inc.y}px)` }, { transform: 'none' }], { duration: 260, easing: HOUSE });
  tessSay('Incline press goes second.');
  await sleep(1400);

  // 2 · drop: swipe a row left, DROP rises in the track; past the line it drains away and the rest close up
  const dips = order[3]; const din = dips.el.querySelector('.in'), dtr = dips.el.querySelector('.trk');
  const [dx, dy] = centre(din.querySelector('.n'));
  await fingerOn(dx + 120, dy);
  await tween(460, (t) => { const d = -170 * t; fingerAt(dx + 120 + d, dy); din.style.transform = `translateX(${d}px)`; dtr.style.opacity = Math.max(0, Math.min(1, (-d - 90) / 30)); });
  fingerOff();
  anim(din, [{ transform: 'translateX(-170px)', opacity: 1, filter: 'blur(0)' }, { transform: 'translateX(-260px)', opacity: 0, filter: 'blur(4px)' }], { duration: 300, easing: 'ease-in' });
  anim(dtr, [{ opacity: 1 }, { opacity: 0 }], { duration: 300 });
  await sleep(220);
  order.splice(3, 1); layout(true); dips.el.remove();
  swap($('ctx'), '4 exercises, about <span id="min" style="display:inline-block">55</span> min'); await sleep(320); rollMin('47');
  tessSay('Dips dropped.'); anim($('undo'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240 });
  await sleep(1500);

  // 3 · sets: tap the value word; it opens into a small drum in place, swipe, and it folds back
  anim($('undo'), [{ opacity: 1 }, { opacity: 0 }], { duration: 200 }); tessSay('Ask Tess…', '#8A7F96');
  const bench = order[0]; const sv = bench.el.querySelector('.sets'); const [vx, vy] = centre(sv);
  await fingerOn(vx, vy); await sleep(100); fingerOff(); wash(sv);
  const sline = bench.el.querySelector('.s');
  const clip = document.createElement('div'); Object.assign(clip.style, { position: 'absolute', left: '0', right: '0', top: (bench.y + 40) + 'px', height: '30px', overflow: 'hidden', zIndex: 4, webkitMaskImage: 'linear-gradient(90deg,transparent 4px,#000 30px)', maskImage: 'linear-gradient(90deg,transparent 4px,#000 30px)' });
  const drum = document.createElement('div'); Object.assign(drum.style, { position: 'absolute', left: '22px', top: '0px', height: '30px', fontSize: '21px', lineHeight: '30px', fontWeight: 600, fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap', zIndex: 4 });
  const nums = [2, 3, 4, 5, 6]; drum.innerHTML = nums.map((n) => `<span style="display:inline-block;width:34px;text-align:center;opacity:${n === 4 ? 1 : .3}">${n}</span>`).join('') + '<span style="opacity:.5;font-weight:400;margin-left:8px">sets</span>';
  clip.appendChild(drum); $('list').appendChild(clip);
  const off = (n) => 34 - nums.indexOf(n) * 34; drum.style.transform = `translateX(${off(4) + 0}px)`;
  anim(sline, [{ opacity: 1 }, { opacity: 0 }], { duration: 160 });
  anim(drum, [{ opacity: 0, transform: `translateX(${off(4)}px) scaleX(.6)` }, { opacity: 1, transform: `translateX(${off(4)}px)` }], { duration: 260, easing: HOUSE });
  await sleep(700);
  await fingerOn(150, vy); await tween(260, (t) => fingerAt(150 - 34 * t, vy)); fingerOff();
  const spans = drum.querySelectorAll('span');
  anim(drum, [{ transform: `translateX(${off(4)}px)` }, { transform: `translateX(${off(5)}px)` }], { duration: 300, easing: 'cubic-bezier(.3,1.3,.5,1)' });
  anim(spans[2], [{ opacity: 1 }, { opacity: .3 }], { duration: 200 }); anim(spans[3], [{ opacity: .3 }, { opacity: 1 }], { duration: 200 });
  await sleep(900);
  anim(clip, [{ opacity: 1 }, { opacity: 0 }], { duration: 180 });
  sv.textContent = '5'; anim(sline, [{ opacity: 0 }, { opacity: 1 }], { duration: 240, delay: 100 });
  rollMin('50');
  await sleep(1300);

  // 4 · change an exercise: tap the name, alternatives from the same pattern unfold under it; pick one, it writes itself in
  const fly = order[order.length - 1]; const fn = fly.el.querySelector('.n'); const [fx, fy] = centre(fn);
  await fingerOn(fx, fy); await sleep(100); fingerOff(); wash(fn);
  const alts = document.createElement('div'); Object.assign(alts.style, { position: 'absolute', left: '22px', top: (fly.y + 76) + 'px', fontSize: '21px', lineHeight: '34px', zIndex: 4 });
  alts.innerHTML = ['Pec deck', 'Dumbbell fly', 'Crossover'].map((a) => `<div style="opacity:0">${a}</div>`).join('');
  $('list').appendChild(alts); anim($('add'), [{ opacity: 1 }, { opacity: 0 }], { duration: 160 });
  anim(fly.el.querySelector('.s'), [{ opacity: 1 }, { opacity: .3 }], { duration: 200 });
  [...alts.children].forEach((a, k) => anim(a, [{ opacity: 0, transform: 'translateY(-8px)' }, { opacity: .65, transform: 'none' }], { duration: 260, delay: k * 50, easing: HOUSE }));
  await sleep(1000);
  const pick = alts.children[0]; const [px, py] = centre(pick); await fingerOn(px, py); await sleep(100); fingerOff();
  [...alts.children].forEach((a, k) => anim(a, [{ opacity: k ? .65 : 1 }, { opacity: 0 }], { duration: 220, delay: k ? 0 : 120 }));
  await anim(fn, [{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(4px)' }], { duration: 160 });
  fn.textContent = ''; fn.style.opacity = 1; fn.getAnimations().forEach((a) => a.cancel());
  const w = document.createElement('span'); Object.assign(w.style, { position: 'absolute', left: '-10px', width: '170px', top: '0', height: '40px', borderRadius: '40% 60% 50% 50% / 60% 40% 60% 40%', background: 'rgba(46,109,164,.22)', filter: 'blur(5px)' });
  fly.el.querySelector('.in').prepend(w); w.animate([{ opacity: .9 }, { opacity: 0 }], { duration: 2400, delay: 300, fill: 'forwards' });
  const gs = [...'Pec deck'].map((ch) => { const s = document.createElement('span'); s.textContent = ch; s.style.opacity = 0; fn.appendChild(s); return s; });
  gs.forEach((s, i) => s.animate([{ opacity: 0, filter: 'blur(3px)' }, { opacity: 1, filter: 'blur(0)' }], { duration: 160, delay: i * 30, fill: 'forwards' }));
  swap(fly.el.querySelector('.s'), '<b class="sets">3</b> × 12–15 · 40 kg'); anim(fly.el.querySelector('.s'), [{ opacity: .3 }, { opacity: 1 }], { duration: 300 });
  anim($('add'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240, delay: 300 });
  tessSay('Pec deck, from 40 kg.'); anim($('undo'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240 });
  await sleep(2400);
  document.body.dataset.done = '1';
})();
</script>
</body>
</html>
