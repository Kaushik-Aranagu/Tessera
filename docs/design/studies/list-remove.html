<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The list remove gesture</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Design item 65: removing a list row. A swipe left on the row (REMOVE rises at 60 pt in live, commits past 96) or the phrase "remove rice from groceries"; the row leaves, the rows close up, the count rolls, Tess says "Ground beef, removed." with UNDO 10 s (Product NE11, AQ15). The strike (tap) stays the check-off; remove is never a tap. ?play records. -->
<style>
:root{--house:cubic-bezier(.2,.8,.2,1);--settle:cubic-bezier(.3,1.3,.5,1)}
html,body{margin:0;background:#E9E6EE}
body{font-family:'Inter Tight',sans-serif;transform-origin:0 0;padding:28px 30px 30px}
body.x2{transform:scale(2)}
.row{display:flex;gap:36px}
.cap{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(23,20,31,.66);height:56px;width:390px;line-height:22px}
.ph{position:relative;width:390px;height:844px;overflow:hidden;--ink:18,16,22;--s2:.66;--s3:.51;--tess:#2450D8;--ctx:#5A3DAF;--liveInk:#C23A22;--live:#E2432A;--now:#F0A500;--health:#12936A;background:#fff;color:rgb(var(--ink))}
.abs{position:absolute}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;white-space:nowrap}
.s2{color:rgba(var(--ink),var(--s2))}
.s3{color:rgba(var(--ink),var(--s3))}
.b{font-size:21px;line-height:28px}
.sm{font-size:16px;line-height:22px}
.nw{white-space:nowrap}
.t34{font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:40px;white-space:nowrap}
.t44{font-size:44px;font-weight:500;letter-spacing:-.035em;line-height:50px;white-space:nowrap}
.hero{font-size:56px;font-weight:500;letter-spacing:-.04em;line-height:58px;white-space:nowrap}
.v{font-weight:600}
.ctx{color:var(--ctx)}
.wet{color:var(--tess)}
.tl{position:absolute;right:71px;width:270px;text-align:right;top:779px;transform:translateY(-50%);z-index:6;color:var(--tess);font-size:21px;line-height:28px}
.tl .u{display:block;font-weight:700;font-size:16px;letter-spacing:.08em;line-height:20px;margin-top:4px;color:var(--liveInk)}
.tl .w{display:block;font-weight:700;font-size:16px;letter-spacing:.08em;line-height:20px;margin-top:4px;color:rgba(var(--ink),.6)}
.soul{position:absolute;left:323px;top:759px;width:46px;height:40px;z-index:7}
.soul i{position:absolute;width:20px;height:17px;border-radius:52% 48% 60% 40%/55% 45% 55% 45%;filter:blur(1.2px);mix-blend-mode:multiply}
.note{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(23,20,31,.66);margin-top:20px;line-height:24px;max-width:2560px}
#fing{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(0,0,0,.08);box-shadow:0 0 0 1.5px rgba(0,0,0,.35);opacity:0;z-index:30;transition:opacity .15s}
</style>
</head>
<body>
<div class="row" id="row"></div>
<div class="note" id="note"></div>
<script>
const Q=location.search;if(Q.includes('x2'))document.body.classList.add('x2');
const PLAY=Q.includes('play'),$=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const H='cubic-bezier(.2,.8,.2,1)',SET='cubic-bezier(.3,1.3,.5,1)';
const lens=(w,t)=>`M0 6 Q ${(w*.42).toFixed(1)} ${6-t} ${w} 5.6 Q ${(w*.58).toFixed(1)} ${6+t} 0 6 Z`;
const soul=()=>{const P=['#2450D8','#E2432A','#F0A500'],f=.65,C=[[10,12.5],[32,10.5],[22,28.5]],cx=21.33,cy=17.17;
 return `<div class="soul">${C.map(([x,y],i)=>`<i style="left:${cx+(x-cx)*f-10+2}px;top:${cy+(y-cy)*f-8.5+3}px;background:radial-gradient(closest-side,${P[i]},${P[i]}33)"></i>`).join('')}</div>`};
const TABS=['REVIEW','TODAY','TRAINING','KITCHEN'],TX=[22,118,199,300];
const tabs=on=>`<div class="abs lbl" style="left:0;right:0;top:78px;height:24px;letter-spacing:.06em;z-index:13">${TABS.map((t,i)=>`<span class="abs" style="left:${TX[i]}px;top:0;color:rgba(var(--ink),${t===on?1:.38})">${t}</span>`).join('')}<svg class="abs" style="left:${TX[TABS.indexOf(on)]}px;top:24px;overflow:visible" width="90" height="12"><path d="${lens(on.length*10.6,1.2)}" fill="rgb(var(--ink))"/></svg></div>`;
// The list. Each row: amount (600), name, optional "for" line, and flags: ask (Claude's proposed link), ghost (just added, wet).
const AISLES=(o={})=>[['Produce',[['1 bunch','scallions',o.kept?'for tacos':'',{ask:o.ask}],...(o.ghost?[['2','limes','for tacos',{ghost:1}],['1','avocado','for tacos',{ghost:1}]]:[]),['','bananas','']]],
 ['Dairy and eggs',[...(o.oat?[['','oat milk','',{ghost:1}]]:[]),['1 dozen','eggs',''],['','greek yogurt','']]],
 ...(o.nobeans?[]:[['Meat and seafood',[['1 lb','ground beef','for tacos',{ghost:o.beanswet,shift:o.shift}]]]]),
 ['Cans and jars',[['1 can','black beans','for tacos · 15 oz']]],
 ['Pantry',[['','tortillas','10 ct']]]];
const list=(o={})=>{let y=200,h='';const rows=[];for(const [a,items] of AISLES(o)){h+=`<div class="abs t34" style="left:22px;top:${y}px;color:rgba(var(--ink),.85)">${a}</div>`;y+=48;
 for(const [amt,name,sub,f={}] of items){const wet=f.ghost;const lx=f.shift?4:64;h+=`<div class="abs b nw ${wet?'wet':''}" data-row="${name}" style="left:${lx}px;top:${y}px"><span class="v">${amt}</span>${amt?' ':''}${name}</div>`;
  if(sub)h+=`<div class="abs sm ${wet?'wet':'s2'}" style="left:${lx}px;top:${y+28}px">${sub}</div>`;
  if(f.ask)h+=`<div class="abs sm wet" data-ask="1" style="left:64px;top:${y+28}px;opacity:.9">for tacos?</div>`;
  y+=sub||f.ask?52:44}
 y+=10}
 return h};
const usually=(y=664)=>`<div class="abs lbl s2" style="left:22px;top:${y}px">USUALLY</div><div class="abs b" style="left:22px;top:${y+24}px">${['Oat milk','Bananas','Coffee'].map((w,i)=>`<span class="nw" data-u="${w}" style="margin-right:22px;font-weight:600;color:rgba(var(--ink),.7)">${w}</span>`).join('')}</div>`;
const page=(o={})=>`<div class="abs lbl s2" style="left:22px;top:58px">‹ KITCHEN</div><div class="abs t44" style="left:22px;top:84px">Groceries</div>
 <div class="abs b s2 nw" style="left:22px;top:140px">${o.count||'9 to get'}, for tacos and 2 more</div><div class="abs" style="left:0;top:0;width:390px;height:640px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 590px,transparent 640px);mask-image:linear-gradient(#000 590px,transparent 640px)">${list(o)}</div>${usually()}`;
const home=()=>`${tabs('TODAY')}
 <div class="abs b nw" style="left:22px;top:138px">Thursday afternoon</div>
 <div class="abs b ctx nw" style="left:22px;top:186px">2 to buy</div>
 <div class="abs hero" style="left:22px;top:220px">Tacos tonight</div>
 <div class="abs lbl" style="left:22px;top:296px">GROCERIES<svg style="position:absolute;left:0;top:22px;overflow:visible" width="110" height="12"><path d="${lens(100,1.6)}" fill="rgb(var(--ink))"/></svg></div>
 <div class="abs t34" style="left:22px;top:388px">Next</div>
 ${[['Stretch and mobility','20:30'],['Read Designing Data-Intensive Applications','21:10',1],['Call mom','tomorrow']].map(([t,h,w],k,a)=>{const y=440+a.slice(0,k).reduce((s,r)=>s+(r[2]?74:46),0);return `<div class="abs b" style="left:22px;top:${y}px;width:280px">${t}</div><div class="abs lbl s2" style="right:22px;top:${y+4}px">${h}</div>`}).join('')}`;
const phone=(c,inner,opt={})=>`<div><div class="cap">${c}</div><div class="ph" ${opt.id?`id="${opt.id}"`:''}>${inner}${opt.line?`<div class="tl">${opt.line}${opt.words?`<span class="w">${opt.words}</span>`:''}${opt.undo?'<span class="u">UNDO</span>':''}</div>`:''}${soul()}${opt.fing?'<div id="fing"></div>':''}</div></div>`;

const REMOVE=(y)=>`<div class="abs lbl" id="rm" style="right:22px;top:${y+4}px;color:var(--live);opacity:0">REMOVE</div>`;
const shifted=(o)=>{let h=page(o);return h};
if(!PLAY){
 $('row').innerHTML=
  phone('SWIPE A ROW LEFT: AT 60 PT, REMOVE RISES AT THE RIGHT EDGE IN LIVE',page({shift:1})+'<div class="abs lbl" style="right:22px;top:534px;color:var(--live)">REMOVE</div><div id="fing" style="opacity:1;left:150px;top:544px"></div>',{fing:0})+
  phone('LET GO PAST 96 PT: THE ROW LEAVES, THE REST CLOSE UP, THE COUNT ROLLS',page({nobeans:1,count:'8 to get'}),{line:'Ground beef, removed.',undo:1})+
  phone('BY PHRASE: "REMOVE RICE FROM GROCERIES" DOES THE SAME, ON ANY LIST',page({nobeans:1,count:'7 to get'}),{line:'Rice, removed.',undo:1})+
  phone('THE PHRASE NAMES NOTHING ON THE LIST: ONE LINE, NOTHING WRITTEN',page(),{line:'No rice on Groceries.'})+
  phone('UNDO: THE ROW SLIDES BACK WET AND DRIES, THE COUNT ROLLS BACK',page({beanswet:1}),{line:'Ground beef, back on Groceries.'});
 $('note').innerHTML='THE LIST REMOVE GESTURE (PRODUCT NE11, AQ15): A SWIPE LEFT ON ANY LIST ROW. THE ROW SLIDES WITH THE FINGER; AT 60 PT "REMOVE" RISES AT THE RIGHT EDGE IN LIVE (LABEL 16/700) WITH .SELECTION ONCE; LET GO PAST 96 PT AND IT COMMITS, BEFORE THAT IT SPRINGS BACK. THE ROW SLIDES OUT TO THE LEFT AND FADES (260 MS), THE ROWS UNDER IT CLOSE UP ON THE HOUSE CURVE (320 MS; AN AISLE WORD LEFT WITH NO ROW GOES WITH IT), THE COUNT LINE ROLLS, TESS SAYS "GROUND BEEF, REMOVED." WITH UNDO FOR 10 S. "REMOVE RICE FROM GROCERIES" SAID OR TYPED DOES THE SAME WITH THE SAME LINE; A NAME NOT ON THE LIST GETS "NO RICE ON GROCERIES." AND NOTHING IS WRITTEN. UNDO: THE ROW SLIDES BACK INTO ITS PLACE WET AND DRIES 2 S, "GROUND BEEF, BACK ON GROCERIES." A TAP IS STILL THE STRIKE (CHECKED, INTO THE FOLD); REMOVE IS NEVER A TAP, NEVER A HOLD, NEVER A RED ROW. THE SAME SWIPE ON EVERY LIST (GROCERIES, PACKING, ANY LIST), AT THE SHOP TOO.';
 document.fonts.ready.then(()=>setTimeout(()=>document.body.dataset.done='1',200));
}else{
 $('row').innerHTML=phone('GROCERIES',page(),{id:'P',fing:1});
 const P=$('P'),f=$('fing'),cap=document.querySelector('.cap'),setCap=t=>cap.textContent=t;
 (async()=>{document.body.dataset.start='1';await sleep(1200);
  const row=P.querySelector('[data-row="ground beef"]'),sub=row.nextElementSibling,ry=parseInt(row.style.top);
  const hdr=[...P.querySelectorAll('.t34')].find(el=>el.textContent==='Meat and seafood');const below=[...P.querySelectorAll('.abs')].filter(el=>el!==row&&el!==sub&&el!==hdr&&el.style.top&&parseInt(el.style.top)>ry&&parseInt(el.style.top)<640&&!el.classList.contains('lbl'));
  setCap('SWIPE GROUND BEEF LEFT: THE ROW SLIDES, REMOVE RISES AT 60 PT IN LIVE');f.style.left='220px';f.style.top=(ry+14)+'px';f.style.opacity=1;P.insertAdjacentHTML('beforeend',REMOVE(ry));const rm=$('rm');
  const slide=async(to,ms)=>{const from=parseInt(f.style.left);const t0=performance.now();await new Promise(res=>{const step=now=>{const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3),x=from+(to-from)*e;f.style.left=x+'px';const dx=Math.min(0,x-220);row.style.transform=`translateX(${dx}px)`;sub.style.transform=`translateX(${dx}px)`;rm.style.opacity=Math.max(0,Math.min(1,(-dx-40)/30));if(k<1)requestAnimationFrame(step);else res()};requestAnimationFrame(step)})};
  await slide(150,420);await sleep(300);setCap('PAST 96 PT: LET GO AND IT COMMITS');await slide(100,300);await sleep(150);f.style.opacity=0;
  row.animate([{transform:'translateX(-120px)',opacity:1},{transform:'translateX(-390px)',opacity:0}],{duration:260,easing:H,fill:'forwards'});sub.animate([{transform:'translateX(-120px)',opacity:1},{transform:'translateX(-390px)',opacity:0}],{duration:260,easing:H,fill:'forwards'});rm.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});hdr.animate([{opacity:1},{opacity:0}],{duration:260,fill:'forwards'});
  await sleep(120);setCap('THE AISLE WORD GOES WITH ITS LAST ROW, THE REST CLOSE UP, THE COUNT ROLLS');below.forEach(el=>el.animate([{transform:'translateY(0)'},{transform:'translateY(-120px)'}],{duration:320,easing:H,fill:'forwards'}));
  const cnt=[...P.querySelectorAll('.b.s2')].find(el=>el.textContent.startsWith('9 to get'));cnt.animate([{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(3px)'}],{duration:160,fill:'forwards'});await sleep(160);cnt.textContent='8 to get, for tacos and 2 more';cnt.animate([{opacity:0,filter:'blur(3px)'},{opacity:1,filter:'blur(0)'}],{duration:320,easing:H,fill:'forwards'});
  P.insertAdjacentHTML('beforeend','<div class="tl" id="tl1" style="opacity:0">Ground beef, removed.<span class="u">UNDO</span></div>');$('tl1').animate([{opacity:0},{opacity:1}],{duration:300,fill:'forwards'});await sleep(2200);
  setCap('TAP UNDO: THE ROW SLIDES BACK WET AND DRIES, THE COUNT ROLLS BACK');f.style.left='330px';f.style.top='800px';f.style.opacity=1;await sleep(170);f.style.opacity=0;$('tl1').animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});
  below.forEach(el=>el.animate([{transform:'translateY(-120px)'},{transform:'translateY(0)'}],{duration:320,easing:H,fill:'forwards'}));hdr.animate([{opacity:0},{opacity:1}],{duration:320,fill:'forwards'});await sleep(120);
  row.style.color='var(--tess)';sub.style.color='var(--tess)';row.animate([{transform:'translateX(-390px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:420,easing:SET,fill:'forwards'});sub.animate([{transform:'translateX(-390px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:420,easing:SET,fill:'forwards'});
  cnt.animate([{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(3px)'}],{duration:160,fill:'forwards'});await sleep(160);cnt.textContent='9 to get, for tacos and 2 more';cnt.animate([{opacity:0,filter:'blur(3px)'},{opacity:1,filter:'blur(0)'}],{duration:320,easing:H,fill:'forwards'});
  P.insertAdjacentHTML('beforeend','<div class="tl" style="opacity:0">Ground beef, back on Groceries.</div>');P.lastElementChild.animate([{opacity:0},{opacity:1}],{duration:300,fill:'forwards'});
  await sleep(400);row.animate([{color:'#2450D8'},{color:'rgb(18,16,22)'}],{duration:2000,easing:H,fill:'forwards'});sub.animate([{color:'#2450D8'},{color:'rgba(18,16,22,.66)'}],{duration:2000,easing:H,fill:'forwards'});await sleep(2300);document.body.dataset.done='1'})();
}
</script>
</body>
</html>
