<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan my day</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Board and recording for docs/design/m4-steers.md §6, redrawn for Design item 30 on the build's own Home frame (day-seams.md S2) to Product's density call (16 Oct 10:25 PM): at most 5 rows on Home, the rest one pull away, and no row under Tess's band (736 to 820). Board: the 08:00 offer with the rules words, Claude's words the first time (VIA CLAUDE and its one line, once), a later morning with a row kept, and the plan pulled up. ?play records: the offer, Claude words it, a pull up and back, a swipe keeps Book physio, a hold on START WITH keeps the plan. Porcelain. Add ?x2 for 2x. -->
<style>
:root{--house:cubic-bezier(.2,.8,.2,1);--settle:cubic-bezier(.3,1.3,.5,1)}
html,body{margin:0;background:#E9E6EE}
body{font-family:'Inter Tight',sans-serif;transform-origin:0 0;padding:28px 30px 30px}
body.x2{transform:scale(2)}
.row{display:flex;gap:40px}
.cap{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(23,20,31,.66);height:34px;white-space:nowrap}
.ph{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;--ink:23,20,31;--s2:.66;--s3:.51;--tess:#2450D8;--ctx:#6A4C9C;--liveInk:#C23A22;color:rgb(var(--ink))}
.abs{position:absolute}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;white-space:nowrap;color:rgba(var(--ink),var(--s2))}
.b{font-size:21px;line-height:28px}
.s2{color:rgba(var(--ink),var(--s2))}
.vw{font-weight:600}
.t34{font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:40px}
.t44{font-size:44px;font-weight:500;letter-spacing:-.035em;line-height:50px}
.hero{font-size:56px;font-weight:500;letter-spacing:-.04em;line-height:58px}
.tabs{left:22px;right:22px;top:78px;display:flex;justify-content:space-between}
.tabs span{font-weight:700;font-size:16px;letter-spacing:.06em;color:rgba(var(--ink),.38)}
.tabs span.on{color:rgb(var(--ink))}
.soul{position:absolute;left:323px;top:759px;width:46px;height:40px;z-index:6}
.soul i{position:absolute;width:20px;height:17px;border-radius:52% 48% 60% 40%/55% 45% 55% 45%;filter:blur(1.2px)}
.say{position:absolute;right:71px;width:270px;text-align:right;top:779px;transform:translateY(-50%);color:var(--tess);font-size:21px;line-height:28px;z-index:6}
.undo{display:block;margin-top:4px;color:var(--liveInk);font-weight:700;font-size:16px;line-height:20px;letter-spacing:.08em}
.ghost{color:var(--tess);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:.66}}
.prow{position:absolute;left:22px;right:22px;height:46px}
.prow .t{position:absolute;left:0;top:0;font-size:21px;line-height:28px;font-weight:500;white-space:nowrap}
.prow .tm{position:absolute;right:0;top:0;font-size:18px;line-height:28px;font-weight:600;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.prow .why{position:absolute;left:0;top:30px;font-size:21px;line-height:28px;color:rgba(var(--ink),var(--s2));white-space:nowrap}
.win{position:absolute;left:0;right:0;top:236px;bottom:108px;overflow:hidden}
.col{position:absolute;left:0;right:0;top:0;transition:transform .5s var(--settle)}
.wisp{position:absolute;width:10px;height:8px;border-radius:50%;background:rgba(36,80,216,.55);filter:blur(1.5px);opacity:0}
#fing{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(23,20,31,.14);box-shadow:0 0 0 1.5px rgba(255,255,255,.8);opacity:0;z-index:20;transition:opacity .15s}
.note{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(23,20,31,.66);margin-top:20px;max-width:1720px;line-height:24px}
</style>
</head>
<body>
<div class="row" id="row"></div>
<div class="note" id="note"></div>
<script>
const Q=location.search;if(Q.includes('x2'))document.body.classList.add('x2');
const PLAY=Q.includes('play');
const $=id=>document.getElementById(id),at=(t,f)=>setTimeout(f,t);
const soul=`<div class="soul"><i style="left:0;top:4px;background:radial-gradient(closest-side,#2450D8,rgba(36,80,216,.2))"></i><i style="left:22px;top:2px;background:radial-gradient(closest-side,#E2432A,rgba(226,67,42,.2))"></i><i style="left:12px;top:20px;background:radial-gradient(closest-side,#F0A500,rgba(240,165,0,.2))"></i></div>`;
const lens=(w,t)=>`M0 6 Q ${(w*.42).toFixed(1)} ${6-t} ${w} 5.6 Q ${(w*.58).toFixed(1)} ${6+t} 0 6 Z`;
const NOWX=85; // 08:00 on a 04:00 to 04:00 day, along 30 to 358
const MEET=[[9.5,10],[12,13],[15,15.5]]; // meetings, read from the calendar
const hx=h=>30+(h-4)/24*328;
const stroke=L=>`<svg class="abs" style="left:0;top:182px;overflow:visible" width="390" height="20">
 <path d="M30 9 L${NOWX} 9" stroke="#7FB7D6" stroke-width="6" stroke-linecap="round" opacity=".6"/>
 <path d="M${NOWX+8} 9 L358 9" stroke="rgba(23,20,31,.22)" stroke-width="1.5" stroke-dasharray="4 5"/>
 ${MEET.map(([a,b])=>`<path d="M${hx(a)} 9 L${hx(b)} 9" stroke="rgba(23,20,31,.55)" stroke-width="6" stroke-linecap="round"/>`).join('')}
 <rect id="${L}mk" x="${hx(8.25)-1.5}" y="2" width="3" height="14" rx="1.5" fill="#2450D8" opacity="0"/></svg>`;
const ROWS=[['Book physio','08:15','20 min, while the morning is quiet.'],['Expense report','08:35','45 min, done before Standup. Due 5 pm.'],['Groceries at Trader Joe\'s','17:30','On the way home, the list is 9 things.']];
const RULES=[['Book physio','08:15'],['Expense report','08:35'],['Groceries at Trader Joe\'s','17:30']];
// the plan column, relative to the window's top (y 236 on the phone)
// state: 'rules' | 'first' | 'worded' | 'later' (row 1 kept) | 'pulled'
function column(L,state){
 const cl=state!=='rules';
 const first=state==='first';
 const rowsTop=cl?(first?430:364):294; // phone y = 236 + this
 const shownN=state==='first'?1:5;
 const rows=(cl?ROWS:RULES).slice(0,shownN).map((r,i)=>{
  const kept=state==='later'&&i===0;
  const showWhy=state==='pulled';
  const y=rowsTop+i*(showWhy?72:46);
  return `<div class="prow" id="${L}r${i}" style="top:${y}px"><div class="t ${kept?'':'ghost'}" id="${L}rt${i}">${r[0]}</div><div class="tm ${kept?'':'ghost'}" id="${L}rm${i}">${r[1]}</div>${showWhy?`<div class="why">${r[2]}</div>`:''}</div>`}).join('');
 return `<div class="col" id="${L}col">
 <div class="abs b" style="left:22px;top:10px;color:var(--ctx)">this morning</div>
 <div class="abs t44" style="left:22px;top:44px;width:346px">Three meetings, four hours free</div>
 <div class="abs b s2" style="left:22px;top:156px">slept 6h40</div>
 <div class="abs" style="right:22px;top:150px;display:flex;align-items:baseline;gap:10px"><span class="b s2">Energy</span><span style="font-size:34px;font-weight:300;line-height:40px">3</span><span class="lbl">OKAY</span></div>
 <div class="abs lbl" style="left:22px;top:212px">START WITH</div>
 ${cl?`<div class="abs lbl" id="${L}via" style="right:22px;top:212px;color:rgb(var(--ink))">VIA CLAUDE</div>`:''}
 <div class="abs t34" style="left:22px;top:238px;color:var(--tess)" id="${L}sw">Reply to landlord<svg style="position:absolute;left:-2px;top:41px;overflow:visible" width="262" height="12"><path d="${lens(262,2.5)}" fill="rgba(36,80,216,.75)" id="${L}swl"/></svg></div>
 ${cl?`<div class="abs b" id="${L}sent" style="left:22px;top:294px;width:346px;color:var(--tess)">Landlord reply first, then physio, then the report.</div>`:''}
 ${first?`<div class="abs b s2" style="left:22px;top:360px;width:346px">Sends your task and event titles, never notes or places.</div>`:''}
 ${rows}
 ${state==='first'?`<div class="abs lbl" style="left:22px;top:${rowsTop+46+8}px">2 MORE</div>`:''}
 </div>`;
}
function phone(L,state,say){
 return `<div class="ph" id="${L}ph">
 <div class="abs tabs"><span>REVIEW</span><span class="on">TODAY</span><span>TRAINING</span><span>KITCHEN</span></div>
 <div class="abs" style="left:0;right:0;top:104px;display:flex;justify-content:center"><div style="width:44px;height:2px;background:rgb(var(--ink));margin-left:-34px"></div></div>
 <div class="abs b" style="left:22px;top:138px">Friday morning</div>
 ${stroke(L)}
 <div class="win" id="${L}win">${column(L,state)}</div>
 <div class="say" id="${L}say" style="opacity:${say?1:0}">${say||''}</div>
 ${soul}${L==='P'?'<div id="fing"></div>':''}
 </div>`;
}
const cap=(t,id)=>`<div class="cap" ${id?`id="${id}"`:''}>${t}</div>`;
if(PLAY){
 $('row').innerHTML=`<div>${cap('08:00 · THE PLAN, IN THE RULES\' WORDS','cap')}${phone('P','rules')}</div>`;
}else{
 $('row').innerHTML=
  `<div>${cap('08:00 · THE OFFER, RULES\' WORDS')}${phone('A','rules')}</div>`+
  `<div>${cap('CLAUDE WORDS IT · THE FIRST TIME')}${phone('B','first')}</div>`+
  `<div>${cap('A LATER MORNING · ONE ROW KEPT')}${phone('C','later','Book physio, 8:15 am.<span class="undo">UNDO</span>')}</div>`+
  `<div>${cap('PULLED UP · EVERY ROW, WITH WHY')}${phone('D','pulled')}</div>`;
 $('D'+'col').style.transform='translateY(-206px)';
 $('note').innerHTML='HOME\'S TOP STAYS FIXED (TABS, DAY LABEL, DAY STROKE); THE PLAN LIVES UNDER IT. ROWS SHOW ONLY WHERE THEY END ABOVE Y 720, AT MOST 5; THE REST WAIT ONE PULL AWAY, COUNTED BY A LABEL WORD. VIA CLAUDE SITS ON THE START WITH ROW; ITS ONE LINE SHOWS ONCE, THE FIRST TIME. CLAUDE\'S WHY FOR EACH ROW IS ONE PULL AWAY. TESS SPEAKS BESIDE THE SOUL.';
}
document.fonts.ready.then(()=>{document.body.dataset.start='1';
 if(!PLAY){setTimeout(()=>document.body.dataset.done='1',200);return}
 const f=$('fing');
 // 1 · the call is out: wisps rise off the soul; nothing else moves
 at(900,()=>{$('cap').textContent='SENT TO CLAUDE · WISPS OFF THE SOUL';const ph=$('Pph');
  for(let k=0;k<3;k++){const w=document.createElement('div');w.className='wisp';w.style.left=(334+k*9)+'px';w.style.top='760px';ph.appendChild(w);
   w.animate([{opacity:0,transform:'translate(0,0) scale(.6)'},{opacity:.8,transform:`translate(${(k-1)*6}px,-26px) scale(1)`},{opacity:0,transform:`translate(${(k-1)*10}px,-52px) scale(1.3)`}],{duration:1300,delay:k*260,iterations:2,easing:'ease-out'})}
 });
 // 2 · the reply lands: the words cross-fade in place, rows slide down, VIA CLAUDE and its line once
 at(3800,()=>{$('cap').textContent='CLAUDE\'S WORDS LAND · VIA CLAUDE, ONCE';
  const win=$('Pwin');const old=$('Pcol');const tmp=document.createElement('div');tmp.innerHTML=column('P','first');const nw=tmp.firstElementChild;nw.style.opacity=0;win.appendChild(nw);
  old.animate([{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(4px)'}],{duration:300,fill:'forwards'}).onfinish=()=>old.remove();
  nw.animate([{opacity:0,filter:'blur(4px)'},{opacity:1,filter:'blur(0)'}],{duration:420,delay:120,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
 });
 // 3 · pull up: the hero scrolls away under the fixed top; every row with its why
 at(6400,()=>{f.style.left='200px';f.style.top='640px';f.style.opacity=1;f.animate([{transform:'translateY(0)'},{transform:'translateY(-200px)'}],{duration:500,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'})});
 at(6500,()=>{$('cap').textContent='PULL UP · EVERY ROW, WITH CLAUDE\'S WHY';
  const win=$('Pwin');const old=$('Pcol');const tmp=document.createElement('div');tmp.innerHTML=column('P','pulled');const nw=tmp.firstElementChild;nw.style.opacity=0;win.appendChild(nw);
  old.style.transform='translateY(-206px)';old.animate([{opacity:1},{opacity:0}],{duration:260,delay:120,fill:'forwards'}).onfinish=()=>old.remove();
  nw.style.transform='translateY(-206px)';nw.animate([{opacity:0},{opacity:1}],{duration:300,delay:160,fill:'forwards'});
 });
 at(7000,()=>{f.style.opacity=0;f.getAnimations().forEach(a=>a.cancel())});
 // 4 · let go: it settles back; the line under VIA CLAUDE is spent
 at(8600,()=>{$('cap').textContent='LET GO · BACK TO HOME\'S FIVE';
  const win=$('Pwin');const old=$('Pcol');const tmp=document.createElement('div');tmp.innerHTML=column('P','worded');const nw=tmp.firstElementChild;nw.style.transform='translateY(-206px)';nw.style.opacity=0;win.appendChild(nw);
  old.animate([{opacity:1},{opacity:0}],{duration:240,fill:'forwards'}).onfinish=()=>old.remove();
  nw.animate([{opacity:0},{opacity:1}],{duration:260,delay:80,fill:'forwards'});
  at(40,()=>{nw.style.transform='translateY(0)';});
 });
 // 5 · swipe right keeps Book physio: it dries cobalt to ink, its slot paints on the day stroke
 at(10200,()=>{f.style.left='60px';f.style.top='614px';f.style.opacity=1;f.animate([{transform:'translateX(0)'},{transform:'translateX(140px)'}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'})});
 at(10560,()=>{f.style.opacity=0;f.getAnimations().forEach(a=>a.cancel());$('cap').textContent='SWIPE RIGHT KEEPS A ROW · IT DRIES INTO INK';
  const t=$('Prt0'),m=$('Prm0');[t,m].forEach((e,k)=>at(k*250,()=>{e.classList.remove('ghost');e.style.color='#2450D8';e.animate([{color:'#2450D8'},{color:'rgb(23,20,31)'}],{duration:700,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'})}));
  const mk=$('Pmk');mk.animate([{opacity:0},{opacity:1}],{duration:200,fill:'forwards'});at(400,()=>mk.animate([{fill:'#2450D8'},{fill:'rgb(23,20,31)'}],{duration:900,fill:'forwards'}));
  const s=$('Psay');s.innerHTML='Book physio, 8:15 am.<span class="undo">UNDO</span>';s.animate([{opacity:0},{opacity:1}],{duration:300,delay:200,fill:'forwards'});
 });
 // 6 · hold START WITH: the line empties and repaints; the plan is kept
 at(13300,()=>{const s=$('Psay');s.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});f.style.left='120px';f.style.top='500px';f.style.opacity=1;$('cap').textContent='HOLD START WITH · THE PLAN IS KEPT';
  const l=$('Pswl');l.animate([{opacity:.75},{opacity:.35}],{duration:140,fill:'forwards'});
  const svg=l.parentNode;const fill=document.createElementNS('http://www.w3.org/2000/svg','path');fill.setAttribute('d',lens(262,3.6));fill.setAttribute('fill','#2450D8');fill.style.clipPath='inset(0 100% 0 0)';svg.appendChild(fill);
  fill.animate([{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],{duration:700,delay:140,easing:'linear',fill:'forwards'});
 });
 at(14200,()=>{f.style.opacity=0;
  const win=$('Pwin');const old=$('Pcol');old.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-30px)'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
  const nw=document.createElement('div');nw.className='col';nw.innerHTML=`<div class="abs b" style="left:22px;top:10px;color:var(--ctx)">now</div><div class="abs hero" style="left:22px;top:44px">Reply to landlord</div><div class="abs b s2" style="left:22px;top:170px">15 min, a quick one to open with.</div>
   <div class="abs t34" style="left:22px;top:212px">Next</div>${['Book physio|08:15','Expense report|08:35','Standup|09:30','Groceries at Trader Joe\'s|17:30'].map((r,i)=>{const [a,b]=r.split('|');return `<div class="prow" style="top:${264+i*46}px"><div class="t" style="font-weight:400">${a}</div><div class="tm s2">${b}</div></div>`}).join('')}`;
  nw.style.opacity=0;win.appendChild(nw);nw.animate([{opacity:0,transform:'translateY(24px)',filter:'blur(4px)'},{opacity:1,transform:'translateY(0)',filter:'blur(0)'}],{duration:460,delay:200,easing:'cubic-bezier(.3,1.3,.5,1)',fill:'forwards'});
  const s=$('Psay');s.innerHTML='Plan kept. Reply to landlord is up.<span class="undo">UNDO</span>';s.animate([{opacity:0},{opacity:1}],{duration:300,delay:400,fill:'forwards'});
 });
 at(17600,()=>document.body.dataset.done='1');
});
</script>
</body>
</html>
