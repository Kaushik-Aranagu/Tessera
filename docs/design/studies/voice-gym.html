<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Voice in the gym</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Motion study for v1 slice 17 (voice in the gym): hold the Tess horizon, say "80 for 7", then "same". Drawn to docs/design/no-buttons.md. Add ?x2 to render at 2x. -->
<style>
:root{--cream:#F3ECE0;--verm:#C8452F;--cobalt:#2E6DA4;--cad:#E0A35C;--sage:#6E9E6A}
body{margin:0;background:#EFE7DC}
.ph{position:relative;width:390px;height:844px;overflow:hidden;color:var(--cream);font-family:'Inter Tight',sans-serif;
 background:radial-gradient(70% 40% at 80% 10%,#3A3150 0%,rgba(58,49,80,0) 70%),radial-gradient(70% 50% at 0% 70%,#2E2A44 0%,rgba(46,42,68,0) 70%),#1C1826}
.abs{position:absolute}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(243,236,224,.6)}
.num{font-weight:300;font-size:80px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
#finger{width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(243,236,224,.2);box-shadow:0 0 0 1.5px rgba(255,255,255,.5);opacity:0;z-index:30;pointer-events:none}
.horizon{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:8;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);-webkit-mask-image:linear-gradient(transparent,#000 55%);mask-image:linear-gradient(transparent,#000 55%)}
.d{position:absolute;width:40px;height:36px;margin:-18px 0 0 -20px;border-radius:52% 48% 60% 40%/55% 45% 55% 45%;background:radial-gradient(closest-side,rgba(var(--c),.95) 0%,rgba(var(--c),.6) 45%,rgba(var(--c),0) 100%);mix-blend-mode:screen;filter:blur(2px)}
.la .line{position:absolute;left:0;right:0;bottom:-6px;height:1.5px;transform:scaleX(0)}
</style>
</head>
<body>
<div class="ph" id="ph">
  <svg width="0" height="0" class="abs" aria-hidden="true">
    <filter id="rough" x="-10%" y="-60%" width="120%" height="220%"><feTurbulence type="fractalNoise" baseFrequency="0.9 0.25" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  </svg>
  <div class="abs" style="left:22px;top:56px;font-size:21px;color:rgba(243,236,224,.6)">Push Day A, 24:10</div>
  <div class="abs" style="left:20px;top:92px;font-size:44px;font-weight:500;letter-spacing:-.035em;line-height:52px">Bench press</div>
  <svg id="strokes" class="abs" style="left:22px;top:170px;overflow:visible" width="300" height="30"></svg>
  <div id="sub" class="abs" style="left:22px;top:210px;font-size:21px;color:rgba(243,236,224,.7)">set 3 of 4, last was 82.5 × 8</div>
  <div class="abs" style="left:20px;top:270px;display:flex;align-items:baseline;gap:8px"><span id="w" class="num">82.5</span><span style="font-size:21px;color:rgba(243,236,224,.7)">kg</span></div>
  <div class="abs" style="left:286px;top:270px;width:82px;text-align:center"><span id="r" class="num" style="font-size:64px">8</span></div>
  <div class="abs" style="left:286px;width:82px;top:350px;text-align:center;font-size:18px;color:rgba(243,236,224,.55)">reps</div>

  <!-- what Tess hears, written large above the horizon while you hold -->
  <div id="heard" class="abs" style="left:22px;right:22px;top:560px;font-size:34px;font-weight:500;letter-spacing:-.035em;line-height:40px;z-index:9"></div>

  <div class="horizon"></div>
  <div id="hz" class="abs" style="left:76px;right:22px;top:788px;height:.5px;background:rgba(243,236,224,.3);z-index:9;transform-origin:100% 50%"></div>
  <span id="tess" class="abs" style="left:78px;top:756px;font-size:21px;color:rgba(243,236,224,.55);z-index:9">Hold to tell me a set</span>
  <span id="undo" class="abs la lbl" style="right:22px;top:762px;color:#F2B8A8;opacity:0;z-index:9">UNDO<span class="line" style="background:#F2B8A8"></span></span>
  <div id="soul" class="abs" style="left:50px;top:772px;width:0;height:0;z-index:9;transform:scale(.5)">
    <div class="d" style="--c:200,69,47"></div><div class="d" style="--c:46,109,164"></div><div class="d" style="--c:224,179,65"></div>
  </div>
  <div id="finger" class="abs"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const HOUSE = 'cubic-bezier(.2,.8,.2,1)';
const anim = (el, kf, o) => el.animate(kf, { fill: 'forwards', ...o }).finished;
const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const tween = (dur, fn, e = ease) => new Promise((res) => { const t0 = performance.now(); const st = (n) => { const t = Math.min(1, (n - t0) / dur); fn(e(t)); t < 1 ? requestAnimationFrame(st) : res(); }; requestAnimationFrame(st); });
const finger = $('finger');
const fingerAt = (x, y) => { finger.style.left = x + 'px'; finger.style.top = y + 'px'; };
const fingerOn = async (x, y) => { fingerAt(x, y); await anim(finger, [{ opacity: 0, transform: 'scale(1.3)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 160 }); };
const fingerOff = () => anim(finger, [{ opacity: 1 }, { opacity: 0 }], { duration: 160 });
async function swap(el, text, colour) {
  await anim(el, [{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(3px)' }], { duration: 120 });
  el.textContent = text; if (colour) el.style.color = colour;
  await anim(el, [{ opacity: 0, filter: 'blur(3px)' }, { opacity: 1, filter: 'blur(0)' }], { duration: 180, easing: HOUSE });
}
const NS = 'http://www.w3.org/2000/svg';
const PAINT = ['#C8452F', '#2E6DA4', '#E0A35C', '#6E9E6A'];
const strokes = [];
for (let i = 0; i < 4; i++) {
  const g = document.createElementNS(NS, 'g'); g.setAttribute('transform', `translate(${i * 74},0)`);
  const guide = document.createElementNS(NS, 'path'); const p = document.createElementNS(NS, 'path');
  for (const q of [guide, p]) { q.setAttribute('d', 'M4 16 C 18 9, 40 19, 60 11'); q.setAttribute('fill', 'none'); q.setAttribute('stroke-linecap', 'round'); }
  guide.setAttribute('stroke', 'rgba(243,236,224,' + (i === 2 ? .7 : .18) + ')'); guide.setAttribute('stroke-width', 2); if (i === 2) guide.setAttribute('stroke-dasharray', '5 5');
  p.setAttribute('stroke', PAINT[i]); p.setAttribute('stroke-width', 9); p.setAttribute('filter', 'url(#rough)');
  if (i >= 2) p.setAttribute('opacity', 0); else guide.setAttribute('opacity', 0);
  g.append(guide, p); $('strokes').appendChild(g); strokes.push({ g, p, guide });
}

// the soul: idle breathes small; listening blooms out to the bloom targets, staggered by thirds
const dabs = [...$('soul').children];
const TARGET = [[18, -10], [-16, -12], [0, 18]], HOME = [[-14, -8], [14, -8], [0, 13]];
dabs.forEach((d, k) => { d.style.transform = `translate(${HOME[k][0]}px,${HOME[k][1]}px)`; });
let bloomAnims = [];
function listen(on) {
  bloomAnims.forEach((a) => a.cancel()); bloomAnims = [];
  if (on) {
    anim($('soul'), [{ transform: 'scale(.5)' }, { transform: 'scale(1)' }], { duration: 360, easing: HOUSE });
    dabs.forEach((d, k) => bloomAnims.push(d.animate([
      { transform: `translate(${HOME[k][0] * .45}px,${HOME[k][1] * .45}px) scale(.6)` },
      { transform: `translate(${TARGET[k][0]}px,${TARGET[k][1]}px) scale(1.15)` },
      { transform: `translate(${HOME[k][0] * .45}px,${HOME[k][1] * .45}px) scale(.6)` }
    ], { duration: 1400, delay: k * 466, iterations: Infinity, easing: 'ease-in-out' })));
  } else anim($('soul'), [{ transform: 'scale(1)' }, { transform: 'scale(.5)' }], { duration: 320, easing: HOUSE });
}
// words arrive as they are heard: each glyph fades up out of blur
async function hear(text) {
  const h = $('heard'); h.innerHTML = '';
  for (const word of text.split(' ')) {
    const w = document.createElement('span'); w.textContent = word + ' '; w.style.display = 'inline-block'; w.style.whiteSpace = 'pre'; h.appendChild(w);
    w.animate([{ opacity: 0, filter: 'blur(6px)', transform: 'translateY(6px)' }, { opacity: .6, filter: 'blur(0)', transform: 'none' }], { duration: 260, easing: HOUSE, fill: 'forwards' });
    await sleep(300);
  }
}
// the heard words become the parsed set, then fly down to the stroke they will become
async function parse(text) {
  const h = $('heard');
  await anim(h, [{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(4px)' }], { duration: 160 });
  h.innerHTML = `<span style="color:#F3ECE0">${text}</span>`;
  await anim(h, [{ opacity: 0, filter: 'blur(4px)' }, { opacity: 1, filter: 'blur(0)' }], { duration: 220, easing: HOUSE });
}
// the ghost: the set's stroke at 35%, drying to full over 2s; the tick under the Tess line is the drying
async function ghost(i, line) {
  const s = strokes[i];
  anim(s.guide, [{ opacity: 1 }, { opacity: 0 }], { duration: 200 });
  const len = s.p.getTotalLength(); s.p.style.strokeDasharray = len; s.p.style.strokeDashoffset = len; s.p.setAttribute('opacity', .35);
  await tween(420, (t) => { s.p.style.strokeDashoffset = len * (1 - t); });
  swap($('tess'), line, '#9DBFE6');
  const dry = document.createElement('div'); Object.assign(dry.style, { position: 'absolute', left: '76px', top: '787.5px', height: '1.5px', width: '0', background: '#9DBFE6', zIndex: 10 }); $('ph').appendChild(dry);
  await tween(2000, (t) => { dry.style.width = (292 * t) + 'px'; s.p.setAttribute('opacity', .35 + .65 * t); }, (t) => t);
  // saved: a rigid tick, the stroke's paint settles, Undo stays until the next set
  anim(dry, [{ opacity: 1 }, { opacity: 0 }], { duration: 260 }).then(() => dry.remove());
  anim(s.g, [{ transform: `translate(${i * 74}px,0) scaleY(1)` }, { transform: `translate(${i * 74}px,0) scaleY(1.25)` }, { transform: `translate(${i * 74}px,0) scaleY(1)` }], { duration: 260 });
  anim($('undo'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240 });
}

(async () => {
  if (location.search.includes('x2')) { const ph = $('ph'); ph.style.transform = 'scale(2)'; ph.style.transformOrigin = '0 0'; }
  await document.fonts.ready; await sleep(400); document.body.dataset.start = '1';
  await sleep(1000);

  // hold anywhere on the horizon: the soul blooms, the writing line brightens and the page dims a little
  await fingerOn(220, 770);
  listen(true);
  anim($('hz'), [{ background: 'rgba(243,236,224,.3)' }, { background: 'rgba(157,191,230,.9)' }], { duration: 300 });
  swap($('tess'), 'Listening', '#9DBFE6');
  await sleep(300);
  await hear('eighty for seven');
  await sleep(300);
  fingerOff(); listen(false);
  anim($('hz'), [{ background: 'rgba(157,191,230,.9)' }, { background: 'rgba(243,236,224,.3)' }], { duration: 300 });
  await parse('80 × 7');
  await sleep(200);
  anim($('heard'), [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-330px) scale(.6)' }], { duration: 420, easing: 'cubic-bezier(.5,0,.2,1)' });
  swap($('w'), '80'); swap($('r'), '7');
  await ghost(2, 'Set 3, 80 × 7.');
  swap($('sub'), 'set 4 of 4, last was 80 × 7');
  await sleep(1400);

  // "same": the last set again
  anim($('undo'), [{ opacity: 1 }, { opacity: 0 }], { duration: 200 });
  $('heard').getAnimations().forEach((a) => a.cancel()); $('heard').innerHTML = '';
  await fingerOn(220, 770); listen(true);
  anim($('hz'), [{ background: 'rgba(243,236,224,.3)' }, { background: 'rgba(157,191,230,.9)' }], { duration: 300 });
  swap($('tess'), 'Listening', '#9DBFE6');
  await sleep(300); await hear('same'); await sleep(400);
  fingerOff(); listen(false);
  anim($('hz'), [{ background: 'rgba(157,191,230,.9)' }, { background: 'rgba(243,236,224,.3)' }], { duration: 300 });
  await parse('80 × 7 again');
  await sleep(200);
  anim($('heard'), [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-330px) translateX(140px) scale(.6)' }], { duration: 420, easing: 'cubic-bezier(.5,0,.2,1)' });
  strokes[3].guide.setAttribute('stroke', 'rgba(243,236,224,.7)'); strokes[3].guide.setAttribute('stroke-dasharray', '5 5');
  await ghost(3, 'Set 4, same again.');
  swap($('sub'), 'all 4 sets done');
  await sleep(1600);
  document.body.dataset.done = '1';
})();
</script>
</body>
</html>
