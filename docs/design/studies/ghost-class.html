<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Ghost class page</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Motion study for Build A4 (docs/product/ship-list-build.md): "I want to track my plants" becomes the ghost of the class's own page, wet cobalt; a kind word is tapped, a field swiped away, and one tap makes it real. Drawn to docs/design/no-buttons.md. Add ?x2 to render at 2x. -->
<style>
:root{--ink:#2B2440;--ctx:#7A5C8E;--sub:#6E6480;--mute:#A39AAE;--cobalt:#2E6DA4;--verm:#C8452F}
body{margin:0;background:#EFE7DC}
.ph{position:relative;width:390px;height:844px;overflow:hidden;color:var(--ink);font-family:'Inter Tight',sans-serif;
 background:radial-gradient(60% 40% at 85% 6%,#DCE6EE 0%,rgba(220,230,238,0) 70%),radial-gradient(70% 45% at 0% 40%,#E3EAD8 0%,rgba(227,234,216,0) 70%),radial-gradient(80% 50% at 100% 80%,#EFE2CF 0%,rgba(239,226,207,0) 70%),#F4F0EA}
.abs{position:absolute}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;color:var(--sub)}
.g{color:rgba(46,109,164,.62)}
.wet{animation:wet 1.8s ease-in-out infinite}
@keyframes wet{0%,100%{opacity:.78}50%{opacity:1}}
.f{position:absolute;left:22px;right:22px;font-size:21px;line-height:30px;white-space:nowrap}
.f b{font-weight:600}
.kw{background:linear-gradient(transparent 62%,rgba(46,109,164,.16) 62%,rgba(46,109,164,.16) 92%,transparent 92%)}
.sw{font-size:34px;font-weight:500;letter-spacing:-.035em;line-height:44px;white-space:nowrap;position:relative}
.sw svg{position:absolute;left:-7px;bottom:7px;z-index:-1}
.la .line{position:absolute;left:0;right:0;bottom:-6px;height:1.5px;transform:scaleX(0)}
.d{position:absolute;width:40px;height:36px;margin:-18px 0 0 -20px;border-radius:52% 48% 60% 40%/55% 45% 55% 45%;background:radial-gradient(closest-side,rgba(var(--c),.85) 0%,rgba(var(--c),.6) 42%,rgba(var(--c),0) 100%);mix-blend-mode:multiply;filter:blur(2.5px)}
#finger{width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(43,36,64,.16);box-shadow:0 0 0 1.5px rgba(255,255,255,.7);opacity:0;z-index:30;pointer-events:none}
.caret{display:inline-block;width:2px;height:34px;margin-left:2px;vertical-align:-6px;background:var(--cobalt);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="ph" id="ph">
  <svg width="0" height="0" class="abs"><filter id="rough" x="-10%" y="-60%" width="120%" height="220%"><feTurbulence type="fractalNoise" baseFrequency="0.9 0.25" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></svg>

  <!-- the sentence, written to Tess (her Write mode) -->
  <section id="ask" class="abs" style="inset:0">
    <div class="abs" style="left:22px;top:150px;font-size:56px;font-weight:500;letter-spacing:-.04em;line-height:1;opacity:.14">Reply to Sam</div>
    <div class="abs lbl" style="left:22px;top:560px;color:var(--cobalt)">WRITE TO TESS</div>
    <div id="sent" class="abs" style="left:22px;right:22px;top:592px;font-size:34px;font-weight:500;letter-spacing:-.035em;line-height:44px;color:var(--cobalt)"><span id="st"></span><span class="caret"></span></div>
    <div id="wline" class="abs" style="left:22px;right:22px;top:690px;height:.5px;background:var(--cobalt)"></div>
  </section>

  <!-- the ghost of the class's own page -->
  <section id="page" class="abs" style="inset:0;pointer-events:none">
    <div id="crumb" class="abs lbl g" style="left:22px;top:58px;opacity:0">THING / PLANT</div>
    <div id="hero" class="abs g" style="left:20px;top:96px;font-size:56px;font-weight:500;letter-spacing:-.04em;line-height:1;opacity:0">Plants</div>
    <div id="has" class="abs lbl g" style="left:22px;top:178px;opacity:0">WHAT A PLANT HAS</div>
    <div id="fields"></div>
    <div id="samLbl" class="abs lbl g" style="left:22px;top:424px;opacity:0">SAMPLES, NOT SAVED</div>
    <div id="samples"></div>
    <div id="chore" class="f g" style="top:560px;opacity:0;white-space:normal">And a chore: <b>Water plants</b>, every <b>7</b> days.</div>
    <div id="acc" class="abs" style="left:22px;top:652px;opacity:0;pointer-events:auto"><div class="sw" style="color:var(--ink)"><span id="accText">Make Plants</span><svg id="accSvg" width="190" height="19" viewBox="0 0 200 14" preserveAspectRatio="none"><path d="M0 8 C 14 4.5, 50 3, 100 4 S 176 3.5, 200 5.5 L 197 9.5 C 150 12, 80 11.5, 34 11 S 8 10.5, 0 8 Z" fill="#2E6DA4" opacity=".82" filter="url(#rough)"/></svg></div></div>
    <span id="notnow" class="abs la lbl" style="right:22px;top:668px;opacity:0">NOT NOW<span class="line" style="background:var(--sub)"></span></span>
    <div id="empty" class="f" style="top:424px;color:var(--ctx);opacity:0">No plants yet. Say “monstera, kitchen”.</div>
  </section>

  <div id="say" class="abs" style="right:78px;bottom:43px;width:262px;font-size:21px;line-height:28px;color:var(--cobalt);text-align:right;opacity:0;z-index:12"></div>
  <span id="undo" class="abs la lbl" style="right:78px;top:808px;color:var(--verm);opacity:0;z-index:12">UNDO<span class="line" style="background:var(--verm)"></span></span>
  <div id="soul" class="abs" style="left:346px;top:788px;width:0;height:0;z-index:13">
    <div class="d" style="--c:200,69,47;transform:translate(-10px,-6px) scale(.72)"></div><div class="d" style="--c:46,109,164;transform:translate(10px,-6px) scale(.72)"></div><div class="d" style="--c:224,179,65;transform:translate(0,9px) scale(.72)"></div>
  </div>
  <div id="finger" class="abs"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const HOUSE = 'cubic-bezier(.2,.8,.2,1)';
const SETTLE = 'cubic-bezier(.3,1.3,.5,1)';
const anim = (el, kf, o) => el.animate(kf, { fill: 'forwards', ...o }).finished;
const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const tween = (dur, fn, e = ease) => new Promise((res) => { const t0 = performance.now(); const st = (n) => { const t = Math.min(1, (n - t0) / dur); fn(e(t)); t < 1 ? requestAnimationFrame(st) : res(); }; requestAnimationFrame(st); });
const rel = (r) => { const p = $('ph').getBoundingClientRect(), k = p.width / 390; return { left: (r.left - p.left) / k, top: (r.top - p.top) / k, width: r.width / k, height: r.height / k }; };
const finger = $('finger');
const fingerAt = (x, y) => { finger.style.left = x + 'px'; finger.style.top = y + 'px'; };
const fingerOn = async (x, y) => { fingerAt(x, y); await anim(finger, [{ opacity: 0, transform: 'scale(1.3)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 160 }); };
const fingerOff = () => anim(finger, [{ opacity: 1 }, { opacity: 0 }], { duration: 160 });
const centre = (el) => { const r = rel(el.getBoundingClientRect()); return [r.left + r.width / 2, r.top + r.height / 2]; };
async function say(t, undo) { const s = $('say'); s.textContent = t; anim(s, [{ opacity: 0, transform: 'translateX(12px)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: HOUSE }); if (undo) anim($('undo'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240, delay: 120 }); }
const hush = () => anim($('say'), [{ opacity: 1 }, { opacity: 0 }], { duration: 160 });

const F = [['Spot', 'text'], ['Light', 'choice: low, bright, direct'], ['Repotted', 'date'], ['Height', 'number, cm'], ['Bought', 'date']];
F.forEach(([n, k], i) => { $('fields').insertAdjacentHTML('beforeend', `<div class="f g" style="top:${210 + i * 40}px;opacity:0"><b>${n}</b> · <span class="kw">${k}</span></div>`); });
const S = ['Monstera · kitchen · bright', 'Pothos · hall · low', 'Fern · balcony · direct'];
S.forEach((t, i) => $('samples').insertAdjacentHTML('beforeend', `<div class="f g" style="top:${454 + i * 34}px;opacity:0;color:rgba(46,109,164,.42)">${t}</div>`));
const rows = [...$('fields').children];
const dabs = [...$('soul').children];

(async () => {
  if (location.search.includes('x2')) { const ph = $('ph'); ph.style.transform = 'scale(2)'; ph.style.transformOrigin = '0 0'; }
  await document.fonts.ready; await sleep(400); document.body.dataset.start = '1';
  await sleep(500);
  for (const ch of 'I want to track my plants') { $('st').textContent += ch; await sleep(50); }
  await sleep(500);

  // Return: the sentence lifts into her corner, she thinks (each dab pulses in turn)
  $('sent').querySelector('.caret').remove();
  anim($('ask'), [{ opacity: 1 }, { opacity: 0, transform: 'translateY(-10px)' }], { duration: 360, easing: HOUSE });
  say('Drawing what a plant has…');
  const pulses = dabs.map((d, k) => d.animate([{ opacity: 1 }, { opacity: .35 }, { opacity: 1 }], { duration: 600, delay: k * 200, iterations: 3 }));
  await sleep(1700);
  hush();

  // the ghost page assembles top-down, each line painted in wet cobalt, left to right
  const ghost = [$('crumb'), $('hero'), $('has'), ...rows, $('samLbl'), ...$('samples').children, $('chore')];
  ghost.forEach((el, k) => { anim(el, [{ opacity: 0, clipPath: 'inset(0 100% 0 0)', transform: 'translateY(8px)' }, { opacity: 1, clipPath: 'inset(0 0 0 0)', transform: 'none' }], { duration: 420, delay: k * 70, easing: HOUSE }); });
  await sleep(ghost.length * 70 + 300);
  ghost.forEach((el) => el.classList.add('wet'));
  anim($('acc'), [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: HOUSE });
  anim($('notnow'), [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 100 });
  say('Here’s Plants. Change anything, then make it.');
  await sleep(2000);

  // tap a kind word: Location goes from text to a choice, read off the samples
  hush();
  const kw = rows[0].querySelector('.kw'); const [kx, ky] = centre(kw); await fingerOn(kx, ky); await sleep(90); fingerOff();
  await anim(kw, [{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(3px)' }], { duration: 120 });
  kw.textContent = 'choice: kitchen, hall, balcony';
  anim(kw, [{ opacity: 0, filter: 'blur(3px)', transform: 'translateY(6px)' }, { opacity: 1, filter: 'blur(0)', transform: 'none' }], { duration: 220, easing: HOUSE });
  await sleep(1300);

  // swipe a field away: it leaves the pending record before accept; the rows below close up
  const b = rows[4]; await fingerOn(240, 386);
  await tween(320, (t) => { fingerAt(240 - 170 * t, 386); b.style.transform = `translateX(${-120 * t}px)`; b.style.opacity = 1 - t; }); fingerOff();
  b.remove();
  ['samLbl', 'chore', 'acc', 'notnow'].forEach((id) => anim($(id), [{ transform: 'none' }, { transform: 'translateY(-40px)' }], { duration: 420, easing: SETTLE }));
  [...$('samples').children].forEach((el) => anim(el, [{ transform: 'none' }, { transform: 'translateY(-40px)' }], { duration: 420, easing: SETTLE }));
  await sleep(1300);

  // one tap makes it real: the ghost dries into ink top-down; the samples were never saved, so they go
  const [ax, ay] = centre($('acc')); await fingerOn(ax - 20, ay - 40); await sleep(120); fingerOff();
  const svg = $('accSvg'); anim(svg, [{ transform: 'scaleY(1)' }, { transform: 'scaleY(1.65)' }, { transform: 'scaleY(1)' }], { duration: 420, easing: 'ease-out' });
  await sleep(200);
  ['acc', 'notnow', 'samLbl'].forEach((id) => anim($(id), [{ opacity: 1 }, { opacity: 0 }], { duration: 240 }));
  [...$('samples').children].forEach((el, k) => anim(el, [{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(3px)' }], { duration: 300, delay: k * 40 }));
  const dry = [$('crumb'), $('hero'), $('has'), ...rows.slice(0, 4), $('chore')];
  dry.forEach((el, k) => { el.classList.remove('wet'); setTimeout(() => { el.style.transition = 'color 520ms ease'; el.classList.remove('g'); el.style.color = el.id === 'crumb' || el.id === 'has' ? 'var(--sub)' : 'var(--ink)'; }, k * 60); });
  anim($('chore'), [{ transform: 'translateY(-40px)' }, { transform: 'translateY(-84px)' }], { duration: 460, delay: 300, easing: HOUSE });
  await sleep(700);
  $('empty').style.top = '424px';
  anim($('empty'), [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 360, easing: HOUSE });
  dabs.forEach((d) => d.animate([{ transform: d.style.transform }, { transform: d.style.transform.replace('scale(.72)', 'scale(.9)') }, { transform: d.style.transform }], { duration: 900, easing: 'ease-in-out' }));
  say('Made Plants, and a chore to water them.', true);
  await sleep(2400);
  document.body.dataset.done = '1';
})();
</script>
</body>
</html>
