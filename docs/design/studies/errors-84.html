<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Errors and offline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{--board:#E9E6EE}
*{box-sizing:border-box}
body{margin:0;background:var(--board);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transform-origin:0 0;color:#1c1a20}
body.x2{transform:scale(2)}
.wrap{padding:34px 40px 40px}
.head{display:flex;gap:30px;margin-bottom:22px}
.head h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.015em;flex:none;width:420px}
.head p{margin:0;font-size:17px;line-height:24px;color:#4a4652;max-width:1000px}
.grid{display:grid;grid-template-columns:repeat(4,393px);gap:22px 22px;align-items:start}
.cap{margin-top:12px}
.cap .opt{font-size:13px;font-weight:700;letter-spacing:.08em;color:#6b6674}
.cap h2{margin:4px 0 6px;font-size:22px;font-weight:600;letter-spacing:-.01em}
.cap p{margin:0;font-size:16px;line-height:22px;color:#4a4652}
.ph{position:relative;width:393px;height:852px;background:var(--bg);color:rgb(var(--ink));overflow:hidden;border-radius:44px}
body.playing .ph{border-radius:0}
.por{--ink:18,16,22;--bg:#FBFAF7;--bg0:rgba(251,250,247,0);--tess:#2450D8;--ctx:#5A3DAF;--pan:#A4601A;--today:rgb(18,16,22);--train:#C23A22;--kit:#12936A;--rev:#5A3DAF;--glass:rgba(251,250,247,.66)}
.obs{--ink:245,242,236;--bg:#121014;--bg0:rgba(18,16,20,0);--tess:#86B4FF;--ctx:#B8A3FF;--pan:#E3A857;--today:rgb(245,242,236);--train:#FF7D62;--kit:#52D3A3;--rev:#B8A3FF;--glass:rgba(30,27,34,.62)}
.abs{position:absolute}
.body{position:absolute;inset:0}
.name{left:22px;top:52px;font-weight:700;font-size:15px;letter-spacing:.08em}
.ttl{left:22px;top:84px;font-size:44px;line-height:50px;font-weight:500;letter-spacing:-.02em}
.sw{right:22px;top:104px;font-weight:700;font-size:13px;letter-spacing:.08em;color:rgba(var(--ink),.55)}
.win{position:absolute;left:22px;right:22px;top:150px;bottom:84px;padding-bottom:64px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent,#000 48px);mask-image:linear-gradient(180deg,transparent,#000 48px)}
.dy{margin-top:30px}
.dy:first-child{margin-top:0}
.dt{font-weight:700;font-size:13px;letter-spacing:.08em;height:26px;line-height:26px;color:rgba(var(--ink),.66)}
.dt.now{color:rgb(var(--ink))}
.dt.mt{color:rgba(var(--ink),.45)}
.dl{position:relative;padding-left:64px;margin-top:6px;font-size:21px;line-height:28px;min-height:30px;max-height:120px;overflow:hidden;transition:max-height .32s cubic-bezier(.2,.9,.25,1),opacity .36s,transform .36s cubic-bezier(.2,.9,.25,1),margin .3s}
.dl:first-of-type{margin-top:8px}
.dl.hid{max-height:0;opacity:0;margin-top:0;transform:translateY(10px)}
.dl .t{position:absolute;left:0;top:3px;font-size:16px;font-weight:600;line-height:22px;font-variant-numeric:tabular-nums;color:rgba(var(--ink),.66)}
.dl.wash{background:linear-gradient(90deg,rgba(36,80,216,0) 0,rgba(36,80,216,.13) 60px,rgba(36,80,216,.13) 100%);border-radius:2px}
.obs .dl.wash{background:linear-gradient(90deg,rgba(134,180,255,0) 0,rgba(134,180,255,.16) 60px,rgba(134,180,255,.16) 100%)}
.qt{font-size:21px;line-height:28px;margin-top:6px;color:rgba(var(--ink),.66);transition:opacity .22s,max-height .3s;max-height:60px;overflow:hidden}
.qt.hid{opacity:0;max-height:0;margin:0}
.ax .dt{font-size:20px;height:36px;line-height:36px}
.ax .dl{padding-left:0;font-size:32px;line-height:38px;margin-top:10px;max-height:none}
.ax .dl .t{position:static;display:block;font-size:24px;line-height:30px}
.ax .qt{font-size:32px;line-height:38px}
.ax .name,.ax .sw{font-size:20px}
.ax .ttl{font-size:56px;line-height:62px;top:88px}
.ax .sw{top:120px}
.gl{position:absolute;left:150px;right:0;top:186px;bottom:96px;padding:20px 22px 0 46px;background:linear-gradient(90deg,var(--bg0),var(--bg) 34px)}
.gl .gk{font-weight:700;font-size:13px;letter-spacing:.08em;color:rgba(var(--ink),.55)}
.gl .big{font-size:56px;line-height:62px;white-space:nowrap;font-weight:500;letter-spacing:-.02em;margin-top:10px}
.gl .big small{font-size:21px;font-weight:400;letter-spacing:0;margin-left:6px}
.gl .gr{font-size:19px;line-height:26px;margin-top:12px}
.gl .gr em{font-style:normal;color:rgba(var(--ink),.62)}
.gl .more{position:absolute;left:46px;bottom:22px;font-weight:700;font-size:13px;letter-spacing:.08em}
.gl .more i{display:block;height:2px;margin-top:5px;background:currentColor}
.ctxl{left:22px;right:22px;top:146px;font-size:17px;color:var(--ctx);display:flex;justify-content:space-between}
.ctxl b{font-weight:700;font-size:13px;letter-spacing:.08em;color:rgb(var(--ink));padding-top:2px}
.sf{position:absolute;left:22px;width:350px;top:200px}
.sf .lbl{font-weight:700;font-size:13px;letter-spacing:.08em;color:rgba(var(--ink),.55);height:26px;line-height:26px;margin-top:22px}
.sf .lbl:first-child{margin-top:0}
.sf .r{display:flex;justify-content:space-between;align-items:center;height:40px;font-size:21px}
.sf .r em{font-style:normal;font-size:19px;color:rgba(var(--ink),.62);font-variant-numeric:tabular-nums}
.sf .qq{font-size:21px;line-height:28px;color:rgba(var(--ink),.66)}
.soul{left:323px;top:759px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 40%,#E2432A 0 28%,transparent 46%),radial-gradient(circle at 66% 38%,#2450D8 0 30%,transparent 50%),radial-gradient(circle at 50% 70%,#F0A500 0 28%,transparent 46%);filter:blur(3px)}
.tl{position:absolute;right:71px;width:270px;top:779px;transform:translateY(-50%);text-align:right;font-size:19px;line-height:25px;color:var(--tess)}
.finger{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(18,16,22,.16);border:1.5px solid rgba(18,16,22,.25);opacity:0;pointer-events:none;z-index:9}
.vo{position:absolute;left:14px;right:14px;border:3px solid #0A64D8;border-radius:8px;pointer-events:none}
.nt{position:absolute;right:71px;width:270px;top:779px;transform:translateY(-50%);text-align:right;font-size:19px;line-height:25px;color:rgb(var(--ink));transition:opacity .15s}
.nt b{font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--liv);margin-left:8px}
.por{--liv:#C23A22}.obs{--liv:#FF7A5C}
.f .lb{position:absolute;left:22px;font-weight:700;font-size:13px;letter-spacing:.08em;color:rgba(var(--ink),.55)}
.f .ln{position:absolute;left:22px;right:22px;font-size:21px;line-height:28px;display:flex;justify-content:space-between}
.f .ln em{font-style:normal;font-size:19px;color:rgba(var(--ink),.62);font-variant-numeric:tabular-nums}
.f .ln.dm{color:rgba(var(--ink),.55)}
.strip{position:absolute;left:22px;right:22px;top:20px;height:4px;display:flex;gap:7px}
.strip i{flex:1;background:rgb(var(--ink));border-radius:2px}.strip i.e{background:rgba(var(--ink),.16)}
.hero{position:absolute;left:22px;top:212px;font-size:56px;line-height:62px;font-weight:500;letter-spacing:-.02em;white-space:nowrap}
.hero small{font-size:21px;font-weight:400;letter-spacing:0;margin-left:6px}
.sets{position:absolute;left:22px;right:22px;top:330px;height:6px;display:flex;gap:10px}
.sets i{flex:1;height:3px;margin-top:1.5px;background:rgb(var(--ink));border-radius:2px;transition:background .7s}.sets i.e{background:rgba(var(--ink),.16)}
.key{position:absolute;left:0;right:0;top:580px;text-align:center;font-weight:700;font-size:16px;letter-spacing:.08em}
.key i,.cw i{display:block;height:2.5px;width:92px;margin:6px auto 0;background:currentColor;opacity:.75}
.ctx17{position:absolute;left:22px;right:22px;font-size:17px;color:var(--ctx);transition:opacity .3s}
.cwd{color:var(--tess)}
.trying{position:absolute;right:71px;top:798px;height:2px;width:0;background:rgb(var(--ink));opacity:.6}
.mx{grid-column:1/-1;margin-bottom:6px}
.mx table{border-collapse:collapse;width:100%;font-size:15px;line-height:20px}
.mx th{text-align:left;font-weight:700;font-size:13px;letter-spacing:.08em;color:#6b6674;padding:0 14px 10px 0;border-bottom:1.5px solid #1c1a20}
.mx td{padding:9px 14px 9px 0;border-bottom:1px solid rgba(28,26,32,.16);vertical-align:top;color:#1c1a20}
.mx td:first-child{font-weight:700;font-size:13px;letter-spacing:.08em;width:178px;color:#1c1a20;padding-top:11px}
.mx td i{font-style:normal;color:#6b6674}.mx td b{font-weight:600;color:#2450D8}
.mx td.n{color:#6b6674}
.lsd{position:absolute;left:0;right:0;top:110px;text-align:center}
.lsd .tm{font-size:96px;line-height:100px;font-weight:300;letter-spacing:-.03em}.lsd .dt2{font-size:19px;color:rgba(var(--ink),.62);margin-top:4px}
.f .hair{position:absolute;left:22px;right:22px;height:1px;background:rgba(var(--ink),.16)}
.f .stk{position:absolute;left:22px;height:4px;border-radius:2px;background:var(--tess)}
</style></head>
<body>
<div class="wrap" id="board"></div>
<script>
const play = location.search.includes('play');
if (location.search.includes('x2')) document.body.classList.add('x2');
const soul = '<div class="abs soul"></div>';
const tess = t => `<div class="tl">${t}</div>`;
const nt = (t, extra = '') => `<div class="nt" ${extra}>${t}</div>`;
const UNDO = ' <b>UNDO</b>';
const live = (o = {}) => `<div class="f"><div class="strip"><i></i><i></i><i></i><i class="e"></i><i class="e"></i></div>
  <div class="ctx17" style="top:56px">Set 4 of 5</div><div class="abs ttl">Bench press</div>
  <div class="hero">82.5 × 8</div>
  <div class="sets"><i></i><i></i><i></i><i class="e" id="s4"></i><i class="e"></i></div>
  <div class="key">LOG SET<i></i></div><div class="key" style="top:650px;font-size:13px;color:rgba(var(--ink),.55)">PAUSE</div></div>`;
const today = (ctx) => `<div class="f"><div class="abs name">TODAY</div><div class="ctx17" id="wait" style="top:186px;opacity:${ctx ? 1 : 0}">1 waiting for Tess</div>
  <div class="hero" style="top:212px">Thursday</div>
  <div class="ln" style="top:340px"><span>Push Day A</span><em>6 pm</em></div>
  <div class="ln" style="top:384px"><span>Call the bank</span><em>2 pm</em></div>
  <div class="ln" style="top:428px"><span>Dal tadka</span><em>7 pm</em></div></div>`;
const recipes = () => `<div class="f"><div class="abs name">‹ KITCHEN</div><div class="abs ttl">Recipes</div><div class="ctx17" style="top:146px">3 recipes</div>
  <div class="ln dm" style="top:212px"><span>Recipe link</span><em>waiting</em></div>
  <div class="ln" style="top:256px"><span>Dal tadka</span><em>50 min</em></div>
  <div class="ln" style="top:300px"><span>Carbonara</span><em>35 min</em></div>
  <div class="ln" style="top:344px"><span>Tacos</span><em>40 min</em></div></div>`;
const lock = () => `<div class="f"><div class="lsd"><div class="tm">9:41</div><div class="dt2">Thursday Oct 15</div></div>
  <div class="lb" style="top:520px">REST</div><div class="hero" style="top:548px">1:24</div>
  <div class="ln" style="top:640px;font-size:19px">Set 4 didn't save. Try again.</div>
  <div class="ln dm" style="top:676px;font-size:19px"><span>Bench press, set 5 next</span></div></div>`;
const settings = () => `<div class="f"><div class="abs name">‹ REVIEW</div><div class="abs ttl">Settings</div>
  <div class="lb" style="top:162px">CLAUDE</div>
  <div class="ln" style="top:196px"><span>Tess asks Claude: <b style="font-weight:600">yes</b>.</span></div>
  <div class="ln" style="top:240px"><span>This month <b style="font-weight:600">$1.20</b> of $10.</span></div>
  <div class="hair" style="top:290px"></div><div class="stk" style="top:288px;width:42px"></div>
  <div class="ln" style="top:318px"><span>Key ends in <b style="font-weight:600">...a1B2</b>, not checked.</span></div>
  <div class="lb" style="top:356px;word-spacing:14px">TEST REPLACE REMOVE</div></div>`;
const noKey = () => `<div class="f"><div class="abs name">TODAY</div><div class="abs ttl" style="font-size:44px">Settings</div>
  <div class="lb" style="top:162px">CLAUDE</div>
  <div class="ln" style="top:196px"><span>Tess thinks <b style="font-weight:600">on this phone</b> only.</span></div>
  <div class="ln" style="top:240px;color:var(--tess)"><span>Add a Claude key</span></div></div>`;
const ph = (cls, inner, opt, h, p) => `<div><div class="ph ${cls}">${inner}</div><div class="cap"><div class="opt">${opt}</div><h2>${h}</h2><p>${p}</p></div></div>`;
const MX = [
 ['TODAY AND HOME', "Didn't save. Try again.", "Claude is busy. Kept it for later.", "Kept it for later.<br><i>Plan my day: Here's your usual plan.</i>", "<i>Plan:</i> Here's your usual plan.<br><b>Tess</b> only when he asked"],
 ['TRAINING, LIVE', "Set 4 didn't save. Try again.<br><i>the set stays in the number row</i>", '<span class="n">Not used in a set</span>', '<span class="n">Nothing: a set never needs a connection</span>', '<span class="n">Nothing: sets run on the phone</span>'],
 ['GROCERIES', "Didn't save. Try again.<br><i>the check springs back</i>", "Claude is busy. Kept it for later.<br><i>name match only</i>", '<span class="n">Nothing: lists and sorting are local</span>', '<span class="n">Nothing: the phone sorts</span>'],
 ['PANTRY', "Didn't save. Try again.<br><i>the state word springs back</i>", '<span class="n">Not used</span>', '<span class="n">Nothing</span>', '<span class="n">Nothing</span>'],
 ['RECIPES', "Didn't save. Try again.", "Claude is busy. Kept it for later.", "Recipe link, kept for later.", "<b>No Claude key yet.</b> / <b>Claude is off.</b><br><i>the link stays in the field</i>"],
 ['NOTES', "Didn't save. Try again.<br>Private note didn't save. Try again.", '<span class="n">Not used</span>', '<span class="n">Nothing: notes are local</span>', '<span class="n">Nothing</span>'],
 ['DAY LOG', '<span class="n">Nothing to retry: it writes itself and retries on the next open, no line</span>', '<span class="n">Nothing</span>', '<span class="n">Nothing</span>', '<span class="n">Nothing</span>'],
 ['REVIEW', "Didn't save. Try again.<br><i>habit tick, weigh-in</i>", "<span class=\"n\">Week line falls back to the phone's own, no line</span>", '<span class="n">Same, no line</span>', '<span class="n">Same, no line</span>'],
 ['SETTINGS', "Didn't save. Try again.<br><i>the value word springs back</i>", "Standing, inline: <i>Key ends in ...a1B2, not checked.</i>", "Standing, inline: <i>not checked</i>", "Standing, inline: <i>Tess thinks on this phone only.</i>"],
 ["TESS'S ASK SLOT", "Didn't save. Try again.", "Claude is busy. Kept it for later.<br>Claude didn't answer in time. Kept it for later.", "Kept it for later.", "<b>No Claude key yet.</b> <b>Claude is off.</b><br><b>Claude paused until Nov 1.</b>"],
 ['WIDGETS, LOCK SCREEN', "Live Activity, Siri and widgets show nothing: the last good line stays<br><i>The failure shows as Didn\'t save. Try again. in Tess\'s band on next open</i>", '<span class="n">Never calls Claude</span>', '<span class="n">Nothing: reads the phone</span>', '<span class="n">Nothing</span>'],
];
const matrix = `<div class="mx"><table><tr><th>AREA</th><th>DIDN'T SAVE</th><th>CLAUDE BUSY OR SLOW</th><th>OFFLINE</th><th>NO KEY OR CLAUDE OFF</th></tr>${MX.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('')}</table></div>`;

if (!play) {
  let b = `<div class="head"><h1>Sheet 84: One error and offline sheet</h1><p>One slot, the UNDO slot, at Tess's band (736 to 820): a failure or a kept-for-later receipt is an ink line there, the same size and place as her line, replacing it for its window. Cobalt stays Tess's voice, so only what she herself says (no key, Claude off, the cap) is cobalt. One haptic: a single .warning when something he just did did not save, never for a kept receipt, never for background work. Tap the line to retry. Offline is not a state, it is a receipt. Standing trouble (Backups, key not checked) is inline on its page, not in the slot.</p></div><div class="grid">`;
  b += matrix;
  b += ph('por', live() + soul + nt("Set 4 didn't save. Try again."), '1 TRAINING, DIDN\'T SAVE', 'The set stays in the number row', 'LOG SET was tapped and the write threw. Set 4\'s stroke does not paint, no clunk, one .warning. The line sits in the UNDO slot in ink at 19. Tap it to run the same write again.');
  b += ph('por', today(true) + soul + nt('Claude is busy. Kept it for later.'), '2 TODAY, CLAUDE BUSY', 'Kept it for later.', 'Product\'s copy, in ink. No haptic: nothing was lost. 4 s, then the context line carries "1 waiting for Tess" (M13) until the inbox drains. Not tappable: it retries itself.');
  b += ph('por', recipes() + soul + nt('Recipe link, kept for later.'), '3 RECIPES, OFFLINE', 'The thing first', 'No connection: the link waits as a ghost row, named first, no URL anywhere. Nothing says "offline" and nothing stays on screen after 4 s.');
  b += ph('por', today(false) + soul + tess('No Claude key yet.'), '4 TESS, NO KEY', 'Her words, her colour', 'He asked her something that needs Claude. This one is Tess, so it is cobalt, and a tap opens CLAUDE in Settings. No haptic, nothing lost. "Claude is off." and "Claude paused until Nov 1." work the same.');
  b += ph('obs', live() + soul + nt("Set 4 didn't save. Try again."), '5 OBSIDIAN', 'Training, didn\'t save', 'Ink 245,242,236 on #121014. No red, no amber: the line is only a sentence.');
  b += ph('obs', today(true) + soul + nt('Claude is busy. Kept it for later.'), '6 OBSIDIAN', 'Today, kept for later', 'Same slot, same place. Tess\'s #86B4FF stays for her own words.');
  b += ph('obs', lock(), '7 LOCK SCREEN', 'Live Activity, didn\'t save', 'Tapping the set on the Lock Screen failed: the rest keeps running and the line under it says so, in ink. Tap it to try again. UNDO takes this place after a good log.');
  b += ph('por', settings() + soul + tess("Claude didn't answer in time. I'll check again later."), '8 SETTINGS, STANDING', 'Not checked is a state, not a toast', 'Test timed out: the key line says "not checked" and stays until the next Test. Tess\'s existing line (C15) speaks once. The slot is not used.');
  b += `</div>`;
  document.getElementById('board').innerHTML = b;
  document.fonts.ready.then(() => { document.body.dataset.done = '1'; });
} else {
  document.body.classList.add('playing');
  const w = document.getElementById('board'); w.className = '';
  w.innerHTML = `<div class="ph por" id="ph">
   <div class="body" id="a1">${live()}</div><div class="body" id="a2" style="opacity:0">${today(false)}</div><div class="body" id="a3" style="opacity:0">${noKey()}</div>
   <div class="abs soul"></div>
   <div class="nt" id="n1" style="opacity:0"></div><div class="tl" id="t1" style="opacity:0"></div><div class="trying" id="tr"></div><div class="finger" id="fg"></div></div>`;
  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const fg = $('fg'), n1 = $('n1'), t1 = $('t1');
  const finger = (x, y, on = 1) => { fg.style.left = x + 'px'; fg.style.top = y + 'px'; fg.style.opacity = on; };
  const tap = async (x, y) => { finger(x, y); await wait(260); fg.style.transform = 'scale(.8)'; await wait(140); fg.style.transform = ''; await wait(200); finger(0, 0, 0); };
  const say = async (el, html, rise = true) => { el.innerHTML = html; el.style.transition = 'none'; el.style.opacity = 0; el.style.marginTop = '10px'; await wait(30); el.style.transition = 'opacity .36s, margin .36s cubic-bezier(.2,.9,.25,1)'; el.style.opacity = 1; el.style.marginTop = '0'; };
  const swap = async (from, to) => { $(from).style.transition = 'opacity .15s'; $(to).style.transition = 'opacity .15s'; $(from).style.opacity = 0; $(to).style.opacity = 1; await wait(200); };
  document.fonts.ready.then(async () => {
    document.body.dataset.start = '1';
    await wait(1600);
    await tap(196, 586);                                   // LOG SET
    await say(n1, "Set 4 didn't save. Try again.");        // warning haptic, stroke stays empty
    await wait(2200);
    finger(270, 779); await wait(260);                       // retry: tap the line
    n1.style.opacity = .6; $('tr').style.transition = 'width .15s'; $('tr').style.width = '120px'; fg.style.transform = 'scale(.8)'; await wait(300);
    fg.style.transform = ''; finger(0, 0, 0);
    $('s4').style.background = 'rgb(18,16,22)'; n1.style.transition = 'opacity .15s'; n1.style.opacity = 0; await wait(160);
    $('tr').style.width = '0'; await say(n1, 'Set 4 logged.' + UNDO); await wait(2800);
    n1.style.opacity = 0; await wait(300);
    await swap('a1', 'a2'); await wait(1200);               // Today
    await say(n1, 'Claude is busy. Kept it for later.'); await wait(900);
    $('a2').insertAdjacentHTML('beforeend', ''); const wt = document.createElement('div'); wt.className = 'ctx17'; wt.style.cssText = 'top:186px;opacity:0;transition:opacity .36s'; wt.textContent = '1 waiting for Tess'; $('a2').appendChild(wt); await wait(30); wt.style.opacity = 1;
    await wait(2800); n1.style.opacity = 0; await wait(500);
    $('a3').innerHTML = today(false); await swap('a2', 'a3'); await wait(900);   // Tess, no key
    await say(t1, 'No Claude key yet.'); await wait(1800);
    await tap(270, 779); t1.style.opacity = 0; $('a3').innerHTML = noKey(); await wait(2200);
