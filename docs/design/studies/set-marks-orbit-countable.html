<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:#f4f1ea}</style><canvas id=c width=1200 height=760></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
const INK=[20,24,31],STAGE=[226,67,42];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),mix=(a,b,t)=>a+(b-a)*t;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)},eob=x=>{x=clamp(x);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const rgb=(a,al=1)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
const colOf=s=>s==='best'?rgb(STAGE):s==='short'?rgb(INK,.22):rgb(INK,.9);
const DEMO=['full','short','full','best'];
function demo(n){const s=Array(n).fill('full');if(n>=3)s[1]='short';if(n>=4)s[n-1]='best';return s}
// ---- shared: an arrival record {ta: time the newest element arrives (or -1e9 if settled)}
// glide p: 0 -> 1 while existing elements move to the new layout; land: 0->1 for the new element
function prog(t,ta){return{p:sm((t-ta-.30)/.45),u:clamp((t-ta)/.6)}}

const GA=2.39996323;
function spiral(cx,cy,B,n,st,t,ta,live){const{u}=prog(t,ta);const R=B*.34,c=R/Math.sqrt(8),rot=live?t*.22:0;
 for(let i=0;i<n;i++){const last=i===n-1&&ta>-1e8&&live;const r0=c*Math.sqrt(i+.5)*(live?1+.05*Math.sin(t*1.4+i*1.7):1),ang=i*GA+rot+(live?.08*Math.sin(t*1.1+i):0);
  let x=Math.cos(ang)*r0,y=Math.sin(ang)*r0;
  if(last){const e=eob(u/.8);const fa=ang+1.4,fr=B*.95;x=mix(Math.cos(fa)*fr,x,e);y=mix(Math.sin(fa)*fr,y,e)}
  const rad=live?B*.058*(st[i]==='best'?1.3:1):(st[i]==='best'?4.2:3.2);
  if(live&&st[i]==='best'){for(let k=1;k<=7;k++){const a2=ang-.07*k;g.fillStyle=rgb(STAGE,.3*(1-k/8));g.beginPath();g.arc(cx+Math.cos(a2)*r0,cy+Math.sin(a2)*r0,rad*(1-k*.09),0,7);g.fill()}}
  g.fillStyle=colOf(st[i]);g.beginPath();g.arc(cx+x,cy+y,rad,0,7);g.fill()}}
function ring(cx,cy,B,n,st,t,ta,live){const{p,u}=prog(t,ta);const R=B*.3,rot=live?t*.45:-Math.PI/2;
 for(let i=0;i<n;i++){const last=i===n-1&&ta>-1e8&&live;const a1=i*2*Math.PI/n,a0=i*2*Math.PI/Math.max(1,n-1);
  let a=a1;if(!last&&ta>-1e8&&live&&n>1)a=mix(a0,a1,p);a+=rot;
  let r=R*(live?1+.07*Math.sin(t*1.5+i*1.9):1);let x=Math.cos(a)*r,y=Math.sin(a)*r;
  if(last){const e=eob(u/.8);x=mix(Math.cos(a+1.2)*B*.95,x,e);y=mix(Math.sin(a+1.2)*B*.95,y,e)}
  const rad=live?B*.062*(st[i]==='best'?1.3:1):(st[i]==='best'?4.2:3.2);
  if(live){const tl=st[i]==='best'?9:5;for(let k=1;k<=tl;k++){const a2=a-.09*k;g.fillStyle=rgb(st[i]==='best'?STAGE:INK,.22*(1-k/(tl+1)));g.beginPath();g.arc(cx+Math.cos(a2)*r,cy+Math.sin(a2)*r,rad*(1-k*.07),0,7);g.fill()}}
  g.fillStyle=colOf(st[i]);g.beginPath();g.arc(cx+x,cy+y,rad,0,7);g.fill()}}
function orbit(cx,cy,B,n,st,t,ta,live){const{u}=prog(t,ta);
 for(let i=0;i<n;i++){const last=i===n-1&&ta>-1e8&&live;const r=B*(.14+.2*((i*3)%4)/3),dir=i%2?1:-1,w=(.7+.28*((i*5)%4))*dir;
  const ph=i*2.4,ang=live?ph+w*t:ph+i*(2*Math.PI/Math.max(n,1));let x=Math.cos(ang)*r*1.15,y=Math.sin(ang)*r*.9;
  if(last){const e=eob(u/.75);const fa=-.6+i*.5;x=mix(Math.cos(fa)*B*.95,x,e);y=mix(Math.sin(fa)*B*.7,y,e)}
  const rad=B*.075*(st[i]==='best'?1.25:1);g.fillStyle=colOf(st[i]);g.beginPath();g.arc(cx+x,cy+y,rad,0,7);g.fill()}}
const IDEAS=[['Spiral','dots settle on a sunflower spiral and drift; a new set flies in and finds its place, earlier dots never move',spiral,1],['Ring','dots share a slow ring with comet tails; a new set joins and the others re-space with one spring',ring,1],['Orbit (before)','the version he saw: loose orbits, hard to count',orbit,.85]];
const T0=1,STEP=3;
function build(t){let n=0,ta=-1e9;for(let i=0;i<4;i++){if(t>=T0+i*STEP){n=i+1;ta=T0+i*STEP}}return{n,ta}}
function draw(t){g.setTransform(1,0,0,1,0,0);g.fillStyle='#f4f1ea';g.fillRect(0,0,1200,760);
 g.font='600 20px -apple-system,Helvetica,Arial';g.fillStyle=rgb(INK,.9);g.fillText('Orbit, but countable (live 28 pt, row 11 pt, shown 3x)',30,36);
 const {n,ta}=build(t);
 IDEAS.forEach(([name,desc,fn,sc],k)=>{const y0=70+k*230;
  g.fillStyle=rgb(INK,.9);g.font='600 22px -apple-system,Helvetica';g.fillText(name,30,y0+34);g.fillStyle=rgb(INK,.55);g.font='13px -apple-system,Helvetica';
  const ws=desc.split(' ');let l='',yy=y0+56;for(const a of ws){if(g.measureText(l+a).width>170){g.fillText(l,30,yy);yy+=17;l=''}l+=a+' '}g.fillText(l,30,yy);
  g.fillStyle=rgb(INK,.4);g.font='11px -apple-system,Helvetica';g.fillText('LIVE, sets 1 to 4',250,y0+12);g.fillText('ROW (true size)',420,y0+12);g.fillText('EVERY COUNT, 1 to 8',560,y0+12);
  g.strokeStyle=rgb(INK,.07);g.strokeRect(235,y0+20,150,170);g.strokeRect(400,y0+20,130,170);
  const st=DEMO.slice(0,Math.max(n,0));
  if(n>0){fn(310,y0+105,84*1.25,n,st,t,ta,true);fn(465,y0+105,k===0?46:40,n,st,t,-1e9,false)}
  for(let m=1;m<=8;m++){const cx=600+(m-1)*77;g.strokeStyle=rgb(INK,.07);g.strokeRect(cx-34,y0+20,68,170);g.fillStyle=rgb(INK,.4);g.font='11px -apple-system,Helvetica';g.fillText(m,cx-3,y0+184);fn(cx,y0+95,84*sc,m,demo(m),t+m,-1e9,true)}
  if(n>0&&t-ta<.2){g.fillStyle=rgb(INK,.5*(1-(t-ta)/.2));g.font='600 11px -apple-system,Helvetica';g.fillText('haptic',250,y0+205)}});
 g.fillStyle=rgb(INK,.45);g.font='12px -apple-system,Helvetica';g.fillText('Sets: 8/8 at 80, 6/8 at 85 (short, pale), 9/8 at 85, 6/6 at 95 (best, stage colour). One haptic when the dot lands. Reduce Motion: no travel, 150 ms crossfade. Row copy is flat.',30,748)}
window.sceneDuration=()=>T0+4*STEP+2.5;window.renderAt=draw;draw(0);
</script>
