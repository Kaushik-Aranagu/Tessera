<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Day log</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Motion study for M4 slice 5 (docs/design/m4-steers.md, Day log). Add ?x2 to render at 2x. -->
<style>
:root{--ink:#2B2440;--ctx:#7A5C8E;--sub:#6E6480;--verm:#C8452F;--cobalt:#2E6DA4}
body{margin:0;background:#EFE7DC}
.ph{position:relative;width:390px;height:844px;overflow:hidden;color:var(--ink);font-family:'Inter Tight',sans-serif;
 background:radial-gradient(60% 40% at 85% 6%,#F7E6B8 0%,rgba(247,230,184,0) 70%),radial-gradient(70% 45% at 0% 30%,#D8CBE6 0%,rgba(216,203,230,0) 70%),radial-gradient(80% 50% at 100% 70%,#BFD8E2 0%,rgba(191,216,226,0) 70%),#F4EEE4}
.abs{position:absolute}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;color:var(--sub)}
.day{position:absolute;left:0;right:0}
.day .date{position:absolute;left:22px;top:6px;width:64px;line-height:1.25}
.day .spine{position:absolute;left:24px;top:52px;display:flex;flex-direction:column;gap:6px}
.day .spine span{width:16px;height:13px;border-radius:55% 45% 60% 40%/50% 60% 40% 50%;filter:blur(.4px)}
.day .c{position:absolute;left:94px;right:22px;top:0}
.yours{font-size:34px;font-weight:500;line-height:1.08;letter-spacing:-.03em;margin-bottom:8px}
.head{font-size:21px;font-weight:500;line-height:1.35}
.head .h{position:relative;display:inline-block}
.cnt{font-size:21px;font-weight:400;line-height:1.35;opacity:.7}
.quiet{margin-top:6px;opacity:.45}
#finger{width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(43,36,64,.16);box-shadow:0 0 0 1.5px rgba(255,255,255,.7);opacity:0;z-index:20;pointer-events:none}
</style>
</head>
<body>
<div class="ph" id="ph">
  <svg width="390" height="844" class="abs" style="inset:0;mix-blend-mode:multiply;opacity:.3;pointer-events:none" aria-hidden="true">
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .45  0 0 0 .55 0"/></filter>
    <rect width="390" height="844" filter="url(#grain)"/>
  </svg>
  <div class="abs lbl" style="left:22px;top:58px">TODAY › DAYS</div>
  <div id="win" class="abs" style="left:0;right:0;top:96px;height:640px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 60px);mask-image:linear-gradient(transparent,#000 60px)">
    <div id="lane" class="abs" style="left:0;right:0;top:0"></div>
  </div>
  <div class="abs" style="left:14px;right:14px;bottom:18px;height:74px;border-radius:20px;background:rgba(250,246,239,.62);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 .5px rgba(43,36,64,.2),0 10px 28px rgba(43,36,64,.12);z-index:6">
    <span id="tess" class="abs" style="left:78px;right:84px;top:14px;font-size:21px;line-height:1.1;color:#8A7F96">Ask Tess…</span>
    <span id="undo" class="abs" style="right:20px;top:24px;font-size:21px;font-weight:600;color:var(--verm);opacity:0">Undo</span>
  </div>
  <div class="abs" style="left:36px;top:778px;width:28px;height:24px;border-radius:52% 48% 60% 40%;background:radial-gradient(closest-side,rgba(46,109,164,.7),rgba(46,109,164,0));filter:blur(2px);z-index:7"></div>
  <div id="finger" class="abs"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const HOUSE = 'cubic-bezier(.2,.8,.2,1)';
const anim = (el, kf, o) => el.animate(kf, { fill: 'forwards', ...o }).finished;
const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const tween = (dur, fn) => new Promise((res) => { const t0 = performance.now(); const st = (n) => { const t = Math.min(1, (n - t0) / dur); fn(ease(t)); t < 1 ? requestAnimationFrame(st) : res(); }; requestAnimationFrame(st); });
const rel = (r) => { const p = $('ph').getBoundingClientRect(), k = p.width / 390; return { left: (r.left - p.left) / k, top: (r.top - p.top) / k, width: r.width / k, height: r.height / k }; };
const finger = $('finger');
const fingerAt = (x, y) => { finger.style.left = x + 'px'; finger.style.top = y + 'px'; };
const fingerOn = async (x, y) => { fingerAt(x, y); await anim(finger, [{ opacity: 0, transform: 'scale(1.3)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 160 }); };
const fingerOff = () => anim(finger, [{ opacity: 1 }, { opacity: 0 }], { duration: 160 });
async function tessSay(text, colour = '#2E6DA4') {
  const t = $('tess'); await anim(t, [{ opacity: 1 }, { opacity: 0 }], { duration: 120 });
  t.innerHTML = text; t.style.color = colour;
  anim(t, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: HOUSE });
}
const C = { train: '#C8452F', cook: '#6E9E6A', task: '#E0A35C', note: '#2E6DA4', focus: '#7A5C8E' };
// oldest first; today last (at the bottom)
const DAYS = [
  { d: 'MON<br>12', yours: 'First squat PR in a month.', head: [['Leg day, PR on squat', 'train'], ['carbonara', 'cook']], cnt: '3 tasks', q: 'SLEPT 7H40 · ENERGY 4' },
  { empty: 'OCT 13' },
  { d: 'TUE<br>13', head: [['Push day', 'train']], cnt: '5 tasks · 1 note', q: 'SLEPT 6H10 · 4 MEETINGS' },
  { d: 'WED<br>14', yours: 'Rough sleep, good lift.', head: [['Pull day', 'train'], ['first time making ramen', 'cook']], cnt: '4 tasks', q: 'SLEPT 5H50 · ENERGY 2' },
  { d: 'TODAY', head: [['Push day, PR on bench', 'train'], ['focus, 50 min on the deck', 'focus']], cnt: '4 tasks · 2 notes', q: 'SLEPT 7H10 · 3 MEETINGS · ENERGY 4', today: 1 }
];
const lane = $('lane');
let y = 0; const blocks = [];
for (const day of DAYS) {
  const b = document.createElement('div'); b.className = 'day'; b.style.top = y + 'px';
  if (day.empty) { b.innerHTML = `<div class="lbl" style="position:absolute;left:22px;top:0;opacity:.45">${day.empty}</div>`; b.style.height = '40px'; lane.appendChild(b); y += 52; blocks.push(b); continue; }
  b.innerHTML = `<div class="date lbl" style="color:${day.today ? '#2B2440' : '#6E6480'}">${day.d}</div>
    <div class="spine">${day.head.map(([, k]) => `<span style="background:${C[k]}"></span>`).join('')}</div>
    <div class="c">${day.yours ? `<div class="yours">${day.yours}</div>` : ''}<div class="head">${day.head.map(([h], i) => `<span class="h" data-i="${i}">${h}</span>`).join(' · ')}</div><div class="cnt">${day.cnt}</div><div class="quiet lbl">${day.q}</div></div>`;
  lane.appendChild(b); blocks.push(b); day.el = b;
  y += b.querySelector('.c').offsetHeight + 40;
}
const laneH = y;
// today sits at the bottom of the window
const winH = 640; let off = winH - laneH; lane.style.transform = `translateY(${off}px)`;

(async () => {
  if (location.search.includes('x2')) { const ph = $('ph'); ph.style.transform = 'scale(2)'; ph.style.transformOrigin = '0 0'; }
  await document.fonts.ready; await sleep(400);
  // re-measure after fonts load
  y = 0; for (const [k, b] of blocks.entries()) { b.style.top = y + 'px'; y += DAYS[k].empty ? 52 : b.querySelector('.c').offsetHeight + 40; }
  off = winH - y + 10; lane.style.transform = `translateY(${off}px)`;
  document.body.dataset.start = '1';
  // arrival: zoomed in from the day label, today settles at the bottom
  anim($('win'), [{ opacity: 0, transform: 'scale(.96) translateY(-30px)', filter: 'blur(4px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 420, easing: HOUSE });
  await sleep(1500);

  // pull down: read back up through the week
  await fingerOn(220, 300);
  const top = 40 - off;
  await tween(1100, (t) => { lane.style.transform = `translateY(${off + top * t}px)`; fingerAt(220, 300 + Math.min(360, top * t * .9)); });
  fingerOff(); off += top;
  await sleep(1400);

  // tap a headline item on Monday: it underlines, Tess previews the undo
  const mon = DAYS[0].el.querySelector('.h[data-i="0"]');
  const r = rel(mon.getBoundingClientRect());
  await fingerOn(r.left + 60, r.top + 14); await sleep(100); fingerOff();
  mon.style.textDecoration = 'underline'; mon.style.textDecorationThickness = '2px'; mon.style.textUnderlineOffset = '5px';
  await tessSay('Removes squat 120 × 3. PR back to 117.5.');
  anim($('undo'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240 });
  await sleep(2400);
  // tap Undo: the strike runs on that item
  await fingerOn(340, 788); await sleep(100); fingerOff();
  mon.style.textDecoration = 'none';
  const sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  const w = r.width; sv.setAttribute('width', w + 10); sv.setAttribute('height', 28);
  Object.assign(sv.style, { position: 'absolute', left: '-4px', top: '0px', overflow: 'visible' });
  sv.innerHTML = `<path d="M2 15 C ${w * .3} 12, ${w * .62} 17.5, ${w + 8} 13.5" fill="none" stroke="#2B2440" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity=".85"/>`;
  mon.appendChild(sv);
  sv.querySelector('path').animate([{ strokeDashoffset: 100 }, { strokeDashoffset: 0 }], { duration: 300, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' });
  anim(mon, [{ opacity: 1 }, { opacity: .45 }], { duration: 300, delay: 200 });
  anim($('undo'), [{ opacity: 1 }, { opacity: 0 }], { duration: 200 });
  tessSay('Undone.');
  await sleep(1400);

  // back down to today: its count line gains the undo
  await fingerOn(220, 600);
  const back = -top;
  await tween(900, (t) => { lane.style.transform = `translateY(${off + back * t}px)`; fingerAt(220, 600 - Math.min(360, -back * t * .9)); });
  fingerOff(); off += back;
  const cnt = DAYS[4].el.querySelector('.cnt');
  await anim(cnt, [{ opacity: .7 }, { opacity: 0 }], { duration: 160 });
  cnt.textContent = '4 tasks · 2 notes · undid 1 thing from Oct 12';
  anim(cnt, [{ opacity: 0, transform: 'translateX(10px)' }, { opacity: .7, transform: 'none' }], { duration: 280, easing: HOUSE });
  await sleep(2200);
  document.body.dataset.done = '1';
})();
</script>
</body>
</html>
