<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Cook mode</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Motion study for kitchen sheet 12 (docs/design/kitchen/12-cook-mode.md). Timers run fast for the recording. Add ?x2 to render at 2x. -->
<style>
:root{--cream:#F6F0E6;--cad:#E0A35C;--verm:#C8452F}
body{margin:0;background:#111}
.ph{position:relative;width:390px;height:844px;overflow:hidden;color:var(--cream);font-family:'Inter Tight',sans-serif;
 background:radial-gradient(70% 45% at 90% 8%,rgba(200,69,47,.28),rgba(200,69,47,0) 70%),radial-gradient(80% 55% at 0% 55%,rgba(122,92,142,.38),rgba(122,92,142,0) 70%),radial-gradient(70% 45% at 100% 100%,rgba(224,163,92,.18),rgba(224,163,92,0) 70%),#221D2E}
.abs{position:absolute}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;color:rgba(246,240,230,.65)}
.step{position:absolute;left:22px;right:22px;font-size:34px;font-weight:500;line-height:1.15;letter-spacing:-.03em}
.step b{font-weight:500;color:var(--cream)}
.step span.rest{color:rgba(246,240,230,.85)}
.key{border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 .5px rgba(246,240,230,.35),0 6px 18px rgba(0,0,0,.3);overflow:hidden}
#finger{width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(246,240,230,.22);box-shadow:0 0 0 1.5px rgba(255,255,255,.6);opacity:0;z-index:20;pointer-events:none}
.hz{position:absolute;left:22px;right:22px;height:20px}
.hz .guide{position:absolute;left:0;right:0;top:6px;height:1.5px;background:rgba(246,240,230,.14)}
.hz .burn{position:absolute;left:0;top:5.5px;height:2.5px;background:var(--cream);border-radius:2px;box-shadow:0 0 6px rgba(246,240,230,.35)}
.hz .tip{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--cream);filter:blur(3px);opacity:.8}
.hz .lab{position:absolute;left:0;top:14px}
</style>
</head>
<body>
<div class="ph" id="ph">
  <svg width="390" height="844" class="abs" style="inset:0;mix-blend-mode:screen;opacity:.08;pointer-events:none" aria-hidden="true">
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/></filter><rect width="390" height="844" filter="url(#grain)"/>
  </svg>
  <span class="abs" style="left:0;right:0;top:0;height:2px;background:var(--verm);box-shadow:0 0 12px rgba(200,69,47,.55)"></span>
  <div id="timers"></div>
  <div id="content" class="abs" style="left:0;top:0;width:390px;height:844px">
  <div class="abs" style="left:22px;top:56px;font-size:21px;color:rgba(246,240,230,.6)">Carbonara, for 2</div>
  <div id="count" class="abs lbl" style="right:22px;top:60px">2 / 6</div>
  <div id="steps"></div>
  <div id="ing" class="abs" style="left:22px;top:430px;font-size:21px;line-height:1.5;color:rgba(246,240,230,.7)"></div>
  <div id="tkey" class="abs key" style="left:22px;width:240px;top:600px;height:64px;background:rgba(246,240,230,.08);color:var(--cream)">
    <span id="tfill" class="abs" style="inset:-30px;background:radial-gradient(closest-side,#E0A35C 0%,#E0A35C 70%,rgba(224,163,92,0) 100%);transform-origin:10% 50%;transform:scale(0);filter:blur(4px)"></span>
    <span id="tkeyText" style="position:relative;display:flex;height:100%;align-items:center;padding:0 20px;font-size:21px"><b style="font-weight:600">10 min</b>&nbsp;· hold to start</span>
  </div>
  <div id="peek" class="abs" style="left:22px;right:22px;top:690px;font-size:21px;color:rgba(246,240,230,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
  </div>
  <div class="abs" style="left:14px;right:14px;bottom:18px;height:74px;border-radius:20px;background:rgba(40,34,52,.6);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 .5px rgba(246,240,230,.15)">
    <span id="tess" class="abs" style="left:78px;top:24px;font-size:21px;color:rgba(246,240,230,.55)">Ask Tess…</span>
  </div>
  <div class="abs" style="left:36px;top:778px;width:28px;height:24px;border-radius:52% 48% 60% 40%;background:radial-gradient(closest-side,rgba(110,160,220,.85),rgba(110,160,220,0));filter:blur(2px)"></div>
  <div id="finger" class="abs"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const HOUSE = 'cubic-bezier(.2,.8,.2,1)';
const anim = (el, kf, o) => el.animate(kf, { fill: 'forwards', ...o }).finished;
const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const tween = (dur, fn) => new Promise((res) => { const t0 = performance.now(); const st = (n) => { const t = Math.min(1, (n - t0) / dur); fn(ease(t)); t < 1 ? requestAnimationFrame(st) : res(); }; requestAnimationFrame(st); });
const finger = $('finger');
const fingerAt = (x, y) => { finger.style.left = x + 'px'; finger.style.top = y + 'px'; };
const fingerOn = async (x, y) => { fingerAt(x, y); await anim(finger, [{ opacity: 0, transform: 'scale(1.3)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 160 }); };
const fingerOff = () => anim(finger, [{ opacity: 1 }, { opacity: 0 }], { duration: 160 });
async function tessSay(text, colour = 'rgba(140,180,230,.95)') {
  const t = $('tess'); await anim(t, [{ opacity: 1 }, { opacity: 0 }], { duration: 120 });
  t.textContent = text; t.style.color = colour;
  anim(t, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: HOUSE });
}
const STEPS = [
  { t: 'Bring a big pot of salted water to the boil.', ing: [] },
  { t: '<b>Pasta</b><span class="rest"> into the water. Cook until just short of done.</span>', ing: [['200 g', 'spaghetti']], timer: { min: 10, lab: 'PASTA' } },
  { t: '<span class="rest">Crisp the </span><b>guanciale</b><span class="rest"> in a dry pan over medium heat.</span>', ing: [['100 g', 'guanciale']], timer: { min: 12, lab: 'GUANCIALE' } },
  { t: '<span class="rest">Whisk the </span><b>eggs</b><span class="rest"> with the </span><b>pecorino</b><span class="rest"> and lots of pepper.</span>', ing: [['3', 'yolks, 1 whole egg'], ['50 g', 'pecorino']] }
];
let cur = 1; const els = [];
function stepEl(i) { const e = document.createElement('div'); e.className = 'step'; e.innerHTML = STEPS[i].t; $('steps').appendChild(e); return e; }
function prevLine(i) { return STEPS[i].t.replace(/<[^>]+>/g, ''); }
function showIng(i) { $('ing').innerHTML = STEPS[i].ing.map(([a, n]) => `<div><b style="font-weight:600">${a}</b> ${n}</div>`).join(''); }
function keyFor(i) { const tm = STEPS[i].timer; $('tkey').style.display = tm ? 'block' : 'none'; if (tm) $('tkeyText').innerHTML = `<b style="font-weight:600">${tm.min} min</b>&nbsp;· hold to start`; }
// horizon timers: stacked hairlines at the top, soonest first; they burn left to right
const timers = [];
function addTimer(lab, secs) {
  const h = document.createElement('div'); h.className = 'hz';
  h.innerHTML = `<span class="guide"></span><span class="burn" style="width:0"></span><span class="tip" style="left:0"></span><span class="lab lbl"></span>`;
  $('timers').appendChild(h);
  const t = { lab, secs, left: secs, el: h, start: performance.now() };
  timers.push(t); layoutTimers(); return t;
}
// each horizon takes 30pt (line plus label); past the first, the page moves down to make room
let shift = 0;
function layoutTimers() {
  timers.sort((a, b) => a.left - b.left).forEach((t, k) => { t.el.style.top = (10 + k * 30) + 'px'; });
  const to = Math.max(0, timers.length - 1) * 30;
  if (to !== shift) { anim($('content'), [{ transform: `translateY(${shift}px)` }, { transform: `translateY(${to}px)` }], { duration: 320, easing: HOUSE }); shift = to; }
}
function fmt(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
let speed = 60; // the recording runs a minute per second
function tick() {
  for (const t of timers) {
    if (t.done) continue;
    t.left = t.secs - (performance.now() - t.start) / 1000 * speed;
    const f = Math.min(1, 1 - t.left / t.secs);
    t.el.querySelector('.burn').style.width = (f * 346) + 'px'; t.el.querySelector('.tip').style.left = (f * 346) + 'px';
    t.el.querySelector('.lab').textContent = `${t.lab} ${fmt(t.left)}`;
    if (t.left <= 0) { t.done = true; flare(t); }
  }
  requestAnimationFrame(tick);
}
async function flare(t) {
  const b = t.el.querySelector('.burn');
  b.animate([{ background: '#F6F0E6', height: '2.5px', top: '5.5px', boxShadow: '0 0 6px rgba(246,240,230,.35)' }, { background: '#E0A35C', height: '6px', top: '4px', boxShadow: '0 0 18px rgba(224,163,92,.9)' }], { duration: 420, easing: HOUSE, fill: 'forwards' });
  t.el.querySelector('.lab').style.color = '#E0A35C'; t.el.querySelector('.lab').textContent = `${t.lab} DONE`;
  // the step it belongs to slides back in from above, in cadmium for a moment
  const back = document.createElement('div'); back.className = 'step';
  Object.assign(back.style, { top: '100px', fontSize: '21px', color: '#E0A35C', zIndex: 5, whiteSpace: 'nowrap' }); back.textContent = 'Pasta’s done. Drain it, keep a cup.';
  $('content').appendChild(back);
  if (els[cur - 1]) anim(els[cur - 1], [{ opacity: .35 }, { opacity: 0 }], { duration: 200 });
  anim(back, [{ opacity: 0, transform: 'translateY(-24px)', filter: 'blur(4px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 420, easing: HOUSE });
  tessSay('Pasta’s done.');
}

async function nextStep() {
  const a = els[cur], i = cur + 1;
  // this step shrinks into the dim line above; the next rises from the peek
  await fingerOn(200, 520);
  const b = stepEl(i); b.style.top = '150px'; els[i] = b;
  const swipe = tween(260, (t) => fingerAt(200, 520 - 180 * t));
  anim(a, [{ top: '150px', fontSize: '34px', opacity: 1 }, { top: '100px', fontSize: '21px', opacity: .35 }], { duration: 380, easing: HOUSE });
  anim(b, [{ opacity: 0, transform: 'translateY(540px) scale(.62)', filter: 'blur(4px)', transformOrigin: '0 0' }, { opacity: 1, transform: 'none', filter: 'blur(0)', transformOrigin: '0 0' }], { duration: 420, easing: HOUSE });
  if (els[cur - 1]) anim(els[cur - 1], [{ opacity: .35 }, { opacity: 0, transform: 'translateY(-20px)' }], { duration: 300 });
  anim($('ing'), [{ opacity: 1 }, { opacity: 0 }], { duration: 160 }).then(() => { showIng(i); anim($('ing'), [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: HOUSE }); });
  anim($('tkey'), [{ opacity: 1 }, { opacity: 0 }], { duration: 160 }).then(() => { keyFor(i); $('tfill').style.transform = 'scale(0)'; $('tfill').getAnimations().forEach((x) => x.cancel()); anim($('tkey'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240 }); });
  $('peek').textContent = STEPS[i + 1] ? 'then: ' + prevLine(i + 1).toLowerCase() : 'then: hold to finish';
  $('count').textContent = (i + 1) + ' / 6';
  await swipe; fingerOff();
  a.style.whiteSpace = 'nowrap'; a.style.overflow = 'hidden'; a.style.textOverflow = 'ellipsis';
  cur = i; await sleep(400);
}
async function startTimer() {
  const tm = STEPS[cur].timer;
  await fingerOn(130, 632);
  await anim($('tfill'), [{ transform: 'scale(0)' }, { transform: 'scale(1.35)' }], { duration: 600, easing: 'cubic-bezier(.3,.6,.4,1)' });
  fingerOff();
  $('tkeyText').innerHTML = `<b style="font-weight:600;color:#221D2E">${tm.min} min</b><span style="color:#221D2E">&nbsp;· running</span>`;
  const t = addTimer(tm.lab, tm.min * 60);
  anim(t.el, [{ opacity: 0, transform: 'translateY(-8px)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: HOUSE });
}

(async () => {
  if (location.search.includes('x2')) { const ph = $('ph'); ph.style.transform = 'scale(2)'; ph.style.transformOrigin = '0 0'; }
  const p0 = stepEl(0); p0.style.top = '100px'; p0.style.fontSize = '21px'; p0.style.opacity = .35; p0.style.whiteSpace = 'nowrap'; p0.style.overflow = 'hidden'; p0.style.textOverflow = 'ellipsis'; els[0] = p0;
  const s1 = stepEl(1); s1.style.top = '150px'; els[1] = s1;
  showIng(1); keyFor(1); $('peek').textContent = 'then: ' + prevLine(2).toLowerCase();
  requestAnimationFrame(tick);
  await document.fonts.ready; await sleep(400); document.body.dataset.start = '1';
  await sleep(900);
  await startTimer();             // pasta, 10 min (10 s here)
  await sleep(1400);
  await nextStep();               // to guanciale
  await sleep(500);
  await startTimer(); // guanciale, 12 min
  await sleep(1500);
  await nextStep();               // to the eggs
  await sleep(6200);              // pasta ends: flare, the step comes back
  document.body.dataset.done = '1';
})();
</script>
</body>
</html>
