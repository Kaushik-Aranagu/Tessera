<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Area index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
<!-- Design item 73 (Kaushik 1:51 PM PT Oct 16): the REVIEW / TODAY / TRAINING / KITCHEN row looks generic, the glass lens isn't enough, maybe it needn't be there at all. Three ways with no tab row: A the index (pull down, every area as a big word with its live line), B the edge spine (four data strokes on the right edge, scrub them), C around the soul (hold Tess, the areas bloom in an arc). ?play records A, Porcelain. -->
<style>
:root{--board:#E9E6EE}
*{box-sizing:border-box}
body{margin:0;background:var(--board);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transform-origin:0 0;color:#1c1a20}
body.x2{transform:scale(2)}
.wrap{padding:34px 40px 40px}
.head{display:flex;gap:30px;margin-bottom:22px;max-width:2060px}
.head h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.015em;flex:none;width:380px}
.head p{margin:0;font-size:17px;line-height:24px;color:#4a4652;max-width:820px}
.row{display:flex;gap:22px;align-items:flex-start}
.col{width:393px;flex:none}
.cap{margin-top:14px}
.cap .opt{font-size:13px;font-weight:700;letter-spacing:.08em;color:#6b6674}
.cap .rec{color:#2450D8}
.cap h2{margin:4px 0 6px;font-size:23px;font-weight:600;letter-spacing:-.01em}
.cap p{margin:0 0 6px;font-size:16px;line-height:22px;color:#4a4652}
.ph{position:relative;width:393px;height:852px;background:var(--bg);color:rgb(var(--ink));overflow:hidden;flex:none;border-radius:44px}
body.playing .ph{border-radius:0}
.por{--ink:18,16,22;--bg:#FBFAF7;--tess:#2450D8;--today:#2450D8;--train:#C23A22;--kit:#12936A;--rev:#5A3DAF;--ctx:#5A3DAF;--glass:rgba(251,250,247,.66)}
.obs{--ink:245,242,236;--bg:#121014;--tess:#86B4FF;--today:#86B4FF;--train:#FF7D62;--kit:#52D3A3;--rev:#B8A3FF;--ctx:#B8A3FF;--glass:rgba(30,27,34,.62)}
.abs{position:absolute}
/* Pages on the rail */
.layer{position:absolute;inset:0;transform-origin:50% 0;will-change:transform,filter}
.rail{position:absolute;top:0;left:0;height:100%;width:1572px;display:flex}
.pg{position:relative;width:393px;height:100%;flex:none}
.day{left:22px;top:138px;font-size:17px;color:rgba(var(--ink),.66)}
.ctxl{left:22px;top:186px;font-size:17px;color:var(--ctx)}
.hero{left:22px;top:212px;width:350px;font-size:44px;line-height:50px;font-weight:500;letter-spacing:-.02em}
.key{left:22px;font-weight:700;font-size:15px;letter-spacing:.08em}
.key i{display:block;height:2px;margin-top:5px;background:currentColor}
.lbl{left:22px;font-weight:700;font-size:13px;letter-spacing:.08em;color:rgba(var(--ink),.55)}
.next{left:22px;width:350px;font-size:19px;line-height:26px}
.next div{display:flex;justify-content:space-between;gap:16px;margin-bottom:14px}
.next em{font-style:normal;color:rgba(var(--ink),.62);white-space:nowrap}
.w{color:color-mix(in oklab,var(--acc,var(--train)) 72%,rgb(var(--ink)))}
/* The old row, for the before phone */
.tabs{left:22px;top:46px;display:flex;gap:22px;font-weight:700;font-size:13px;letter-spacing:.08em;color:rgba(var(--ink),.45)}
.tabs b{color:rgb(var(--ink));font-weight:700;border-bottom:2px solid rgb(var(--ink));padding-bottom:5px}
/* The area's name: one word where the back word sits on pages one down (58). It rolls when the page changes. */
.name{left:22px;top:52px;height:20px;overflow:hidden;font-weight:700;font-size:15px;letter-spacing:.08em}
.name .roll{display:flex;flex-direction:column;transition:transform .42s cubic-bezier(.2,.9,.25,1)}
.name .roll span{height:20px;line-height:20px}
/* Tess's band */
.soul{left:323px;top:759px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 40%,#E2432A 0 28%,transparent 46%),radial-gradient(circle at 66% 38%,#2450D8 0 30%,transparent 50%),radial-gradient(circle at 50% 70%,#F0A500 0 28%,transparent 48%);filter:blur(2px)}
.tline{right:71px;top:768px;width:270px;text-align:right;font-size:18px;color:var(--tess)}
/* A: the index */
.glass{position:absolute;left:0;right:0;top:0;height:600px;border-radius:0 0 40px 40px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);box-shadow:inset 0 -1px 0 rgba(255,255,255,.55),0 18px 50px rgba(18,16,22,.10);transform-origin:50% 0}
.obs .glass{box-shadow:inset 0 -1px 0 rgba(255,255,255,.14),0 18px 50px rgba(0,0,0,.4)}
.ix{position:absolute;left:22px;right:22px}
.ix .it{height:104px;transform-origin:0 50%;transition:transform .2s cubic-bezier(.2,.9,.25,1),opacity .2s}
.ix .wd{font-size:40px;line-height:46px;font-weight:600;letter-spacing:-.02em;color:rgba(var(--ink),.42);transition:color .2s}
.ix .ln{font-size:17px;line-height:24px;margin-top:4px;color:rgba(var(--ink),.5);transition:color .2s}
.ix .it.here .wd{color:rgb(var(--ink))}
.ix .it.on .wd{color:color-mix(in oklab,var(--a) 72%,rgb(var(--ink)))}
.ix .it.on .ln{color:color-mix(in oklab,var(--a) 72%,rgb(var(--ink)))}
.ix .it.on{transform:scale(1.06)}
.hint{left:22px;font-size:15px;color:rgba(var(--ink),.45)}
/* B: the edge spine */
.spine{right:7px;top:300px;display:flex;flex-direction:column;gap:14px}
.spine i{display:block;width:4px;height:56px;border-radius:2px;background:linear-gradient(to top,var(--a) 0 var(--f),color-mix(in oklab,var(--a) 22%,var(--bg)) var(--f))}
.spine i.here{width:6px;margin-left:-2px}
.spname{right:30px;text-align:right;font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:38px}
.spname small{display:block;font-size:15px;font-weight:400;letter-spacing:0;line-height:20px}
/* C: around the soul */
.arc{font-weight:700;font-size:14px;letter-spacing:.08em;padding:10px 16px;border-radius:22px;white-space:nowrap}
.arc.g{background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 24px rgba(18,16,22,.12)}
.arc small{display:block;font-weight:400;font-size:13px;letter-spacing:0;margin-top:2px;opacity:.75}
.dim{position:absolute;inset:0;background:rgba(251,250,247,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.finger{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(18,16,22,.16);border:1.5px solid rgba(18,16,22,.25);opacity:0;transition:opacity .15s;pointer-events:none;z-index:9}
</style></head>
<body>
<div class="wrap" id="board"></div>
<script>
const play = location.search.includes('play');
if (location.search.includes('x2')) document.body.classList.add('x2');

const AREAS = [
  { k: 'review', w: 'REVIEW', word: 'Review', a: 'var(--rev)', line: 'This week, 3 of 6 sessions', f: '50%' },
  { k: 'today', w: 'TODAY', word: 'Today', a: 'var(--today)', line: 'Push Day A, 13 sets left', f: '40%' },
  { k: 'train', w: 'TRAINING', word: 'Training', a: 'var(--train)', line: 'Push Day A is on', f: '35%' },
  { k: 'kit', w: 'KITCHEN', word: 'Kitchen', a: 'var(--kit)', line: 'Tacos at 7 pm', f: '25%' },
];

// The four tab pages, simplified to their tops (41, 44, 46, 47).
function page(k) {
  if (k === 'today') return `<div class="abs day">Friday evening</div><div class="abs ctxl">now, 7 of 20 sets</div>
    <div class="abs hero" style="font-weight:542">Push Day A, <span class="w">bench set 4</span></div>
    <div class="abs key" style="top:332px">RESUME<i></i></div><div class="abs lbl" style="top:400px">NEXT</div>
    <div class="abs next" style="top:428px"><div><span>Stretch &amp; mobility</span><em>8:30 pm</em></div><div><span>Read Designing Data-Intensive Applications</span><em>9:10 pm</em></div></div>`;
  if (k === 'train') return `<div class="abs day">This week</div><div class="abs ctxl">3 of 6 sessions</div>
    <div class="abs hero">Push Day A is on</div><div class="abs key" style="top:282px;color:var(--train)">RESUME<i></i></div>
    <div class="abs lbl" style="top:350px">ROUTINES</div>
    <div class="abs next" style="top:378px"><div><span>Push Day A</span><em>Mon, Thu</em></div><div><span>Pull Day A</span><em>Tue</em></div><div><span>Legs A</span><em>Sat</em></div><div><span>Mobility</span><em>any day</em></div></div>`;
  if (k === 'kit') return `<div class="abs day">Tonight</div><div class="abs ctxl">cook at 6:30 pm</div>
    <div class="abs hero">Tacos at 7 pm</div><div class="abs key" style="top:282px">START COOKING<i></i></div>
    <div class="abs lbl" style="top:350px">LISTS</div>
    <div class="abs next" style="top:378px"><div><span>Groceries</span><em>6 to buy</em></div><div><span>Packing</span><em>11 to pack</em></div><div><span>Recipes</span><em>24</em></div></div>`;
  return `<div class="abs day">This week</div><div class="abs ctxl">Oct 12 to Oct 18</div>
    <div class="abs hero">3 of 6 sessions</div>
    <div class="abs next" style="top:300px"><div><span>TRAINING</span><em>3 of 6</em></div><div><span>TASKS DONE</span><em>14</em></div><div><span>COOK</span><em>2 of 4</em></div></div>`;
}
const band = (line = '') => `<div class="abs soul"></div>${line ? `<div class="abs tline">${line}</div>` : ''}`;
const nameRoll = i => `<div class="abs name" id="nm"><div class="roll" style="transform:translateY(${-20 * i}px)">${AREAS.map(a => `<span>${a.w}</span>`).join('')}</div></div>`;
function index(top, here, on) {
  return `<div class="ix" style="top:${top}px">${AREAS.map((a, i) => `<div class="it${i === here ? ' here' : ''}${i === on ? ' on' : ''}" style="--a:${a.a}"><div class="wd">${a.word}</div><div class="ln">${a.line}</div></div>`).join('')}</div>`;
}

if (!play) {
  const today = 1;
  const before = `<div class="ph por"><div class="abs tabs"><span>REVIEW</span><b>TODAY</b><span>TRAINING</span><span>KITCHEN</span></div><div class="pg" style="position:absolute;inset:0">${page('today')}</div>${band()}</div>`;
  const aRest = `<div class="ph por"><div class="pg" style="position:absolute;inset:0">${page('today')}</div>${nameRoll(today)}${band()}</div>`;
  const aOpen = `<div class="ph por"><div class="layer" style="transform:scale(.9) translateY(40px);filter:blur(6px);opacity:.6"><div class="pg">${page('today')}</div></div>
     <div class="glass"></div>${index(96, 1, 3)}<div class="abs hint" style="top:548px">Let go to open</div><div class="finger" style="left:250px;top:500px;opacity:1"></div>${band()}</div>`;
  const aObs = `<div class="ph obs"><div class="layer" style="transform:scale(.9) translateY(40px);filter:blur(6px);opacity:.5"><div class="pg">${page('today')}</div></div>
     <div class="glass"></div>${index(96, 1, 2)}<div class="abs hint" style="top:548px">Let go to open</div>${band()}</div>`;
  const spine = (on) => `<div class="abs spine">${AREAS.map((a, i) => `<i class="${i === 1 ? 'here' : ''}" style="--a:${a.a};--f:${a.f}"></i>`).join('')}</div>`;
  const bRest = `<div class="ph por"><div class="pg" style="position:absolute;inset:0">${page('today')}</div>${spine()}${band()}</div>`;
  const bScrub = `<div class="ph por"><div class="layer" style="opacity:.35"><div class="pg">${page('today')}</div></div>${spine()}
     <div class="abs spname" style="top:416px;color:color-mix(in oklab,var(--train) 72%,rgb(var(--ink)))">Training<small>Push Day A is on</small></div>
     <div class="abs spname" style="top:346px;font-size:20px;line-height:24px;color:rgba(var(--ink),.45)">Today</div>
     <div class="abs spname" style="top:490px;font-size:20px;line-height:24px;color:rgba(var(--ink),.45)">Kitchen</div>
     <div class="finger" style="left:383px;top:440px;opacity:1"></div>${band()}</div>`;
  const cHeld = `<div class="ph por"><div class="pg" style="position:absolute;inset:0">${page('today')}</div><div class="dim"></div>
     <div class="abs arc g" style="left:184px;top:470px;color:var(--rev)">REVIEW<small>3 of 6 this week</small></div>
     <div class="abs arc g" style="left:120px;top:560px;color:var(--today)">TODAY<small>7 of 20 sets</small></div>
     <div class="abs arc g" style="left:96px;top:650px;color:var(--train);transform:scale(1.1);transform-origin:100% 50%">TRAINING<small>Push Day A is on</small></div>
     <div class="abs arc g" style="left:40px;top:744px;color:var(--kit)">KITCHEN<small>Tacos at 7 pm</small></div>
     ${band()}<div class="finger" style="left:200px;top:680px;opacity:1"></div></div>`;

  const col = (ph, opt, h, ps, rec) => `<div class="col">${ph}<div class="cap"><div class="opt${rec ? ' rec' : ''}">${opt}</div><h2>${h}</h2>${ps.map(p => `<p>${p}</p>`).join('')}</div></div>`;
  let h = `<div class="head"><h1>No tab row. Three other ways to move between areas</h1><p>Every way keeps the left and right swipe between neighbours, and every way puts one word at the top where the back word sits one page down, so the top of a page always says where you are. What changes is how you jump, and what you see while you do: each area shows what it's holding right now, not just its name.</p></div><div class="row">`;
  h += col(before, 'NOW', 'The row', ['Four words and a line under one. It names the areas and says nothing about them.']);
  h += col(aRest, 'A · RECOMMENDED', 'The index, at rest', ['One word at the top: where you are. Swipe left or right for the neighbours, and the word rolls to the next.']);
  h += col(aOpen, 'A · RECOMMENDED', 'Pull down: every area', ['Pull the page down past its top (or tap the word) and the areas drop in as big words, each with its live line. Slide to one, let go, and you’re there. One tick per word.']);
  h += col(aObs, 'A · OBSIDIAN', 'The same, in Obsidian', ['The index is glass, the one navigation layer. The page stays live and blurred under it.']);
  h += col(bScrub, 'B', 'The edge spine', ['Four short strokes on the right edge, each in its area’s colour, filled by how far today got. Run a thumb down them to scrub. Quiet, but you can’t read it at rest.']);
  h += col(cHeld, 'C', 'Around the soul', ['Hold Tess and the areas bloom around her. Close to the thumb, but it takes Tess’s band, which is hers.']);
  h += `</div>`;
  document.getElementById('board').innerHTML = h;
  document.fonts.ready.then(() => { document.body.dataset.done = '1'; });
} else {
  document.body.classList.add('playing');
  const w = document.getElementById('board'); w.className = '';
  w.innerHTML = `<div class="ph por" id="ph">
    <div class="layer" id="layer"><div class="rail" id="rail">${AREAS.map(a => `<div class="pg">${page(a.k)}</div>`).join('')}</div></div>
    <div class="glass" id="glass" style="opacity:0;transform:translateY(-40px)"></div>
    <div id="ixw" style="opacity:0">${index(96, 1, -1)}<div class="abs hint" style="top:548px">Let go to open</div></div>
    ${nameRoll(1)}${band()}<div class="finger" id="fg"></div></div>`;
  const $ = id => document.getElementById(id);
  const rail = $('rail'), layer = $('layer'), glass = $('glass'), ixw = $('ixw'), fg = $('fg'), roll = document.querySelector('#nm .roll');
  const items = [...document.querySelectorAll('.ix .it')];
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const out = x => 1 - Math.pow(1 - x, 3);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const tween = (ms, f, e = ease) => new Promise(r => { const t0 = performance.now(); (function k(n) { const q = Math.min((n - t0) / ms, 1); f(e(q)); q < 1 ? requestAnimationFrame(k) : r(); })(t0); });
  let at = 1, x = -393;
  const setRail = v => { x = v; rail.style.transform = `translateX(${v}px)`; };
  setRail(-393);
  const finger = (l, t, show = true) => { fg.style.left = l + 'px'; fg.style.top = t + 'px'; fg.style.opacity = show ? 1 : 0; };
  const setName = i => { roll.style.transform = `translateY(${-20 * i}px)`; };
  const mark = (here, on) => items.forEach((it, i) => { it.classList.toggle('here', i === here); it.classList.toggle('on', i === on); });
  // The index forms: 0 → 1.
  const form = q => {
    layer.style.transform = `scale(${1 - .1 * q}) translateY(${40 * q}px)`; layer.style.filter = `blur(${6 * q}px)`; layer.style.opacity = 1 - .4 * q;
    glass.style.opacity = q; glass.style.transform = `translateY(${-40 * (1 - q)}px)`;
    ixw.style.opacity = q; items.forEach((it, i) => { it.style.transform = `translateY(${-24 * (1 - Math.min(1, q * 1.4 - i * .1))}px)`; });
  };
  const rowAt = y => Math.max(0, Math.min(3, Math.floor((y - 96) / 104)));
  async function swipeTo(i) {
    const from = x, to = -393 * i, dir = Math.sign(from - to);
    finger(300, 420);
    await tween(420, q => { setRail(from + (to - from) * q); finger(300 - 220 * q * dir, 420); });
    finger(80, 420, false); at = i; setName(i);
  }
  async function openIndex(pullFrom, pullTo) {
    mark(at, at); items.forEach(it => it.style.transition = 'none');
    finger(250, pullFrom);
    await wait(160);
    // The pull: the page follows the finger, rubber-banded; past 80 pt the index forms.
    await tween(520, q => { const y = pullFrom + (pullTo - pullFrom) * q; finger(250, y); form(Math.min(1, Math.max(0, (y - pullFrom - 20) / 70))); }, out);
    items.forEach(it => it.style.transition = '');
  }
  async function dragTo(y0, y1) {
    let last = rowAt(y0);
    await tween(700, q => { const y = y0 + (y1 - y0) * q; finger(250, y); const r = rowAt(y); if (r !== last) { last = r; mark(at, r); } });
    return last;
  }
  // Let go: the chosen word flies up into the name's place and becomes it; the page comes up under it.
  async function land(i) {
    finger(250, 0, false); mark(at, i);
    await wait(120);
    const ph = $('ph').getBoundingClientRect(), wd = items[i].querySelector('.wd'), r = wd.getBoundingClientRect(), s = ph.width / 393;
    const fly = document.createElement('div');
    fly.textContent = AREAS[i].word; fly.className = 'abs';
    Object.assign(fly.style, { left: '22px', top: (r.top - ph.top) / s + 'px', fontSize: '40px', lineHeight: '46px', fontWeight: 600, letterSpacing: '-.02em', transformOrigin: '0 0', color: getComputedStyle(wd).color, zIndex: 8 });
    $('ph').appendChild(fly); wd.style.opacity = 0;
    const y0 = (r.top - ph.top) / s, nm = $('nm'); nm.style.opacity = 0;
    setRail(-393 * i); at = i; setName(i);
    await tween(460, q => {
      form(1 - q);
      fly.style.transform = `translateY(${(50 - y0) * q}px) scale(${1 - .62 * q})`;
      fly.style.opacity = q > .7 ? 1 - (q - .7) / .3 : 1; nm.style.opacity = q > .6 ? (q - .6) / .4 : 0;
    });
    fly.remove(); wd.style.opacity = ''; nm.style.opacity = 1;
  }
  document.fonts.ready.then(async () => {
    document.body.dataset.start = '1';
    await wait(1500);
    // 1. A neighbour is a swipe away; the word at the top rolls with it.
    await swipeTo(2); await wait(1300);
    // 2. Pull down: every area, each with what it's holding now.
    await openIndex(300, 392); await wait(700);
    const r = await dragTo(392, 488); await wait(500);
    await land(r); await wait(1400);
    // 3. Tap the word: the same index, then tap an area.
    finger(60, 62); await wait(250); finger(60, 62, false);
    document.querySelector('#ixw .hint').textContent = 'Tap one to open';
    mark(at, at); await tween(380, q => form(q), out); await wait(800);
    finger(120, 96 + 104 + 40); await wait(160); mark(at, 1); await wait(240);
    await land(1); await wait(1600);
    document.body.dataset.done = '1';
  });
}
</script>
</body></html>
