<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Training reorganized</title>
<style>
:root{--ink:20,24,31;--s2:.66;--ctx:#5B3FB8;--tess:#2F5BD0;--push:#D8432A;--pull:#2F5BD0;--legs:#C98A12;--live:#E5482C}
html,body{margin:0;background:#E9E6EE}
body{font-family:'Inter Tight','Inter',sans-serif;padding:28px 30px 30px;width:max-content}
.board{display:flex;gap:36px;margin-bottom:40px}
.cell{width:390px}
.cap{font-weight:700;font-size:15px;letter-spacing:.07em;color:rgba(23,20,31,.66);height:58px;line-height:21px;text-transform:uppercase}
.ph{position:relative;width:390px;height:844px;overflow:hidden;background:#FBFBF8;color:rgb(var(--ink));border-radius:0}
.abs{position:absolute}
.lbl{font-weight:700;font-size:16px;letter-spacing:.08em;white-space:nowrap;text-transform:uppercase}
.s2{color:rgba(var(--ink),var(--s2))}
.s3{color:rgba(var(--ink),.38)}
.b{font-size:21px;line-height:28px}
.ctx{color:var(--ctx)}
.t44{font-size:44px;font-weight:500;letter-spacing:-.035em;line-height:50px;white-space:nowrap}
.t56{font-size:56px;font-weight:500;letter-spacing:-.04em;line-height:58px;white-space:nowrap}
.name{font-size:21px;font-weight:500;line-height:26px;letter-spacing:-.01em}
.d16{font-size:16px;line-height:20px}
.num{font-weight:300;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.hr{position:absolute;height:1px;background:rgba(var(--ink),.12)}
.key{position:absolute;white-space:nowrap}
.key i{display:block;height:6px;margin-top:8px;background:rgb(var(--ink));border-radius:3px 3px 3px 3px/3px 3px 3px 3px}
.tess{position:absolute;right:71px;width:270px;text-align:right;color:var(--tess);font-size:21px;line-height:28px}
.soul{position:absolute;left:323px;top:759px;width:46px;height:40px}
.soul i{position:absolute;width:20px;height:17px;border-radius:52% 48% 60% 40%/55% 45% 55% 45%;filter:blur(1.2px)}
.note{width:1900px;font-weight:600;font-size:15px;letter-spacing:.04em;color:rgba(23,20,31,.7);line-height:22px;text-transform:uppercase}
.names{display:flex;gap:36px}
.opt{width:610px;background:#FBFBF8;padding:34px 36px 38px;box-sizing:border-box;color:rgb(var(--ink))}
.opt h3{margin:0 0 4px;font-size:21px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.opt .why{font-size:21px;line-height:28px;color:rgba(var(--ink),.66);margin-bottom:22px}
.opt .six{border-top:1px solid rgba(var(--ink),.12)}
.opt .six div{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(var(--ink),.12)}
.opt .six b{font-size:28px;font-weight:500;letter-spacing:-.02em}
.opt .six span{font-size:16px;color:rgba(var(--ink),.66)}
.opt .reads{margin-top:20px;font-size:16px;line-height:24px;color:rgba(var(--ink),.66)}
.opt .reads b{color:rgb(var(--ink));font-weight:600}
.pick{display:inline-block;margin-bottom:10px;font-weight:700;font-size:16px;letter-spacing:.08em;color:var(--push)}
</style></head><body>
<div class="board" id="c1"></div>
<div class="board" id="c2"></div>
<div class="board" id="c3"></div>
<div class="board" id="c4"></div>
<script src="muscle-figure.js"></script>
<script>
const $=id=>document.getElementById(id);
// ---- the figure: SVG from Design's path data, left half drawn and mirrored ----
const FIG={front:FRONT,back:BACK};
const TINT={push:'#D8432A',pull:'#2F5BD0',legs:'#C98A12'};
function fig(side,roles,h,tint,opt={}){
  const d=FIG[side],w=h*200/440,dim=opt.dim||{};
  const half=(m)=>`<g transform="${m}">`+
    Object.entries(d.regions).map(([id,p])=>roles[id]?`<path d="${p}" fill="${tint}" fill-opacity="${roles[id]==='p'?1:.7}"/>`:'').join('')+
    d.outline.concat(d.lines).map(p=>`<path d="${p}" fill="none" stroke="rgb(20,24,31)" stroke-opacity="${opt.oa||.24}" stroke-width="${opt.line||1.4}" stroke-linecap="round" stroke-linejoin="round"/>`).join('')+`</g>`;
  return `<svg viewBox="0 0 200 440" width="${w}" height="${h}" style="${opt.style||''}">${half('')}${half('translate(200 0) scale(-1 1)')}</svg>`;
}
// stored muscle -> region id per side
const REG=(m,side)=>({chest:'Chest',frontDelts:'FrontDelts',sideDelts:side==='back'?'RearDelts':'FrontDelts',rearDelts:'RearDelts',triceps:'Triceps',biceps:'Biceps',forearms:'Forearms',lats:'Lats',upperBack:'UpperBack',lowerBack:'LowerBack',abs:'Abs',obliques:'Obliques',glutes:'Glutes',quads:'Quads',hamstrings:'Hamstrings',adductors:'Adductors',abductors:'Abductors',calves:'Calves'})[m];
const hasRegion=(m,side)=>{const r=REG(m,side);return r&&FIG[side].regions[r]};
function rolesFor(ex,side){const o={};(ex.s||[]).forEach(m=>{if(hasRegion(m,side))o[REG(m,side)]='s'});(ex.p||[]).forEach(m=>{if(hasRegion(m,side))o[REG(m,side)]='p'});return o}
function sideFor(ex){const pf=(ex.p||[]).filter(m=>hasRegion(m,'front')&&!['sideDelts'].includes(m)).length,pb=(ex.p||[]).filter(m=>hasRegion(m,'back')&&!['sideDelts','frontDelts'].includes(m)&&REG(m,'back')!=='Calves'&&m!=='forearms').length;return pb>pf?'back':'front'}
function union(list,side){const o={};list.forEach(ex=>{(ex.s||[]).forEach(m=>{if(hasRegion(m,side)&&!o[REG(m,side)])o[REG(m,side)]='s'});});list.forEach(ex=>(ex.p||[]).forEach(m=>{if(hasRegion(m,side))o[REG(m,side)]='p'}));return o}

const PUSH={name:'Bench day',cls:'push',time:'about 55 min',works:'Works chest, shoulders and triceps',tess:'Bench press is ready for 82.5 today.',plan:'Push Pull Legs, rolls on',ex:[
 {n:'Bench press',t:'4 \u00d7 5\u20138',w:'82.5',p:['chest'],s:['triceps','frontDelts']},
 {n:'Overhead press',t:'3 \u00d7 6\u201310',w:'47.5',p:['frontDelts'],s:['triceps','sideDelts']},
 {n:'Incline dumbbell press',t:'3 \u00d7 8\u201312',w:'28',p:['chest','frontDelts'],s:['triceps']},
 {n:'Dumbbell lateral raise',t:'3 \u00d7 12\u201315',w:'10',p:['sideDelts']},
 {n:'Rope pushdown',t:'3 \u00d7 10\u201315',w:'30',p:['triceps']}]};
const PULL={name:'Row day',cls:'pull',time:'about 50 min',works:'Works back, shoulders and biceps',tess:'Barbell row is ready for 70 today.',plan:'Push Pull Legs, rolls on',ex:[
 {n:'Barbell row',t:'4 \u00d7 6\u201310',w:'70',p:['upperBack','lats'],s:['biceps','rearDelts','lowerBack']},
 {n:'Lat pulldown',t:'3 \u00d7 8\u201312',w:'62.5',p:['lats'],s:['biceps','upperBack']},
 {n:'Seated cable row',t:'3 \u00d7 10\u201312',w:'55',p:['upperBack','lats'],s:['biceps','rearDelts']},
 {n:'Face pull',t:'3 \u00d7 12\u201315',w:'27.5',p:['rearDelts'],s:['upperBack']},
 {n:'Dumbbell curl',t:'3 \u00d7 10\u201312',w:'14',p:['biceps'],s:['forearms']}]};
const TC=c=>TINT[c];
const soul=()=>{const P=['#86B4FF','#FF5B3A','#FFC23D'];return `<div class="soul"><i style="left:0;top:8px;background:${P[0]}"></i><i style="left:16px;top:0;background:${P[1]}"></i><i style="left:10px;top:18px;background:${P[2]}"></i></div>`};
const lens=(w,t)=>`M0 6 Q ${(w*.42).toFixed(1)} ${6-t} ${w} 5.6 Q ${(w*.58).toFixed(1)} ${6+t} 0 6 Z`;
const strip=(P,lit=-1,part=0)=>{const total=P.ex.reduce((s,e)=>s+parseInt(e.t),0);let x=24;return `<div class="abs" style="left:0;right:0;top:0;height:3px">${P.ex.map((e,i)=>{const w=(342-4*(P.ex.length-1))*parseInt(e.t)/total;const h=`<div class="abs" style="top:0;height:3px;left:${x}px;width:${w}px;background:rgba(var(--ink),${i<lit?.9:.14})"></div>${i===lit?`<div class="abs" style="top:0;height:3px;left:${x}px;width:${w*part}px;background:var(--live)"></div>`:''}`;x+=w+4;return h}).join('')}</div>`};
const startKey=(txt,y)=>`<div class="key lbl" style="left:24px;top:${y}px">${txt}<i style="width:${txt.length*10.4}px"></i></div>`;
const area=(y=58)=>`<div class="abs" style="left:24px;top:${y}px;font-size:21px;font-weight:600;letter-spacing:-.01em">Training</div>`;
function words(P){return `<div class="abs b ctx" style="left:24px;top:100px">today, ${P.ex.length} exercises, ${P.time}</div>`}

const ex0=PUSH.ex[0];
const INK='#14181F',PAN='#EFEEEA',TNT='216,67,42';
const L1=52,L2=50,S={x:204,y:140},Hh={x:112,y:142};
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
function state(t){const T=4.4,u=(t%T);let h,e;
 if(u<.3){h=0;e=.15}else if(u<1.9){h=ease((u-.3)/1.6);e=.3}else if(u<2.2){h=1;e=.35}else if(u<3.6){h=1-(1-Math.pow(1-(u-2.2)/1.4,2));h=1-(1-Math.pow(1-(u-2.2)/1.4,2));h=Math.pow(1-(u-2.2)/1.4,2);h=1-ease((u-2.2)/1.4)*1;e=1}else{h=0;e=.2}
 return {h,e}}
const cirS=(c,r)=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${r}"/>`;
function capS(a,ra,b,rb){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d;
 const q=[[a.x+nx*ra,a.y+ny*ra],[b.x+nx*rb,b.y+ny*rb],[b.x-nx*rb,b.y-ny*rb],[a.x-nx*ra,a.y-ny*ra]].map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
 return `<polygon points="${q}"/>${cirS(a,ra)}${cirS(b,rb)}`}
function sil(shapes){return `<g fill="${INK}" stroke="${INK}" stroke-width="4.6" stroke-linejoin="round">${shapes}</g><g fill="${PAN}" stroke="none">${shapes}</g>`}
function frame(t){const {h,e}=state(t);
 const wx=204-8*h,wy=(S.y-101)+h*(113-(S.y-101)),W={x:wx,y:wy};
 const dx=W.x-S.x,dy=W.y-S.y,d=Math.hypot(dx,dy),a=(L1*L1-L2*L2+d*d)/(2*d),hh=Math.sqrt(Math.max(L1*L1-a*a,0));
 const P={x:S.x+a*dx/d,y:S.y+a*dy/d};
 const c1={x:P.x+(-dy)/d*hh,y:P.y+(dx)/d*hh},c2={x:P.x-(-dy)/d*hh,y:P.y-(dx)/d*hh};
 const El=c1.x<c2.x?c1:c2;
 const pa=.30+.55*e,sa=.2+.38*e,pt=(A,B,k)=>({x:A.x+(B.x-A.x)*k,y:A.y+(B.y-A.y)*k});
 const hip={x:112,y:143},knee={x:60,y:114},ank={x:46,y:190};
 const legs=sil(capS(hip,15,knee,9.5)+capS(knee,9.5,ank,6)+cirS({x:62,y:134},10)+capS({x:46,y:192},6,{x:70,y:194},5));
 const torso=sil(capS(hip,14,{x:146,y:143},12)+capS({x:146,y:143},12,{x:184,y:141},17.5)+capS({x:184,y:141},17.5,{x:204,y:141},12)+cirS({x:113,y:147},15)+capS({x:206,y:140},9,{x:226,y:138},7)+cirS({x:240,y:137},14.5)+cirS({x:241,y:122},3.4));
 const hand=pt(El,W,1);
 const arm=sil(cirS({x:S.x,y:S.y-2},12)+capS(S,9.8,El,7.6)+capS(El,7.6,W,5.4)+cirS(pt(El,W,.25),8.4));
 const hair=`<path d="M236 123C249 122 257 131 255 143C251 139 247 134 241 132Z" fill="${INK}"/>`;
 const lines=`<g fill="none" stroke="${INK}" stroke-opacity=".38" stroke-width="1.3" stroke-linecap="round"><path d="M176 143C184 149 196 148 204 143"/><path d="M98 136C84 130 74 124 66 118"/><path d="M52 118C56 124 58 128 56 132"/><path d="M236 138C238 140 241 140 243 138"/><path d="M148 138V146"/></g>`;
 const hook=`<rect x="283" y="94" width="14" height="6" rx="2" fill="${PAN}" stroke="${INK}" stroke-width="2"/>`;
 return `<defs><linearGradient id="fl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#EFEEEA"/><stop offset="1" stop-color="#E4E2DC"/></linearGradient></defs><rect x="0" y="10" width="342" height="200" fill="url(#fl)"/>
 <path d="M0 200H342" stroke="${INK}" stroke-opacity=".4" stroke-width="1.5"/><ellipse cx="160" cy="201" rx="100" ry="4" fill="${INK}" fill-opacity=".1"/>
 <rect x="296" y="52" width="9" height="148" rx="2" fill="${PAN}" stroke="${INK}" stroke-width="2.2"/><rect x="284" y="196" width="34" height="5" rx="2" fill="${INK}"/>${hook}
 <rect x="102" y="170" width="7" height="30" fill="${PAN}" stroke="${INK}" stroke-width="2"/><rect x="214" y="170" width="7" height="30" fill="${PAN}" stroke="${INK}" stroke-width="2"/><rect x="92" y="197" width="28" height="4" rx="2" fill="${INK}"/><rect x="204" y="197" width="28" height="4" rx="2" fill="${INK}"/>
 <circle cx="204" cy="${S.y-101}" r="19" fill="none" stroke="${INK}" stroke-opacity=".22" stroke-width="1.4" stroke-dasharray="3 4"/><circle cx="196" cy="113" r="19" fill="none" stroke="${INK}" stroke-opacity=".22" stroke-width="1.4" stroke-dasharray="3 4"/>
 ${legs}${torso}${hair}
 <rect x="84" y="156" width="154" height="15" rx="7" fill="${PAN}" stroke="${INK}" stroke-width="2.2"/><path d="M96 163H226" stroke="${INK}" stroke-opacity=".3" stroke-width="1.2"/>
 <ellipse cx="${S.x-12}" cy="${S.y-6}" rx="21" ry="10" fill="rgb(${TNT})" fill-opacity="${pa}"/>
 ${lines}
 <circle cx="${W.x-3}" cy="${W.y-2}" r="19" fill="${INK}" fill-opacity=".35"/>
 ${arm}
 <path d="M${S.x} ${S.y}L${El.x} ${El.y}" stroke="rgb(${TNT})" stroke-opacity="${sa}" stroke-width="9" stroke-linecap="round"/>
 <circle cx="${S.x}" cy="${S.y-2}" r="9" fill="rgb(${TNT})" fill-opacity="${sa}"/>
 <circle cx="${W.x}" cy="${W.y}" r="19.5" fill="${INK}"/><circle cx="${W.x}" cy="${W.y}" r="13.5" fill="none" stroke="${PAN}" stroke-opacity=".5" stroke-width="1.4"/><circle cx="${W.x}" cy="${W.y}" r="6" fill="${PAN}"/><circle cx="${W.x}" cy="${W.y}" r="2.4" fill="${INK}"/>
 <circle cx="${W.x}" cy="${W.y+1}" r="6.8" fill="${PAN}" stroke="${INK}" stroke-width="2.2"/>`}
function kit(){return `<svg width="342" height="56" viewBox="0 0 342 56" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"><path d="M6 24H150M48 6V42M56 12V36M64 18V30M108 6V42M100 12V36M92 18V30"/><rect x="186" y="14" width="136" height="11" rx="5"/><path d="M206 25V50M302 25V50M196 50H216M292 50H312"/></svg>`}
function press2(){const tint=TC('push'),e=ex0;
 return `<div class="ph"><div class="abs" style="inset:0;filter:blur(7px);transform:scale(.94);transform-origin:50% 40%;opacity:.85"><div class="abs" style="left:24px;top:58px;font-size:21px;font-weight:600">Training</div><div class="abs t44" style="left:24px;top:136px">Bench day</div>${PUSH.ex.map((x,i)=>`<div class="abs name" style="left:100px;top:${280+i*72}px">${x.name||''}</div>`).join('')}</div>
 <div class="abs" style="left:0;right:0;top:0;height:690px;background:rgba(251,251,248,.88);backdrop-filter:blur(16px);border-radius:0 0 40px 40px;box-shadow:0 10px 40px rgba(20,24,31,.18)">
  <div class="abs t44" style="left:24px;top:84px">Bench press</div>
  <div class="abs b ctx" style="left:24px;top:140px">barbell, flat bench</div>
  <div class="abs" style="left:24px;top:182px;width:342px;height:200px;overflow:hidden"><svg id="an" width="342" height="200" viewBox="0 10 342 200"></svg></div>
  <div class="abs lbl s2" style="left:24px;top:390px;font-size:13px">side view, loops</div>
  <div class="abs" style="left:24px;top:418px;width:262px"><div class="b s2" style="font-size:21px">Shoulder blades pinned, bar to lower chest, press back up.</div></div>
  <div class="abs" style="left:306px;top:414px">${fig('front',rolesFor(e,'front'),88,tint,{line:2.2,oa:.45})}</div>
  <div class="abs b ctx" style="left:24px;top:510px;width:340px;font-size:18px;line-height:24px">chest, with triceps and front shoulders</div>
  <div class="abs" style="left:24px;top:546px">${kit()}</div>
  <div class="abs d16 s2" style="left:24px;top:608px">About 6 kcal a set at your weight. An estimate.</div>
  <div class="abs lbl" style="left:24px;top:648px;font-size:15px">Open exercise<span style="margin-left:26px" class="s2">Swap</span><span style="margin-left:26px" class="s2">Close</span></div>
 </div>${soul()}</div>`}
document.body.style.padding='0';document.body.style.zoom=(window.ZOOM||1);
$('c1').innerHTML=press2();['c2','c3','c4'].forEach(i=>$(i).remove());
const an=document.getElementById('an');
if(window.FREEZE!==undefined){an.innerHTML=frame(window.FREEZE)}else{const t0=performance.now();(function loop(){an.innerHTML=frame((performance.now()-t0)/1000);requestAnimationFrame(loop)})()}
</script></body></html>
