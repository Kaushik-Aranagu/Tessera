<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Machined Workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&family=Fraunces:ital,opsz,wght,SOFT@1,9..144,300..800,0..100&display=swap" rel="stylesheet">
<style>
body{margin:0}
.mw a{color:#ECE9E3;text-decoration:none}
.mw *::-webkit-scrollbar{display:none}
.lbl{font-family:'Martian Mono',monospace;font-stretch:85%;font-size:16px;letter-spacing:.04em;color:#8B877F}
.num{font-family:'Martian Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-0.04em}
/* anodised graphite: raised parts catch light on the top chamfer, recesses take it on the bottom lip */
.raised{background:#25262A;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(0,0,0,.55),0 0 0 .5px rgba(0,0,0,.9)}
.recess{background:#131416;box-shadow:inset 0 1px 2px rgba(0,0,0,.7),inset 0 -1px 0 rgba(255,255,255,.07),0 0 0 .5px rgba(0,0,0,.9)}
.seam{height:1px;background:linear-gradient(rgba(0,0,0,.75) 50%,rgba(255,255,255,.07) 50%)}
@keyframes procGlint{0%{background-position:180% 0}30%,100%{background-position:-80% 0}}
@keyframes seat{0%{transform:translateY(118px);opacity:.0}55%{transform:translateY(-2px);opacity:1}70%{transform:translateY(1px)}100%{transform:none}}
@keyframes bleed{0%,45%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes sweep{0%{background-position:160% 0;opacity:1}70%{opacity:1}100%{background-position:-60% 0;opacity:0}}
@keyframes prIn{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
@keyframes restIn{0%{opacity:0;filter:blur(4px)}100%{opacity:1;filter:blur(0)}}
@keyframes inR{0%{opacity:0;transform:translateX(16px)}100%{opacity:1;transform:none}}
/* soul on a dark ground: screen blend instead of multiply */
.d{position:absolute;width:64px;height:58px;margin:-29px 0 0 -32px;border-radius:52% 48% 60% 40% / 55% 45% 55% 45%;mix-blend-mode:screen;filter:blur(1.5px)}
.r{background:#D9563F;--x:-13px;--y:-7px;--mx:18px;--my:-10px}
.b{background:#3F7FC0;--x:13px;--y:-7px;--mx:-16px;--my:-12px;border-radius:45% 55% 40% 60% / 50% 60% 40% 50%}
.y{background:#E8BD4C;--x:0px;--y:12px;--mx:0px;--my:18px;border-radius:60% 40% 55% 45% / 45% 55% 45% 55%}
@keyframes idle{0%,100%{transform:translate(var(--x),var(--y)) scale(.8)}50%{transform:translate(calc(var(--x)*1.18),calc(var(--y)*1.18)) scale(.88)}}
@keyframes merge{0%{transform:translate(var(--x),var(--y)) scale(.8)}30%{transform:translate(0,0) scale(.85)}42%{transform:translate(0,0) scale(1.15)}55%,70%{transform:translate(0,0) scale(.95)}100%{transform:translate(var(--x),var(--y)) scale(.8)}}
@keyframes bloom{0%,100%{transform:translate(0,0) scale(.55);filter:blur(2px)}40%{transform:translate(var(--mx),var(--my)) scale(1.15);filter:blur(6px)}70%{transform:translate(0,0) scale(.9);filter:blur(3px)}}
@keyframes splash{0%,30%{transform:scale(.4);opacity:0}38%{transform:scale(.6);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
</style>
</helmet>
<div class="mw" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, rgba(0,0,0,.03) 1px 2px), #1B1C1E; color: #ECE9E3; font-family: 'Schibsted Grotesk', system-ui, sans-serif">

  <!-- a running process: a lit seam along the top edge, not a pill -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, #C8452F 0%, #C8452F 40%, #FFE2A8 50%, #C8452F 60%, #C8452F 100%); background-size: 300% 100%; animation: procGlint 4.5s ease-in-out infinite; box-shadow: 0 0 12px rgba(200,69,47,.5)"></div>

  <div style="position: absolute; left: 20px; right: 20px; top: 54px; display: flex; justify-content: space-between">
    <span class="lbl" style="color: #ECE9E3">PUSH DAY A · {{elapsed}}</span>
    <span class="lbl">{{exCount}}</span>
  </div>

  <!-- x: exercises in a bounded lane, the next one peeks -->
  <div id="mwEx" onScroll="{{onEx}}" style="position: absolute; left: 20px; right: 0; top: 82px; height: 56px; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none">
    <sc-for list="{{exs}}" as="e" hint-placeholder-count="5">
      <a href="{{e.href}}" style="flex: none; width: 322px; scroll-snap-align: start; font-weight: 850; font-size: 40px; letter-spacing: -0.04em; line-height: 1.25; white-space: nowrap; color: {{e.fg}}; transition: color 200ms">{{e.n}}</a>
    </sc-for>
    <span style="flex: none; width: 30px"></span>
  </div>
  <div style="position: absolute; left: 20px; top: 142px; display: flex; gap: 9px; align-items: flex-start; height: 12px">
    <sc-for list="{{exTicks}}" as="t" hint-placeholder-count="5">
      <span style="width: 2px; height: {{t.h}}; background: {{t.c}}; transition: height 200ms, background 200ms"></span>
    </sc-for>
  </div>

  <!-- y: sets. Done above, current at eye level, remaining below -->
  <div class="seam" style="position: absolute; left: 0; right: 0; top: 168px"></div>
  <div style="position: absolute; left: 20px; right: 20px; top: 172px; height: 92px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
    <sc-for list="{{done}}" as="s" hint-placeholder-count="2">
      <div style="position: relative; display: grid; grid-template-columns: 70px 1fr auto; align-items: center; height: 46px; animation: {{s.anim}}">
        <span class="lbl">SET {{s.i}}</span>
        <span class="num" style="font-size: 21px; font-weight: 600">{{s.w}} × {{s.r}}</span>
        <span class="lbl" style="color: {{s.ec}}">{{s.e}}</span>
        <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: {{s.paint}}; transform-origin: 0 50%; animation: {{s.bleed}}; opacity: .9"></span>
      </div>
    </sc-for>
  </div>

  <!-- current set: one milled block -->
  <div class="raised" style="position: absolute; left: 12px; right: 12px; top: 272px; height: 316px; border-radius: 22px; overflow: hidden">
    <span style="position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent 0%, transparent 40%, #FFE9B8 50%, transparent 60%, transparent 100%); background-size: 300% 100%; opacity: 0; animation: {{prSweep}}"></span>

    <div style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; justify-content: space-between">
      <span class="lbl" style="color: {{headColor}}">{{head}}</span>
      <span class="lbl">{{target}}</span>
    </div>

    <sc-if value="{{isSet}}" hint-placeholder-val="{{true}}">
      <div>
        <div style="position: absolute; left: 16px; top: 48px; display: flex; align-items: baseline; gap: 6px">
          <span class="num" style="font-size: 64px; font-weight: 600; line-height: 1">{{weight}}</span>
          <span style="font-size: 21px; font-weight: 600; color: #8B877F">kg</span>
        </div>
        <!-- live plate maths, one side of the bar -->
        <div style="position: absolute; left: 16px; top: 128px; height: 66px; display: flex; align-items: center; gap: 2px">
          <span style="width: 34px; height: 6px; background: #6B6862; border-radius: 1px"></span>
          <span style="width: 6px; height: 22px; background: #6B6862; border-radius: 1px"></span>
          <sc-for list="{{plates}}" as="p" hint-placeholder-count="3">
            <span style="width: 9px; height: {{p.h}}; background: {{p.c}}; border-radius: 2px; box-shadow: inset 1px 0 0 rgba(255,255,255,.25), inset -1px 0 0 rgba(0,0,0,.35)"></span>
          </sc-for>
          <span class="lbl" style="margin-left: 10px">{{plateText}}</span>
        </div>
        <!-- reps: a vertical drum, opposite axis to the dial -->
        <div class="recess" style="position: absolute; right: 16px; top: 48px; width: 82px; height: 146px; border-radius: 10px; overflow: hidden">
          <div id="mwReps" onScroll="{{onReps}}" style="position: absolute; inset: 0; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; padding: 51px 0; box-sizing: border-box">
            <sc-for list="{{repList}}" as="r" hint-placeholder-count="31">
              <div class="num" style="height: 44px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; font-size: {{r.fs}}; font-weight: 600; color: {{r.c}}">{{r.n}}</div>
            </sc-for>
          </div>
          <span style="position: absolute; left: 6px; right: 6px; top: 51px; height: 44px; border-radius: 6px; pointer-events: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.5), 0 0 0 .5px rgba(0,0,0,.8); background: rgba(255,255,255,.04)"></span>
          <span style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(#131416 0%, rgba(19,20,22,0) 32%, rgba(19,20,22,0) 68%, #131416 100%)"></span>
        </div>
        <div class="lbl" style="position: absolute; right: 16px; top: 200px; width: 82px; text-align: center">{{ghost}}</div>
      </div>
    </sc-if>

    <sc-if value="{{isRest}}" hint-placeholder-val="{{false}}">
      <div style="animation: restIn 300ms ease-out both">
        <div style="position: absolute; left: 16px; top: 48px; display: flex; align-items: baseline; gap: 10px">
          <span class="num" style="font-size: 64px; font-weight: 600; line-height: 1; color: #E8BD4C">{{restText}}</span>
          <span style="font-size: 21px; font-weight: 600; color: #8B877F">rest</span>
        </div>
        <div style="position: absolute; left: 16px; right: 16px; top: 132px; font-family: 'Fraunces', serif; font-style: italic; font-size: 21px; line-height: 1.35; color: #9DBFE6; font-variation-settings: 'SOFT' 100">{{restNote}}</div>
      </div>
    </sc-if>

    <!-- the precision dial: weight, and during rest the same part counts down -->
    <div class="recess" style="position: absolute; left: 10px; right: 10px; top: 222px; height: 84px; border-radius: 12px; overflow: hidden">
      <div id="mwDial" onScroll="{{onDial}}" style="position: absolute; inset: 0; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; pointer-events: {{dialPE}}">
        <div style="display: flex; align-items: flex-start; padding: 0 {{dialPad}}; width: max-content; height: 100%">
          <sc-for list="{{ticks}}" as="t" hint-placeholder-count="65">
            <div style="flex: none; width: 14px; height: 100%; position: relative; scroll-snap-align: center">
              <span style="position: absolute; left: 6px; top: 0; width: {{t.w}}; height: {{t.h}}; background: {{t.c}}"></span>
              <span class="lbl" style="position: absolute; left: 7px; top: 50px; transform: translateX(-50%); color: #8B877F; white-space: nowrap">{{t.lab}}</span>
            </div>
          </sc-for>
        </div>
      </div>
      <!-- rest: the dial's track fills and drains -->
      <span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{restFill}}; background: rgba(232,189,76,.16); border-right: 2px solid #E8BD4C; transition: width 1s linear; pointer-events: none"></span>
      <span style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, #131416 0%, rgba(19,20,22,0) 22%, rgba(19,20,22,0) 78%, #131416 100%)"></span>
      <span style="position: absolute; left: 50%; top: 0; width: 2px; height: 44px; margin-left: -1px; background: #D9563F; box-shadow: 0 0 8px rgba(217,86,63,.6); pointer-events: none; opacity: {{needleOp}}"></span>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 600px; display: grid; grid-template-columns: 70px 1fr; align-items: center; height: 40px; color: #5F5C57">
    <span class="lbl" style="color: #5F5C57">{{nextLabel}}</span>
    <span class="num" style="font-size: 21px; font-weight: 600">{{nextText}}</span>
  </div>

  <!-- hold to log: a raised key with a recessed channel -->
  <div onPointerDown="{{holdStart}}" onPointerUp="{{holdEnd}}" onPointerLeave="{{holdEnd}}" class="raised" style="position: absolute; left: 12px; right: 12px; top: 654px; height: 76px; border-radius: 16px; cursor: pointer; user-select: none; touch-action: none">
    <div class="recess" style="position: absolute; left: 8px; right: 8px; top: 8px; bottom: 8px; border-radius: 8px; overflow: hidden">
      <span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{fill}}; background: linear-gradient(90deg, #C8452F, #E07A3F); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); transition: {{fillT}}"></span>
      <span style="position: relative; display: flex; height: 100%; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 21px; font-weight: 700"><span>{{keyText}}</span><span class="lbl" style="color: #ECE9E3">{{keyMeta}}</span></span>
    </div>
  </div>

  <!-- Tess in a flush glass lens -->
  <div style="position: absolute; left: 12px; right: 12px; top: 752px; height: 70px; border-radius: 18px; background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03)); backdrop-filter: blur(18px) saturate(1.4); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(0,0,0,.5), 0 0 0 .5px rgba(0,0,0,.9); display: flex; align-items: center; padding-left: 78px; padding-right: 14px">
    <span style="font-family: 'Fraunces', serif; font-style: italic; font-size: 21px; line-height: 1.2; color: #C9D9EE; font-variation-settings: 'SOFT' 100">{{tess}}</span>
  </div>
  <div style="position: absolute; left: 52px; top: 787px; width: 0; height: 0; transform: scale(.6)">
    <span style="position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 3px solid #E8BD4C; opacity: 0; animation: {{splash}}"></span>
    <span class="d r" style="animation: {{ar}}"></span>
    <span class="d b" style="animation: {{ab}}"></span>
    <span class="d y" style="animation: {{ay}}"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const ex = [
      { n: 'Bench press', sets: 4, tw: 82.5, tr: 8, best: 104.5, done: [[80, 8], [82.5, 8]], w: 82.5, r: 8, href: 'BenchObject.dc.html' },
      { n: 'Incline DB press', sets: 3, tw: 30, tr: 10, best: 41, done: [], w: 30, r: 10, href: 'BenchObject.dc.html' },
      { n: 'Overhead press', sets: 3, tw: 50, tr: 6, best: 60, done: [], w: 50, r: 6, href: 'BenchObject.dc.html' },
      { n: 'Cable fly', sets: 3, tw: 15, tr: 12, best: 22, done: [], w: 15, r: 12, href: 'BenchObject.dc.html' },
      { n: 'Dips', sets: 3, tw: 0, tr: 12, best: 0, done: [], w: 0, r: 12, href: 'BenchObject.dc.html' }
    ];
    this.state = { ex, cur: 0, phase: 'set', holding: false, rest: 0, restMax: 150, soul: 'idle', pr: false, justLogged: false, elapsed: 768, prVal: 0 };
    this.timer = null; this.hold = null;
    setTimeout(() => this.syncInputs(), 60);
    this.clock = setInterval(() => this.setState({ elapsed: this.state.elapsed + 1 }), 1000);
  }
  syncInputs() {
    const e = this.state.ex[this.state.cur];
    const d = document.getElementById('mwDial'); if (d) d.scrollLeft = Math.round(e.w / 2.5) * 14;
    const r = document.getElementById('mwReps'); if (r) r.scrollTop = e.r * 44;
  }
  patchEx(fn) { const ex = this.state.ex.map((e, i) => i === this.state.cur ? fn({ ...e }) : e); this.setState({ ex }); }
  renderVals() {
    const s = this.state, e = s.ex[s.cur];
    const fmt = (sec) => Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    const e1 = (w, r) => w * (1 + r / 30);
    const paints = ['#D9563F', '#3F7FC0', '#E8BD4C', '#D9563F'];
    const done = e.done.slice(-2).map((d, j, arr) => {
      const i = e.done.length - arr.length + j + 1;
      const last = j === arr.length - 1 && s.justLogged;
      const v = e1(d[0], d[1]);
      return { i, w: d[0], r: d[1], e: 'e1RM ' + v.toFixed(1), ec: v > e.best - 0.01 && d[2] ? '#E8BD4C' : '#8B877F', paint: paints[(i - 1) % 4],
        anim: last ? 'seat 620ms cubic-bezier(.3,.9,.3,1) both' : 'none', bleed: last ? 'bleed 900ms cubic-bezier(.3,.7,.2,1) both' : 'none' };
    });
    const setNo = Math.min(e.done.length + 1, e.sets);
    const finished = e.done.length >= e.sets;
    const perSide = Math.max(0, (e.w - 20) / 2);
    const plates = []; let rem = perSide;
    [[25, 64, '#C8452F'], [20, 64, '#3F7FC0'], [15, 56, '#E8BD4C'], [10, 46, '#5E8C61'], [5, 36, '#D9D6CF'], [2.5, 28, '#55534F'], [1.25, 22, '#A8A49C']].forEach(([kg, h, c]) => { while (rem >= kg - 1e-9) { plates.push({ h: h + 'px', c }); rem -= kg; } });
    const ticks = Array.from({ length: 65 }, (_, i) => {
      const major = i % 4 === 0;
      return { w: major ? '2px' : '1px', h: major ? '34px' : (i % 2 === 0 ? '22px' : '14px'), c: major ? '#ECE9E3' : 'rgba(236,233,227,.35)', lab: major ? String(i * 2.5) : '' };
    });
    const repList = Array.from({ length: 31 }, (_, n) => ({ n, fs: n === e.r ? '34px' : '21px', c: n === e.r ? '#ECE9E3' : '#5F5C57' }));
    const exTicks = s.ex.map((_, i) => ({ h: i === s.cur ? '12px' : '6px', c: i === s.cur ? '#ECE9E3' : 'rgba(236,233,227,.25)' }));
    const exs = s.ex.map((x, i) => ({ n: x.n, href: x.href, fg: i === s.cur ? '#ECE9E3' : '#4A4844' }));
    const curE1 = e1(e.w, e.r);
    const willPR = e.best > 0 && curE1 > e.best + 0.01;
    const SA = {
      idle: ['idle 6s ease-in-out infinite', 'idle 6s ease-in-out -2s infinite', 'idle 6s ease-in-out -4s infinite'],
      done: ['merge 1.6s cubic-bezier(.4,0,.2,1) 1 both', 'merge 1.6s cubic-bezier(.4,0,.2,1) 1 both', 'merge 1.6s cubic-bezier(.4,0,.2,1) 1 both'],
      pr: ['bloom 1.2s ease-in-out 2', 'bloom 1.2s ease-in-out -.4s 2', 'bloom 1.2s ease-in-out -.8s 2']
    }[s.soul];
    const isRest = s.phase === 'rest';
    let tess = willPR ? 'That would be a new best. e1RM ' + curE1.toFixed(1) + '.' : 'Last time 80 × 8 moved fast. Try 82.5.';
    if (isRest) tess = s.pr ? 'New best: e1RM ' + s.prVal.toFixed(1) + '. Breathe.' : 'Seated. Next set when the dial empties.';
    if (finished && !isRest) tess = 'Bench done. Swipe for incline.';
    const nextSet = setNo + 1 <= e.sets && !finished;
    return {
      elapsed: fmt(s.elapsed) + ' ELAPSED', exCount: (s.cur + 1) + ' OF ' + s.ex.length,
      exs, exTicks, done,
      head: isRest ? 'REST · THE DIAL COUNTS DOWN' : finished ? 'ALL SETS SEATED' : (willPR ? 'SET ' + setNo + ' · NEW BEST IF YOU HIT IT' : 'SET ' + setNo + ' OF ' + e.sets),
      headColor: willPR && !isRest ? '#E8BD4C' : '#8B877F',
      target: isRest ? '' : 'TARGET ' + e.tr + ' @ ' + e.tw,
      isSet: !isRest, isRest,
      weight: e.w.toFixed(e.w % 1 ? 1 : 0), plates, plateText: perSide > 0 ? perSide + ' KG / SIDE' : 'BAR ONLY',
      repList, ghost: 'LAST ' + e.tr,
      ticks, dialPad: '161px', dialPE: isRest ? 'none' : 'auto', needleOp: isRest ? 0.25 : 1,
      restText: fmt(s.rest), restFill: isRest ? ((s.rest / s.restMax) * 100).toFixed(1) + '%' : '0%',
      restNote: s.pr ? 'Light caught the edge: e1RM ' + s.prVal.toFixed(1) + ', a new best.' : 'Rest lives in the dial. When it empties, it turns back into weight.',
      prSweep: s.pr && isRest ? 'sweep 1.8s ease-out 2' : 'none',
      nextLabel: nextSet ? 'SET ' + (setNo + 1) : '',
      nextText: nextSet ? e.tr + ' @ ' + e.tw : '',
      fill: s.holding ? '100%' : '0%', fillT: s.holding ? 'width 800ms linear' : 'width 200ms ease-out',
      keyText: isRest ? 'Skip rest' : finished ? 'Next exercise →' : (s.holding ? 'Keep holding…' : 'Hold to log set ' + setNo),
      keyMeta: isRest ? 'TAP' : finished ? 'SWIPE' : e.w + ' × ' + e.r,
      tess, ar: SA[0], ab: SA[1], ay: SA[2], splash: s.soul === 'done' || s.soul === 'pr' ? 'splash 1.6s ease-out 1' : 'none',
      onEx: (ev) => { const x = ev && ev.target ? ev.target.scrollLeft : 0; const i = Math.max(0, Math.min(s.ex.length - 1, Math.round(x / 322))); if (i !== this.state.cur) { this.setState({ cur: i, justLogged: false }); setTimeout(() => this.syncInputs(), 30); } },
      onDial: (ev) => { if (this.state.phase !== 'set') return; const x = ev && ev.target ? ev.target.scrollLeft : 0; const w = Math.max(0, Math.min(160, Math.round(x / 14) * 2.5)); if (w !== this.state.ex[this.state.cur].w) this.patchEx((o) => { o.w = w; return o; }); },
      onReps: (ev) => { const y = ev && ev.target ? ev.target.scrollTop : 0; const r = Math.max(0, Math.min(30, Math.round(y / 44))); if (r !== this.state.ex[this.state.cur].r) this.patchEx((o) => { o.r = r; return o; }); },
      holdStart: () => {
        const st = this.state, ce = st.ex[st.cur];
        if (st.phase === 'rest') { clearInterval(this.timer); this.setState({ phase: 'set', rest: 0, pr: false, soul: 'idle' }); setTimeout(() => this.syncInputs(), 30); return; }
        if (ce.done.length >= ce.sets) { const n = Math.min(st.ex.length - 1, st.cur + 1); const el = document.getElementById('mwEx'); if (el) el.scrollTo({ left: n * 322, behavior: 'smooth' }); return; }
        this.setState({ holding: true });
        clearTimeout(this.hold);
        this.hold = setTimeout(() => {
          const c = this.state.ex[this.state.cur];
          const v = c.w * (1 + c.r / 30);
          const pr = c.best > 0 && v > c.best + 0.01;
          this.patchEx((o) => { o.done = [...o.done, [o.w, o.r, pr]]; if (pr) o.best = v; return o; });
          this.setState({ holding: false, justLogged: true, soul: pr ? 'pr' : 'done', pr, prVal: v, phase: 'rest', rest: this.state.restMax });
          setTimeout(() => this.setState({ soul: 'idle' }), 2600);
          clearInterval(this.timer);
          this.timer = setInterval(() => {
            const left = this.state.rest - 1;
            if (left <= 0) { clearInterval(this.timer); this.setState({ rest: 0, phase: 'set', pr: false }); setTimeout(() => this.syncInputs(), 30); }
            else this.setState({ rest: left });
          }, 1000);
        }, 800);
      },
      holdEnd: () => { clearTimeout(this.hold); if (this.state.holding) this.setState({ holding: false }); }
    };
  }
}
</script>
