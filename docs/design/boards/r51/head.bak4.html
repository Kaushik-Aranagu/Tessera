<title>Lists page</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&family=Newsreader:ital,wght@0,400;1,400&family=Outfit:wght@200;300&display=swap">
<style>
:root{
  --ground:#EFECE6;--phone:#F7F5F1;--ink:#1D1B19;--ink2:#5E5A55;--ink3:#8E8982;--edge:#DDD8D0;
  --acc:#5E6B1F;--sec:#34506F;--warm:#9A2541;
  --words:"Figtree",-apple-system,system-ui,sans-serif;--nums:"Outfit","Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0E0E10;--phone:#000000;--ink:#F1EEE9;--ink2:#ABA6A0;--ink3:#78736D;--edge:#2A2A2E;--acc:#B5BE7A;--sec:#A7BCD6;--warm:#EE8E9C;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#0E0E10;--phone:#000000;--ink:#F1EEE9;--ink2:#ABA6A0;--ink3:#78736D;--edge:#2A2A2E;--acc:#B5BE7A;--sec:#A7BCD6;--warm:#EE8E9C;color-scheme:dark}
body{background:var(--ground);color:var(--ink);font-family:var(--words);font-size:17px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 72px}
.head,.sec{max-width:1120px;margin:0 auto 40px;display:flex;flex-direction:column;gap:12px}
.lab{color:var(--ink3);font-size:16px;margin:0}
h1{font-weight:500;font-size:clamp(36px,6.5vw,60px);letter-spacing:-.03em;line-height:1;margin:0;text-wrap:balance}
h2{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0}
.sub{color:var(--ink2);font-size:19px;margin:0;max-width:66ch}
.row{display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start}
.notes{flex:1 1 340px;min-width:0;max-width:540px;display:flex;flex-direction:column;gap:12px}
.notes p{margin:0}
.flow{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:16px;color:var(--ink3)}
.flow b{color:var(--ink);font-weight:600}
.try{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:16px}
.try span:nth-child(odd){color:var(--ink3);font-family:var(--nums)}
.tr{all:unset;cursor:pointer;color:var(--ink2);font-size:17px}.tr:hover{color:var(--ink)}
.tap{all:unset;cursor:pointer}
.tr:focus-visible,.tap:focus-visible,.act:focus-visible{outline:2px solid var(--ink3);outline-offset:3px}
.phone{position:relative;width:350px;max-width:100%;height:720px;background:var(--phone);border:1px solid var(--edge);border-radius:44px;overflow:hidden;box-sizing:border-box;flex:none;user-select:none;-webkit-user-select:none}
.scr{position:absolute;inset:0}
.z{position:absolute;left:24px;right:24px}
.n{font-family:var(--nums);font-weight:300}
.big{font-family:var(--nums);font-weight:200;line-height:.86;letter-spacing:-.02em}
.brief{text-align:right;font-size:19px;line-height:25px;height:50px;overflow:hidden}
.l{height:26px;line-height:26px;font-size:15px;white-space:nowrap;overflow:hidden;color:var(--ink2);display:flex;justify-content:space-between;gap:10px}
.act{all:unset;cursor:pointer;font-size:19px;font-weight:600}
.tess{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFA90F,#FF5A26 55%,#E5341C)}
.ft{bottom:24px;height:40px;display:flex;justify-content:space-between;align-items:center}
.u{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.sc2{position:absolute;inset:0;background:var(--phone);z-index:4}
.fl{height:44px;display:flex;justify-content:space-between;align-items:center;font-size:17px;white-space:nowrap;border:0}
.fl .k{color:var(--ink2)}
.fl .v{all:unset;cursor:pointer;color:var(--kitT);font-weight:600;display:inline-block;overflow:hidden;height:26px;line-height:26px;text-align:right}
.hd{height:44px;display:flex;align-items:flex-end;padding-bottom:6px;box-sizing:border-box;font-size:13px;font-weight:600;color:var(--kitT);letter-spacing:.02em}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
/* the glass lens over a horizontal swipe (his 10:33 PM, a saved pattern): clear, no frost, a bright rim and a soft
   inner light; the text under it swells. Reduce Transparency draws it as a 1 pt rim only. */
#lens{position:absolute;right:-14px;top:50%;height:34px;border-radius:17px;pointer-events:none;opacity:0;transform:translateY(-50%) scale(.9);transform-origin:right center;
  transition:transform .16s cubic-bezier(.2,.8,.2,1),width .16s cubic-bezier(.2,.8,.2,1);
  -webkit-backdrop-filter:saturate(1.5) brightness(1.03);backdrop-filter:saturate(1.5) brightness(1.03);background:transparent;
  box-shadow:inset 0 .5px 0 color-mix(in srgb,#fff 80%,transparent),inset 0 0 0 .5px color-mix(in srgb,var(--ink) 12%,transparent)}
@media (prefers-reduced-transparency:reduce){#lens{backdrop-filter:none;-webkit-backdrop-filter:none;background:none;box-shadow:inset 0 0 0 1px var(--ink3)}}
</style>
