<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#E9E6EE}
body{font-family:'Inter Tight','Inter',sans-serif;color:#14181F;padding:24px;width:1560px;box-sizing:border-box}
.row{display:flex;gap:28px;align-items:flex-start}
.ph{width:390px;height:560px;background:#FBFBF8;position:relative;padding:26px 24px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(4,270px);gap:14px}
.c{background:#FBFBF8;width:270px;height:268px;padding:16px 18px;box-sizing:border-box}
.l{font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.d{font-size:17px;line-height:22px;color:rgba(20,24,31,.66);margin-top:4px;height:46px}
.big{font-size:21px;font-weight:600}
.sub{font-size:16px;color:rgba(20,24,31,.66)}
.hr{height:1px;background:rgba(20,24,31,.12);margin:10px 0}
svg{display:block}
</style></head><body><div class="row"><div class="ph" id="ph"></div><div class="grid" id="g"></div></div><script>
const INK='#14181F',PAL='216,67,42',LIVE='229,72,44',T=4.4;
const clamp=x=>Math.max(0,Math.min(1,x));
const back=p=>{p=clamp(p);const c=2;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const ease=p=>{p=clamp(p);return 1-Math.pow(1-p,3)};
const tn=w=>.45+Math.min(1,Math.max(0,(w-60)/45))*.5;
// one dot: x,y,radius, fill 0..1, ring 0..1 (hairline ring), scale
const mix=(a,b,m)=>a.split(',').map((v,i)=>Math.round(+v+(+b.split(',')[i]-v)*m)).join(',');
function dot(x,y,r,f,ring,sc=1,warm=0,col=PAL){const R=(r*sc).toFixed(2);const c=mix('20,24,31',col,clamp(warm));return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${R}" fill="rgba(${c},${f.toFixed(2)})" stroke="${INK}" stroke-opacity="${ring.toFixed(2)}" stroke-width="1.4"/>`}
// slot position: n slots in two rows, filled column by column
const slot=(i,n,sp,ox,oy)=>{const cols=Math.ceil(n/2);return [ox+Math.floor(i/2)*sp,oy+(i%2)*sp]};
const svg=(w,h,b)=>`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${b}</svg>`;
// cases: each returns svg for local time u, at 2x scale (sp 30, r 11)
const SP=30,R0=11,OX=34,OY=58;
const cases=[
['Planned','Hollow dots wait at the planned size. They breathe, nothing else.',u=>{let o='';for(let i=0;i<8;i++){const [x,y]=slot(i,8,SP,OX,OY);o+=dot(x,y,R0,0,.35+.12*Math.sin(u*1.8+i*.5))}return o}],
['Logging','Each rep lands as a dot that pops in warm and cools to ink. One dot per rep.',u=>{let o='';for(let i=0;i<8;i++){const [x,y]=slot(i,8,SP,OX,OY),q=back((u-.3-i*.33)/.4);o+=q>0?dot(x,y,R0,.9,.8,Math.max(q,.05),1-ease((u-.3-i*.33-.2)/.8)):dot(x,y,R0,0,.3)}return o}],
['On target','All dots in: one soft settle together and the ink line draws under. Done.',u=>{let o='';const s=u>3.2?1-.12*Math.sin(clamp((u-3.2)/.5)*Math.PI):1;for(let i=0;i<8;i++){const [x,y]=slot(i,8,SP,OX,OY);o+=dot(x,y,R0,.9,.8,s,.9*(1-ease((u-1.6)/.8))*(u<3.2?1:0)+(u>3.2?.5*Math.sin(clamp((u-3.2)/.5)*Math.PI):0))}const w=ease((u-3.4)/.6)*(3*SP+2*R0);o+=`<rect x="${OX-R0}" y="${OY+SP+R0+8}" width="${w.toFixed(1)}" height="3" rx="1.5" fill="${INK}"/>`;return o}],
['Short','Fewer reps than planned: the dots that did not happen stay as quiet rings and fade.',u=>{let o='';for(let i=0;i<8;i++){const [x,y]=slot(i,8,SP,OX,OY);if(i<6){const q=back((u-.2-i*.22)/.4);o+=dot(x,y,R0,.9,.8,Math.max(q,.05),1-ease((u-.2-i*.22-.2)/.8))}else{o+=dot(x,y,R0,0,Math.max(.12,.4-.08*clamp((u-1.8)/1.5)*3))}}return o}],
['One extra','A rep past the plan is a bonus dot that springs out in the live colour.',u=>{let o='';for(let i=0;i<8;i++){const [x,y]=slot(i,8,SP,OX,OY);o+=dot(x,y,R0,.9,.8)}const q=back((u-1.4)/.5);if(q>0){o+=`<circle cx="${OX+4*SP}" cy="${OY}" r="${(R0+7+4*(1-clamp((u-1.4)/.9))).toFixed(1)}" fill="none" stroke="rgb(${LIVE})" stroke-opacity="${(.5*(1-clamp((u-1.4)/.9))).toFixed(2)}" stroke-width="2"/>`+dot(OX+4*SP,OY,R0,.9,.9,Math.max(q,.05),1-ease((u-1.4)/1.8),LIVE)}return o}],
['Heavier than last time','Last time is a ghost ring behind each dot. Today fills it and grows past it.',u=>{let o='';for(let i=0;i<8;i++){const [x,y]=slot(i,8,SP,OX,OY);o+=dot(x,y,R0*.72,0,.35);const q=back((u-.3-i*.3)/.45);o+=q>0?dot(x,y,R0*1.08,.9,.9,Math.max(q,.05),1-ease((u-.3-i*.3-.2)/.8)):''}return o}],
['Personal best','A bright dot runs once around and the dots glint. Colour only in motion.',u=>{let o='';const ww=3*SP+2*R0,hh=SP+2*R0,perim=2*(ww+hh);const gl=i=>{const k=(u-1.6-i*.12)/.45;return k>0&&k<1?Math.sin(k*Math.PI):0};for(let i=0;i<8;i++){const [x,y]=slot(i,8,SP,OX,OY);o+=dot(x,y,R0,.9,.8+.2*gl(i),1+.18*gl(i),gl(i))}const p=ease((u-.2)/1.5);if(p>0&&p<1){const d=p*perim;let px,py;const x0=OX-R0-8,y0=OY-R0-8,w2=ww+16,h2=hh+16,per=2*(w2+h2),dd=p*per;if(dd<w2){px=x0+dd;py=y0}else if(dd<w2+h2){px=x0+w2;py=y0+dd-w2}else if(dd<2*w2+h2){px=x0+w2-(dd-w2-h2);py=y0+h2}else{px=x0;py=y0+h2-(dd-2*w2-h2)}o+=dot(px,py,5,1,.9,1,1,LIVE)}return o}],
['Resting','One dot per half minute, going out one by one. The last one pulses in colour: go.',u=>{let o='';for(let i=0;i<4;i++){const x=OX+i*SP*1.2,y=OY+SP/2;const out=u>.7*(i+1);const last=i===3&&u>3.1;o+=out&&!last?dot(x,y,R0,0,.35):dot(x,y,R0,.9,.8,last?1+.15*Math.sin(u*9):1,last?1:0,LIVE)}return o}]
];
const G=document.getElementById('g');
function render(t){
 G.innerHTML=cases.map((c,k)=>{const u=(t+k*.37)%T;return `<div class="c"><div class="l">${c[0]}</div><div class="d">${c[1]}</div>${svg(240,150,c[2](u))}</div>`}).join('');
 // in use: Training row with sets as 2x4 dot clusters
 const S=[{r:8,w:80,at:.8},{r:8,w:85,at:2.6},{r:6,w:90,at:4.6,T:8},{r:6,w:90,at:null}];
 let o='';let x=6;
 S.forEach((s,i)=>{const T0=s.T||8,rad=3.6+(s.w-60)/45*2.6,ox=x+rad+1,oy=14;
  for(let k=0;k<T0;k++){const [px,py]=slot(k,T0,rad*2.8,ox,oy);const done=s.at!=null&&k<s.r;const q=done?back((t%12-s.at-k*.14)/.35):0;
   o+=done&&q>0?dot(px,py,rad,tn(s.w),.8,Math.max(q,.05),1-ease((t%12-s.at-k*.14-.2)/.8)):dot(px,py,rad,0,s.at==null?.35:.3)}
  x+=Math.ceil(T0/2)*rad*2.8+14});
 const tt=t%12;const show=tt>9?`<text x="6" y="64" font-size="21" font-weight="600" fill="${INK}">Set 3: 90 kg x 6</text>`:'';
 document.getElementById('ph').innerHTML=`<div class="l">In use: the Training row</div><div class="d">Each set is a small cluster: a dot per rep, bigger and darker when heavier. Tap one and the exact numbers show.</div><div style="margin-top:26px;font-size:21px;font-weight:500;letter-spacing:-.01em">Bench press</div><div class="sub">4 x 6-8</div>${svg(342,80,o+show)}<div class="hr"></div><div class="sub" style="margin-top:14px">The same dot grammar runs in live mode, the Lock Screen and the Watch. One vocabulary, eight moves.</div>`;
}
if(window.FREEZE!==undefined)render(window.FREEZE);else{const t0=performance.now();(function f(){render((performance.now()-t0)/1000);requestAnimationFrame(f)})()}
document.body.style.zoom=window.ZOOM||1;
</script></body></html>
