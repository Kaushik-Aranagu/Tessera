<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#E9E6EE}
body{font-family:'Inter Tight','Inter',sans-serif;color:#14181F;padding:24px;width:1260px;box-sizing:border-box}
.row{display:flex;gap:30px}
.p{width:390px;height:560px;background:#FBFBF8;position:relative;box-sizing:border-box;padding:26px 24px}
.l{font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.why{font-size:18px;line-height:24px;color:rgba(20,24,31,.66);margin-top:8px;height:72px}
.big{margin-top:6px;height:170px}
.det{height:26px;margin-top:6px;font-size:21px;font-weight:600;transition:none}
.hr{height:1px;background:rgba(20,24,31,.12);margin:12px 0}
.rw{display:flex;align-items:center;justify-content:space-between;height:44px}
.rw b{font-size:21px;font-weight:500;letter-spacing:-.01em}
.sub{font-size:16px;color:rgba(20,24,31,.66)}
svg{display:block}
</style></head><body><div class="row" id="r"></div><script>
const PAL='216,67,42',INK='#14181F';
const SETS=[{r:8,w:80,at:1.0,t:8},{r:8,w:85,at:3.2,t:8},{r:6,w:90,at:5.4,t:8},{r:6,w:90,at:null,t:6}];
const DUR=1.3,T=13,TAP=9.2;
const clamp=x=>Math.max(0,Math.min(1,x));
const back=p=>{p=clamp(p);const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const prog=(t,at)=>at==null?0:back((t-at)/DUR);
const lin=(t,at)=>at==null?0:clamp((t-at)/DUR);
const tone=w=>.4+Math.min(1,Math.max(0,(w-60)/45))*.55;
const sel=(t)=>t>=TAP&&t<T-0.6?2:-1;
// D: loaded bar
function mD(t){let x=62,o=`<path d="M8 60H336" stroke="${INK}" stroke-width="3.4" stroke-linecap="round"/><rect x="40" y="40" width="9" height="40" rx="2" fill="${INK}"/>`;
 SETS.forEach((s,i)=>{const th=6+s.r*2.4,h=26+(s.w-60)*1.5,p=prog(t,s.at),sl=sel(t)===i;
  if(s.at==null||p<=0){o+=`<rect x="${x}" y="${60-h/2}" width="${th}" height="${h}" rx="3" fill="none" stroke="${INK}" stroke-opacity=".35" stroke-width="1.6" stroke-dasharray="4 4"/>`}
  else{const dy=(1-clamp(p))*-26+(sl?-5:0),a=clamp(p*2);o+=`<g opacity="${a}" transform="translate(0 ${dy})"><rect x="${x}" y="${60-h/2}" width="${th}" height="${h}" rx="3" fill="rgba(${PAL},${tone(s.w)})" stroke="${INK}" stroke-width="${sl?3:1.8}"/></g>`}
  x+=th+4});return `<svg width="342" height="120" viewBox="0 0 342 120">${o}</svg>`}
// E: growth rings
function ring(R,k,cx,cy){let d='';for(let i=0;i<=72;i++){const a=i/72*Math.PI*2,r=R*(1+.035*Math.sin(3*a+k*1.7)+.022*Math.sin(5*a+k*2.9));d+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1)}return d+'Z'}
function mE(t){const cx=171,cy=85;let R=7,rs=[];
 SETS.forEach(s=>{const th=4+s.r*1.35;rs.push({R0:R,th});R+=th});
 let o='';
 for(let i=SETS.length-1;i>=0;i--){const s=SETS[i],g=rs[i],p=lin(t,s.at),sl=sel(t)===i;
  if(s.at==null||p<=0){o+=`<path d="${ring(g.R0+g.th,i,cx,cy)}" fill="none" stroke="${INK}" stroke-opacity=".35" stroke-width="1.6" stroke-dasharray="4 4"/>`}
  else{const e=prog(t,s.at);o+=`<path d="${ring(g.R0+g.th*Math.max(e,.02),i,cx,cy)}" fill="rgba(${PAL},${tone(s.w)})" stroke="${INK}" stroke-width="${sl?3:1.6}"/>`}}
 o+=`<circle cx="${cx}" cy="${cy}" r="4" fill="${INK}"/>`;
 return `<svg width="342" height="170" viewBox="0 0 342 170">${o}</svg>`}
// F: abacus
function mF(t){let o='';
 SETS.forEach((s,i)=>{const y=22+i*38,d=12+(s.w-60)*.2,sl=sel(t)===i;
  o+=`<path d="M8 ${y}H334" stroke="${INK}" stroke-opacity=".4" stroke-width="1.6" stroke-linecap="round"/>`;
  const n=Math.max(s.t,s.r);
  for(let k=0;k<n;k++){const rightX=326-(n-1-k)*24+0,leftX=22+k*24;
   const done=s.at!=null&&k<s.r;const q=done?back((t-s.at-k*.11)/ (DUR*.7)):0,e=clamp(q);
   const x=done?rightX+(leftX-rightX)*e:rightX;
   if(done&&e>0){o+=`<circle cx="${x.toFixed(1)}" cy="${y+(sl?-3:0)}" r="${d/2+(sl?1:0)}" fill="rgba(${PAL},${tone(s.w)})" stroke="${INK}" stroke-width="${sl?2.6:1.6}"/>`}
   else{o+=`<circle cx="${x.toFixed(1)}" cy="${y}" r="${d/2}" fill="none" stroke="${INK}" stroke-opacity=".32" stroke-width="1.4"/>`}}});
 return `<svg width="342" height="170" viewBox="0 0 342 170">${o}</svg>`}
const O=[['D','The loaded bar','Each set is a plate on the bar. Thicker is more reps, taller is heavier. The workout builds the bar you lifted.',mD],['E','Growth rings','Each set is a ring, like a tree. Thicker is more reps, darker is heavier. One small disc per exercise.',mE],['F','The abacus','Each set is a rod and each rep a bead that slides over. Bigger, darker beads are heavier. You can count it.',mF]];
const det=t=>{const s=SETS[2];return t>=TAP&&t<T-0.6?`Set 3: ${s.w} kg x ${s.r}`:''};
const R=document.getElementById('r');
R.innerHTML=O.map((o,i)=>`<div class="p"><div class="l">${o[0]}  ${o[1]}</div><div class="why">${o[2]}</div><div class="big" id="b${i}"></div><div class="det" id="d${i}"></div><div class="hr"></div><div class="rw"><div><b>Bench press</b><div class="sub">4 x 6-8, on the Training page</div></div><div id="s${i}" style="width:140px"></div></div></div>`).join('');
const t0=performance.now();
function loop(){const t=window.FREEZE!==undefined?window.FREEZE:((performance.now()-t0)/1000)%T;
 O.forEach((o,i)=>{document.getElementById('b'+i).innerHTML=o[3](t);document.getElementById('d'+i).textContent=det(t);
  const s=o[3](t).replace(/width="342" height="\d+"/,m=>m.replace('342','140').replace(/height="\d+"/,'height="48"'));document.getElementById('s'+i).innerHTML=s.replace(/<svg width="140" height="48" viewBox="0 0 342 (\d+)"/,'<svg width="140" height="48" viewBox="0 0 342 $1" preserveAspectRatio="xMidYMid meet"')});
 if(window.FREEZE===undefined)requestAnimationFrame(loop)}
document.body.style.zoom=window.ZOOM||1;loop();
</script></body></html>
