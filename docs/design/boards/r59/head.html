<title>Weather room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@200;300;400&display=swap">
<style>
:root{--ground:#EFECE6;--phone:#F7F5F1;--ink:#1D1B19;--ink2:#5E5A55;--ink3:#8E8982;--edge:#DDD8D0;
 --acc:#C9772E;--sky1:#C9772E;--rain:#557A93;--snow:#6E8296;--wind:#5E6E7E;--cloud:#6B7480;--pcloud:#8A7552;--moon:#4A5788;--fog:#727880;--ice:#2F7299;--storm:#53507A;--warn:#A23B27;--bolt:#5B4FD0;--go:#25803D;--slate:#34506F;
 --words:"Figtree",-apple-system,system-ui,sans-serif;--nums:"Outfit","Figtree",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0E0E10;--phone:#000000;--ink:#F1EEE9;--ink2:#ABA6A0;--ink3:#78736D;--edge:#2A2A2E;--acc:#E8A06A;--sky1:#E8A06A;--rain:#9DBACE;--snow:#C9D6E2;--wind:#B4C2CC;--cloud:#B9C0C8;--pcloud:#DCCDAA;--moon:#B3BDE8;--fog:#A7ACB2;--ice:#9FD0EE;--storm:#ABA8DC;--warn:#F08F72;--bolt:#FFF1A8;--go:#8FC9A0;--slate:#A7BCD6;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#0E0E10;--phone:#000000;--ink:#F1EEE9;--ink2:#ABA6A0;--ink3:#78736D;--edge:#2A2A2E;--acc:#E8A06A;--sky1:#E8A06A;--rain:#9DBACE;--snow:#C9D6E2;--wind:#B4C2CC;--cloud:#B9C0C8;--pcloud:#DCCDAA;--moon:#B3BDE8;--fog:#A7ACB2;--ice:#9FD0EE;--storm:#ABA8DC;--warn:#F08F72;--bolt:#FFF1A8;--go:#8FC9A0;--slate:#A7BCD6;color-scheme:dark}
body{background:var(--ground);color:var(--ink);font-family:var(--words);font-size:17px;line-height:1.5;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px}
h1{font-size:34px;letter-spacing:-.02em;margin:0;text-wrap:balance}h2{font-size:20px;margin:0}
.head{max-width:1180px;margin:0 auto 24px;display:flex;flex-direction:column;gap:8px}.lab{margin:0;font-size:13px;font-weight:600;font-variant-caps:all-small-caps;letter-spacing:.08em;color:var(--slate)}.sub{margin:0;max-width:72ch;color:var(--ink2)}
.tools{display:flex;gap:8px 22px;flex-wrap:wrap}.tr{background:none;border:0;font:inherit;font-size:15px;color:var(--acc);padding:10px 0;cursor:pointer}
.row{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.fit{width:min(402px,100%);aspect-ratio:402/874;position:relative}
.phone{position:absolute;left:0;top:0;width:402px;height:874px;transform-origin:0 0;background:var(--phone);border-radius:54px;overflow:hidden;outline:1px solid var(--edge)}
.scr{position:absolute;inset:0;background:var(--phone)}.z{position:absolute;left:24px;right:24px}
.tap{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit;min-height:44px}
.n{font-family:var(--nums);font-variant-numeric:tabular-nums}
.sl{font-size:13px;font-weight:600;font-variant-caps:all-small-caps;letter-spacing:.06em;color:var(--ink2);line-height:16px}
.wx{font-weight:700}.wx .lt{display:inline-block}
.wx.shine{background:linear-gradient(105deg,var(--c) 0 34%,color-mix(in srgb,var(--c) 40%,#FFF6E0) 46%,#FFFBF0 50%,color-mix(in srgb,var(--c) 40%,#FFF6E0) 54%,var(--c) 66% 100%);background-size:320% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:glint 4s ease-in-out infinite}
@keyframes glint{0%,45%{background-position:100% 0}80%,100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.wx.shine{animation:none;background:none;color:var(--c)!important}}
.hrs{display:flex;transition:transform .45s cubic-bezier(.2,.9,.25,1.05)}.hr{flex:none;width:59px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.act{background:none;border:0;font:inherit;font-size:20px;font-weight:600;min-height:44px;padding:0;cursor:pointer}
.ft{left:28px;bottom:30px;height:44px;display:flex;align-items:center}
.tess{position:absolute;right:24px;bottom:30px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFB36B,#E8582A 60%,#B2301C)}
.notes{max-width:1180px;margin:36px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px 40px}.notes p{margin:0;color:var(--ink2);font-size:16px}.notes b{color:var(--ink);font-weight:600}.notes div{display:flex;flex-direction:column;gap:8px;min-width:0}
.cap{color:var(--ink2);font-size:14px;max-width:402px;margin:12px 0 0}
</style>
