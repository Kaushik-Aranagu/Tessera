<script id="data" type="application/json">[{"id": "p0", "name": "Read me first", "html": "<h1 id=\"tessera-design-bible-read-me-first-oct-24-2026\">Tessera design\nbible: read me first (Oct 24, 2026)<\/h1>\n<p>This is the whole design of Tessera as it stands on Oct 24, 2026,\nwritten so a design agent on another system or account (Codex or a fresh\nClaude) can pick it up and keep everything consistent. It covers every\nscreen we designed, every effect and charm, the color, type and look\nrules, and what Kaushik liked and rejected.<\/p>\n<p>Tessera is Kaushik's private iPhone app (SwiftUI, iOS 27), an \"OS\ninside an app\" built for an ADHD brain. Its assistant is Tess. The\ndesign lead was the Claude \"Design studio\" thread. Builders A and B and\nCore build from the sheets.<\/p>\n<h2 id=\"how-to-use-it\">How to use it<\/h2>\n<ol type=\"1\">\n<li>Read <strong>01 System and learnings<\/strong> before you touch\nanything. It holds the rules that apply on every page, plus the patterns\nbehind his feedback.<\/li>\n<li>Then read the room you are working on: <strong>02 Home and\nTess<\/strong>, <strong>03 Training<\/strong>, <strong>04 Kitchen, Lists,\nNotes<\/strong>, <strong>05 Routines, Money and the rest<\/strong>.<\/li>\n<li>Check <strong>06 Open questions<\/strong> before you present work.\nThose are real contradictions between sheets. Settle each one with\nKaushik in one question with one recommendation, never by guessing.<\/li>\n<\/ol>\n<h2 id=\"which-source-wins\">Which source wins<\/h2>\n<ol type=\"1\">\n<li>Kaushik's own latest words (thread messages, then his Codex chat\ndigest <code>docs/handoff/codex-chat-oct24.md<\/code>).<\/li>\n<li>The rules in 01 and the \"Current hard rules\" below.<\/li>\n<li>The newest numbered sheet on the topic\n(<code>docs/handoff/design-sheets/<\/code>, full archive in the project\ndesign folder). A higher number is newer.<\/li>\n<li>Older sheets, only for behavior they define that nothing newer\nreplaced. Many early sheets describe a look that is gone (painterly\ngrounds, Inter Tight, Fraunces, brushstrokes, dabs, cobalt Tess, pixel\nlintels, lens on swipe, rings, dots). The repo files\n<code>docs/DESIGN_MOTION.md<\/code>, the old themes.md sheet and the\n<code>tessera-design<\/code> skill still describe some of those old\nvisuals. Don't copy them.<\/li>\n<\/ol>\n<h2\nid=\"the-three-newest-rules-from-his-codex-chat-245-835-am-pt-oct-24\">The\nthree newest rules from his Codex chat (2:45-8:35 AM PT Oct 24)<\/h2>\n<ul>\n<li><strong>Keystone:<\/strong> every app gets ONE expressive element,\nbuilt from its own data, in the Home mosaic's slot. Home has the mosaic,\nNotes has the word wall, and Routines now has the habit woodland (248).\nIt should be a small living world that reacts to what he does, adds and\ncompletes, does things by itself, and helps him navigate into the app.\nStatic decoration doesn't count. Scenes must scale with the amount of\ndata, so no per-item drawings. Studies for Training (live metal, a path\nwith cairns), Kitchen, Recipes, Pantry, Lists, Weather and Money were\n\"too basic\" or unfinished, so those keystones are still open. He liked\n\"pull apart to reveal a breakdown\" as an interaction to reuse.<\/li>\n<li><strong>Every effect or reaction lasts 3 to 5 seconds at\nmost.<\/strong><\/li>\n<li><strong>Density:<\/strong> as much information in as little space as\npossible, without clutter. No long lists and no\neverything-on-one-screen: dials and swipes move between dimensions. No\ntabs, pills, filter rows or redundant buttons. The item itself is the\ncontrol: tap opens, swipe or hold completes.<\/li>\n<\/ul>\n<h2 id=\"current-hard-rules-one-line-each-detail-in-01\">Current hard\nrules (one line each; detail in 01)<\/h2>\n<ul>\n<li><strong>Type:<\/strong>\n<ul>\n<li>Figtree for words, Outfit for numbers, Newsreader only for Tess's\nown words.<\/li>\n<li>Sentence case.<\/li>\n<li>Units at about half the numeral's size, minimum 10 pt.<\/li>\n<li>The 2-4 biggest words on a page never share a color.<\/li>\n<\/ul><\/li>\n<li><strong>Banned:<\/strong> cards, pills, bars, rings, middle dots,\nfilled dots, decorative underlines, lens or glass on swipes, fades on\ntext, \"...\", \"N of M\" counters, foot menus and door rows.\n<ul>\n<li>Pixels and tiles appear only on the Home mosaic.<\/li>\n<li>Two exceptions, both his own asks: the Notes areas glass pane, and\nthe small note cards in the Notes Folio.<\/li>\n<\/ul><\/li>\n<li><strong>Color:<\/strong>\n<ul>\n<li>3-4 colors per page, chosen by meaning. Room color = title + action\nword.<\/li>\n<li>Fixed state colors: done is green, late or needs care is wine, best\nor new is gold, planned or private is slate.<\/li>\n<li>Nothing sits within \u0394E00 10 of Tess's Ember (FF5A26 light / FF6B3D\ndark), except the room currently cueing her.<\/li>\n<li>The word wall may use many colors.<\/li>\n<\/ul><\/li>\n<li><strong>Gestures:<\/strong>\n<ul>\n<li>Swipe right = Done; swipe left = Not now.<\/li>\n<li>Single elements swipe on both axes unless the axes mean different\nthings. A strip owns any drag that starts on it.<\/li>\n<li>Undo lasts 10 s everywhere. Money undo reads \"Reversed\".<\/li>\n<li>Numbers never step with \u2212 / +. They scroll, and a tap opens a\nwheel.<\/li>\n<li>Every wheel has depth blur (Notes dial up to 1.8 pt).<\/li>\n<\/ul><\/li>\n<li><strong>Layout:<\/strong>\n<ul>\n<li>Landings are a summary plus a keystone plus doors, never the full\nlist.<\/li>\n<li>Use the 3-place dial on landings only. Deeper pages use other forms:\na focus wheel, the Folio, a dimension line.<\/li>\n<li>Text sits in fixed slots and never wraps or moves the layout. Tess\nshortens it.<\/li>\n<li>Each depth level has one fixed block that stays the same on every\nsibling page.<\/li>\n<li>Bottom left holds one action word (tap, or drag left or right for\noptions). Tess is bottom right.<\/li>\n<\/ul><\/li>\n<li><strong>Data rules that shape design:<\/strong>\n<ul>\n<li>No money on Home. Weeks start Monday. Sample data until\nproduction.<\/li>\n<li>Health, body, calendar, calories, location and money never reach\nwidgets, backups or logs.<\/li>\n<li>Private items show as \"Private \u2026\" or as a count off the phone.<\/li>\n<li>Money actions are never offered to Claude.<\/li>\n<li>Free APIs only.<\/li>\n<\/ul><\/li>\n<li><strong>Motion:<\/strong>\n<ul>\n<li>Everything goes through MotionPolicy (springs, haptics).<\/li>\n<li>Reduce Motion and Low Power: no blur, no drift, cross-fades\nonly.<\/li>\n<li>No effect longer than 5 s.<\/li>\n<\/ul><\/li>\n<\/ul>\n<h2 id=\"status-of-every-screen-oct-24-450-pm-pt\">Status of every screen\n(Oct 24, 4:50 PM PT)<\/h2>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Area<\/th>\n<th>State<\/th>\n<th>Sheet / board<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Home<\/td>\n<td>v2.2 approved; v2.3 vertical one-thing swipe and v2.4-2.8 weather\nword effects specified<\/td>\n<td>236; board DygjFLo442RxyE1kmn4rJM<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Tess (corner, cloud, conversation)<\/td>\n<td>specified<\/td>\n<td>215 final<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Weather room<\/td>\n<td>first cut, open<\/td>\n<td>243; board NyeaiLgka6cPQX3vqWZ1jj<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Training<\/td>\n<td>plan page, live workout and library specified (v20 not yet\nreviewed); landing needs a keystone<\/td>\n<td>230; board PFDdUde9cLtYA1G6Qjrpwp<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Kitchen<\/td>\n<td>cook mode, pantry and recipes specified; landing open (needs a\nkeystone)<\/td>\n<td>231-234<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lists<\/td>\n<td>kinds v9 not yet reviewed; landing open<\/td>\n<td>237; board 9JBnr8TytGTnKtnnyXjdik<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Notes landing<\/td>\n<td>APPROVED Oct 24, 1:54 AM<\/td>\n<td>246; board 1mSPKcxhvQB4pFU2tmQZkx<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Notes door pages<\/td>\n<td>draft; must be reconciled with his Codex-era Folio and areas\ndecisions<\/td>\n<td>247 v2 + codex digest; board S4dqsoynjdQMRQsV9EPW5z<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Routines<\/td>\n<td>woodland landing v1, awaiting his verdict; inner pages 238<\/td>\n<td>248; board KZkqPY2U6VxDMBETRu3CML<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Money<\/td>\n<td>rules settled; look not redrawn in the current language<\/td>\n<td>223, 133<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Settings<\/td>\n<td>sentence settings<\/td>\n<td>203; board Sm2gKa3mJFAmaGoF356b9K<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Day log, Review, Shutdown, Plan my day, Upkeep, People, Reading<\/td>\n<td>behavior kept; look needs a round<\/td>\n<td>older sheets<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Widgets, Lock Screen, Live Activities, Watch, app icon<\/td>\n<td>no confirmed current look<\/td>\n<td>see 02, 03, 05<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Boards are claude.ai artifact pages, private to Kaushik: <a\nhref=\"https://claude.ai/artifact/\">https://claude.ai/artifact/<\/a><id>.\nThe sheets are the spec. Boards are only references.<\/p>\n<h2 id=\"how-the-design-work-ran-keep-doing-it-this-way\">How the design\nwork ran (keep doing it this way)<\/h2>\n<ul>\n<li>One numbered sheet per round, plus a board he can open on his phone.\nHe can't open file paths, so always give him a link to a page.<\/li>\n<li>Ask one question at a time, each with one recommendation. Never\nre-ask a settled pick; it frustrated him. Record every verdict with its\ntime.<\/li>\n<li>He reviews fast and by voice. Short fragments like \"too basic\",\n\"gaps\", \"monotonic\" are full verdicts (see 01 \u00a78).<\/li>\n<li>Sheets go to the repo as docs PRs, which merge without review.\nBuilders build only from sheets, and only after his yes.<\/li>\n<\/ul>\n"}, {"id": "p1", "name": "System and learnings", "html": "<h1 id=\"01-the-design-system-and-what-we-learned\">01 The design system,\nand what we learned<\/h1>\n<p>The cross-cutting rules every Tessera screen follows, then what\nKaushik liked, what he rejected, and the reasons behind his feedback.\nWhere a sheet and this page disagree, the newest sheet wins, except for\nthe Oct 24 hard rules (section 7), which override every sheet. Sheet\nnumbers refer to <code>/mnt/project-files/tessera/design/<\/code> (the\nnewest are mirrored in <code>docs/handoff/design-sheets/<\/code>).<\/p>\n<p><strong>Stale sources. Do not build from these without\nchecking:<\/strong><\/p>\n<ul>\n<li><code>.claude/skills/tessera-design/SKILL.md<\/code> describes Hero\n64, mono uppercase labels, dotted underlines, \"no pure #000\" and glass\nbars.<\/li>\n<li><code>docs/DESIGN_MOTION.md<\/code> lists cards, a glass add button,\nconfetti, glass pills and Tess as three paint dabs.<\/li>\n<li><code>themes.md<\/code> uses Inter Tight, cobalt as Tess's color, and\nbrush strokes.<\/li>\n<\/ul>\n<p>The <em>principles<\/em> in those files still hold: MotionPolicy, the\nhouse spring, Reduce Motion, haptics, no decorative color. Their\n<em>visuals<\/em> are superseded.<\/p>\n<h2 id=\"1-principles\">1. Principles<\/h2>\n<ul>\n<li><strong>UI weighs as much as the backend (50/50).<\/strong> UI is\nwhere invention happens, not polish added at the end. Never ship a stock\niOS screen, a card screen, or \"a list of summaries\". Kaushik's ideas\narrive raw: polish them and push back on them. Every round should\ninclude at least one idea he has not seen before.<\/li>\n<li><strong>Everything is an object.<\/strong> Every thing is a linkable\ninstance of a class (ClassDef, FieldDef, ObjectRecord, ObjectLink). Any\nword that names a thing can open it (\"word becomes the page\", sheet 138\nD1). Information is dense, but it is revealed progressively:\n<ul>\n<li>a landing gives a summary plus doors;<\/li>\n<li>a page gives one thing in focus;<\/li>\n<li>a detail page gives everything about that thing.<\/li>\n<\/ul><\/li>\n<li><strong>One thing at a time (ADHD-friendly).<\/strong> The screen is\na scarce resource (no-buttons):\n<ul>\n<li>one primary action per screen, plus at most two fast paths;\neverything else is one layer down;<\/li>\n<li>nothing stays on screen unless it earns its place;<\/li>\n<li>Home shows one thing under the mosaic (213), and swipers show one\nitem at a time.<\/li>\n<\/ul><\/li>\n<li><strong>Calm, but alive.<\/strong> Color arrives through motion and\nmoments, and resting color stays quiet (no-dots). He still wants\n\"action, drama and things happening\": small living details (sheet 236\nweather words, word-wall moments, the departure-board flips).<\/li>\n<li><strong>Tone.<\/strong> Offers, never orders. No guilt, no shaming,\nno \"streak 0\". Missed days are neutral. Receipts name the thing first\n(section 3).<\/li>\n<li><strong>Privacy is part of the design.<\/strong>\n<ul>\n<li>Health, body, calendar, calories, location and money never reach\nwidgets, backups or logs. They reach Claude only while lab mode is on\n(his Oct 23 ruling; strict mode turns it off in one switch). Private\nnotes and lists may go to Claude under lab mode \"for now\"; workouts\nnever do; money actions are never offered.<\/li>\n<li>Off the phone, private items read \"Private workout\" or \"Private\nnote\", or as a count (\"3 private notes\", never \"Private note\"\nrepeated).<\/li>\n<li>Inside its own room, a private item shows its real name.<\/li>\n<li>No money ever appears on Home.<\/li>\n<\/ul><\/li>\n<\/ul>\n<h2 id=\"2-looks-color-roles-ember-contrast\">2. Looks, color roles,\nEmber, contrast<\/h2>\n<h3 id=\"21-looks-themeconcept--designsystemlooksswift\">2.1 Looks\n(ThemeConcept / <code>DesignSystem/Looks.swift<\/code>)<\/h3>\n<ul>\n<li>A look changes only three things: the ground, the ink and the\npigments. Layout, type and motion are the same in every look.<\/li>\n<li>One base runs through the whole app, workout included (themes.md,\nfourth addendum). Nothing pops out brighter or darker than the\nrest.<\/li>\n<li>The looks in code:<\/li>\n<\/ul>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Look<\/th>\n<th>Kind<\/th>\n<th>Ground<\/th>\n<th>Field<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Porcelain<\/td>\n<td>light<\/td>\n<td>FFFFFF<\/td>\n<td>pigment bloom<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Obsidian<\/td>\n<td>dark<\/td>\n<td>000000<\/td>\n<td>emissive glow<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Plein<\/td>\n<td>light<\/td>\n<td>warm paper F3EDE2<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lacquer<\/td>\n<td>dark<\/td>\n<td>plum-black 130A0D<\/td>\n<td>slow specular band<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Celadon<\/td>\n<td>light<\/td>\n<td>jade E0EAE2<\/td>\n<td>glaze<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>White (213)<\/td>\n<td>light<\/td>\n<td>FFFFFF<\/td>\n<td>ink2 54514D, ink3 86827C<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Black (213)<\/td>\n<td>dark<\/td>\n<td>000000<\/td>\n<td>ink2 A3A09B, ink3 6E6B67<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Settings &gt; Look is one sentence: \"<strong>Porcelain<\/strong> by\nday, <strong>Obsidian<\/strong> by night\". Tap a name to cycle it; hold\nto pin. <code>-theme &lt;name&gt;<\/code> pins a look on the\nsimulator.<\/li>\n<li>He wants absolute black (#000) for dark. Every board gets a quick\ntheme flip between pure black, white and warm paper\n(little-details-rule). Boards draw light on paper F7F5F1.<\/li>\n<li><strong>Soft dark<\/strong> (his pick 10:15 PM Oct 23, sheet 230 v2),\non 000000:<\/li>\n<\/ul>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Role<\/th>\n<th>Hex<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>accent (Training)<\/td>\n<td>8FB0EE<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>go<\/td>\n<td>8FC9A0<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ink<\/td>\n<td>E8E3DA<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ink2<\/td>\n<td>A49E96<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ink3<\/td>\n<td>78736D<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>edge<\/td>\n<td>2A2A2E<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>His second choice was Moonlight: B0C1E6, A8CDB4, DCD7CE, 9C968E. He\nsaid Soft is \"fine for now\", so a better set may still come.<\/p>\n<ul>\n<li>Ink tiers: ink is for text, ink2 for secondary text, ink3 for rest\nand disabled. Nothing on Home uses ink3 text (236).<\/li>\n<\/ul>\n<h3 id=\"22-color-roles-app-wide-sheet-241-his-1153-pm-not-monotonic\">2.2\nColor roles, app-wide (sheet 241, his 11:53 PM \"not monotonic\")<\/h3>\n<ul>\n<li><strong>3-4 colors per page, each with a meaning.<\/strong> Never 1,\nnever 5 or more. Color goes on type and fine lines only, never on\nfills.<\/li>\n<li><strong>Room accent:<\/strong> the room title, the bottom-left action\nword, and the focused item when it has no kind.<\/li>\n<li><strong>Kind colors:<\/strong> each kind wears its own color on its\nname, count, focused items, page title and action word. A kind that\nbelongs to another room wears that room's accent. The other kinds take a\ncolor from the shared set: teal, clay, gold, slate.<\/li>\n<li><strong>State colors (the same everywhere):<\/strong><\/li>\n<\/ul>\n<table>\n<thead>\n<tr class=\"header\">\n<th>State<\/th>\n<th>Color<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>done, logged, paid, in stock, a gain<\/td>\n<td>go green 25803D / 8FC9A0<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>late, due, expiring, warning<\/td>\n<td>wine 9A2541 / EE8E9C<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>best, new, starred<\/td>\n<td>gold 7E6A1E / D9C27A<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>planned, private, later, small-caps labels<\/td>\n<td>slate 34506F / A7BCD6<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Shared kind colors:<\/strong><\/li>\n<\/ul>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Kind color<\/th>\n<th>Light<\/th>\n<th>Dark<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>teal<\/td>\n<td>1E6E77<\/td>\n<td>84C3C9<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>clay<\/td>\n<td>9C4B2C<\/td>\n<td>E2A07F<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>plum<\/td>\n<td>8A4570<\/td>\n<td>D69CC0<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>steel<\/td>\n<td>2F6A8F<\/td>\n<td>8DBAD6<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>lavender<\/td>\n<td>6A5E8C<\/td>\n<td>B4A9D6<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>BIG TYPE rule (his 12:07 AM Oct 24):<\/strong>\n<ul>\n<li>The 2-4 biggest type elements on a page never share a color. Each\ntakes the color of its meaning.<\/li>\n<li>Vary their weight and size too, for example a 600 title, a 200 light\nstat number and a 600 hero at another size.<\/li>\n<li>The action word may share the title's accent, because they sit at\nopposite ends of the page.<\/li>\n<\/ul><\/li>\n<li><strong>Money exception:<\/strong> in Money, paid uses the room's\nsage, not go green. No amount is ever colored as good or bad.<\/li>\n<\/ul>\n<h3 id=\"23-room-accents-light--dark\">2.3 Room accents (light /\ndark)<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Room<\/th>\n<th>Accent<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Training<\/td>\n<td>blue 0B62AE / 8FB0EE (Soft)<\/td>\n<td>Splits: Push clay, Pull teal, Legs plum, streak gold. Library:\nRoutines green, Exercises gold, Programs slate, Goals blue. The old\n3B8CF2 dark and the crimson are retired.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Kitchen<\/td>\n<td>ochre A8701F (name and big numbers) / C49A5E<\/td>\n<td>Small text in light uses 93611A (A8701F is only 3.9:1). Pantry teal,\nRecipes clay, Shopping ochre.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Money<\/td>\n<td>sage 3F7A62 / 8DBFA7<\/td>\n<td>Bills clay, Subscriptions teal, Savings gold, Late wine.\n<strong>Unconfirmed:<\/strong> README says Money moved to sea teal 2A7878\n/ 7BC0C4 (223); 241 and the code use sage.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lists<\/td>\n<td>olive 5E6B1F / B5BE7A<\/td>\n<td>v9 kinds: Shopping ochre, Trips steel, Home teal, People plum, Watch\nand read lavender. Small-caps labels in ink2. Slate only on\n\"Private\".<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Notes<\/td>\n<td>violet 5B3FB8 / B9A9E0 <strong>must change<\/strong><\/td>\n<td>It is only \u0394E00 6.1 from Ember. Plum 8A4570 / E3A3CB is proposed\n(246) and needs confirming in the Notes round. Kinds: Ideas gold,\nJournal clay, Reading teal, Work slate.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Routines<\/td>\n<td>plum 8E4A78 / D59AC4<\/td>\n<td>Code still has D79AA6. Kinds: Mornings gold, Evenings slate, Body\ntraining blue, Home clay, Mind teal, Borrowed wears the source room's\naccent.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Home<\/td>\n<td>no room accent<\/td>\n<td>See below.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Weather<\/td>\n<td>sky amber C9772E / E8A06A<\/td>\n<td>Condition colors below.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Tasks<\/td>\n<td>ink<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Home colors:<\/strong>\n<ul>\n<li>The date wears the sky of the hour as a left-to-right gradient\n(216). Evening, for example, is BF6A22 \u2192 A33C62 light and E8A06A \u2192\nF286A6 dark.<\/li>\n<li>Rain or snow eases the second stop 30% toward slate.<\/li>\n<li>Each highlighted door word is Figtree 700 in its room's accent.<\/li>\n<\/ul><\/li>\n<li><strong>Weather condition colors (light / dark):<\/strong><\/li>\n<\/ul>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Condition<\/th>\n<th>Light<\/th>\n<th>Dark<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>rain<\/td>\n<td>557A93<\/td>\n<td>9DBACE<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>snow<\/td>\n<td>6E8296<\/td>\n<td>C9D6E2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>wind<\/td>\n<td>5E6E7E<\/td>\n<td>B4C2CC<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>cloud<\/td>\n<td>6B7480<\/td>\n<td>B9C0C8<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>white-cloud days<\/td>\n<td>8A7552<\/td>\n<td>DCCDAA<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>moon<\/td>\n<td>4A5788<\/td>\n<td>B3BDE8<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>fog<\/td>\n<td>727880<\/td>\n<td>A7ACB2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ice<\/td>\n<td>2F7299<\/td>\n<td>9FD0EE<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>storm<\/td>\n<td>53507A<\/td>\n<td>ABA8DC<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>warn<\/td>\n<td>A23B27<\/td>\n<td>F08F72<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>bolt<\/td>\n<td>5B4FD0<\/td>\n<td>FFF1A8<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Highlights take their meaning's color: rain wears rain slate, never a\nsunset wash.<\/p>\n<ul>\n<li><strong>Code is behind.<\/strong> <code>AppAccents.swift<\/code> still\nhas Training C4472A / EE6A4C and Kitchen dark D49A52. The sheets\nwin.<\/li>\n<\/ul>\n<h3 id=\"24-the-ember-rule-and-contrast\">2.4 The Ember rule and\ncontrast<\/h3>\n<ul>\n<li><strong>Ember is Tess's color<\/strong> (215 final):\n<ul>\n<li>light: FF5A26 (middle), E5341C, FFA90F;<\/li>\n<li>dark: FF6B3D, FF4A33, FFC23D.<\/li>\n<\/ul><\/li>\n<li>Nothing else on screen may sit within \u0394E00 10 of Ember. The only\nexception is the accent of the room currently cueing her (she takes that\naccent at L 0.64 light / 0.74 dark).<\/li>\n<li>Cobalt is no longer reserved for Tess.<\/li>\n<li><strong>Contrast:<\/strong> every text color reaches 4.5:1 on F7F5F1\nand on 000000. A color under that bar is for large text or strokes only\n(go 2FA24D was 3.0, so it moved to 25803D).<\/li>\n<li><strong>Spacing between colors:<\/strong> every role color sits \u0394E \u2265\n10 from Ember and from its own room's accent.<\/li>\n<li>Check new colors with a script (the c241 check.py approach), using\n\u0394E2000, not CIE76.<\/li>\n<\/ul>\n<h2 id=\"3-type\">3. Type<\/h2>\n<ul>\n<li><strong>Figtree<\/strong> for words. <strong>Outfit<\/strong> for\nnumbers, with tabular figures (<code>tnum<\/code>) and fractions as\ndigits with <code>frac<\/code>. <strong>Newsreader<\/strong> only for\nTess's own words (New York in the app). Licences: SIL OFL, credited on\nAbout.<\/li>\n<li>Sentence case everywhere. US words. Never name a city.<\/li>\n<li><strong>Number weight:<\/strong> Outfit 300 below 28 pt and 200 from\n28 pt up. An estimate is one step lighter than an exact value and always\nreads \"about\".<\/li>\n<li><strong>Units:<\/strong> the unit sits at about half the numeral's\nsize, minimum 10 pt, Figtree 400, ink2, 2 pt after the number, joined by\na no-break space. Every weight shows lb or kg.<\/li>\n<li><strong>Copy:<\/strong>\n<ul>\n<li>Digits for counts.<\/li>\n<li>\"6 pm\", never \"at 6 pm\".<\/li>\n<li>Dates as \"Oct 12\".<\/li>\n<li>\"best\", never \"record\".<\/li>\n<li>Receipts read \"Thing, what happened.\" (\"Tacos, 2 added.\").<\/li>\n<li>Money undo reads \"Reversed\".<\/li>\n<\/ul><\/li>\n<li><strong>Sizes in use:<\/strong><\/li>\n<\/ul>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Element<\/th>\n<th>Type<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Room title<\/td>\n<td>Figtree 700, 40 pt<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Door page title<\/td>\n<td>34 pt<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Home date<\/td>\n<td>Figtree 600, 23 pt<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Home rows<\/td>\n<td>500, with 700 highlights<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>One thing, big tier<\/td>\n<td>Figtree 700 38 pt, or Outfit 400 56 pt<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>One thing, mid tier<\/td>\n<td>500, 20 pt<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>One thing, small tier<\/td>\n<td>500, 15 pt, ink2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Action word<\/td>\n<td>600, 20 pt<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Small caps labels<\/td>\n<td>13 pt, 600, tracked 0.06 em<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Smallest text<\/td>\n<td>13 pt (word wall and labels); units 10 pt<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Title fit (his 9:11 PM):<\/strong> big fixed titles shrink 1\npt at a time to a floor of about 0.75x, then cut at whole words or use\nTess's short form. Examples:<\/li>\n<\/ul>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Title<\/th>\n<th>Range<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>exercise name<\/td>\n<td>34 \u2192 26<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Kitchen reel<\/td>\n<td>46 \u2192 34<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>dial focus<\/td>\n<td>44 \u2192 32<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>wheel focus<\/td>\n<td>28 \u2192 21<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>note title<\/td>\n<td>28 \u2192 21<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Home's sentence lines keep a fixed size. Never use \"...\".<\/p>\n<ul>\n<li><strong>Fixed text slots (224):<\/strong> every shown piece of text\nhas a fixed width and line count.\n<ul>\n<li>The phone measures each written form, full to short, and shows the\nlongest form that fits.<\/li>\n<li>If none fits, the on-device model (never Claude) writes a shorter\none. Names, digits and days survive.<\/li>\n<li>VoiceOver reads the full text.<\/li>\n<li>Input fields are exempt.<\/li>\n<li>The QA fit test runs at default size, AX3 and AX5.<\/li>\n<\/ul><\/li>\n<li><strong>Section labels:<\/strong> small caps, 600, tracked, in the\nsection color (slate, or ink2 in Lists). Items stay sentence case in\nink. <strong>Unconfirmed:<\/strong> the page-palette rule puts a hairline\nunder the label, but 230 and 246 draw none.<\/li>\n<li><strong>Word wall type (246):<\/strong> Figtree 900 capitals,\n\"sharpened\" with a same-color outline at 3.5% of size and mitred joins,\ntracking \u22120.01 em. Letters are never spaced unevenly, there are no gaps,\nand stretch is at most 8%.<\/li>\n<\/ul>\n<h2 id=\"4-layout-grammar\">4. Layout grammar<\/h2>\n<ul>\n<li><strong>Frame:<\/strong> 402 \u00d7 874 pt (iPhone 17), 24 pt gutters. Hit\ntargets are at least 44 pt.\n<ul>\n<li>The back edge zone is 0-24 pt and nothing else takes it.<\/li>\n<li>The action word starts 28 pt or more from the left edge.<\/li>\n<li>Tess's corner is bottom right.<\/li>\n<\/ul><\/li>\n<li><strong>Home slots (236 v2.2, approved):<\/strong><\/li>\n<\/ul>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Slot<\/th>\n<th>y (pt)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>board, three 30 pt rows<\/td>\n<td>84-180<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>mosaic, 248 \u00d7 160, right<\/td>\n<td>210-370<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>one thing<\/td>\n<td>400-612 (hard clip 92 pt from the right, where the sign sits)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>apps list, 3 \u00d7 40<\/td>\n<td>640-760<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>foot: Undo line left, Tess right<\/td>\n<td>768-840<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Home has no ScrollView. The gaps scale on other sizes.<\/p>\n<ul>\n<li><strong>Landings<\/strong> are a summary plus doors into sub-areas,\nnever a full list (his 11:27 PM). The approved pattern is Notes (246):\n<ul>\n<li>title at 54;<\/li>\n<li>one ink2 line;<\/li>\n<li>an expressive element on the mosaic slot (word wall, x 24-378, y\n180-400);<\/li>\n<li>doors on a 3-place dial at 432-576;<\/li>\n<li>one line at 612;<\/li>\n<li>the action word at the bottom left.<\/li>\n<\/ul><\/li>\n<li><strong>Deeper pages (247):<\/strong>\n<ul>\n<li>Dials are for landings only.<\/li>\n<li>Each depth level has one fixed block, identical on every sibling\npage (Notes door wall 354 \u00d7 132 at y 140, list from y 300).<\/li>\n<li>Font sizes vary per page to fill the block exactly.<\/li>\n<li>No gaps, and no row of all-equal sizes.<\/li>\n<\/ul><\/li>\n<li><strong>226 four bands<\/strong> (approved 5:40 PM Oct 23): headline\n170, brief 50 (two lines, right-aligned), body 262 (1-3 columns on a 24\npt line grid, six lines then pages), foot 36. The <em>layout<\/em>\nstands, but 240, 242 and 246 superseded the <em>landing\ncontent<\/em>.<\/li>\n<li><strong>Foot (224):<\/strong> one action word at the bottom left in\nthe room accent, Tess at the bottom right. No menus, no door rows, no\ntab bars. The title tap opens the room's index. A pull from the right\nmargin opens the side (76). The left edge goes back.<\/li>\n<li><strong>Long lists:<\/strong> fewer items per page and page turns,\nnot endless scroll (his Oct 17 rejection of sheet 89). Page turn = pages\nof 5-6 rows. One column for long lists; a right-hand value column is\nallowed, and moves under the name at AX sizes.<\/li>\n<li><strong>Element kit (222, \"all of them are really\ncool\"):<\/strong><\/li>\n<\/ul>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Element<\/th>\n<th>What it is<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>drum<\/td>\n<td>words on a cylinder past a reading line<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>thumb arc<\/td>\n<td>a quarter circle at the bottom-left corner, shown only while a value\nis being set<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>page turn<\/td>\n<td>long lists as pages<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>fold<\/td>\n<td>pinch to regroup days, weeks and months<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>word strip<\/td>\n<td>a sideways run of words<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>thread<\/td>\n<td>a cord pulled to advance a step<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>pressed number<\/td>\n<td>numbers as instruments; changes go on Undo with \"was\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The lens element was later rejected.<\/p>\n<ul>\n<li><strong>Wheels (230):<\/strong> the shared <code>mkWheel<\/code>\ncomponent, with 40 pt rows and the focus row at 30 pt. Rows step down\nwith distance (20, 17, 15 pt in ink2). A header sits as row \u22121 in small\ncaps. Focus snaps one row on the spring with a tick, and the wheel\nsprings back to \"now\" 6 s after the last touch.<\/li>\n<li><strong>Dials:<\/strong> 3 places only (the focus plus one above and\none below), 48 pt slots, looping. The focus is 1.32x in its meaning\ncolor; neighbors are ink2. A tap on a neighbor turns to it, and a tap on\nthe focus opens it.<\/li>\n<li><strong>Pixels, tiles and mosaic<\/strong> belong to Home only.\nInside rooms: type, hairlines (1-2 pt), negative space and columns.<\/li>\n<\/ul>\n<h2 id=\"5-motion-and-charms\">5. Motion and charms<\/h2>\n<ul>\n<li><strong>Rules:<\/strong>\n<ul>\n<li>Everything animates through MotionPolicy\n(<code>.tesseraAnimation<\/code>,\n<code>withTesseraAnimation<\/code>).<\/li>\n<li>House spring: Spring(duration 0.42, bounce 0.12). Firm: 0.35 / 0.\nSnappy: 0.25, for direct manipulation. Celebrate: bouncy 0.5, rare.<\/li>\n<li>Ink dry: 1.1 s after a 0.4 s hold.<\/li>\n<li>No linear curves. No fades on text: reveals are clips or rises.<\/li>\n<\/ul><\/li>\n<li><strong>Reduce Motion:<\/strong> a 150 ms crossfade or a plain\nappear, and effects go off.<\/li>\n<li><strong>Low Power<\/strong> turns off depth blur and auto-turns.\nReduce Transparency turns off blur.<\/li>\n<li><strong>Haptics (175):<\/strong> one per moment. Tick for picking and\nscrubbing, soft for landing or marking (Undo too), rigid for finishing.\nNever on scroll, never a warning buzz.<\/li>\n<li><strong>Depth blur on every wheel:<\/strong> 0.65 pt one row out and\n1.0 pt two or more rows out (230); the Notes dial goes up to 1.8 pt\n(246). Never on the focus. None under Reduce Motion, Reduce Transparency\nor Low Power. This is the only blur allowed.<\/li>\n<li><strong>Numbers (138, 230):<\/strong>\n<ul>\n<li>Numbers never step with \u2212 / +. They scroll: drag 16 pt per value,\nwith a tick, while ghost values show at 0.42x in ink3.<\/li>\n<li>A tap opens a full depth-wheel dial.<\/li>\n<li>After a hand change, \"was 185\" shows for 2 s under the new value,\nnever on money.<\/li>\n<li>Digits roll.<\/li>\n<li>Unit turn: tap or swipe the unit word to convert, and the digits\nroll.<\/li>\n<li>Pressure: weight rises with drag speed.<\/li>\n<\/ul><\/li>\n<li><strong>Word effects:<\/strong>\n<ul>\n<li>Weather words act out their weather (236 v2.4-2.8): one effect per\nWeatherCondition. Clouds appear only on mostly sunny, partly cloudy and\ncloudy, level with and behind the word. Sunny is shine only. Fog masks\nthe word (he loves it). Rain and snow have no cloud. Flashes stay well\nunder 3 per second.<\/li>\n<li>Home board rows flip letter by letter like a departure board, every\n5-10 s with jitter.<\/li>\n<li>The word wall has single-word moments every 5 s (flip, jumble,\ndissolve), a swap and re-pack every 40 s, and a whole-wall moment every\n2 min.<\/li>\n<li>Tess's words reveal one word at a time (62 ms each) with a 3 pt\nrise. No letter flips in conversation.<\/li>\n<\/ul><\/li>\n<li><strong>Action word gestures (230, every room):<\/strong>\n<ul>\n<li>Tap does the action. Drag left for stop or remove, right for again\nor redo.<\/li>\n<li>The word leans up to 18 pt. Past 56 pt it rolls to the option's name\nwith a selection tick.<\/li>\n<li>Release commits with a medium impact and a \"Thing, what happened.\nUndo\" receipt.<\/li>\n<li>Short of 56 pt it springs back with a soft tick. A side with no\noption moves 6 pt with a rigid tick.<\/li>\n<li>VoiceOver gets each option as an accessibilityAction.<\/li>\n<\/ul><\/li>\n<li><strong>Undo<\/strong> lasts 10 s everywhere. There is one app-wide\nUndo slot. Money reads \"Reversed\".<\/li>\n<li><strong>Transitions:<\/strong>\n<ul>\n<li>A word becomes its page (matched geometry). Pages slide in from the\nright; the left edge goes back.<\/li>\n<li>Receipts travel home from Tess's corner.<\/li>\n<li>Sheets lift like paper, with no shadow or dim.<\/li>\n<\/ul><\/li>\n<li><strong>Little details<\/strong> he loves: the Sunset word painted\nwith the sky gradient, the Kitchen skyline, the fog. Look for one or two\nsmall, subtle touches per board. They must never be loud or heavy.<\/li>\n<\/ul>\n<h2 id=\"6-gesture-rules\">6. Gesture rules<\/h2>\n<ul>\n<li>Swipe right means Done, swipe left means Not now. There is one 90 pt\nstep, never two (207). Policy (<code>gesture-policy.md<\/code>):\n<ul>\n<li>A drag starts at 10 pt; the axis locks at 12 pt.<\/li>\n<li>A row arms at 96 pt; a flick is 500 pt/s with 28 pt of travel.<\/li>\n<li>A tap is held off for 120 ms after a wheel settles.<\/li>\n<\/ul><\/li>\n<li>A single swiped element takes both axes: left or up for next, right\nor down for previous. The exceptions are when the two axes mean\ndifferent things, and dials, wheels and rails.<\/li>\n<li>A strip or zone owns any drag that starts on it, until lift. A\nparent never decides for a child's region.<\/li>\n<li>Swipers slide 1:1, with no lens or glass, no page dots, no \"N of M\".\nThe first time, the next item peeks 12 pt.<\/li>\n<li>Weeks start Monday.<\/li>\n<li>Edges (76): left edge = out/back; right margin = in (glance, then\nfull side); the middle = along a run; vertical = reading.<\/li>\n<\/ul>\n<h2 id=\"7-banned-with-the-reason-so-nobody-re-offers-it\">7. Banned (with\nthe reason, so nobody re-offers it)<\/h2>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Banned<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Cards, pills, button shapes, glass slabs (no-buttons, Oct 15)<\/td>\n<td>He dislikes every rectangular, oval or pill shape, Apple's\nincluded<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bars, rings, gauges, chart furniture<\/td>\n<td>They read as generic dashboards. The barbell is an object, not a\nmeter<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Middle dots, filled or colored dots, bullets (no-dots)<\/td>\n<td>They distract. A \" \u00b7 \" is allowed only in a pack size<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Decorative underlines (8:58 PM Oct 23)<\/td>\n<td>An underline is for linked words only, never a marker. Home has\nnone<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Fades on text, \"...\", \"N of M\" counters<\/td>\n<td>Layout and text must feel solid. Cut at whole words<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lens or glass on swipes (10:51 PM Oct 23)<\/td>\n<td>\"I don't want that lens effect at all\"<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pixels or tiles outside the Home mosaic (4:27 PM Oct 23)<\/td>\n<td>Overused. Pixel lintels 210 and 217-225 are dead<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>\u2212 / + steppers<\/td>\n<td>Numbers scroll<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Bottom menus, door rows at the foot, tab bars<\/td>\n<td>One action word only<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Blur, other than wheel depth<\/td>\n<td>No soft patches. Tess is never diffused<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Two-color pages<\/td>\n<td>\"Too monotonic\"<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Big type sharing one color<\/td>\n<td>\"All of it in blue, looking the same\"<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Anything within \u0394E 10 of Ember<\/td>\n<td>Ember is Tess's<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Drawn food stand-ins (pan, grocery)<\/td>\n<td>They read poorly. Only his photo, or nothing. The muscle figure is\napproved<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Fine-line drawings on landings (240)<\/td>\n<td>\"Drawings are the worst\"<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Text that wraps or moves layout<\/td>\n<td>Layout jumps feel broken to him<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"8-learnings-what-he-liked-what-he-rejected-the-patterns\">8.\nLearnings: what he liked, what he rejected, the patterns<\/h2>\n<p><strong>Liked:<\/strong><\/p>\n<ul>\n<li>the living pixel mosaic and the departure-board sentence (200);<\/li>\n<li>the mosaic lending its pixels to the one-thing sign (his own\nidea);<\/li>\n<li>the Sunset sky word, the Kitchen skyline, the fog word;<\/li>\n<li>the element kit (222);<\/li>\n<li>the word wall / word band (12:43 AM Oct 24, \"the first landing idea\nhe liked\");<\/li>\n<li>the 3-place dial;<\/li>\n<li>Soft dark;<\/li>\n<li>the stack-and-handle set mark;<\/li>\n<li>the Tess smooth cloud (rev 9+);<\/li>\n<li>the muscle figure;<\/li>\n<li>weather word effects (\"all good, very glad\").<\/li>\n<\/ul>\n<p><strong>Rejected, in time order:<\/strong><\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Date and time<\/th>\n<th>Rejected<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Oct 15-21<\/td>\n<td>the machined look; Inter Tight; Fraunces; Cormorant and Urbanist\n(116: \"too sharp\")<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Oct 17<\/td>\n<td>sheet 89 density<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Oct 18<\/td>\n<td>food drawings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Oct 22 4:47 PM<\/td>\n<td>the Tess orb/Sphere skin (\"ugly\")<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Oct 23 11:16 AM<\/td>\n<td>the 208 apps dial and the simplified Tess<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Oct 23<\/td>\n<td>dabs, wet paint, sun core and turbulent texture for Tess; the\nlip-sync mouth; presets and underlined offers in her layer<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Oct 23 4:27 PM<\/td>\n<td>crimson for Training; pixel lintels<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Oct 23<\/td>\n<td>captions at the mosaic edge; the square mosaic skin<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Oct 23 9:33-10:06 PM<\/td>\n<td>tally marks, \"5 5 5\", Pulse, Climb, Waves, Arrows, plate stack (set\nmarks)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Oct 23 10:51 PM<\/td>\n<td>the lens<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Oct 23 11:39-11:52 PM<\/td>\n<td>the doors list, the big reel, and the summary-plus-2-column grid\n(\"sections and sections of lists again\")<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Oct 24 12:07 AM<\/td>\n<td>all of 240<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Oct 24 12:27 AM<\/td>\n<td>242 round 1: strings and chimes \"too bad\"; swarm \"too much\"<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Oct 24<\/td>\n<td>tide (\"doesn't have anything\"); Archivo condensed; the spine shelf\n(he likes columns, reuse them elsewhere); plain door rows (\"too basic\");\nthe pile (2:02 AM)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Patterns behind his feedback:<\/strong><\/p>\n<ol type=\"1\">\n<li><strong>\"Too basic\"<\/strong> means plain rows or stock lists. Give\nhim an instrument (dial, wall) instead.<\/li>\n<li><strong>\"Too monotonic\"<\/strong> means too few colors, or big words\nthat share a color. Use 3-4 role colors.<\/li>\n<li><strong>\"Too much\"<\/strong> means the effect outweighs the\ninformation it carries. Every effect must carry real state.<\/li>\n<li><strong>He hates gaps, uneven spacing and uneven letter\nspacing.<\/strong> Packed and justified is right; fillers and repeats are\nfine.<\/li>\n<li><strong>Stacked sections read as \"lists again\".<\/strong> Compose one\npage instead.<\/li>\n<li><strong>Fine-line drawings and literal metaphors (strings, chimes,\njars) fail.<\/strong> Kinetic type works.<\/li>\n<li><strong>Layout must never jump.<\/strong> Use fixed slots.<\/li>\n<li><strong>He likes expressive elements \"at the mosaic's\nlevel\"<\/strong> but not the mosaic itself in rooms.<\/li>\n<li><strong>When changing a piece, never drop approved pieces.<\/strong>\nList every carried feature (Home, 1:07 PM Oct 23).<\/li>\n<li><strong>Iterate one room at a time<\/strong>, landing first (6:06 PM\nOct 23). Explore several display options before picking.<\/li>\n<li><strong>Re-asking settled questions frustrates him.<\/strong> Check\nmemory and sheets first, and give one recommendation per question.<\/li>\n<li><strong>He cannot open file paths<\/strong> (/mnt and local). Show\nevery visual as a claude.ai artifact page, and the phone is where he\ntruly reviews.<\/li>\n<\/ol>\n<p><strong>How the design process worked:<\/strong><\/p>\n<ul>\n<li><strong>Each round<\/strong> = one board artifact plus a numbered\nsheet (the number goes up with time), indexed in README.md. NEWER\nWINS.<\/li>\n<li><strong>Each board<\/strong> has a light/black flip and live\nelements. It is versioned in place (same URL, v1 \u2192 v20), and a re-cut\nkeeps the URL.<\/li>\n<li><strong>His verdicts<\/strong> are logged by PT time (\"his 9:20 PM\")\nin the sheet and in memory. A version is \"approved\" only when he says\nso; a board is a reference and the sheet is the spec.<\/li>\n<li><strong>Reviewer pass<\/strong> (manager-reviewer.md) before a round\ngoes out: look, accents, motion, privacy, tone, process. Then the round\ngoes to the builders, split by lead:\n<ul>\n<li>Builder A: Training, looks, motion, mosaic;<\/li>\n<li>Builder B: Home, Notes, Kitchen, Lists, Routines, Money;<\/li>\n<li>Core: data and AI.<\/li>\n<\/ul><\/li>\n<li><strong>Each feature<\/strong> sits behind a Review switch (default\nOff), or is on by default when he asks.<\/li>\n<li><strong>Sheets reach the repo<\/strong> through docs PRs\n(<code>docs/handoff/design-sheets/<\/code>), which merge always.<\/li>\n<li><strong>Cadence:<\/strong> design never idles. One short reply per\nround with the board link. Real forks still go to him.<\/li>\n<\/ul>\n<h2 id=\"open-questions-and-contradictions\">Open questions and\ncontradictions<\/h2>\n<ol type=\"1\">\n<li>Ember: 241's table measures against Ember \"3433D6 D6266E F2B21B\"\n(the old living-colours palette), but Tess's Ember is FF5A26 / E5341C /\nFFA90F (215). 241's \u0394E column may be against the wrong colors.\nRe-measure.<\/li>\n<li>Notes 246 and 247 put \"From Tess\" in \"Tess blue\", but Tess is Ember\nnow. The color for Tess's words in rooms is unconfirmed.<\/li>\n<li>Proposed Notes plum 8A4570 / E3A3CB shares its light hex with Legs\nand People plum (D69CC0 dark) and is close to Routines plum 8E4A78.<\/li>\n<li>Money: sage (241, code) or sea teal 2A7878 / 7BC0C4 (README,\n223)?<\/li>\n<li>Wheel blur cap: 1 pt (230) or 1.8 pt (246 dial)?<\/li>\n<li>Section labels: with a hairline under (page-palette-rule) or none\n(230, 246)?<\/li>\n<li>Stray counters: \"1 of 6\" (237 kinds row) and \"1 of 2 pages\" (226 AX\nstate) break the no-counter rule.<\/li>\n<li>Weather 243 writes \"4 PM\"; the copy rule says \"4 pm\".<\/li>\n<li>Code accents (AppAccents, Looks) lag behind 230 and 241. The\nSKILL.md and DESIGN_MOTION.md visuals are stale.<\/li>\n<\/ol>\n"}, {"id": "p2", "name": "Home and Tess", "html": "<h1 id=\"02-home-and-tess\">02 Home and Tess<\/h1>\n<p>State as of Oct 24, 2026. Newest sheet wins. The Home spec today is\n<strong>sheet 236 v2.2 (approved: \"exactly like this on the phone\") plus\nv2.3-v2.8<\/strong>, layered on 199-216 and 220. Everything from 199\nonward carries over unless 236 replaced it (his 1:07 PM Oct 23: \"I want\nall the previous features too\"; never drop approved Home pieces when the\nmosaic changes). Tess today is <strong>215-final (Rev 9 cloud + Revs\n11-21)<\/strong>.<\/p>\n<p>Boards (private to Kaushik): Home now <a\nhref=\"https://claude.ai/artifact/DygjFLo442RxyE1kmn4rJM\">https://claude.ai/artifact/DygjFLo442RxyE1kmn4rJM<\/a>\n(v11). Earlier Home board (200-216) <a\nhref=\"https://claude.ai/artifact/1aLhfDtkLbG2dFYbjUFVmp\">https://claude.ai/artifact/1aLhfDtkLbG2dFYbjUFVmp<\/a>.\nOne thing (213) <a\nhref=\"https://claude.ai/artifact/VgyTXVBnXhMXW1ujG1qE1X\">https://claude.ai/artifact/VgyTXVBnXhMXW1ujG1qE1X<\/a>.\nScene gallery (214) <a\nhref=\"https://claude.ai/artifact/PBUKcPYqbmhP4xs9iZrmcK\">https://claude.ai/artifact/PBUKcPYqbmhP4xs9iZrmcK<\/a>.\nSwitchboard (204) <a\nhref=\"https://claude.ai/artifact/Lc5mhAxYvDnNdbF18a3rho\">https://claude.ai/artifact/Lc5mhAxYvDnNdbF18a3rho<\/a>.\nTess (215) <a\nhref=\"https://claude.ai/artifact/7g8r4LzjRV6LeHDxMJ5yiZ\">https://claude.ai/artifact/7g8r4LzjRV6LeHDxMJ5yiZ<\/a>\n(v22). Weather room (243) <a\nhref=\"https://claude.ai/artifact/NyeaiLgka6cPQX3vqWZ1jj\">https://claude.ai/artifact/NyeaiLgka6cPQX3vqWZ1jj<\/a>.<\/p>\n<hr />\n<h2 id=\"1-home\">1. Home<\/h2>\n<p><strong>Purpose.<\/strong> The one screen that says what today is and\nwhat matters next, in words, with one living picture (the mosaic). Every\nhighlighted part is a door into a room. No money on Home, ever.<\/p>\n<h3 id=\"11-layout-fixed-slots-no-scrollview-236-v2-1\">1.1 Layout (fixed\nslots, no ScrollView) (236 v2 \u00a71)<\/h3>\n<p>No scrolling page. Five fixed slots fill the screen; nothing moves\nwhen text changes.<\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Block<\/th>\n<th>402 x 874 (iPhone 17)<\/th>\n<th>390 x 844<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Top board, 3 rows x 30 pt + 3 pt gaps<\/td>\n<td>y 84-180<\/td>\n<td>66-162<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Gap<\/td>\n<td>30<\/td>\n<td>26<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Mosaic, core frame 248 x 160, right-aligned (right margin 24)<\/td>\n<td>210-370<\/td>\n<td>188-348<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Gap (starts no gesture)<\/td>\n<td>30<\/td>\n<td>26<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>One thing<\/td>\n<td>400-612 (212 tall)<\/td>\n<td>374-578 (204)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Gap<\/td>\n<td>28<\/td>\n<td>24<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Apps list, 3 rows x 40<\/td>\n<td>640-760<\/td>\n<td>602-722<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Foot: Undo line left (15 pt, Figtree 500, ink2), Tess right<\/td>\n<td>768-840<\/td>\n<td>734-810<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Other phone sizes: the three gaps and the one-thing height (196-232)\nshare the difference evenly.<\/li>\n<li>The word \"Settings\" sits on row 1's line, at the left (plain word,\n44 pt target; 194 \u00a70).<\/li>\n<li>No 80 pt Tess band and no 56 pt bottom inset: Tess overlays the\nfoot, bottom right.<\/li>\n<\/ul>\n<h3 id=\"12-type-on-home-236-2\">1.2 Type on Home (236 \u00a72)<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Element<\/th>\n<th>Spec<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Date (row 1)<\/td>\n<td>Figtree 600, 23 pt<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rows 2-3 plain words<\/td>\n<td>Figtree 500, ink<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Rows 2-3 highlighted part<\/td>\n<td>Figtree 700, room accent, <strong>no underline<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Numbers<\/td>\n<td>Outfit 400<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Apps list names<\/td>\n<td>Figtree 600, ink<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Apps fact line<\/td>\n<td>Figtree 500, 15 pt, ink2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>One-thing big tier<\/td>\n<td>Figtree 700 38 pt (words) / Outfit 400 56 pt (numbers)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Nothing on Home uses ink3 text. Thinnest text is 500 (numerals 400).\nIf the phone looks lighter than the board, the sizes are wrong, not the\ncolors. No underlines anywhere on Home.<\/p>\n<h3 id=\"13-top-board-date--two-rows-of-notices-212-216-236-3\">1.3 Top\nboard: date + two rows of notices (212, 216, 236 \u00a73)<\/h3>\n<ul>\n<li><strong>Rows are fixed<\/strong> (216 \u00a71): 3 rows x 30 pt (23 pt type\nx 1.3), right-aligned, top pinned to safe area + 16. One line per row\nalways: no wrap, no \"...\", font never shrinks. Every notice has ordered\nfull/short forms; the row shows the longest that fits (224). Tess may\nwrite a shorter form on device; facts (names, digits, days) are never\ndropped.<\/li>\n<li><strong>Row 1, the date<\/strong>: \"Friday, October 23\" (US order,\nweekday first). Door to Today. Colored with the <strong>sky of the\nhour<\/strong> as a left-to-right gradient across its letters (216\n\u00a72):<\/li>\n<\/ul>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Hours<\/th>\n<th>Light<\/th>\n<th>Dark / Black<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>5-11 AM morning<\/td>\n<td>A9621A -&gt; C2507A<\/td>\n<td>E6A97E -&gt; E07FA0<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>11 AM-5 PM day<\/td>\n<td>2F6FD0 -&gt; 237E92<\/td>\n<td>6FA4FF -&gt; 5CC6D2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5-8 PM evening<\/td>\n<td>BF6A22 -&gt; A33C62<\/td>\n<td>E8A06A -&gt; F286A6<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>8 PM-5 AM night<\/td>\n<td>4B3FA8 -&gt; 2D3F7A<\/td>\n<td>A79CF0 -&gt; 7E95D8<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Rain or snow eases the second stop 30% toward slate (34506F /\nA7BCD6). On a day with something due, the weekday word takes the first\nstop's color at 700. All stops are \u0394E &gt;= 10 from Ember and &gt;= 3:1\nat 23 pt. When the hour band changes: one letter-flip pass, gradient\neases 600 ms.<\/li>\n<li><strong>Rows 2-3, notices<\/strong> (a departure board): one complete\nnotice per row, ending in a stop. Each notice names one highlighted\npart, which is its door: \"<strong>Bench<\/strong>, 185 for 5 again.\"\n-&gt; Training at that lift; \"<strong>Packing<\/strong>, 6 of 14.\" -&gt;\nthat list; \"<strong>Rice<\/strong> goes out today.\" -&gt; Pantry at\nLeftovers; \"Rain from <strong>4 PM<\/strong>.\" -&gt; Weather. Highlight\nis Figtree 700 in the meaning's color (weather words use their condition\ncolor, e.g. rain 557A93 / 9DBACE; 236 v2.1). Door hit area = full row\nheight around the highlight + 8 pt each side. Private items read by\ntheir shownLabel. At most 6 notices in rotation, ranked by Core\n(soonest/most important first).<\/li>\n<li><strong>Flip cadence<\/strong> (236 \u00a73): each row holds 7 s \u00b1 3 s\n(jittered, clamped 5-10 s); row 3 offset by half a hold so rows never\nflip the same second; an event (new notice, timer ends, set logged)\nflips its row at once; while a finger is on Home, flips wait until 2 s\nafter lift. Reduce Motion: plain swap every 10 s. Low Power and quiet\nhours (11 PM-7 AM): fixed 10 s. Paused in background and during a\ndoorway.<\/li>\n<li><strong>The flip itself<\/strong> (216 \u00a74, the board's setSentence):\neach character is a fixed cell laid out once at the target string.\nLetter set in order: space, a-z, A-Z, 0-9, \":\", \",\", \".\", \"'\". A cell\nwalks forward old -&gt; new in steps of ceil(n/9) (max 9 steps), 52 ms\nper step. Each step is a vertical flap scaleY 0.08 -&gt; 1 over 70 ms,\ncubic-bezier(.3,.7,.4,1), origin 50%/52%. No fade, blur or slide.\nStagger (row x 5 + index) x 14 ms. Unchanged cells stay. Added cells\nflip in from a space, dropped cells flip to a space then collapse. A new\nchange cancels the old (generation counter; cells snap to target first).\nOne soft haptic when the last character lands, only while Home is on\nscreen. VoiceOver reads the final text once. Letter flips live\n<strong>only<\/strong> on Home's top lines (never in Tess's\nconversation).<\/li>\n<\/ul>\n<h3\nid=\"14-weather-words-and-their-effects-236-v22-v28-approved-all-good-very-glad\">1.4\nWeather words and their effects (236 v2.2-v2.8; approved \"all good, very\nglad\")<\/h3>\n<p>Any weather word on Home (in a notice, the one thing) acts out its\nweather on a clear layer over the text. Never pixels or dots. Reduce\nMotion: no effect, the word keeps its color. Flash rate well under 3/s.\nOne effect per Core <code>WeatherCondition<\/code> case.<\/p>\n<ul>\n<li><strong>Tokens<\/strong> (light / dark): rain 557A93/9DBACE; snow\n6E8296/C9D6E2; wind 5E6E7E/B4C2CC; cloud 6B7480/B9C0C8; pcloud\n8A7552/DCCDAA (white-cloud days); moon 4A5788/B3BDE8 (nights); fog\n727880/A7ACB2; ice 2F7299/9FD0EE (freezing, cold warning, hail); storm\n53507A/ABA8DC; warn A23B27/F08F72 (wind and heat warnings); bolt\n5B4FD0/FFF1A8 (lightning only); sun = sky amber. Word color follows its\ncloud.<\/li>\n<li><strong>Clouds only on<\/strong> mainlyClear, partlyCloudy and\novercast (v2.8): flat-bottomed cumulus (union of puffs, filled once,\ntop-lit gradient, 1.6 pt soft rim), drawn <strong>level with the word,\nbehind it<\/strong>, clipped to the word box, width &lt;= half the word;\nsoft fog-style wisps in the cloud tone in front at alpha .3-.4. Puffs\nbreathe \u00b15% over ~1.8 s; drift \u00b18-16% of word width over 5-7 s.<\/li>\n<li>clear day: a bright sweep (white core) every 4 s with three 1.2 pt\nrays riding it (\"shine only\"). clear night: 4 star glints (thin 4+4 arm\nstrokes) grow and shrink. mainlyClear: shine or glints + one small white\ncloud. partlyCloudy: 2 white clouds .7-.78. overcast: 3 grey clouds\n.66-.74.<\/li>\n<li>fog: the word is masked where mist is thick (horizontal moving mask,\nmin 30% opacity), long soft page-colored wisps in front (alpha up to\n.8), fog-tinted haze behind. He loves the fog.<\/li>\n<li>Precipitation has <strong>no cloud<\/strong>; it starts at the word\ntop and falls to just under the line: drizzle 16 fine 3 pt strokes; rain\n11 strokes 7 pt (1.3 pt wide, alpha .85); heavyRain 20 slanted 9 pt +\nsplash ticks at baseline; freezingDrizzle/Rain the same in ice + a glaze\nline under the word with a traveling glint; snow 9 six-point flakes\n(alpha .95); heavySnow 17 flakes + a snow-cap line on the letters;\nsnowGrains 22 tiny fast ticks.<\/li>\n<li>thunderstorm: light rain + a bolt (2 flickers every 5.2 s), the word\nflashes bolt color. thunderstormHail: + 7 stroked-square ice pellets\nthat bounce once.<\/li>\n<li>windy: letters sway 4 pt / skew 12\u00b0 / rotate 2\u00b0 / lift 1.2 in a\nwave, 5 curved gusts alpha .75. windWarning: 1.35x sway + shiver, 8\nlonger gusts, warn color. heatWarning: letters waver in a traveling\nwave, 4 rising heat squiggles. coldWarning: frost crystals grow and fade\nat letter tops and baseline, ice color.<\/li>\n<li>Tapping any weather word opens the Weather room (243) through the\ndoorway, that word's sentence first.<\/li>\n<\/ul>\n<h3 id=\"15-the-mosaic-199-214-236-4-v21-v22-v27\">1.5 The mosaic\n(199-214, 236 \u00a74, v2.1, v2.2, v2.7)<\/h3>\n<p>A living pixel picture, the only place in the app with pixels/tiles\n(rooms' pixel lintels 210, 217-225 are superseded).<\/p>\n<ul>\n<li><strong>Grid<\/strong>: 4 pt step, tiles 3.2 pt on dark, <strong>3.6\npt on paper<\/strong> (gap 0.4) (v2.7), each tile one flat color.\nSwipe/touch zone = the core frame (right 24, 160 tall) + 8 pt.<\/li>\n<li><strong>Width per face<\/strong> grows left from the right margin,\neases between faces, breathes 1 tile: Now 88, Gallery 88, Weather 84,\nWorkout 72 tiles (v2.1). Extra width shows more (Weather: rain on its\nway at the left; Workout: the week's 7 days as 3x3 tiles, done lit,\ntoday pulsing).<\/li>\n<li><strong>Edge<\/strong> (202 Rev 3 + v2.1): squircle (corner radius 6\ntiles), colors climb out of the page over 16 whole tiles in Bayer 4x4\ndithered steps (24 levels, smootherstep from 8 tiles inside to 16\noutside; up/down climbs 2.2x faster so it clears the board and the one\nthing). Rim tiles sample the scene mirrored across the edge. No frame,\nno alpha fade, no blur; tiles always full size. On light looks the grade\nstays full strength across the frame; the climb happens only outside it.\nText shield: tiles under words are capped, feathered over 5 tiles.<\/li>\n<li><strong>Light grade<\/strong> (v2.7, not yet confirmed by him):\nsaturation x1.55 around the mean, x1.08 brightness, 5% shadow lift. Dark\nunchanged.<\/li>\n<li><strong>Faces (widget stack)<\/strong>, current list: <strong>Now,\nGallery, Weather, Workout<\/strong> (v2.1; \"more apps later\"). Now plays\nthe board's latest announcement, turning top row down as the flap turns\n(Rain: slate sky, falling drops, splashes on the bottom row; Rice: a\nbag; Bench: a barbell; Packing: a case filling; else the scene of the\nhour). Gallery: 214 scenes by hour, weather and kind of place, a\nscattered tile swap every ~9 s. Weather: pixel scene of now +\ntemperature and next change in pixel numerals. 236 \u00a74 also specs Place\n(&gt;80 km from home: skyline by kind of place + local time; name only\nwhile held, as pixel letters), Cooking, Shopping, Today (unconfirmed\nwhether still planned).<\/li>\n<li><strong>Turning<\/strong>: auto every 5-10 s on the same jittered\nclock, never the same second as a line flip; live context faces show 2\nof every 3 turns. Swipe across: 1:1 with the finger, commit past 35% or\non a flick, else spring back; light impact on commit. A touch pauses\nauto-turn 30 s. No page dots, no labels, no caption at the mosaic's edge\n(211); first time only, the next face peeks 12 pt for 600 ms. Reduce\nMotion: plain swap every 10 s. Low Power: swipe only. Quiet hours:\ngallery + weather every 20 s.<\/li>\n<li><strong>Tap a face<\/strong> opens its room (Training, Kitchen,\nPantry To get, Today, Weather).<\/li>\n<li><strong>Scenes<\/strong> (214): city at dusk, beach, mountains and\nlake, woods, desert, rain on the window, night sky, fields at sunrise,\nsnow, harbor, autumn trees. One small slow life each (max ~1 tile change\nper 150 ms). Black look mixes 18% toward 14121A, dark 30%, white x1.02.\nTess picks on the phone; he can pin one or ask Tess (\"show the beach\").\nNever name a place.<\/li>\n<li><strong>Carried behaviors<\/strong>: 200 moods (morning, day, golden,\nrunning, rest, back, done, rain, night) and changeovers (flip, wave,\nfall, wipe, dissolve, gather, melt); 201 moments (snow, fog, wind,\nstorm, heat, announce crawl, Tess eyes, timer, finished, best, reminder,\ndelivery); 204 switchboard (cue -&gt; effect -&gt; changeover; Tess &gt;\napps &gt; clock &gt; weather; moment beats mood; queue max 3; 11 PM-7 AM\nonly timer and reminder); 206 app glance motifs; 207/199 a tile flies in\non Done; 209 open reactions by time away (&lt;2 min ripple 0.9 s; 2\nmin-3 hr tiles flip from last scene row by row 1.4 s; first open after 4\nAM night falls away 2.2 s; 2+ days dusty pixels gather 2.4 s; cold\nlaunch gather from night 1.8 s; no haptic); 213 lent pixels. Touches\nlean the tiles (radius 36 pt, up to 5 pt). Reduce Motion: field still,\nchanges are plain swaps, no lean or ripple.<\/li>\n<li><strong>Doorway<\/strong> (206): opening a room, a wave spreads from\nthe touched word/face across the phone at 0.75 ms/pt (+ up to 30 pt\njitter); each 4 pt tile turns the room accent, flips 170 ms, lands as\npage ground. Back = left-edge swipe (0-24 pt), the same wave reversed.\nNo back word in rooms (4:16 PM ruling). Haptics: soft at start, light on\nland. Reduce Motion: plain swap.<\/li>\n<\/ul>\n<h3 id=\"16-the-one-thing-213-220-236-v2-3-v22-v23\">1.6 The one thing\n(213, 220, 236 v2 \u00a73, v2.2, v2.3)<\/h3>\n<p>One thing at a time under the mosaic. Replaces the old Next list and\nthe 209 mosaic pages.<\/p>\n<ul>\n<li><strong>Header<\/strong>: small-caps room word in its accent, 13 pt,\n600, tracked. No \"N of M\" counter.<\/li>\n<li><strong>Big<\/strong> (slot 64): one line, accent (ink for tasks);\nnumbers Outfit 400 56 pt, words Figtree 700 38 pt; fits down 1 pt at a\ntime to 0.75x, then the 224 short form. <strong>Mid<\/strong> (slot 28):\nFigtree 500 20 pt, ink, one plain sentence, no keyword, cuts at whole\nwords. <strong>Small<\/strong> (slot 22): Figtree 500 15 pt, ink2. Gaps\n8/6/6; block 154 pt centered in the slot.<\/li>\n<li><strong>Copy<\/strong>: Training \"6:30 pm\" / \"Push A, bench first\" /\n\"Bench best 205 lb, three weeks ago\". Kitchen \"4 to get\" / \"Tortillas,\ncilantro, limes\" / \"For tacos tonight, on the way home\". Lists \"6 of 14\"\n/ \"Packing, for Sunday\" / \"Next: socks, the book, the adapter\". Routines\n\"8 pm\" / \"Stretch, five minutes\" / \"Third night this week\". Weather\n\"64\u00b0\" / \"Clear until 4, then rain\" / \"Sunset at 6:34 pm\". Order = Tess's\non-device ranking, max 7.<\/li>\n<li><strong>Sign<\/strong> (A): 20 x 20 of the mosaic's own tiles (80\npt), centered on big+mid, text slots end 12 pt before it. Edge tiles\nkeep 33% of their source color. Built bottom row first, 6 ms stagger,\n420 ms low arc (lift 18). Its tiles fly out of the mosaic (lent cells\ngap and refill ~1.1 s). Every 4-7 s one tile flies to the mosaic and\nback. Drawings: loaded barbell (bobs), bag with greens, packing case\nfilling to its share, moon with twinkles, sun with turning rays.<\/li>\n<li><strong>Swipe<\/strong>: four ways. Left or up = next; right or down\n= previous. Horizontal commit 50 pt or a 300 pt/s flick; vertical commit\n44 pt. Text slides 1:1 under the finger with depth (tiers translate at\n.9/.72/.54), clipped to the slot (insets -57 top, -29 bottom); big and\nmid get a hard clip edge 92 pt from the right so text never passes under\nthe sign; small runs full width. No fade on edges, no lens. One light\nhaptic per page.<\/li>\n<li><strong>Done<\/strong> = press and hold on the big line (the only\nexception to swipe-right-Done): after 180 ms an ink strike (1.5 pt at\n55% height) draws over 0.6 s; release when full finishes it, shows Undo\n(10 s), next thing arrives; early release retracts. One rigid haptic. A\none-time hint replaces the old \"Hold to strike it through\" line.\nVoiceOver: \"Mark done\" plus adjustable next/previous.<\/li>\n<\/ul>\n<h3 id=\"17-apps-list-doors-to-apps-205-209-220-236-1\">1.7 Apps list\n(doors to apps) (205, 209, 220, 236 \u00a71)<\/h3>\n<ul>\n<li>Under the one thing, no label. 3 rows visible, 40 pt rows, wraps\nendlessly. Middle row is the pick: name swells 1.3x in its accent; its\none-line fact (15 pt 500 ink2) is revealed from the right by a clip\nsliding 14 pt (never a fade). Other rows show names only.<\/li>\n<li>Facts (Core, privacy-masked): \"Push A at 6:15 pm, bench first\",\n\"Tacos tonight, 4 to get\", \"Stretch at 8 pm\", \"3 left today\", \"Trip\npacking, edited at noon\", \"Packing, 6 of 14 done\", \"Rent is due Friday\"\n(money as words only).<\/li>\n<li>Scroll: moves 1:1, coasts with normal deceleration, rubber-bands,\nsnaps to the nearest row (.viewAligned). Selection tick per row crossed\nwhile the finger is down, none while coasting. Hold-and-scroll (220)\nstays: hold 180 ms within 6 pt, soft haptic, middle row 1.06x. Tap\nmiddle = open via doorway; tap another row = bring it to the middle.\nWhen it settles 240 ms on an app, the mosaic plays that app's glance\n(206). Vertical drags only.<\/li>\n<\/ul>\n<h3 id=\"18-touch-zones-236-v2-2\">1.8 Touch zones (236 v2 \u00a72)<\/h3>\n<p>A drag belongs to the zone it starts in until lift; direction locks\nafter 10 pt (sideways if it leads 1.3x). Mosaic: sideways turns faces,\ntouches lean pixels. One thing: four-way swipes + hold. Board: taps on\nhighlights only. Apps list: vertical only. Gap between mosaic and one\nthing: nothing. No page-level gesture turns things from the mosaic.<\/p>\n<h3 id=\"19-states\">1.9 States<\/h3>\n<ul>\n<li>Empty day: the one thing falls back to weather / a routine; notices\ninclude sunset. Quiet hours: flips at 10 s, mosaic gallery+weather only,\nno Tess unprompted.<\/li>\n<li>Private: shownLabel everywhere (\"Private workout\", \"Private, done.\nUndo\"), including inside the doorway and notices.<\/li>\n<li>Sample: until real data, weather shows the on-device sample; marked\n\"sample\" only in Settings (never on the mosaic).<\/li>\n<li>Never on Home: money amounts, health, body, calories, calendar\ntitles.<\/li>\n<\/ul>\n<h3 id=\"110-rejected-on-home-do-not-re-offer\">1.10 Rejected on Home (do\nnot re-offer)<\/h3>\n<ul>\n<li>194 six app edges / fan; 195-197 day ruler, day line, 270\u00b0 day ring;\n197 write line and mic on Home; 198 widget row with word tabs.<\/li>\n<li>208 apps dial with lens (11:16 AM Oct 23) and its simplified\nTess.<\/li>\n<li>202 screen-wide pixel layer (\"too pixelated\"); square skin edge;\nhard bright-side edge.<\/li>\n<li>209 captions under the mosaic, mosaic page captions; 211 day phrase\nas an underlined word.<\/li>\n<li>236 v2 glass lens on swipers (10:51 PM: \"I don't want that lens\neffect at all\").<\/li>\n<li>Underlines, \"N of M\" counters on swipers, ink3 on Home, heavy\nwide-spaced numerals (release 66 bug).<\/li>\n<li>213 parallax/slide was removed at 12:14 PM, then 1:1 slide with\ndepth came back in 236 v2.1-v2.3 (current).<\/li>\n<\/ul>\n<hr />\n<h2 id=\"2-tess\">2. Tess<\/h2>\n<p><strong>What she is.<\/strong> The in-app assistant, drawn as a small\nliving cloud (\"the soul\") in the bottom-right corner of every screen.\nShe speaks only when she has something or when touched. All reasoning is\non-device first; Claude only when \"Tess asks Claude\" is on.<\/p>\n<h3 id=\"21-body-215-final\">2.1 Body (215-final)<\/h3>\n<ul>\n<li>A smooth per-pixel cloud, spherical overall, with no boundary,\nfading into the page. Uniform texture: no noise, streaks, patches. Only\nthe soft edge moves, on slow waves. Drawing scaled 0.7 (Rev 21); visible\nsize small, <strong>touch target 84 pt<\/strong>.<\/li>\n<li>Radius R = 0.16 \u00b7 breath \u00b7 (1 + 0.1\u00b7spread) \u00b7 (1 + 0.26\u00b7bloom \u2212\n0.13\u00b7gather). Edge reach 1 + 0.045 sin(2\u03b8 + 0.42t) + 0.03 sin(3\u03b8 \u2212 0.33t\n+ 1.1) + 0.035 sin(\u03b8 \u2212 0.19t). Density exp(\u2212r^2.2 \u00b7 0.95). Alpha dark 1\n\u2212 exp(\u22123.1\u00b7dens) \u2212 .02 (peak 235); light 1 \u2212 exp(\u22124.6\u00b7dens) \u2212 .02 (peak\n242). Alpha reaches 0 inside her bounds (no ring).<\/li>\n<li>Breath 0.96 + 0.08 sin(0.98t) (+0.08 voice level); quiet: 0.03 at\n0.35x speed.<\/li>\n<li><strong>Color: Ember<\/strong>, [middle, side, side] light FF5A26,\nE5341C, FFA90F; dark FF6B3D, FF4A33, FFC23D. Three gaussian fields\n(sigma 0.76R) a third of a turn apart, turning 0.6 + 0.16t, middle at\n0.40R weight 1.08, sides at 0.56R. Plain OKLab mix, chroma up to 1.25x.\nColor lookup is warped by two broad sines (brush-sweep seams). Light\ngrounds: thin parts chroma x(1 + .45(1\u2212a)), L \u2212.025(1\u2212a). Bursts: one\nfield swells from a random inner point, every 2.2-5.7 s (5-11 s\nquiet).<\/li>\n<li><strong>Ember rule<\/strong>: nothing else on screen within \u0394E00 10\nof her Ember middle, unless it is the accent of the room cueing\nher.<\/li>\n<li><strong>Face<\/strong>: eyes at 1.3x, ink rgba(30,24,30,.86) light /\nrgba(21,21,23,.82) dark, &gt;= 3:1 else #111. Blinks 130 ms every\n2.4-6.6 s (18% double). Glances every 0.7-2.8 s (55% small, 27% to a\npoint of interest, 18% to him held 2.6 s); eyes follow the finger.\n<strong>Mouth<\/strong> only with meaning: smile (did what was asked),\nslant rising 0.5 pt right (waiting on his answer), \"oh\" for 1.4 s\n(something new arrived beside her). No lip sync, never a frown.<\/li>\n<li><strong>Life<\/strong>: leans after her eyes (0.45x), bobs \u00b11.1 pt.\nReactions are cloud envelopes: open (gather 13%/140 ms then bloom up to\n26%, burst from middle), close (bloom .45 over 320 ms), think (colors\nspin +.045/frame), done (4 pt hop 420 ms, .35 bloom, gold burst 1.6 s,\nhappy eyes 1.1 s), no (2.4 pt nod 360 ms), touch (.6 gather 220 ms,\nburst toward the finger, eyes 1.2x 320 ms), hearing (his voice level as\ntravelling edge waves, .28 catch per heard word, 1.6 pt lean). Reduce\nMotion: reactions off, eyes and blinks stay.<\/li>\n<li><strong>Ground awareness<\/strong> (213): samples luminance under her\nevery 0.5 s; light grounds draw normal + 30% multiply pass; dark grounds\nscreen.<\/li>\n<\/ul>\n<h3 id=\"22-how-she-cues-rooms-215-rev-20-g2-g4\">2.2 How she cues rooms\n(215 Rev 20 G2-G4)<\/h3>\n<ul>\n<li>In a room with one clear accent, her palette becomes a close palette\nfrom it: middle = the accent at L 0.64 (light) / 0.74 (dark), chroma\n&gt;= 0.15; sides \u00b118\u00b0 hue at L \u22120.05/+0.05. Home, or any screen with\nseveral accents, keeps Ember. She never averages accents.<\/li>\n<li>Change is a 1.2 s smoothstep glide, hue the short way in OKLCH, plus\na 0.28 catch. Reduce Motion: instant.<\/li>\n<li>Decided by\n<code>TessDirector.decide(.tessPalette(pageAccent), context)<\/code>\n(RuleDirector now, a model later); it sees only screen kind, accent and\nher state, never text.<\/li>\n<\/ul>\n<h3 id=\"23-in-the-corner-212-215\">2.3 In the corner (212, 215)<\/h3>\n<ul>\n<li>Bottom right, on her own top layer above every layer (mosaic,\nsheets, doorway); hit-testing only on her. 14 pt from right and bottom\n(212).<\/li>\n<li>No standing line. When she has something (on-device rule) or is\ntapped: one line to her left, right-aligned, up to 2 lines, in\nNewsreader 18 pt (New York in the app if Newsreader can't ship), words\narriving one at a time (62 ms each, +40 ms after punctuation, 3 pt rise\nover 180 ms, no fade), gone after 6 s. Names in her line are doors.\nLinked words weight 500, never break. Never speaks unprompted 11 PM-7\nAM.<\/li>\n<\/ul>\n<h3 id=\"24-gestures-on-her-215\">2.4 Gestures on her (215)<\/h3>\n<ul>\n<li><strong>Tap<\/strong>: opens her layer (below), typing ready.<\/li>\n<li><strong>Hold (&gt;= 0.35 s)<\/strong>: talk. She stays under the\nfinger at 1.3x; his live words show at once (Figtree Light 28); release\nsends; slide left &gt; 60 pt arms cancel. On-device speech only\n(SpeechAnalyzer), audio never kept; if the model isn't downloaded she\nsays so and the field opens.<\/li>\n<li><strong>Drag onto anything<\/strong>: ask about this (moves after 10\npt, sits 44 pt above the finger at 0.78 scale; light tick per target;\nanswers in the corner, then springs home). Open in build (builder-a\nhandoff).<\/li>\n<li><strong>Swipe up fast<\/strong> (&gt; 40 pt in &lt; 0.26 s): her\nroom, a circle growing from her corner: \"Watching today\" + today's log\n(time column Outfit, names as doors, Undo reading \"Reversed\" after use).\nOpen in build.<\/li>\n<li><strong>Double tap<\/strong>: quiet for an hour: eyes close, breath\nslows, top lines stop rolling, \"Quiet until 1:30 pm.\" once. Tap wakes\nher (two blinks).<\/li>\n<li>VoiceOver: one button with actions Ask, Talk, Open her room, Quiet\nfor an hour; every object gets \"Ask Tess about this\".<\/li>\n<\/ul>\n<h3 id=\"25-her-layer-215-rev-2-5-10-16-19\">2.5 Her layer (215 Rev 2, 5,\n10, 16, 19)<\/h3>\n<ul>\n<li>Opens over Home blurred 18 pt, saturation 1.15, 52% page tint (the\none place blur is used besides wheels; Reduce Transparency = page color\nat 92%). In/out 0.38 s. She moves to (W/2, H \u2212 112) at 1.35x.<\/li>\n<li>Top to bottom: state line (\"Ask me, or hold me to talk\"), the\nconversation, at most 3 plain replies (ink 17 pt, no underlines; a\ntapped reply flashes for 0.22 s and becomes his line; \"That's all\"\ncloses), the Type to Tess field (multi-line, grows to 120 pt; on the\nphone return adds a line and a send arrow sends).<\/li>\n<li>One running conversation (TessMemory, on device, 7 days, clearable\nin her room). Her newest line 23 pt Newsreader, older 17 pt; his words\nFigtree 17. Up to 9 items. Time markers Outfit 200 12 pt ink3, tracked\n.06 em, only after 20+ min gaps; after a gap she opens under \"Now, 1:31\npm\". Her opener picks up what changed (\"Since then, Push day moved to\n6:30. Stretch at 8 may run into it. Move it to 9?\"), never repeats or\ncontradicts. Echo: an earlier mention of a word she names again\nbrightens to ink for 0.9 s.<\/li>\n<li>Close: tap blurred Home, swipe down, tap her, Escape. Unsent drafts\nclear. Privacy: shownLabel only; money/health/body/calorie/calendar text\nnever stored; never on widgets, Lock Screen or notices.<\/li>\n<\/ul>\n<h3 id=\"26-speak--write--show-history\">2.6 Speak / Write / Show\n(history)<\/h3>\n<p><code>no-buttons.md<\/code> (Oct 15) and <code>calm-capture.md<\/code>:\ntap the soul and three dabs rose into a column of mode words Speak (y\n594), Write (664), Show (734); Write smeared a dab into a writing line;\nShow opened Photo, Video, File; hold = straight to Speak.\n<strong>Superseded by the 215 layer<\/strong>: tap = conversation with\nthe typing field, hold = Speak. Show (photo/video/file capture) has no\nhome in 215: unconfirmed whether it returns. Also superseded there:\ndouble-tap-soul-goes-to-Today (now Quiet), cobalt lines, vermilion\nUNDO.<\/p>\n<h3 id=\"27-rejected-tess-looks-never-re-offer\">2.7 Rejected Tess looks\n(never re-offer)<\/h3>\n<p>Orb/skin/Vegas Sphere (Oct 22 4:47 PM: \"tess is ugly\"); 208\nsimplified drawing; six dabs (\"two overlaid triangles\"); wet-paint\nmarbling (\"ugly\"); full rainbow ramp; visible blobs; a ring from clipped\nglow; sun-like solid core; flattened shape; readable body with feather\nedge; turbulent patchy gas; lip-sync mouth (\"what is that?\");\ntone-by-moment (removed); Lagoon/Dusk/Before palettes; presets and\nunderlined offer rows in the layer; letter flips in conversation.<\/p>\n<hr />\n<h2 id=\"3-weather-room-243-first-cut-open\">3. Weather room (243, first\ncut, open)<\/h2>\n<ul>\n<li><strong>Purpose<\/strong>: a basic Weather app; any weather word on\nHome opens it through the doorway with that word's sentence first. More\ncreative features later. Data: Open-Meteo (free, on by default, 0.1\u00b0\nrounding, 30 min cache; his 10:28 PM OK), air-quality API. WeatherKit\nwhen the paid account exists. Never show a city.<\/li>\n<li><strong>Landing (402 x 874)<\/strong>: y 54 \"Weather\" 40 pt 600 in\nsky amber C9772E / E8A06A, time right (Outfit 15 ink2). y 112\ntemperature Outfit 200 104 pt (degree 52 pt) colored by the current\ncondition; right of it 15 pt ink2 \"feels like 55\u00b0\" / \"high 61\u00b0, low\n49\u00b0\". y 238 line 1, 26/500: \"<Cloudy> now, <Rain> from 4 PM.\" (weather\nwords with their 236 effects). y 276 line 2 17 pt ink2. y 330 \"Next\nhours\"; y 350 hour columns 59 pt wide (time 13 ink2, temp Outfit 300 24,\none word 13/600 in its condition color); drag across or up/down pages 3\nhours; the strip owns drags that start on it. y 456 \"The week\"; y 476\none 22/500 sentence (line 34) naming only notable days, each weather\nword a door (44 pt hit) to that day. y 640 air line 15 pt ink2 (\"Air is\ngood, UV 2, wind 9 mph from the west.\", good in go green). Foot: action\nword \"Rain alert\" in rain color, &gt;= 28 pt from the left; tap toggles,\nreceipt \"You'll hear 30 minutes before rain.\" + Undo 10 s. Tess\nright.<\/li>\n<li><strong>Day page<\/strong>: day name 40 pt amber; high Outfit 200 88\npt in the day's condition color, low 40 pt ink3; the day's sentence 24\npt; hour columns; \"Sunrise 7:25 AM, sunset 6:06 PM.\" Slides in from the\nright (spring .42 s); back by edge swipe. Words on a covered screen\ndon't animate.<\/li>\n<li><strong>Colors<\/strong>: amber (room), condition colors by meaning,\nink/ink2, go green for good air.<\/li>\n<li>Build: #1401 room, #1402 adapter (both cloud-written, not compiled).\nOpen: wind direction, CoreLocation wiring, rain-alert notification.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"4-lock-screen-widgets-live-activities-as-they-touch-home\">4.\nLock Screen, widgets, Live Activities (as they touch Home)<\/h2>\n<p>The newest visual spec is old (Oct 16-23 surface sheets); only the\nrules below are firm.<\/p>\n<ul>\n<li><strong>Firm rules<\/strong> (142, 177, 190, 191, 215, 236 \u00a75):\nFigtree words, Outfit numbers, sentence case. Health, body, calories,\ncalendar, location, place names and Tess's conversation never reach\nwidgets, Lock Screen or Live Activities. Money only as due words (\"Rent\nis due Friday\"), never an amount. Private things read \"Private workout\"\n/ \"Private routine\"; private dishes \"Your dish\" / \"Timer done\". Lock\nScreen setting: Masked/Titles (private and walled stay masked\nregardless; 203). No badges, no emoji, no counts of what he missed.\nNotifications are one sentence (\"Rice, 2 min left.\"), actions are plain\nwords \"Done\", \"Not now\". Nothing on the Lock Screen asks.<\/li>\n<li><strong>Widgets<\/strong> (142, needs his yes, switch surfacesV2):\nmedium = the day sentence, up to 3 clauses, key words in their accent;\nsmall = the first clause; large = sentence + 3 next things. Older\n(widget-states addendum, Oct 16): each widget is Home's line, one\nsentence with a stop, no counts, no rings; the one number on a face is a\ntime or timer; words push in from below, numbers\n<code>.numericText()<\/code>. Tinted mode: ground drops, one accentable\nelement. Unconfirmed: whether widgets now mirror the 236 top board or\nthe mosaic.<\/li>\n<li><strong>Lock Screen accessories<\/strong>: inline = next clause by\nclock (\"Push A at 6:15\"); rectangular = clause + start time in Outfit\n300; circular = one word or a <code>Text(timerInterval:)<\/code> timer,\nno gauge. Controls (177): \"Log a set\", \"Start Morning\", \"Add a task\",\n\"Quiet\", words only, ink only.<\/li>\n<li><strong>Live Activities<\/strong> (142, 230): one per running process\nin its room's signature: Training = set marks + rest countdown (Outfit\n200); Cook = soonest timer + \"+2\", next step; Routine = step in words.\nRest end updates the activity + one local notification (sound follows\nthe silent switch). Updates are silent. The older lockscreen.md /\nlive-activity.md (Cobalt sky, Inter Tight, cream type, vermilion tick)\nare superseded in type and color; their structure (one number, one\naction, tap the set to log without unlocking, Undo) is the base.\nUnconfirmed: current color treatment.<\/li>\n<li><strong>The mosaic's Workout/Cooking faces<\/strong> mirror the Live\nActivity content on Home (current
