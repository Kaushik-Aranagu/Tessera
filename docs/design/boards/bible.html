 lift's mark + rest timer in pixels;\nrecipe step + timer).<\/li>\n<\/ul>\n<hr />\n<h2 id=\"sources\">Sources<\/h2>\n<p>home-v2-elements-194, home-v3-195 (196-199), departure-mosaic-200,\nmosaic-moments-201, home-blend-202, mosaic-switchboard-204,\nhome-sentence-apps-205, apps-mosaic-door-206, dial-tess-layers-208\n(rejected), home-open-swipe-tess-209, home-doors-next-211,\nhome-date-notices-tess-corner-212, home-one-thing-213,\nhome-mosaic-gallery-214, tess-corner-interface-215, tess-215-final,\nhome-top-fixes-216, home-gestures-220, fixed-slots-foot-224,\ncolor-roles-241, home-delta-236, weather-room-243, no-buttons,\nwidgets-and-snippets, widget-states, lockscreen, live-activity,\nround3-141-145, round12-177-180, round15-189-192;\ndocs/handoff/design.md, builder-a.md, builder-b.md, weather.md,\ngestures.md; memory home-mosaic-design, tess-paint-v2,\ntess-sphere-direction, dial-208-rejected, swipe-lens-pattern.<\/p>\n"}, {"id": "p3", "name": "Training", "html": "<h1 id=\"03-training\">03 Training<\/h1>\n<p>Training is the first domain and one of the two rooms Kaushik uses\nmost (with Kitchen). His Oct 23 4:09 PM verdict was that he \"doesn't\nlike it much yet\" and wants it more fun so he uses it more. The current\nspec is <strong>sheet 230 (training-flow-230.md), through v3.3, board\nv20<\/strong>, plus the app-wide color roles in <strong>sheet\n241<\/strong>. Board: <a\nhref=\"https://claude.ai/artifact/PFDdUde9cLtYA1G6Qjrpwp\">https://claude.ai/artifact/PFDdUde9cLtYA1G6Qjrpwp<\/a>\n(r45). Builder handoff: handoff-training-230.md, and in the repo\ndocs/handoff/specs/builder-a-training-230.md (written before v3.3/v20;\nwhere they differ, 230's later sections and 241 win). Owner: Builder A.\nCode branch <code>ios/training-230<\/code> (head 82bc8a29) holds the\nwheel, scrolling numbers, action word, stack marks, workout screen,\nlanding v2, This week and Library. It compiles but had never been viewed\non a simulator as of Oct 24.<\/p>\n<p>Status: v20 (split colors, what-colors) has not been reviewed by\nKaushik yet. Everything below is the latest ruling unless marked\n\"unconfirmed\".<\/p>\n<h2 id=\"1-palette\">1. Palette<\/h2>\n<p>Four roles per page (241): Training blue for the title and action\nword; go green for done and gains; gold for best and new; slate for\nsmall-caps labels, planned and private. Ink and ink2 carry text; ink3 is\nfor rest and disabled.<\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Token<\/th>\n<th>Light (paper F7F5F1)<\/th>\n<th>Dark \"Soft\" (pure black 000000)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>training (accent)<\/td>\n<td>0B62AE<\/td>\n<td>8FB0EE<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>go<\/td>\n<td>25803D (was 2FA24D, 3.0:1, too weak)<\/td>\n<td>8FC9A0<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ink<\/td>\n<td>theme ink<\/td>\n<td>E8E3DA<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ink2<\/td>\n<td>theme ink2<\/td>\n<td>A49E96<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ink3<\/td>\n<td>theme ink3<\/td>\n<td>78736D<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>edge<\/td>\n<td>theme edge<\/td>\n<td>2A2A2E<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>gold<\/td>\n<td>7E6A1E<\/td>\n<td>D9C27A (moved from 8A6A10 / E2C26A)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>slate<\/td>\n<td>34506F<\/td>\n<td>A7BCD6<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Push split (clay)<\/td>\n<td>9C4B2C<\/td>\n<td>E2A07F<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pull split (teal)<\/td>\n<td>1E6E77<\/td>\n<td>84C3C9<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Legs split (plum)<\/td>\n<td>8A4570<\/td>\n<td>D69CC0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Soft dark was picked at 10:15 PM Oct 23 (\"fine for now\"; a better\ncombination may still come up; Moonlight B0C1E6 / A8CDB4 / DCD7CE /\n9C968E was his second choice). Not picked: Deep (5C88D8 / 5FA87A) and\n\"As it was\" (3B8CF2 / 3BAC56). Light values did not change.<\/li>\n<li>Go green is never the only signal: rest also says \"Rest\", and a done\nlift is also struck.<\/li>\n<li>Big type rule (v20): the 2-4 biggest words never share a color. The\ntitle \"Training\" and the action word are blue. A routine's name takes\nits split (Push A clay, Pull A teal). The streak number is gold. \"+10\nlb\" is green. Session counts are ink.<\/li>\n<li>Library \"whats\": Routines go green, Exercises gold, Programs slate,\nGoals training blue.<\/li>\n<li>This week: today is blue (v20: today's row takes its split color),\ndone days are green with a green strike, planned days are slate.<\/li>\n<li>Rejected: crimson / pink Training (A8203F, CC4478; his 4:27 PM Oct\n23); 2-color pages (\"too monotonic\"); an all-blue big type (\"all of it\nin blue, looking the same\").<\/li>\n<\/ul>\n<h2 id=\"2-training-landing-room-landing-not-started\">2. Training landing\n(room landing, not started)<\/h2>\n<p>For: his stats, today's workout, This week and the Library. It never\njumps into the workout.<\/p>\n<p>Top down, in fixed slots (230 v2, moved up 40 pt in v3.2):<\/p>\n<ol type=\"1\">\n<li>Title \"Training\", 40 pt, blue.<\/li>\n<li>Two stat lines, 40 pt each: a big light number (Outfit 200, 32 pt)\nplus plain words. \"5 weeks in a row on plan\" (5 in gold per v20; slate\nin v3.2) and \"+10 lb on bench since Oct 1\" (gain in green; a tap opens\nthe lift). \"3 of 6 this week\" moved to the This week door.<\/li>\n<li>Today slot, 118 pt. Not started: small \"Today\" header, \"Push A\" at\n52 pt in its split color, then \"about 45 min, 4 lifts. Starts on the\nrower.\" A tap opens Today's workout (the plan page).<\/li>\n<li>Two doors, a 26 pt word each with one ink2 line under it: \"This\nweek\" (\"3 of 6 done. Pull A tomorrow.\", with 3 blue and Pull A in teal)\nand \"Library\" (\"28 workouts in 6 kinds. New: hill sprints.\", with \"New:\nhill sprints\" in green or gold; 241 says new = gold, v3.2 says green:\nunconfirmed).<\/li>\n<li>Foot: action word bottom-left, Tess bottom-right.<\/li>\n<\/ol>\n<p>Action word: not started = tap \"Start Push A\"; drag left \"Skip today\"\n(then \"Skipped today\", word becomes \"Start anyway\" in ink2). Started =\n\"Resume Push A\"; drag left \"End workout\" (saves what was done); drag\nright \"Pause\" / \"Go on\" (v2) or \"Start over\" (earlier v3): unconfirmed\nwhich right option wins; v2 is later.<\/p>\n<p>Data: TrainingLedger (Core): sessions this week against the plan,\nweeks on plan, e1RM change on the headline lift. Use sample values until\nCore's stats API lands.<\/p>\n<p>Landing open problem: Kaushik later rejected summary-plus-door\nlandings for rooms in general (11:52 PM) and sheets 240 and 242. The\nword wall is what he liked (12:43-12:53 AM, see the landings section of\nthe bible). Training landing v2 is the one landing builders were allowed\nto keep building; expect it to be redone in the word-wall direction.\nUnconfirmed.<\/p>\n<h3 id=\"in-progress-strip-the-today-slot-mid-workout\">In-progress strip\n(the today slot mid-workout)<\/h3>\n<ul>\n<li>In progress: header \"In progress\" in go green, the running clock, a\n\"Pause\" word on the right; then \"Push A\" and where you are (\"Bench\npress, set 2 of 3.\", or \"Bench press, set 2 of 3. 4 lifts to go.\"). A\ntap goes back in.<\/li>\n<li>Paused: header \"Paused\" in ink2, the clock in ink3 and stopped, the\nword reads \"Go on\".<\/li>\n<li>Done: \"Push A\" struck with a 1 px go-green line. Skipped: the same\nwith an ink3 line.<\/li>\n<li>Resume rule: leaving mid-workout keeps it. Home's Training line, the\nLive Activity and this slot all open the same place. 6 h auto-finish\n(product decision).<\/li>\n<\/ul>\n<h2 id=\"3-todays-workout-the-plan-page-depth-wheel\">3. Today's workout\n(the plan page, depth wheel)<\/h2>\n<p>For: what today holds before you start. This is the old 230 landing\nmoved one level in, minus the weekday strip. Slides in from the right;\nthe left edge (0-24 pt) or Esc goes back.<\/p>\n<ul>\n<li>Headline: \"Today\", \"Push A\" (split color), \"about 45 min, 4 lifts\".\nTapping the minutes rolls 25, 35, 45, All; lifts outside the time go\nink2/ink3 and never disappear; receipt \"Cut to 35 min.\" with Undo.<\/li>\n<li>Knob word \"Gym or Home\" at the top right of the headline, current\nchoice in ink 600. At Home, lifts swap to home versions; a lift with no\nswap reads ink3 with \"not at home\". Receipt \"3 swapped for home.\" with\nUndo.<\/li>\n<li>Brief (moves up to 270 pt): \"Starts with 8 min on the rower. Bench\nopens at 185 lb.\" (\"8 min\" in green).<\/li>\n<li>The plan wheel (the shared depth wheel): header row as row -1, small\ncaps 13 pt 600, tracking .06 em, ink2, no hairline: \"The plan\" + \"4\nlifts after the warm-up\". Rows: \"Warm up, row 8 min\" first, then each\nlift.\n<ul>\n<li>Focus row sits at the top slot (centre 62 pt into a 206 pt band; one\nrow above may peek): name 30 pt Semibold in the accent (go green for the\nwarm-up), value 15 pt Light.<\/li>\n<li>Value = weight in ink2 Light with its unit, a 12 pt gap, then one\nslot per set holding reps: \"185 lb 5 5 5\". To-do sets: target in ink3\nExtraLight. Done sets: actual reps in ink Medium (accent at the focus):\n\"185 lb 5 5 4\". Bodyweight lifts have no weight. VoiceOver: \"3 sets of 5\nat 185, done 5, 5, 4\". The old \"3 by 5 at 185\" is gone everywhere.<\/li>\n<li>Plus each lift's stack-and-handle mark (section 5). Tapping a stack\nopens the lift page.<\/li>\n<li>Before starting, focus = the warm-up. Mid-workout, focus = the\ncurrent lift with value \"now\" in blue.<\/li>\n<li>A finished lift is crossed off with a 1 pt go-green hairline through\nits name (still readable). Skipped lifts: 1 pt ink3 line, undoable for\n10 s.<\/li>\n<\/ul><\/li>\n<li>\"Bench best 205 lb, three weeks ago.\" opens the Bench exercise\npage.<\/li>\n<li>Swipe a lift row right: \"Bench press, done.\"; left: \"Bench press,\nlater.\" (Not now). Undo 10 s. Rows 44 pt hit area.<\/li>\n<li>Foot: \"Start Push A\". No working weight or bar drawing on this\npage.<\/li>\n<\/ul>\n<h2\nid=\"4-shared-depth-wheel-used-for-plan-session-week-library-and-the-number-dial\">4.\nShared depth wheel (used for plan, session, week, library and the number\ndial)<\/h2>\n<p>One component (<code>mkWheel<\/code> on the board). Rows 38-40 pt;\nrows near focus 8 pt further apart. Focus 30 pt (landing/plan), then 20\npt at one row, 17 at two, 15 at three or more, ink2 Regular. Depth blur:\n0.65 pt at one row, 1.0 pt at two or more, never on the focus, never\nover 1 pt (Notes later allowed up to 1.8 pt on its dial: Training stays\nat 1 pt, unconfirmed). Reduce Motion, Reduce Transparency, Low Power:\nsize and ink only, no blur.<\/p>\n<p>Gestures (sheet 220): hold-and-scroll tracks 1:1; a flick moves\nexactly one row; snaps on a spring; one light haptic tick per new focus.\nTap another row = bring it to focus; tap the focused row = open it.\nVoiceOver reads it as a list. Title fit: a big fixed title shrinks 1 pt\nat a time to about 0.75 of its size (wheel focus 28 to 21, exercise name\n34 to 26) before Tess's short form takes over.<\/p>\n<h2 id=\"5-live-workout-mode\">5. Live workout mode<\/h2>\n<p>Starts only from the foot word \"Start Push A\". No vertical page turn\nin workout mode. The number, the bar and the wheel have separate hit\nareas.<\/p>\n<h3 id=\"warm-up\">Warm-up<\/h3>\n<p>\"Rower, easy\" in green, 8:00 countdown, \"Keep it easy, about 22\nstrokes a minute. Bench is next.\" Foot \"Done warming up\" (drag left:\n\"Skip warm up\"). A routine can start with cardio (his 6:06 PM).<\/p>\n<h3 id=\"top-band-the-current-lift-only\">Top band (the current lift\nonly)<\/h3>\n<ul>\n<li>Name 34 pt 600 in the accent, one-line slot, fitted 34 to 26 pt,\nTess short form past that (\"Incline DB press\"). A tap opens the exercise\npage.<\/li>\n<li>\"Set 1 of 3\" in fixed width (see open questions: conflicts with the\nno \"N of M\" rule). \"was 185 lb\" in ink2 appears 2 s after a weight\nchange.<\/li>\n<li>Weight in Outfit 200, 84 pt (80 in early 230), unit word beside it\nat about half size in the accent, no underline. The bar drawing on the\nright (the barbell is the object, not a gauge).<\/li>\n<li>Weight: drag the number up/down or drag the bar (sideways or\nvertical), 5 lb steps (2.5 kg); plates slide on and off the sleeve.<\/li>\n<li>Unit: tap or swipe the unit word; digits roll; plates reload. kg\nshows what the bar actually holds, rounded to 2.5 kg (lb x 0.4536):\nreceipt \"185 lb loads as 85 kg.\" with Undo. kg plates 25, 20, 15, 10, 5,\n2.5, 1.25 on a 20 kg bar; 10 and up in the accent. A hung fraction shows\nonly for .5. Kaushik's own defaults: kg, 20 kg bar, 1.25 kg plates, 2 kg\ndumbbell steps (product decisions).<\/li>\n<\/ul>\n<h3 id=\"set-mark-stack-and-handle-picked-1002-1009-pm-oct-23\">Set mark:\nstack and handle (picked 10:02-10:09 PM Oct 23)<\/h3>\n<p>One cable-machine drawing per set, 11 x 24 pt (12 x 28 at focus),\nsets 5 pt apart. Top down: a grip 5.2 pt wide at 1.6 pt on a short\ncable; the cap (top plate) at 1.4 pt; the rod at 0.8 pt ink3; a floor\nline at 1 pt ink3. Each rep is a plate line: logged reps lift up under\nthe cap in go green at 1.15 pt; reps still to do rest on the floor in\nink3 at 0.8 pt. The rod runs from the cap only down to the lowest lifted\nplate (or the top resting plate when none is lifted), never to the\nfloor. Cable and cap turn green once a set has reps; the grip turns\ngreen when the set is full. Tapping a stack in either wheel opens the\nlift page.<\/p>\n<p>Rejected set marks, never re-offer: brush circles / liquid ink drops\n(108, 229), static ink ring D, rep strokes with fold-to-trail (230 Part\n1), tally marks, \"5 5 5\" as the mark, Pulse, Climb, Waves, Arrows, the\nplate stack (9:57 PM, replaced 5 min later), set guides and brushstrokes\n(training-mode, live-workout, set-block).<\/p>\n<h3 id=\"logging-a-set\">Logging a set<\/h3>\n<ul>\n<li>Sets log WHOLE at the planned reps; nothing logs per rep. Foot \"Log\nset N\" (drag right after a set: \"Same again\" logs the last count; drag\nleft: \"Skip this lift\", or \"End workout\" on the last lift).<\/li>\n<li>After logging, the brief confirms for 5 s: \"Set 1, 5 reps.\" with the\ncount as a scrolling number (each change restarts the 5 s; it waits\nwhile the dial is open). Then \"Set 1, 5 reps, kept.\" It is a\nconfirmation, never a question (no yes/no asks in a live workout). Range\n0 to planned + 10.<\/li>\n<li>Undo 10 s: \"Set 2, logged. Undo\". Also on Done and on a swap.<\/li>\n<li>Set motion (from 230 v3, unconfirmed how much survives the stack\nmark): marks drop in one by one on a spring 55 ms apart; logging inks\nleft to right 70 ms apart; the set number rolls its digit; rest starts.\nReduce Motion: the end state appears in one step.<\/li>\n<\/ul>\n<h3 id=\"session-wheel-bottom-of-the-workout\">Session wheel (bottom of\nthe workout)<\/h3>\n<p>5 rows of 34 pt, focus in the middle, ending above the 36 pt foot\nband so Tess never covers it. Header \"This session\" + \"N lifts\". Current\nlift: 22 pt 600 accent, info \"now\". Neighbours 16 pt then 14 pt, weight\n400, ink2 or darker (size and weight carry distance), with depth blur. A\nbrowsed row shows ink 600, no \"now\". Info: done lifts show their set\nslots, next lifts their usual sets, part-done \"5, 2 left\". Springs back\nto now 6 s after the last touch; pauses while a finger is down, while\nVoiceOver is on it, and while an exercise page is open. AX3 and above: 3\nrows.<\/p>\n<h3 id=\"rest\">Rest<\/h3>\n<p>\"Rest 1:30\" in go green, then \"Set 2 is next\". Foot \"Skip rest\". Rest\nend fires the Live Activity update and a local notification; sound\nfollows the silent switch. No countdown lines, no rings, no horizon\nline. Rest-dab (dry horizon stroke) is superseded.<\/p>\n<h3 id=\"done\">Done<\/h3>\n<p>\"Push A\", the time, \"warm-up and 4 lifts\", \"Bench held at 185 lb.\nNext Push A is Friday.\" Foot \"Finish\" (Undo 10 s).<\/p>\n<h3 id=\"foot-words-one-at-a-time\">Foot words, one at a time<\/h3>\n<p>Start Push A, Done warming up, Log set N, Skip rest, Finish, Pick up\nPush A / Resume Push A, Do it now. Action word drag: leans up to 18 pt\nwith the finger; past 56 pt the text rolls to the option (selection\ntick); release commits (.medium impact) with a 10 s Undo receipt; short\nof that it springs back (.soft); a side with no option moves 6 pt max\n(.rigid). Left = stop/remove, right = again/redo. VoiceOver: each option\nis an accessibilityAction.<\/p>\n<h2 id=\"6-numbers-scroll-tap-for-the-wheel\">6. Numbers: scroll, tap for\nthe wheel<\/h2>\n<p>Numbers never step with \u2212 or + (10:09 PM, app-wide). Drag a number up\nor down; every 16 pt is one value (weight steps 5 lb / 2.5 kg) with a\nselection tick. While a finger is on it, the next and previous values\nshow at 0.42x in ink3 above and below. Scroll wheel and arrow keys work\ntoo. A tap opens the dial: a full-room depth wheel of values (46 pt\nrows, wheel blur) under a small-caps label, with \"Done\" bottom-left; Esc\nor Done keeps the value in front. Accessibility: adjustable element,\nincrement and decrement. Used in the 5 s set confirmation and the lift\npage's Sets, Reps and Weight. The \"Set 1, 5 reps. \u2212 +\" and \"\u2212 value +\"\nrows in 230 are replaced by this.<\/p>\n<h2 id=\"7-exercise-lift-page\">7. Exercise (lift) page<\/h2>\n<p>Slides in from the right; back by the left edge. Top down: \"Works\nchest, shoulders and triceps\" (no Oxford comma), the name, the exercise\npicture loop, a sets block, Best, the last sessions (cut to 2 lines),\nnext time.<\/p>\n<ul>\n<li>Sets block: small-caps label \"Today's sets\" in a workout, \"Usual\nsets\" otherwise; Sets, Reps, Weight as scrolling numbers (weight with\nunit at half size). Sets can't go below sets already done. In a workout,\na right-side line \"Also the usual: No/Yes\"; Yes copies today's numbers\nto the usual. Wheels and the current lift update at once.<\/li>\n<li>For a lift not done yet, the foot reads \"Do it now\": it swaps that\nlift in and the current one goes next. Receipt \"Dips now, bench press\nafter. Undo\" (10 s).<\/li>\n<li>History lines carry units: \"185 lb for 5, 5, 4\".<\/li>\n<\/ul>\n<h3 id=\"exercise-pictures-free-gifs-only\">Exercise pictures (free GIFs\nonly)<\/h3>\n<ul>\n<li>Gym visual GIF loops first (71 files, kept in\n~/Library/Developer/TesseraBuilds/exercise-gifs, git-ignored, copied at\nexport, never committed, never upscaled past their ~180 px source, never\nsent to Claude). Fallback: Workout Guide line art (Everkinetic, CC BY-SA\n4.0), recolored to the theme ink as a template image, three frames\nplayed 1-2-3-2 at 0.55 s each.<\/li>\n<li>Reduce Motion and Low Power: a still middle frame. VoiceOver hides\nthe picture. Sibling motions show \"Similar motion\" in ink2. A GIF that\ncan't take the ink color sits on a flat ink-tinted ground with a hard\nedge, not a card.<\/li>\n<li>Credits on the About page at the foot of Settings (109): a build\nnever ships without them.<\/li>\n<li>Never: our own drawn figures, paid videos (offered Oct 19 at about\n$452, he chose free only), a second picture style on one screen,\npictures on Home or in the live workout's top band.<\/li>\n<\/ul>\n<h2 id=\"8-bests-prs\">8. Bests (PRs)<\/h2>\n<p>The word is \"best\", never \"record\" or \"PR\". Pushing the weight past\nthe best turns the best line into \"Bench 215 lb today would be a new\nbest.\" with one 3 pt rise and settle (0.5 s). Best and new wear gold\n(241). A best shows in the best line, not in the set mark. No confetti,\nno flare, no glint sweep. The custom best haptic from live-polish (two\ntransients 90 ms apart, then a 320 ms swell, instead of the log haptic)\nis not restated in 230: unconfirmed.<\/p>\n<h2 id=\"9-this-week\">9. This week<\/h2>\n<p>Title \"This week\" (blue) and the date range, a brief slot, then the\nshared wheel centered on today, header \"The week / 6 sessions, 1 rest\".\nWeeks start Monday. Each row: a small day word plus the workout. Today\nstays colored even away from focus. Done rows: 1 px green strike through\nthe name only, minutes in green. Rest rows ink3. The brief follows the\nrow in front (what was done, or what's in it). Tapping today opens it or\nthe live workout. Action word \"Move Push A\": tap makes today a rest day\nand slides the week a day (Undo 10 s); drag left skips it.<\/p>\n<p>Plan rules (product decisions): PPL x2 at 6 a week; a rolling plan\nrolls missed days; fixed days don't roll; one routine per weekday, newer\npick wins; skipping or \"rest day today\" is a day mark, not a plan write;\na planned timed workout ends a rest day.<\/p>\n<h2 id=\"10-library\">10. Library<\/h2>\n<p>Title \"Library\" in blue. A matrix, not a list (v3, 10:38 PM):<\/p>\n<ul>\n<li>Across: a category row, one at a time on the right with its count\n(Everything 28, Push 6, Pull, Legs, Full body, Cardio, Mobility). Swipe\nsideways 1:1; up/down on that row rolls the sort (kinds, lengths: under\n20, 20-40, 40-60, an hour+; days: Monday-Sunday). No sort label, no\nlens, no \"N of M\".<\/li>\n<li>Down: a \"what\" dial (Routines green, Exercises gold, Programs slate,\nGoals blue) with counts for the cell; focus 40 pt in the what's color,\nneighbours 15 pt ink2. The what color also goes on the category count\nand the focused row.<\/li>\n<li>Brief (2 lines) names what's in the focused item (a routine's first\nexercises and days; an exercise's best and routines; a goal's\nprogress).<\/li>\n<li>\"In here\" depth wheel holds the cell's items; tap focuses, tap the\nfocused one opens it. Routine page: title, exercises/minutes/days,\nbrief, a wheel of its exercises with usual sets as stack marks; action\nword \"Do it today\". Push A opens Today's workout.<\/li>\n<li>Action word per what: Build a routine / Add an exercise / Start a\nprogram / Set a goal.<\/li>\n<li>Data: routines = exercise lists with sets/reps; exercises; programs\n= weeks of routines; goals = target, now, date.<\/li>\n<\/ul>\n<h2 id=\"11-units-rule-app-wide-1124-pm-oct-23\">11. Units rule (app-wide,\n11:24 PM Oct 23)<\/h2>\n<p>Every weight shows lb or kg at about half the number's size, min 10\npt, Figtree 400, ink2, 2 pt after the numeral; the number stays Outfit.\nApplies to history lines, bests, week notes, briefs and wheels. A bare\n\"N x M\" never writes kg.<\/p>\n<h2 id=\"12-workout-live-activity-and-watch\">12. Workout Live Activity\nand Watch<\/h2>\n<ul>\n<li>Live Activity behavior (current): shows the rest countdown and the\ncurrent set; rest end updates it plus a local notification; tapping it\nopens the same place as Resume. A private workout shows only \"Private\nworkout\" and the timer on the Lock Screen and Island.<\/li>\n<li>Its look (live-activity.md, Oct 15: Inter Tight, \"Cobalt sky\"\nwashes, cream numerals, horizon line, red tick) predates the current\nrules (no Inter Tight, no countdown lines, no washes). It needs a redraw\nin Figtree/Outfit and the Soft palette: unconfirmed, no current\nsheet.<\/li>\n<li>Watch: a watchOS target is allowed after Builder A's signing check\n(CLAUDE.md, Oct 19); scripts/test.sh now gates \"watch\". The specs\n(watch-set-logging-105: one screen, weight and reps on the Crown, Done\nline, rest as in the Smart Stack; watch-quick-wins W1/W2) are spec-only,\nnot okayed by Kaushik, and use the old Cobalt sky look. Their structure\ncan carry; their look and the \"SET 4 of 5\" counter cannot.<\/li>\n<\/ul>\n<h2 id=\"13-privacy-and-naming\">13. Privacy and naming<\/h2>\n<ul>\n<li>Workout names are made on the device, never by Claude. Workouts\nnever go to Claude, even under lab mode (his 10:25 PM).<\/li>\n<li>A private workout reads \"Private workout\" in the name slot, on Home,\nin the Live Activity and on the Lock Screen; a private routine draws a\nplain outline, nothing lit. Body values, calories and health data never\nreach widgets, backups or logs.<\/li>\n<li>Voice in the gym (voice-gym, \"80 for 7\", \"same\") stays as a\ncapability on-device; its soul-bloom look is superseded by the current\nTess.<\/li>\n<\/ul>\n<h2 id=\"14-rejected-one-line-each\">14. Rejected, one line each<\/h2>\n<ul>\n<li>Crimson/pink accent and the 210 pixel lintel (pixels are\nHome-only).<\/li>\n<li>Landing that jumps straight into the workout; the not-started weight\nand bar on the landing.<\/li>\n<li>Weekday strip at the top of the plan page.<\/li>\n<li>Steppers (\u2212 +) anywhere.<\/li>\n<li>\"3 by 5 at 185\" text form.<\/li>\n<li>Brush circles, ink rings, rep strokes, plate stack and all other set\nmarks listed in section 5.<\/li>\n<li>Countdown lines, horizon strokes, rings as gauges, the rest\ndab.<\/li>\n<li>Month heatmap plans page (plans.md) and the list-first Training\nreorg (107).<\/li>\n<li>Glass lens on swipers, \"N of M\" pagination, sort labels.<\/li>\n<li>Confetti or \"record\" wording on a best.<\/li>\n<li>Paid exercise videos and self-drawn figures.<\/li>\n<\/ul>\n"}, {"id": "p4", "name": "Kitchen, Lists, Notes", "html": "<h1 id=\"04-kitchen-lists-notes\">04. Kitchen, Lists, Notes<\/h1>\n<p>Status as of Oct 24, 2026. Newer sheets win. Hard rules in the brief\n(type, no cards/pills/bars/rings/dots/underlines/lens, no \"N of M\", 10 s\nUndo, swipe right Done / left Not now, dials on landings only, fixed\ntext slots, one action word bottom-left + Tess bottom-right, privacy)\noverride anything below that disagrees. Where an older sheet line breaks\na hard rule, it is marked SUPERSEDED here.<\/p>\n<p>Owner of all three rooms' screens: Builder B. Engine: Core.<\/p>\n<p>Shared Kitchen pieces (from handoff-kitchen-231-233):\n<code>PlaceDial<\/code>, <code>FocusWheel<\/code>,\n<code>ReceiptLine<\/code>, foot word, in\n<code>Features/Kitchen/KitchenParts.swift<\/code>.<\/p>\n<hr />\n<h2 id=\"shared-grammar-for-these-rooms\">Shared grammar for these\nrooms<\/h2>\n<ul>\n<li><strong>Receipt line.<\/strong> One fixed 26 pt line above the foot,\n15 pt ink2. Pattern: \"Thing, what happened. Undo\". Undo is in the room's\nsmall-text color at 600. It lasts 10 s, and the newest receipt replaces\nthe line. It clips in from the top over 0.3 s. Older actions stay\nreversible from Tess's room, where they read \"Reversed\" (sheet\n232).<\/li>\n<li><strong>Action word gestures<\/strong> (page-palette-rule, sheet\n230). The bottom-left word takes a tap. It also takes a drag left\n(stop/remove) or right (again/new). The word leans 18 pt at most. Past\n56 pt it rolls to the option's name with a selection tick, and release\ncommits with a .medium impact and a 10 s Undo. Left drags start 28 pt or\nmore from the edge, so they never fight the back edge (0-24 pt). Each\noption is also an accessibilityAction. No menus.<\/li>\n<li><strong>Back<\/strong> is the left edge swipe. A title tap opens the\nroom index (sheet 224). Rooms show no \"&lt; Home\" word (217\nruling).<\/li>\n<li><strong>Wheels<\/strong> (230 FocusWheel). The focus sits in the\nfirst slot and the list loops. Drag tracks 1:1, a flick moves one row,\nand it snaps on a spring with one tick per row. It never springs back.\nThe height ends on a row boundary (202 pt in a band, 392 pt full page),\nso no row is ever cut. Every row is ink2 or darker; size and weight\ncarry distance. Depth blur sits on neighbours, never on the focus or its\ndetail line. The blur turns off with the Settings &gt; Look \"Depth on\nwheels\" switch (default On), Reduce Motion, Reduce Transparency and Low\nPower.<\/li>\n<li><strong>Dials<\/strong> have 3 places: the focus plus one above and\none below. They loop, with one haptic tick per place, and are VoiceOver\nadjustable (\"Fridge, 8 things\"). At AX3+ the dial shows the focus plus\none neighbour. Since Oct 24 2:06 AM the Notes dial uses 48 pt slots with\nneighbour blur up to 1.8 pt. <strong>Depth rule (Oct 24 2:08-2:22 AM):\ndials belong on LANDINGS only.<\/strong> Deeper pages use other list\nforms. See open question 1 about the Pantry and Recipes dials.<\/li>\n<li><strong>Region rule.<\/strong> A drag belongs to the region where it\nstarts. A vertical drag in the headline moves the dial, and one in the\nbody turns the page or wheel. Horizontal drags on a row are row actions.\nAny 3 pt move cancels a 0.5 s hold.<\/li>\n<li><strong>Privacy.<\/strong> A private item shows its real name inside\nits room only. Everywhere else it shows its shownLabel: briefs, counts\ntext, notices, widgets, the Live Activity, Siri, backups and Tess lines.\nBriefs are built on the phone from templates, never by Claude. Calories\nand macros show in the Kitchen room only, behind Settings \"Show\ncalories\" (default On). They never appear on Home, widgets, notices, the\nLive Activity, the cooking brief, Claude lines, logs, the op log or\nbackups.<\/li>\n<\/ul>\n<hr />\n<h1 id=\"kitchen\">KITCHEN<\/h1>\n<h3\nid=\"palette-sheet-234-v5v7-page-palette-rule-color-roles-241\">Palette\n(sheet 234 v5/v7, page-palette-rule, color-roles-241)<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Role<\/th>\n<th>Light<\/th>\n<th>Dark<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Kitchen accent (ochre/amber)<\/td>\n<td>A8701F<\/td>\n<td>C49A5E<\/td>\n<td>Room name, big numbers, dial focus, action word<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>kitchenText<\/td>\n<td>93611A (4.9:1)<\/td>\n<td>C49A5E (8.1:1)<\/td>\n<td>Small Kitchen words: Cook now, Undo, Get it, Cooking<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Slate<\/td>\n<td>34506F<\/td>\n<td>A7BCD6<\/td>\n<td>Section names<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Wine (kitchenWarn)<\/td>\n<td>9A2541<\/td>\n<td>EE8E9C<\/td>\n<td>What needs you: low, eat by tomorrow, throw out today<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pine<\/td>\n<td>2F6450<\/td>\n<td>8EC7AE<\/td>\n<td>Fine leftover days. Since 234 v7 it is no longer used on Pantry<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Kinds (color-roles-241): Pantry teal 1E6E77/84C3C9, Recipes clay\n9C4B2C/E2A07F, Shopping ochre.<\/li>\n<li>Kitchen dark C49A5E was moved off D49A52 because that was 9.1 from\nEmber gold (sheet 221).<\/li>\n<li>No food drawings (design-no-food-drawings). A recipe image is only\nhis own photo, or nothing.<\/li>\n<\/ul>\n<h2 id=\"kitchen-landing-sheet-231--landing-open\">Kitchen landing (sheet\n231) \u2014 LANDING OPEN<\/h2>\n<p><strong>Status.<\/strong> The 231 landing body is built, but the\nlanding itself is superseded. The design handoff says \"Kitchen 231-234\n... all their landings are superseded by the landing work\". The 46 pt\nreel was rejected at 11:45 PM Oct 23 (sheet 240). The plan is to bring\nthe word wall (see Notes) to the other landings after the Notes door\npages. Treat the elements below as the content the next Kitchen landing\nmust carry, not as its layout. Kaushik still wants the brief sentence\nkept (\"Tacos tonight. Lemon is short.\"), and while he is cooking the\nlanding focuses on cook mode (rooms-feedback-oct23).<\/p>\n<p><strong>Not cooking (231 as built):<\/strong><\/p>\n<ul>\n<li>Top row: \"Kitchen\" and the day word.<\/li>\n<li>Headline: \"Tonight you could make\", then the dish in a 46 pt reel\nclipped to a 52 pt slot (REJECTED as a headline), then \"25 min, you have\nall 8 things\" and \"another\". Swipe up or \"another\" rolls to the next\nmakeable dish. Tap the name to open the recipe.<\/li>\n<li>Brief from a phone template: \"Eggs and milk run out first. Spinach\nwants using by Sunday.\"<\/li>\n<li>Pantry: three Outfit 200 44 pt numbers with the fixed labels \"on\nhand\", \"low\" (Kitchen) and \"to get\". They count up on arrival; VoiceOver\nreads the final values. A tap opens Pantry.<\/li>\n<li>Recipes lines: \"You can make 4 now\" (opens Recipes on Ready now),\n\"Pasta on Thursday\", \"Dal, last made Tuesday\", and \"Ate out? Log it\"\n(234).<\/li>\n<li>Foot: \"Cook\" (opens the Recipes wheel on Ready now), with Tess.<\/li>\n<li>Rejected: the separate Cook page (superseded by Recipes Ready now,\n231 drift fix). Jars, heap and ink blooms (242 round 1). The paragraph,\nfine-line drawing and contents page (240: \"drawings are the\nworst\").<\/li>\n<\/ul>\n<h2 id=\"cooking-cook-mode-the-landing-taken-over-231-233-v5-229\">Cooking\n(cook mode): the landing taken over (231, 233 v5, 229)<\/h2>\n<ul>\n<li>Cook now rises from the bottom.<\/li>\n<li>Top row: \"Cooking\" in kitchenText.<\/li>\n<li>Dish name (opens the recipe), then the step line, then the step\ntitle 26 pt in a 58 pt two-line slot, bottom-aligned.<\/li>\n<li>Step timer: 72 pt Outfit 200 with one word (\"garlic\"). With no step\ntimer it shows the soonest running timer; with none, the step's\nnote.<\/li>\n<li>Brief: \"Then: zest the lemons.\" On the last step: \"Last step. Enjoy\nit.\"<\/li>\n<li>Timers: plain lines, soonest first, max 3 (229: name 16 pt, time\nOutfit 300 28 pt, \"and N more\" past three). A finished timer reads\n\"Garlic is ready\" in kitchenText, and the big number goes Kitchen \"0:00\nready\". It fires a local notification or Live Activity alert, with sound\nfollowing the silent switch.<\/li>\n<li>Below, in ink3: \"Pantry 24 on hand, 3 low\" and \"Pasta on\nThursday\".<\/li>\n<li>Foot: \"Next step\", then \"Done cooking\" on the last step. Done opens\nLeftovers (234). The receipt is \"Lemon pasta, cooked. Pantry took 6\nthings. Undo\".<\/li>\n<li>229 extras still valid: the step hangs from a 1.2 pt edge thread,\nand the next two steps show as \"Then ...\" in ink3. Next step clips the\nold step upward with a 10 pt rise.<\/li>\n<li>Unconfirmed: 229's bead (a 4.5 pt ring breathing \u00b10.9 pt over 2.4 s)\nmay now fall under \"no rings\".<\/li>\n<li>Hands-free (104, 229): \"Say Next, Back, Repeat or How long\". It runs\non the device only and keeps no audio. \"Listening\" shows only while the\nmic is on. It asks for mic permission in context the first time, and\nturns off on leaving cook mode or after 2 min of quiet. It never handles\nmoney or private items.<\/li>\n<li>Private recipe: the notification and Live Activity read \"Your dish\"\n/ \"Timer done\". Timer notification title is \"Timer\", body \"<label> is\ndone.\" (G217).<\/li>\n<li>\"Step 2 of 6\" is an N of M counter, which the hard rule bans.\nReplace it (open question 2).<\/li>\n<li><strong>Several dishes (sheet 132, older, logic only):<\/strong> one\nmerged queue on one clock, planned backward from the serve time. One\nnext step for one pair of hands. The dish word sits small above the\nstep, and dishes never get their own colors. \"On the stove\" holds max 3\ntimers. There is one warning line in ink2, a plan spine before starting,\nand \"Change the plan\" / \"I am behind\" (Serve at 7:10, holds warm 10\nmore, 5 more minutes; nothing shames). Its visuals (progress strip,\nochre underline, \"&lt; Kitchen\", bars) are SUPERSEDED. Redraw it in the\n231 grammar. It sits behind switches multiDishCook and serveTimeAlign\n(default Off).<\/li>\n<\/ul>\n<h2 id=\"pantry-sheet-232-sections-234-v3-v8\">Pantry (sheet 232, sections\n234 v3-v8)<\/h2>\n<p><strong>Purpose:<\/strong> what is in the house, by place.<\/p>\n<p><strong>Layout top to bottom:<\/strong><\/p>\n<ol type=\"1\">\n<li>Top row: \"Pantry\". On the right, \"5 to get\", which jumps the dial to\nTo get.<\/li>\n<li>Headline 196 pt (140 pt in the 237 v2 tighter spec): the place dial\nover To get, Fridge, Freezer, Shelf, Counter.\n<ul>\n<li>Focus: 44 pt Figtree 600 Kitchen, with its count in Outfit 200.<\/li>\n<li>Neighbours: 26 pt ink2, with counts in Outfit 300.<\/li>\n<\/ul><\/li>\n<li>Brief: two template lines, e.g. \"Low on milk and eggs. Spinach wants\nusing by Sunday.\" Freezer: \"All good in here.\" To get: \"Feta makes\nShakshuka work.\"<\/li>\n<li>Body (234 v4-v8): two packed section columns, 16 pt gap, each 232 pt\ntall.\n<ul>\n<li>Section name: 14 pt Figtree 600 in all small caps, tracking 0.015\nem, slate, with a 1 pt hairline under it and the count right-aligned in\nOutfit 300. This is the one sentence-case exception, for labels\nonly.<\/li>\n<li>Things: 17 pt ink, sentence case.<\/li>\n<li>Rows: 28 pt with the value beside the name, 34 pt with the value\nbelow. Sections sit 18 pt apart.<\/li>\n<li>Value beside: 10.5 pt Light ink2. Value below: 8 pt Light, +0.03 em,\non a 12 pt line, ink2 (see open question 4).<\/li>\n<li><strong>Low lives in the name.<\/strong> A low thing's name turns\nwine 500; the word \"low\" is gone. VoiceOver still says \"Milk, low\".<\/li>\n<li>Packing: sections are taken in queue order from the entry section\n(the first with something low or near its day). Each column first-fits\nlater whole sections into its leftover space. Only the first section in\na column may split, with an \"N more, swipe\" tail. A header never sits\nalone at the bottom. Every column keeps at least one section to fill, so\ntwo sections always use both columns.<\/li>\n<li>\"Next: Produce\" is a 13 pt right-aligned tappable line above the\ncolumns.<\/li>\n<\/ul><\/li>\n<li>Receipt line, then the foot \"Add a thing\" (\"Say it or type it. Tess\nputs it in the right place.\"), then Tess.<\/li>\n<\/ol>\n<p><strong>Sections (max 4 per place):<\/strong><\/p>\n<ul>\n<li>Fridge: Leftovers, Dairy and eggs, Meat and fish, Produce.<\/li>\n<li>Freezer: Cooked, Meat and fish, Vegetables, Bread.<\/li>\n<li>Shelf: Dal and lentils, Grains and pasta, Snacks, Spices.<\/li>\n<li>Counter: Fruit, Vegetables.<\/li>\n<li>To get: For a recipe, Next shop.<\/li>\n<\/ul>\n<p><strong>Gestures:<\/strong><\/p>\n<ul>\n<li>Swipe right (90 pt; 70 pt inside a column) means used up. The row\nslides off, its name arcs up to \"to get\", and the count rolls: \"Milk,\nused up. On To get. Undo\". On To get, swipe right means got it: \"Feta,\ngot it. Back in the fridge.\"<\/li>\n<li>Swipe left means not now: \"Spinach, not now. Asks again\ntomorrow.\"<\/li>\n<li>Tap toggles in and low: \"Butter, low. Add to To get Undo\". Tapping\n\"Add to To get\" puts it on Next shop. Tap does nothing on To get\nrows.<\/li>\n<li>Hold 0.5 s pins it, at most 3 per place, at the top of its own\nsection: \"Three pins already. Unpin one first.\"<\/li>\n<li>The column swipe works on the headers or the space under a column's\nlast thing. A column part-way through a section continues it. A finished\ncolumn takes the next queued sections. With none, it stays; when nothing\ncan move, the columns nudge 10 pt (a haptic only under Reduce Motion).\nBack history holds 6 steps.<\/li>\n<li>A drag within 20 pt of the left edge is always back.<\/li>\n<\/ul>\n<p><strong>Motion:<\/strong> a dial change brings the columns in from the\ndial's direction, each clipping open with a 28 pt spring rise, 60 ms\napart. Section moves slide inside each column's clip.<\/p>\n<p><strong>States:<\/strong><\/p>\n<ul>\n<li>Large type: one column from the first accessibility size.<\/li>\n<li>Private: real name in the room only.<\/li>\n<li>Empty place: \"All good in here.\"<\/li>\n<\/ul>\n<p><strong>Rejected:<\/strong><\/p>\n<ul>\n<li>The v2 two-row section strip.<\/li>\n<li>Section names inside the paged list.<\/li>\n<li>Pine values (v7).<\/li>\n<li>The cupboard lintel and pixel columns (221; pixels are Home\nonly).<\/li>\n<li>\"1 of 2\" page counters (banned N of M).<\/li>\n<\/ul>\n<h2 id=\"leftovers-sheet-234\">Leftovers (sheet 234)<\/h2>\n<ul>\n<li>\"Done cooking\" opens \"Put leftovers away\", which rises from the\nbottom.<\/li>\n<li>Headline: a servings drum. Focus Outfit 200 72 pt, neighbours 30 pt\nink2. It runs 0 to the servings made, with no loop, and starts at made\nminus 1.<\/li>\n<li>Fixed rolling lines:\n<ul>\n<li>\"Goes in\": Fridge or Freezer.<\/li>\n<li>\"Good until\": fridge defaults to 3 days; freezer 1-3 months, default\n2.<\/li>\n<li>\"Remind me\": that morning 10 AM, the day before, or Off. It obeys\nquiet hours (11 PM-7 AM). The notice reads \"Dal in the fridge, eat by\nMonday.\" with no calories, and \"Your leftovers\" for a private dish.<\/li>\n<\/ul><\/li>\n<li>Foot: \"Put in fridge\" or \"Put in freezer\". At 0 servings it reads\n\"Nothing left\".<\/li>\n<li>A leftover row reads \"Lasagna\" with \"2 left, by Sunday\". The day\nbefore it turns wine; on the day it reads \"throw out today\".<\/li>\n<li>Swipe right on a leftover always means one serving eaten and logged\nas a MealEntry: \"Lasagna, one serving eaten. Logged. Undo\".<\/li>\n<li>Tap reopens the put-away screen. Past its day the foot reads \"Throw\nout\".<\/li>\n<\/ul>\n<p><strong>Food from outside<\/strong> (234): opened from \"Ate out? Log\nit\" or by telling Tess.<\/p>\n<ul>\n<li>Name: 30 pt 600 Kitchen. There is an optional photo, which stays on\nthe phone with complete file protection and never goes to Photos or\nbackups.<\/li>\n<li>Estimate: \"about\" + 72 pt Outfit 200 + \"cal\", then the macros line,\nthen a source line: on-device (the default), typed, or Claude. Claude is\nused only under asksClaude plus lab mode, with a sent-log row.<\/li>\n<li>\"You ate\" rolls from None yet to All of it.<\/li>\n<\/ul>\n<h2 id=\"recipes-sheet-233-v5-the-current-pick\">Recipes (sheet 233 v5,\nthe current pick)<\/h2>\n<p><strong>Layout top to bottom:<\/strong><\/p>\n<ol type=\"1\">\n<li>Top row: \"Recipes\" on the left, \"5 to get\" on the right.<\/li>\n<li>Lens dial: Ready now, One short, Planned, All, with counts.<\/li>\n<li>Brief, e.g. \"Fried rice is the quickest, 20 min. Lemon pasta uses\nthe lemons.\"<\/li>\n<li>Section line, right-aligned: \"7 you can make now, quickest\nfirst\".<\/li>\n<li>FocusWheel, quickest first, with pins first. \"New recipe\" in\nkitchenText is part of the loop.\n<ul>\n<li>Focused row: 28 pt 600 ink, with two 15 pt ink2 one-line slots that\nclip in.\n<ul>\n<li>Line 1: \"5 min, about 350 cal a serving\".<\/li>\n<li>Line 2: \"lemons, spaghetti and 4 more\", with use-first items in\nkitchenText 600. It may instead read \"needs feta\" or \"milk low\".<\/li>\n<\/ul><\/li>\n<li>Other rows: name plus \"20 min\" on the right (\"min\" at 0.62 size), 17\npt next to the focus, then 15 pt.<\/li>\n<\/ul><\/li>\n<li>Foot word follows the focus: Cook now / Get it / Get 2 things / New\nrecipe.<\/li>\n<\/ol>\n<p><strong>Interactions:<\/strong><\/p>\n<ul>\n<li>Tap the focused recipe to open the recipe page. Tap another row to\nbring it up.<\/li>\n<li>Tap the focused lens for the full-page list (392 pt wheel). Back is\nthe left edge only.<\/li>\n<li>\"Have\" follows the level rule: in or low counts as have.<\/li>\n<\/ul>\n<p><strong>Recipe page:<\/strong><\/p>\n<ul>\n<li>Name.<\/li>\n<li>\"25 min, serves 2, about 520 cal each\".<\/li>\n<li>Up to 5 ingredient lines, otherwise four plus \"and 3 more\". Missing\nthings show \"to get\"/\"low\" in kitchenText.<\/li>\n<li>Fixed line \"Keep at the top\": Pinned/No. Pin lives here, because a\nhold would pick up the wheel.<\/li>\n<li>Fixed line \"Plan for\": a tap rolls No day, then Monday to Sunday,\nwith \"Shakshuka, planned for Monday. Undo\".<\/li>\n<li>The foot follows the recipe.<\/li>\n<\/ul>\n<p><strong>Rejected:<\/strong><\/p>\n<ul>\n<li>v1-v2 paged rows with per-row action words (\"too cluttered\").<\/li>\n<li>v3 timetable (kept only as an alternative view).<\/li>\n<li>Hold-to-pin.<\/li>\n<li>A spring-back wheel.<\/li>\n<\/ul>\n<h2 id=\"groceries\">Groceries<\/h2>\n<p>Groceries is not a separate list. It is Pantry <strong>To\nget<\/strong> (237 ruling); the Home Shopping face reads To get.<\/p>\n<p>Still-valid logic from groceries-tess (47):<\/p>\n<ul>\n<li>The phone sorts by aisle.<\/li>\n<li>A planned meal's missing lines land with \"for tacos\" under them:\n\"Tacos, 2 added. Undo\".<\/li>\n<li>Claude's only job is matching a row to a recipe ingredient. It comes\nas one ask (\"Scallions, for tacos?\" Keep / Not now), never during\nshopping.<\/li>\n<li>\"Usually\" words come from his own check-off history, max 4.<\/li>\n<li>Groceries never notifies.<\/li>\n<li>\"+\" pack-first amounts (\"1 can + 15 oz\").<\/li>\n<\/ul>\n<p>Its visuals (\u2039 KITCHEN, Title 44, wet cobalt ghosts, USUALLY caps)\nare SUPERSEDED. Remove gesture: see list-remove under Lists.<\/p>\n<h2\nid=\"recipe-from-a-link-kitchenlink-fetch-us-32-231-fix-5-233-fix-6\">Recipe\nfrom a link (kitchen/link-fetch-us 32, 231 fix 5, 233 fix 6)<\/h2>\n<ul>\n<li>Order: L1 recipe card, then L2 the page's text, both fetched and\nparsed on the phone. L3 is Claude, only after both fail, with asksClaude\non and his ask, logged in Sent, and skipped when Claude is paused at the\ncap.<\/li>\n<li>The New recipe brief reads \"Tell Tess, type it, or paste a link.\"\nIts line: \"A link is fetched from its site, read on the phone.\"<\/li>\n<li>Nothing is saved until Save. \"Chili mac saved.\" comes with a 10 s\nUndo, and the recipe keeps \"From budgetbytes.com\".<\/li>\n<li>Failure copy, each in Tess's two lines, ending \"Paste the text\ninstead.\":\n<ul>\n<li>\"That site won't let me read it.\"<\/li>\n<li>\"The steps are paywalled. Paste them below.\"<\/li>\n<li>\"That page is paywalled.\"<\/li>\n<li>\"No recipe on that page.\"<\/li>\n<li>\"Claude didn't answer in time.\"<\/li>\n<li>\"Claude's paused until Nov 1.\"<\/li>\n<li>\"You're offline. I'll read it when you're back.\"<\/li>\n<li>\"Too big to read safely.\"<\/li>\n<li>Several recipes on a page: \"3 recipes on that page. I read the\nfirst.\"<\/li>\n<\/ul><\/li>\n<li>Visual layer (cobalt wash, sage brush pass, \u2039 KITCHEN, Title 44) is\nSUPERSEDED. Redraw in the 231/233 grammar (unconfirmed, not yet\ndrawn).<\/li>\n<\/ul>\n<hr />\n<h1 id=\"lists\">LISTS<\/h1>\n<h2 id=\"palette-237-color-roles-241-lists-kinds-v9\">Palette (237,\ncolor-roles-241 \"Lists kinds v9\")<\/h2>\n<ul>\n<li>Olive accent 5E6B1F / B5BE7A: dial focus, focused list, list title,\nactions, check strike.<\/li>\n<li>Wine 9A2541 / EE8E9C: due only (\"Fri\", \"due Friday\", the count of a\nlist due soon). Used sparingly (his 10:25 PM).<\/li>\n<li>Kind colors (v9, one family):\n<ul>\n<li>Shopping: Kitchen ochre.<\/li>\n<li>Trips: steel 2F6A8F/8DBAD6.<\/li>\n<li>Home: teal 1E6E77/84C3C9.<\/li>\n<li>People: plum 8A4570/D69CC0.<\/li>\n<li>Watch and read: lavender 6A5E8C/B4A9D6.<\/li>\n<\/ul><\/li>\n<li>v9 moved small-caps labels to ink2, because steel is too close to\nslate. Slate stays only on \"Private\".<\/li>\n<li>Halfway is ink.<\/li>\n<li>Board v9 <a\nhref=\"https://claude.ai/artifact/9JBnr8TytGTnKtnnyXjdik\">https://claude.ai/artifact/9JBnr8TytGTnKtnnyXjdik<\/a>\nis NOT yet reviewed. He called v8 \"slightly okay, combinations not\ngood\".<\/li>\n<\/ul>\n<h2 id=\"lists-page-sheet-237-v2v3--landing-open\">Lists page (sheet 237\nv2/v3) \u2014 LANDING OPEN<\/h2>\n<p><strong>Kinds row<\/strong> (v3): the top 42, 38 pt tall, one kind at\na time.<\/p>\n<ul>\n<li>It shows the current kind, 17 pt Semibold ink, with its count at 15\npt in the accent.<\/li>\n<li>Each kind is a full-width page. It follows the finger 1:1 with a\n0.3x rubber band, commits past 22% or on a flick of 0.5 pt/ms or more,\nand gives a selection tick.<\/li>\n<li>Kinds: All lists, Shopping, Trips, Home, People, Watch and\nread.<\/li>\n<li>It is a shared component, also for Notes, Kitchen and Money.<\/li>\n<li>SUPERSEDED in v3/v5: the \"1 of 6\" counter (N of M ban), and the\nglass lens and the v5 iris slab. The lens was rejected at 10:51 PM Oct\n23: \"I don't want that lens effect at all\". Never re-offer it.<\/li>\n<\/ul>\n<p><strong>Dial (v2 tighter):<\/strong><\/p>\n<ul>\n<li>46 pt rows, focus 40 pt, neighbours 16 pt (0.4x) with blur.<\/li>\n<li>Dial 140 pt tall at top 84. Brief at 236. Wheel at 294, 310 pt\ntall.<\/li>\n<li>Lenses per kind:\n<ul>\n<li>All: Going / Due soon / Done / All.<\/li>\n<li>Shopping: To get / Due soon / Got it all / All.<\/li>\n<li>Trips: To pack / Due soon / Packed / All.<\/li>\n<li>Home: Going / Due soon / Fixed / All.<\/li>\n<li>People: To call / Due soon / Called / All.<\/li>\n<li>Watch and read: Up next / Halfway / Finished / All.<\/li>\n<\/ul><\/li>\n<\/ul>\n<p><strong>Brief:<\/strong> \"19 things left across 7 lists. Before the\ntrip is due Friday.\"<\/p>\n<p><strong>Wheel:<\/strong><\/p>\n<ul>\n<li>Header: small caps \"Your lists\" with \"7 lists, due first\".<\/li>\n<li>Focus: name in olive Semibold, 26 pt fitted down to 21 pt, then\nwhole words.<\/li>\n<li>Detail 1: 13 pt, \"5 of 9 left, due Friday\" (due in wine\nMedium).<\/li>\n<li>Detail 2: 15 pt ink2, the next open things as whole items.<\/li>\n<li>Others: 17 then 15 pt ink2. Blur 0.65 / 1.0 pt.<\/li>\n<li>Order: due soon first, then most recently touched.<\/li>\n<\/ul>\n<p><strong>Action word<\/strong> names the kind: Start fresh / Start a\nrun / Pack a bag / Start a project / Start a call list / Save a pick.\nDrag right gives \"Private list\".<\/p>\n<h2 id=\"a-list-237\">A list (237)<\/h2>\n<ul>\n<li>It slides in from the right; back is the left edge.<\/li>\n<li>Header: the lens on the left, \"5 of 9 left\" or \"All done\" on the\nright.<\/li>\n<li>Title: olive, fitted 28 pt down to 21 pt. Meta: small caps\n\"List\"/\"Private\", then \"9 things, due Friday\".<\/li>\n<li>Rows: 40 pt at 19 pt. Open things first, then a \"Done\" label, then\nchecked things in ink2 with a 1 pt olive strike. A due day shows at 13\npt wine.<\/li>\n<li>Check: tap, or swipe right past 70 pt. The strike draws left to\nright over 260 ms with a .medium impact. It stays struck for 1.5 s; each\nnew check restarts the wait, so a run of taps drops together. Reduce\nMotion waits 0.6 s. Tapping a struck thing before it drops takes it\nback.\n<ul>\n<li>Receipts: \"Passports, done. Undo\", or \"Before the trip, all done.\nUndo\" on the last one.<\/li>\n<\/ul><\/li>\n<li>Swipe left: Not now. The thing moves to the end of the open\nthings.<\/li>\n<li>Tap a done thing: \"Passports, back on the list. Undo\".<\/li>\n<li>More than 400 pt of rows pages vertically (drop the \"1 of 2\").<\/li>\n<li>Add: a new line opens at the top with an olive caret, and the word\nbecomes \"Done\". Return adds the line and opens the next one. It\nautosaves on tap-away or Esc.<\/li>\n<li>\"Add\" dragged left: \"Clear done\", giving \"Cleared 5 done. Undo\".\nCleared things are recoverable from the op log for 7 days. With nothing\ndone: \"Nothing done to clear.\"<\/li>\n<li>\"Add\" dragged right: \"Uncheck all\".<\/li>\n<\/ul>\n<p><strong>Privacy:<\/strong> \"Private list\" off the room. Under lab\nmode, private list things MAY go to Claude, gated by asksClaude with a\nsent-log row (his 10:25 PM).<\/p>\n<h2 id=\"list-remove-list-remove-item-65-product-ne11\">List remove\n(list-remove, item 65; Product NE11)<\/h2>\n<ul>\n<li>Remove is one gesture with one Tess line and Undo. It is never a tap\n(tap is the check), never a hold, never a red row, trash can or\nconfirm.<\/li>\n<li>The phrase form: \"remove rice from groceries\" gives \"Rice, removed.\"\n<ul>\n<li>Not on the list: \"No rice on Groceries.\"<\/li>\n<li>Two matches: \"2 rows match. Swipe the one to remove.\"<\/li>\n<\/ul><\/li>\n<li>Undo: \"Ground beef, back on Groceries.\"<\/li>\n<li>A removed row never counts as checked.<\/li>\n<li>CONFLICT: the sheet's left swipe with REMOVE rising at 60 pt and\ncommitting at 96 pt predates the Oct 23 rule (left = Not now). Under\ntoday's rules remove has no row swipe. Use the phrase, or \"Clear done\"\non the action word, plus the VoiceOver action \"Remove\". Open question\n5.<\/li>\n<li>Rejected: Lists room lintel as a falling stepped line of tiles (217;\npixels are Home only), and ink check rings (rings banned).<\/li>\n<\/ul>\n<hr />\n<h1 id=\"notes\">NOTES<\/h1>\n<h2 id=\"palette\">Palette<\/h2>\n<ul>\n<li>Room color is <strong>plum 8A4570 / E3A3CB<\/strong>, used on the 246\nlanding. Violet 5B3FB8 is retired: it was \u0394E00 6.1 from Ember.\nConfirming plum is still open.<\/li>\n<li>Doors' meaning colors:\n<ul>\n<li>All notes: ink.<\/li>\n<li>Ideas: room.<\/li>\n<li>From Tess: \"Tess blue\" (see open question 6).<\/li>\n<li>Voice memos: room.<\/li>\n<li>Pinned: gold 7E6A1E/D9C27A.<\/li>\n<li>Mentions: ink.<\/li>\n<li>Private: slate.<\/li>\n<li>Archive: ink2.<\/li>\n<\/ul><\/li>\n<li>235's sienna 8A4B2A/E0A47F for \"fresh today\" stands for the inner\npage (unconfirmed after 246).<\/li>\n<\/ul>\n<h2 id=\"notes-landing-sheet-246--approved-oct-24-154-am-pt\">Notes\nlanding (sheet 246) \u2014 APPROVED Oct 24, 1:54 AM PT<\/h2>\n<p>Board v4: <a\nhref=\"https://claude.ai/artifact/1mSPKcxhvQB4pFU2tmQZkx\">https://claude.ai/artifact/1mSPKcxhvQB4pFU2tmQZkx<\/a>.\nRepo PR #1413. Supersedes 226, the 235 landing parts, 240 and 242 rounds\n1-5.<\/p>\n<p><strong>Frame:<\/strong> 402x874 pt, 24 pt gutters.<\/p>\n<ol type=\"1\">\n<li>\"Notes\" at y 54, Figtree 700 40 pt, room color. No \"doors\" label\n(his last tweak).<\/li>\n<li>One line under it, Figtree 16 ink2, e.g. \"Three new today, one from\nTess.\"<\/li>\n<li><strong>Word wall<\/strong>: x 24-378, y 180-400 (220 pt, a quarter\nof the screen, centred on the Home mosaic slot, so the mosaic hands its\nplace to the words).<\/li>\n<li><strong>Doors dial<\/strong>: y 432-576, 32 pt under the wall.<\/li>\n<li>Line at y 612, Figtree 15 ink2 with the title in ink 600: \"You last\nwrote in <Title>, an hour ago.\" He asked for this to be rephrased; final\nwording is unconfirmed. Private notes use shownLabel.<\/li>\n<li>\"New note\" bottom-left (28 pt from the edge, 44 pt target), Tess\nbottom-right. No lines, cards or fills.<\/li>\n<\/ol>\n<h3 id=\"word-wall-engine-246-242-rounds-4-6-word-wall-rules\">Word wall\nengine (246; 242 rounds 4-6; word-wall-rules)<\/h3>\n<p><strong>Words.<\/strong> The user's note titles, weighted by pinned,\nrecent, due and opened often. Private notes never appear.<\/p>\n<p><strong>Type.<\/strong><\/p>\n<ul>\n<li>CAPITALS, Figtree 900, letter-spacing -0.01 em.<\/li>\n<li>\"Sharpened\": a same-color outline stroked behind each glyph, at 3.5%\nof the font size, with mitred joins, for crisper corners.<\/li>\n<li>Line box = cap height only, with 3 pt gaps between every brick on\nall sides, so rows read as solid bricks.<\/li>\n<li>Nothing under 13 pt.<\/li>\n<\/ul>\n<p><strong>Justified rows that solve their own height.<\/strong> Every\nrow meets both edges (x 24 and 378) exactly. With a = advance width per\npt of size and C = cap-height ratio:<\/p>\n<ul>\n<li>Single word brick width = a/C\u00b7h.<\/li>\n<li>A stack of n small words, each sized to fill the brick width: width\n= (h - (n-1)\u00b73) / (C\u00b7\u03a3(1/a\u1d62)).<\/li>\n<li>A two-word name stacked on two lines, same color and size: width =\na_max/C\u00b7(h-3)/2.<\/li>\n<li>Each row follows a brick pattern (B S / S B S / B B S / S B / B S\nB). Big words come from the top of the importance list, and stacks from\nthe bottom, paired by length. Bricks are added until the row passes its\ntarget width, then h is solved (bisection) so the row meets both edges\nexactly.<\/li>\n<\/ul>\n<p><strong>Notch fillers.<\/strong> The notch beside a stacked name's\nshorter line is filled by one of:<\/p>\n<ul>\n<li>1-3 small words stacked to its exact height, in other colors (Tetris\nL/J shapes);<\/li>\n<li>two words side by side at the name's size.<\/li>\n<\/ul>\n<p>Repeats are allowed, but only of words not already on the wall. If\nnothing fits, the name goes flat on one line and the wall re-packs.<\/p>\n<p><strong>Stretch and gaps (his rule).<\/strong><\/p>\n<ul>\n<li>Letters are never spaced unevenly, and there are no gaps.<\/li>\n<li>A word may stretch at most 8%, glyphs and spacing together and\nuniform (lengthAdjust spacingAndGlyphs).<\/li>\n<li>A row that can't reach both edges is rejected, never squeezed.<\/li>\n<li>The wall is packed at row-height scales 0.70-1.40 in 0.02 steps (36\ntries). It keeps the largest scale whose leftover height is under 8 pt\nand spreads that leftover into the row gaps.<\/li>\n<\/ul>\n<p><strong>Colors.<\/strong> 12 per look, assigned by index\u00b75 mod 12, so\nneighbours never match. This is the one exception to 3-4 colors.<\/p>\n<ul>\n<li>Light: B5452B 1E6E77 7A5A12 5A3F8E 2F6A8F 8A4570 3F6B2A 9A2541\n0F766E 92400E 1F4E8C 1D1B19.<\/li>\n<li>Black: F09A7E 84C3C9 E2C26A B4A3E6 8DBAD6 E3A3CB A9D48A F08E9C\n5FD0C0 F0B07A 9DB8F0 F1EEE9.<\/li>\n<li>Open question 7: B5452B and F09A7E have not been checked against the\n\u0394E00 10 Ember rule.<\/li>\n<\/ul>\n<p><strong>Tap a word<\/strong> to open that note.<\/p>\n<p><strong>Moments<\/strong> (his 1:46 AM timing; slower, so there is\ntime to read and tap):<\/p>\n<ul>\n<li>Every 5 s, one word does one of:\n<ul>\n<li>flip: rotateX 360, 0.8 s;<\/li>\n<li>jumble: letters scramble and settle left to right like the Home\ndeparture board, 0.8 s;<\/li>\n<li>dissolve: noise/turbulence displacement out and back, 1.3 s.<\/li>\n<\/ul><\/li>\n<li>Every 40 s a new word swaps in and the wall re-packs: bricks glide\nto their new places on a 0.65 s spring.<\/li>\n<li>Every 2 min there is one whole-wall moment, alternating: a diagonal\nflip wave, or dissolve everything and rebuild with new words.<\/li>\n<li><strong>No pile.<\/strong> \"Not needed, remove it, forget it\" (2:02\nAM). On entry the bricks glide into place 22 ms apart.<\/li>\n<li>Reduce Motion: no moments, and swaps cross-fade.<\/li>\n<\/ul>\n<p><strong>Rejected on the way<\/strong> (don't re-offer):<\/p>\n<ul>\n<li>Archivo condensed: wanted the Figtree/Bricolage feel.<\/li>\n<li>Bricolage 84% width: Figtree won in round 6.<\/li>\n<li>Plain Figtree, Plus Jakarta Sans 800, Urbanist 900.<\/li>\n<li>Third-screen (300 pt) and full-page bands: the quarter band\nwon.<\/li>\n<li>Uneven letter spacing to fill.<\/li>\n<li>Pile-and-tidy, toss, and the tilted pile.<\/li>\n<li>Tide (\"doesn't have anything\").<\/li>\n<li>Ink-only with top-5 colored: he wants as many colors as\npossible.<\/li>\n<li>Round 3's subtitles under words.<\/li>\n<\/ul>\n<h3 id=\"doors-dial-246\">Doors dial (246)<\/h3>\n<ul>\n<li>The app dial: 3 places, <strong>48 pt slots<\/strong> (64 before;\nsame type size), loops, haptic tick per door, spring settle.<\/li>\n<li>Focus: name Figtree 700 21 pt x1.32 in its meaning color, with the\ncount in Outfit 400 at about half size, ink2.<\/li>\n<li>Neighbours: smaller, ink2, <strong>depth blur up to 1.8 pt<\/strong>,\nnone under Reduce Motion or Low Power.<\/li>\n<li>Order: All notes, Ideas, From Tess, Voice memos, Pinned, Mentions,\nPrivate, Archive.<\/li>\n<li>Right of the focus: \"Newest <when>\" (13 pt ink2), then its 3 newest\ntitles (16 pt, the first at 700), which rise 6 pt into place when the\nfocus changes. Private shows one line, \"3 private notes\", never \"Private\nnote\" repeated.<\/li>\n<li>Drag vertically to turn. Tap the focus to open the door; tap a\nneighbour to turn to it.<\/li>\n<li>Rejected:\n<ul>\n<li>the spine shelf of door names (1:40 AM; he liked the column idea, so\nkeep it for another place);<\/li>\n<li>plain \"Recent\" + 2-column \"Doors\" rows (\"too basic\");<\/li>\n<li>a \"Doors\" section label.<\/li>\n<\/ul><\/li>\n<\/ul>\n<h2\nid=\"notes-door-pages-his-codex-era-decisions-245-835-am-pt-oct-24-win-over-247-v2\">Notes\ndoor pages: his Codex-era decisions (2:45-8:35 AM PT Oct 24) WIN over\n247 v2<\/h2>\n<p>247 v2 (below) was written from his 2:08-2:22 AM notes, before he\nkept designing with Codex. Where they differ, these later decisions\nhold, and 247 must be reconciled to them before anyone builds (source:\n<code>docs/handoff/codex-chat-oct24.md<\/code> \u00a71):<\/p>\n<ul>\n<li><strong>Band:<\/strong> the Notes word wall, a FIXED block on every\ndoor page. Codex's prototype used 354 x 124 pt (247 v2 says 354 x 132;\nuse 124 unless he says otherwise). Word spacing 3 or 5 pt, \"fine either\nway\". Landing effects apply (flip, departure scramble, dissolve).<\/li>\n<li><strong>Too few words:<\/strong> repeat words in other colors and\nsizes (his rule). This replaces 247 v2's split-names-and-fillers\nfallback.<\/li>\n<li><strong>Areas (tags):<\/strong> a note may touch several areas;\ntapping an area gathers every related note across doors. A key Notes\nfeature.<\/li>\n<li><strong>Lower section = Folio:<\/strong> the section under the band\nturns like a real flexible page while the band stays fixed. Horizontal\nswipes curl the page left; vertical swipes fold it top to bottom.\nBackside visible, a crease, a soft contact shadow, shallow curl, firm\nbound edge, a little corner lift (Codex used the Grabfold WebGL page\ncurl as reference). This replaces the \"ledger\" list as the pick.<\/li>\n<li><strong>Neighbours by name:<\/strong> no \"Previous note / Next note\";\nthe turn words name the neighbouring notes by title.<\/li>\n<li><strong>Titles overlay:<\/strong> the small heading above the preview\n(a \"Titles\" word) opens a searchable overlay of every note title.<\/li>\n<li><strong>Lower section shows a small card per note<\/strong> (his ask,\nan exception to \"no cards\" for this place); opening a note shows its own\nfull page without the band (voice memo: duration, areas,\ntranscript).<\/li>\n<li><strong>Open note order:<\/strong> title, updated date, then the\ncontent directly. Areas come after the content as a control that opens a\nsmall pane sized to its contents.<\/li>\n<li><strong>Areas pane is glass (his ask, exception to \"no lens or\nglass\" for this pane only):<\/strong> translucent, thin, refractive, NO\nborder, NO bright rim, the text behind faintly visible. Selecting an\narea opens that area's list.<\/li>\n<li><strong>No diagonal arrow glyphs anywhere.<\/strong><\/li>\n<\/ul>\n<h2\nid=\"notes-door-pages-sheet-247--draft-v2-not-approved-to-be-reconciled-with-the-section-above\">Notes\ndoor pages (sheet 247) \u2014 DRAFT v2, not approved, to be reconciled with\nthe section above<\/h2>\n<p>Board v4: <a\nhref=\"https://claude.ai/artifact/S4dqsoynjdQMRQsV9EPW5z\">https://claude.ai/artifact/S4dqsoynjdQMRQsV9EPW5z<\/a>.<\/p>\n<ul>\n<li><strong>One fixed block on every door page:<\/strong> the wall is\nalways x 24-378, y 140-272 (354x132 pt). The list always starts at y\n300. Nothing below moves from door to door.<\/li>\n<li>Font sizes vary per door so each door's words fill that exact block.\nNo gaps. No row of all-equal sizes if a mixed row fits.<\/li>\n<li><strong>Door wall algorithm:<\/strong>\n<ul>\n<li>Each note once, newest first. Each gap between neighbours is one of:\nsame stack (2-3 titles each sized to the stack width), next brick, or\nnext row. All 3^(n-1) choices are tried, up to 10 items.<\/li>\n<li>Every row meets both edges. The whole wall may scale \u2264 8% uniformly\nso the last row meets the bottom.<\/li>\n<li>Score:\n<ul>\n<li>closest to no scale;<\/li>\n<li>a newer row is never smaller than the row under it;<\/li>\n<li>neighbouring rows differ by 25% or more;<\/li>\n<li>rows of 3+ equal words cost most, rows of 2 equal words some;<\/li>\n<li>nothing under 13 pt.<\/li>\n<\/ul><\/li>\n<li>Small doors: a two-word title may break into stacked words (never\nside by side, one color). If it is still short, the note's day and\ndetail join as ink2 fillers, smaller than every title, never two side by\nside.<\/li>\n<li>Tap a word to focus that note in the list.<\/li>\n<\/ul><\/li>\n<li><strong>Page:<\/strong>\n<ul>\n<li>Back word \"Notes\" top-left in the room color.<\/li>\n<li>Door name Figtree 700 34 pt in its color, then one 16 pt ink2\nline.<\/li>\n<li>The block, then the list at 300.<\/li>\n<li>Action word per door: New note, New idea, Ask Tess, Record, New\nprivate note, Restore.<\/li>\n<\/ul><\/li>\n<li><strong>List (\"Ledger\", the pick):<\/strong>\n<ul>\n<li>An 84 pt left column names each group only where it starts, in the\nroom color at 13 pt small caps: Today, Yesterday, This week, Earlier.\nMentions groups by kind.<\/li>\n<li><strong>Titles are sized by recency:<\/strong> Today 21, Yesterday\n18, This week 17, Earlier 16 (Figtree 600). Mentions: 19 for the top\nthree, then 16.<\/li>\n<li>The when sits at the right, 13 pt ink2. Under it, one 14 pt ink2\nline cut at a whole word, with no \"...\".<\/li>\n<li>Tap a note to open it in place (title +3 pt, body 16 pt, meta 13\npt).<\/li>\n<\/ul><\/li>\n<li><strong>From Tess<\/strong> reads as her voice. There is no \"Tess\nsaid\" title. A small line reads \"About <strong>Run plan<\/strong>\" (13 pt\nink2, the subject in ink 700) with the when, then her sentence in\n<strong>Newsreader<\/strong>, in Tess's color, sized Today 22, then 19,\n18, 17. The open one shows all her words at +3 pt.<\/li>\n<li>Voice memos: length in Outfit, units at half size, plus the start of\nthe transcript.<\/li>\n<li>Private: locked until Face ID (\"Unlock\"), and counted (\"3 private\nnotes\").<\/li>\n<li>Going in: the landing's words that belong to the door stay and\nre-pack; the rest dissolve. Moments as on the landing, with no\npile.<\/li>\n<li>Alternative (not picked): \"Pages\", four notes a page with an\n\"Older\"/\"Newer\" word or a sideways swipe.<\/li>\n<li>Unconfirmed: the sheet header says \"Oct 24 4:30 PM PT\" while the\ndepth rules are 2:08-2:22 AM. That is likely 2:30 AM.<\/li>\n<\/ul>\n<h2 id=\"note-page-sheet-235-the-parts-not-superseded\">Note page (sheet\n235, the parts not superseded)<\/h2>\n<ul>\n<li>Header: lens on the left; on the right \"Today, 2 h ago\" or \"Edited 3\ndays ago\".<\/li>\n<li>Title in the room color (was violet), fitted 28 pt down to 21 pt,\nthen whole words. Meta: small-caps \"Note\"/\"Private\" in slate, then \"29\nwords, kept at the top\".<\/li>\n<li>Body: Newsreader 19/26, paged in 286 pt pages. Unconfirmed:\nNewsreader is now reserved for Tess's words, so the user's own note body\nmay need Figtree. The 247 open-in-place uses 16 pt.<\/li>\n<li>Fixed lines \"Keep at the top\" and \"Private\" (Yes/No rolls on tap).\nMax 3 kept.<\/li>\n<li>Foot: \"Write\", which becomes \"Done\".\n<ul>\n<li>Drag left: \"Delete note\". It goes into \"Recently deleted\" for 7\ndays.<\/li>\n<li>Drag right: \"New note\".<\/li>\n<li>While typing, \"Done\" dragged left: \"Put back\".<\/li>\n<\/ul><\/li>\n<li>Autosave every 2 s of quiet.<\/li>\n<li>Private:\n<ul>\n<li>shownLabel off the phone.<\/li>\n<li>Body kept out of backups; a restore brings back a stub.<\/li>\n<li>Under lab mode private text MAY go to Claude, with asksClaude and a\nsent-log row (v3, his 10:25 PM).<\/li>\n<\/ul><\/li>\n<li>SUPERSEDED: the 235 dial and wheel list (now the 246 landing and 247\nledger), violet, and \"1 of 2\".<\/li>\n<li>Also SUPERSEDED: 217 note-as-tile-rows lintel, 81, notes-grammar 57\n(cobalt, Title 44).<\/li>\n<\/ul>\n<h2 id=\"landing-studies-that-led-here\">Landing studies that led\nhere<\/h2>\n<ul>\n<li><strong>240<\/strong> (Oct 24 12:00 AM), board <a\nhref=\"https://claude.ai/artifact/XJrBPpMjnuFCyvTjpp4CgY\">https://claude.ai/artifact/XJrBPpMjnuFCyvTjpp4CgY<\/a>.\nAll REJECTED at 12:07 AM:\n<ul>\n<li>A: paragraph prose with bold door words.<\/li>\n<li>B: fine-line drawing with labelled doors (\"the worst\").<\/li>\n<li>C: contents page of ranked words.<\/li>\n<li>Its system rules (one statement of now, 3-6 doors, no list rows)\nstill describe what a landing must do.<\/li>\n<\/ul><\/li>\n<li><strong>242 rounds:<\/strong>\n<ul>\n<li>Round 1 (U7CbdSZGtjH6f7Qh5M13ZA): strings, chimes, swarm, jars,\nheap, ink. All rejected; strings and chimes \"too bad\", swarm \"too\nmuch\".<\/li>\n<li>Round 2 (24SMi8GxcoMFmMdtHwr99f): kinetic type: tossed/tidied,\nweighted words, tide, standing words. Rejected.<\/li>\n<li>Round 3 (HgDEZfib4Xw9BiafqyVydt): the word band.\n<strong>Liked<\/strong>: \"the first landing idea he liked\".<\/li>\n<li>Round 4 (M9JKaR55a6rRFdiBcH2sYU): packed wall, 12 colors.<\/li>\n<li>Round 5 (CTm3h1DfeUV3nUADP8Vf6N): capitals, L/J stacks.<\/li>\n<li>Round 6 (1mSPKcxhvQB4pFU2tmQZkx): became 246.<\/li>\n<\/ul><\/li>\n<li>Next: use the wall on other landings (Kitchen, Lists and Routines\nare all open).<\/li>\n<\/ul>\n<hr />\n<h2 id=\"open-questions-and-contradictions\">Open questions and\ncontradictions<\/h2>\n<ol type=\"1\">\n<li>Pantry (232) and Recipes (233) are deeper pages, but they use\n3-place dials. The Oct 24 depth rule says dials go on landings only.\nRedraw them, or treat them as half-landings?<\/li>\n<li>Banned \"N of M\" counters still sit in current sheets: cooking \"Step\n2 of 6\", Pantry/Notes/Lists \"1 of 2\", the lists \"5 of 9 left\" detail,\nand the kinds row \"1 of 6\".<\/li>\n<li>Kitchen and Lists landings are superseded but not redesigned. The\nword wall is the expected base.<\/li>\n<li>Pantry value line at 8 pt Light (234 v8) is below the 13 pt wall\nminimum and the 10 pt units minimum. 9 pt was already flagged under\nApple's 11 pt guideline.<\/li>\n<li>list-remove's left-swipe REMOVE conflicts with left = Not now.<\/li>\n<li>246/247 say \"Tess blue\" for From Tess, but Tess's color is Ember\nFF5A26/FF6B3D. Which color is it?<\/li>\n<li>Plum 8A4570 is the Notes room color (246), the Lists People kind\n(v9), and the Training Legs split. The light wall palette also includes\n8A4570, and B5452B/F09A7E look close to Ember. They need a \u0394E00\ncheck.<\/li>\n<li>Notes \"Newsreader only for Tess\" conflicts with the 235 note body in\nNewsreader 19/26 and the 235 first-words line in Newsreader italic.<\/li>\n<li>229's cook \"bead\" ring and 132's progress strip/bars may break the\nno-rings/bars rule.<\/li>\n<li>247's date \"4:30 PM\" looks wrong; it is probably 2:30 AM.<\/li>\n<li>234 v5 \"slate section names with hairline\" vs. 241 v9 \"small-caps\nlabels go to ink2\" (Lists only?). Kitchen keeps slate\n(unconfirmed).<\/li>\n<\/ol>\n"}, {"id": "p5", "name": "Routines, Money, the rest", "html": "<h1\nid=\"05-routines-money-measure-the-quiet-pages-settings-icon-empty-states-errors\">05.\nRoutines, Money, Measure, the quiet pages, Settings, icon, empty states,\nerrors<\/h1>\n<p>Status as of Oct 24, 2026. Newer sheets win over older ones, and the\nhard rules in the brief (type, no\ncards/pills/bars/rings/dots/underlines/lens/fades/\"N of M\", 3-4 colors\nby meaning, big type never shares a color, swipe right = Done / left =\nNot now, Undo 10 s, weeks start Monday, numbers scroll and never step\nwith -/+, depth blur on wheels, fixed text slots, one action word\nbottom-left plus Tess bottom-right) override anything below that\ndisagrees. Many sheets here come from the Oct 15-19 \"grammar\" era\n(uppercase label words, cobalt Tess, sage/painterly strokes, dabs, Title\n44 / Hero 56). For those pages, <strong>the behavior and copy carry\nover, but the look does not<\/strong>. Redraw them in the current room\nlanguage (Figtree/Outfit, color roles 241, wheels, action word) when\ntheir round comes.<\/p>\n<hr />\n<h2 id=\"1-routines\">1. Routines<\/h2>\n<p><strong>What it is for:<\/strong> the things he does on a rhythm:\nmorning walk, vitamins, evening stretch, chores, reading. A routine can\nbe <strong>one thing<\/strong> or <strong>a run of steps<\/strong>. Owner:\nBuilder B.<\/p>\n<p><strong>Routines landing = the habit woodland (sheet 248, from his\nCodex chat 2:45-8:35 AM PT Oct 24; v1, awaiting his verdict).<\/strong>\nBoard: <a\nhref=\"https://claude.ai/artifact/KZkqPY2U6VxDMBETRu3CML\">https://claude.ai/artifact/KZkqPY2U6VxDMBETRu3CML<\/a>.\nFull spec:\n<code>docs/handoff/design-sheets/routines-woodland-248.md<\/code> (scene\ncode in <code>routines-woodland-248/scene.html<\/code>). It replaces the\n\"landing waits\" line below; the inner-page rulings of 238 still\nstand.<\/p>\n<h3 id=\"10-the-woodland-248\">1.0 The woodland (248)<\/h3>\n<ul>\n<li><strong>What it is:<\/strong> the Routines keystone (see 00 Read me\nfirst). Plants are habits. Consistent habits grow into trees, new ones\nare small plants, several species and sizes. It is a living scene built\nfrom the Routines data, in the Home mosaic's slot, and it is also how\nyou move around Routines.<\/li>\n<li><strong>Life stages:<\/strong> sprout day 0, small plant day 3,\nmedium plant day 7, tree day 28, first fruit day 35. Flowers = done\ntoday. Fruit = a completed week, collectable. A nest on trees at 30\ndays. Importance caps size (small plant 32, shrub 46, small tree 68,\ncanopy tree 104 prototype units), so a steady small habit can stay a\nshrub.<\/li>\n<li><strong>Withering:<\/strong> 3 days in a row missed, or 3 missed\nwithin 7 days = sparse canopy, leaves falling. 8 in a row = bare, no\nleaves. One completion can't restore a bad week. A planned rest keeps\nthe foliage. Replanting starts a new cycle. UI words stay soft: \"needs\ncare\", \"begin again\", \"resting\"; never \"missed\", \"dead\" or red\nbanners.<\/li>\n<li><strong>Caretaker:<\/strong> sits by the lake; walks out to plant,\nwater a finished habit or collect fruit, then back. Whole reaction \u2264 5 s\n(1.65 out, 1.7 working, 1.65 back).<\/li>\n<li><strong>Scene layout:<\/strong> lake in the central clearing (quiet\nsilver-jade, reflective wavelets), middle empty until the forest fills,\n12-14 plants in the wide view, every plant tappable, none hides another,\nneighbours never share a color family, blue only at the outer edges,\ntree shape and color independent, background trees faint, the scene\nfades into the page color in Paper and Black. Slow clouds, birds\nvisiting new trees, butterflies, evening fireflies.<\/li>\n<li><strong>Landing (402 x 874):<\/strong> plum title; one Tess sentence\nof three big colored phrases (\"Three done, eight to tend, three to give\na little care.\": green, plum, wine); the woodland in the mosaic slot\n(402 x 182); one caption line names a tapped tree and its stage, a\nsecond tap opens it; the 3-place dial (Today, Body, Mind, Home, Fruit,\nAcross the lake) with the focused door's three most urgent routines\nbeside it; turning the dial pans the woodland to that grove; foot word\n\"Plant\", Tess at right.<\/li>\n<li><strong>Inside a grove:<\/strong> back word, grove name 38 pt 700\nplum, a 100 pt crop of the woodland, the dimension line (Needs care wine\n/ To tend plum / Done today green; sideways turns them), then the\n230/233 focus wheel; foot word follows the focus (Done, Begin again,\nCollect).<\/li>\n<li><strong>A routine:<\/strong> the whole life on one hairline with five\nstage words and a moving marker, current stage large (plum; wine when\nwithering; slate when bare), seven strokes, \"Six kept in the last seven\ndays\", one care sentence.<\/li>\n<li><strong>Completion:<\/strong> tap opens; swipe right or hold\ncompletes with a 7-petal bloom (1.3 s, light haptic) and a strike; Undo\n10 s; swipe left = Not now. No \"Open routine\" / \"Mark done\"\nbuttons.<\/li>\n<li><strong>Colors:<\/strong> plum 8E4A78 / D79BC4 (black; 238/241 say\nD59AC4: confirm), done green 2F6450 / 8EC7AE, needs care wine 9A2541 /\nEE8E9C, new and fruit gold 7E6A1E / D9C27A, resting slate 34506F /\nA7BCD6.<\/li>\n<li><strong>Reduce Motion:<\/strong> no walking caretaker, no petals, no\nblur, no drift; cross-fades; a still woodland.<\/li>\n<li><strong>Rejected in the Codex chat:<\/strong> tree icons inside\nlists, tabs and pills, a long list, a stage legend (\"new 3, mature 2\"),\na percentage with bars, packing a whole grove on one screen.<\/li>\n<li><strong>Open:<\/strong> which groves (recommend Body, Mind, Home,\nplus Borrowed from other rooms across the lake; Mornings and Evenings\nbecome Today filters); withering vs the older \"nothing is owed\" rule\n(his ask wins; recommend soft words, planned rest and the Small way\nprotecting a tree); his verdict on all of 248.<\/li>\n<\/ul>\n<h3 id=\"palette-sheet-238-tokens-in-241\">Palette (sheet 238; tokens in\n241)<\/h3>\n<ul>\n<li>Room accent <strong>plum 8E4A78 light / D59AC4 dark<\/strong> (5.67:1\non paper F7F5F1, 9.25:1 on black). Plum goes on the room title, the\nfront routine, the current step, strike lines, done strokes and the\naction word. Plum replaced A4505F (sheet 219), which was \u0394E 8.3 from\nTraining's old crimson.<\/li>\n<li>Slate labels <strong>34506F / A7BCD6<\/strong> in small caps\n(\"Today\", \"by time\", \"Evening\", \"Done\").<\/li>\n<li>Wine <strong>9A2541 / EE8E9C<\/strong>, for late only. Never use it\nfor missed or skipped.<\/li>\n<li>Kind colors (241): Mornings gold 7E6A1E/D9C27A, Evenings slate, Body\ntraining blue 0B62AE/8FB0EE, Home clay 9C4B2C/E2A07F, Mind teal\n1E6E77/84C3C9. Each Borrowed routine wears its source room's\naccent.<\/li>\n<li>Ink, ink2 and ink3 carry the text.<\/li>\n<\/ul>\n<h3 id=\"landing-level-1-open-do-not-build\">Landing (level 1): OPEN, do\nnot build<\/h3>\n<ul>\n<li>Kaushik rejected three landings in a row: v3 (a list of doors, 11:39\nPM), v4 (a 46 pt reel headline, 11:45 PM) and v6 (a summary plus a\ntwo-column door grid, 11:52 PM: \"sections and sections of lists\nagain\").<\/li>\n<li>The landing waits for the app-wide landing system. The current\ndirection is the <strong>word wall<\/strong> (Notes landing 246, approved\nOct 24 1:54 AM; see the landings section of the bible). Sheet 242\nsketched a Routines wall rising with the day: done routines laid bottom\nup, the pending ones piled at the side, a late one in wine. That sketch\nis unconfirmed.<\/li>\n<li>The 226/228/219 <strong>tide line<\/strong> (the day 5 am to 11 pm as\none fine line, each routine a cosine swell at its time, now as an ink\nstitch, passed swells plum 2 pt, ahead ink3 1.5 pt, late wine) was\ncarried into v6. Kaushik said round 2's kinetic \"tide doesn't have\nanything\". Treat it as rejected for the landing.<\/li>\n<li>What the landing has to carry, in his words: a summary with doors\ninto sub-areas, not the full list. That means the kinds, a way to create\na routine, and routines borrowed from other rooms. Foot: \"Start\n<next routine>\". Drag left = Skip today, drag right = New routine. When\neverything is done, the action word becomes New routine.<\/li>\n<\/ul>\n<h3 id=\"today-page-one-level-in-238-v2\">Today page (one level in; 238\nv2)<\/h3>\n<p>Layout, top to bottom (pt on a 402-wide phone):<\/p>\n<ul>\n<li>50: the slate label \"Routines\" sits above the title \"Today\", plum,\nFigtree 600 28 pt. It fits by stepping down 1 pt at a time to 21 pt,\nthen cuts at a whole word.<\/li>\n<li>94: the week as letters <strong>M T W T F S S<\/strong>, 15 pt, 9 pt\napart. A fully kept day is plum 600, a day with a gap is ink2, today is\n19 pt ink 600, and days ahead are ink3. On the right, the rhythm in\nwords, 15 pt ink2 (\"four nights of stretch\").<\/li>\n<li>140: the brief, two lines at 19/25, right-aligned: \"3 left today.\" /\n\"Water the plants is late, from 9 am.\" The late name is in wine. With\nnothing late, the second line is \"Stretch is next, at 8 pm.\"<\/li>\n<li>206: a <strong>depth wheel<\/strong> of today's routines by time,\nunder a small-caps header \"Today \u2026 by time\". Rows are 44 pt. The front\nrow opens 58 pt more: its name is plum 600 26 pt (fitting down to 21);\nunder it, 13 pt ink2 \"5 steps, about 9 min\", then 15 pt ink with the\nfirst steps, cut at whole items. Neighbors are 17 pt, dropping toward 15\npt, in ink2. Blur grows with distance, up to 1 pt, and never touches the\nfront row. There is no blur under Reduce Motion or with Depth off. The\nfront row starts on the first routine not yet done.<\/li>\n<li>A done routine shows its name and \"done 7:52 am\" in ink2. A skipped\none reads \"skipped\" in ink2, with no wine.<\/li>\n<li>597: the receipt line, 44 pt tall.<\/li>\n<li>Foot: the action word on the left, Tess on the right. Tap\n<strong>Start<\/strong> to open the front routine already started. Drag\nleft = <strong>Skip today<\/strong> (receipt \"Skipped today. Undo\";\nrecorded as skipped, with no late state). Drag right = <strong>Later, 9\npm<\/strong>.<\/li>\n<\/ul>\n<h3 id=\"a-routine-level-3\">A routine (level 3)<\/h3>\n<ul>\n<li>50: the part of day in slate small caps (\"Evening\") on the left;\n\"about 8 min left\" on the right.<\/li>\n<li>76: the title, plum 28 pt.<\/li>\n<li>118: the rhythm in words, 15 pt ink2: \"Fourth night in a row\", which\nbecomes \"Fifth night in a row\" once finished. It is never called a\nstreak.<\/li>\n<li>146: <strong>the last 14 days as stroke marks<\/strong>, 9 pt apart.\nAll 14 are the same length (14 pt). A done day is plum at 2 pt; a missed\nday is ink3 at 1 pt (never wine). There is no count, axis or chart.\n\"last two weeks\" sits on the right in 13 pt ink2. The VoiceOver label\nlists done or missed per day.<\/li>\n<li>182 on: the steps in 44 pt rows: the name at 19 pt with \"2 min\" in\nOutfit 15 ink2. The current step (the first open one) is 21 pt plum 600,\nwith one
