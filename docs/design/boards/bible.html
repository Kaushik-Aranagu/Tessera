how-to line in 15 pt ink2 that clips in. Done steps sit under a\nslate \"Done\" label, struck through by a thin plum line. It is a strike,\nnot an underline.<\/li>\n<li><strong>Check a step:<\/strong> tap it, or swipe right 70 pt. The\nstrike draws in 260 ms, then the step waits 1.5 s; each new check\nrestarts the wait. Then the checked run drops to Done together. Tap a\nstep to take it back. Swipe left 70 pt = Not now: the step moves to the\nend.<\/li>\n<li><strong>Action word:<\/strong> Start, then Next step (checks the next\nopen step), then Do it again once everything is done. Drag left = Skip\ntoday. Drag right = Restart (unchecks every step; receipt \"<Routine>,\nrestarted. Undo\"; the 10 s Undo restores the checked steps and the done\ntime).<\/li>\n<li>Receipts: \"Neck rolls, done.\" \"Hip opener, not now.\" \"Done, fifth\nnight running.\" \"Evening stretch, from the top.\"<\/li>\n<\/ul>\n<h3 id=\"kind-page-level-2-making-one-from-another-room-238-v3\">Kind page\n(level 2), Making one, From another room (238 v3)<\/h3>\n<ul>\n<li><strong>Kind page:<\/strong> the slate \"Routines\" label, the kind's\nname at 28 pt in its kind color (241; the 238 text says plum), and a\none-line fact (\"chores and resets\"). Below is a depth wheel under the\nheader \"<Kind> \u2026 when\" (\"\u2026 from\" on Borrowed).\n<ul>\n<li>A one-thing routine is a single line with no step count. Its front\ndetail reads \"about 5 min, weekdays\", then its how-to line.<\/li>\n<li>A routine with steps reads \"4 steps, about 12 min, training days\",\nthen its first steps.<\/li>\n<li>Right column: today's time if it runs today (wine if late),\notherwise when it repeats. On Borrowed, the right column holds the\nsource room's name in that room's accent. This is the one place other\nrooms' colors appear.<\/li>\n<\/ul><\/li>\n<li><strong>New routine:<\/strong>\n<ul>\n<li>A slate label, then the name field at 28 pt plum, with the\nplaceholder \"Name it\" in ink3.<\/li>\n<li>\"In <kind>\": tap the kind word to cycle through the kinds. Borrowed\nis never one of them.<\/li>\n<li>\"Keep it one thing\" / \"Add steps\": the chosen one is ink 600 and the\nother ink2, with no pill or underline.<\/li>\n<li>With steps: a \"Steps\" label, the step lines, and an \"Add a step\"\nline. Return adds the next step.<\/li>\n<li>Action word <strong>Save<\/strong> lands on the kind's wheel with the\nnew routine in front, receipt \"<Name>, saved. Undo\". Drag left =\nDiscard.<\/li>\n<\/ul><\/li>\n<li><strong>From another room:<\/strong>\n<ul>\n<li>The line \"It stays linked: change it there and it changes\nhere.\"<\/li>\n<li>54 pt rows: the name, the step count, and the source room in its\naccent.<\/li>\n<li>Tap a row to borrow it. Receipt: \"<Name>, borrowed from Training.\nUndo\".<\/li>\n<li>Edits stay owned by the source room, and a borrowed routine keeps\nits home room's privacy.<\/li>\n<\/ul><\/li>\n<\/ul>\n<h3 id=\"pause-busy-habit-marks-sheet-176-behavior-stands\">Pause, Busy,\nhabit marks (sheet 176; behavior stands)<\/h3>\n<ul>\n<li><strong>Pause<\/strong> asks \"Until when?\" with the choices Tomorrow,\nThis week and Until I say. A paused routine leaves Now and Home, and its\nrow reads \"Paused until Mon.\" with Resume. It resumes on its own,\nsilently.<\/li>\n<li><strong>Busy<\/strong> skips today only. The row reads \"Busy today.\"\nBusy is hidden once the routine has run today.<\/li>\n<li>Paused and busy days are <strong>bridged<\/strong>: they never count\nas missed and never break a count.<\/li>\n<li><strong>Habit = a routine he chose to count.<\/strong> Hold it and\npick \"Count this one\" (or \"Stop counting\").\n<ul>\n<li>The count is consecutive scheduled days, computed from history and\nnever stored.<\/li>\n<li>It is shown only at 2 or more, as \"4 days\" in Outfit ink3.<\/li>\n<li>Never use the word \"streak\", never show a best-ever number, and keep\nit out of widgets.<\/li>\n<\/ul><\/li>\n<li>The older Habits pages (habits.md, habits-grammar 59, habits-85) are\nsuperseded as screens. Their principle holds: a day without a mark is\nonly a day without a mark. There is no \"missed\", no red, no percentage,\nand a zero count reads as the target (\"5 a week\"), never \"0 of 5\".<\/li>\n<\/ul>\n<h3 id=\"routine-editor-routine-editormd-training-routines\">Routine\neditor (routine-editor.md, Training routines)<\/h3>\n<p>Its behavior stands; its look is old. The page is always editable.\nHold a row 0.4 s to reorder. Tap a value word to open a drum in place\n(today that means the depth-blur wheel). Tap a name to see alternatives\nfrom the same movement pattern.<\/p>\n<ul>\n<li>Its \"swipe left to DROP\" conflicts with the current rule (swipe left\n= Not now). Removing a row should move to the action word's left drag.\nThis is unconfirmed; ask Kaushik.<\/li>\n<\/ul>\n<h3 id=\"motion-privacy-accessibility\">Motion, privacy,\naccessibility<\/h3>\n<ul>\n<li>Springs come only through MotionPolicy. Pages slide in from the\nright, and text clips in with no fades.<\/li>\n<li>Reduce Motion: wheels swap in place, the strike shows at once, the\ndrop happens in place after 0.6 s, the action word swaps with no roll,\nand there is no blur.<\/li>\n<li>Every tap target is at least 44 pt. The back edge-swipe zone is 0-24\npt, and the action word's hit area starts at least 28 pt from the left\nedge.<\/li>\n<li>A <strong>private routine<\/strong> reads normally in the room. Off\nthe phone it is \"Private routine\": Lock Screen, widgets, Tess and Claude\nlines, backups and notices.<\/li>\n<li>Routines linked to health or body items never send their times to\nClaude.<\/li>\n<li>Reminders are not designed yet. When they come, they follow quiet\nhours (11 PM-7 AM PT).<\/li>\n<\/ul>\n<p><strong>Rejected (do not re-offer):<\/strong><\/p>\n<ul>\n<li>The pixel tide lintel (219), because pixels belong only to\nHome.<\/li>\n<li>The door list (v3), the reel (v4) and the door grid (v6).<\/li>\n<li>Strings, chimes and swarm (242).<\/li>\n<li>Streak counts and red misses.<\/li>\n<li>A lens on swipes.<\/li>\n<li>A kinds pager with a counter.<\/li>\n<\/ul>\n<p><strong>Sources:<\/strong> 238 (board <a\nhref=\"https://claude.ai/artifact/VfPAA9FtH5DXrnog5f6u96\">https://claude.ai/artifact/VfPAA9FtH5DXrnog5f6u96<\/a>),\n219 (<a\nhref=\"https://claude.ai/artifact/WqsDGCX3gdjG84xK4eG3Wa\">https://claude.ai/artifact/WqsDGCX3gdjG84xK4eG3Wa<\/a>),\n176, routine-editor, habits-85, 241, 242 (<a\nhref=\"https://claude.ai/artifact/U7CbdSZGtjH6f7Qh5M13ZA\">https://claude.ai/artifact/U7CbdSZGtjH6f7Qh5M13ZA<\/a>),\ndocs/handoff/builder-b-specs.md.<\/p>\n<hr />\n<h2 id=\"2-money\">2. Money<\/h2>\n<p><strong>What it is for:<\/strong> what is due, what moved, and what\nthe month cost, across several currencies, held by Kaushik alone. Owner:\nBuilder B. A dedicated Money round (239) was scheduled for 7 AM PT Oct\n24 but has no sheet. The <strong>landing is open<\/strong>, like every\nlanding.<\/p>\n<h3 id=\"palette\">Palette<\/h3>\n<ul>\n<li>Room accent <strong>sea teal 2A7878 light / 7BC0C4 dark<\/strong>\n(sheet 223). The earlier sage 3F7A62/8DBFA7 sat \u0394E 8.0/7.0 from Lists\nolive. The 241 token table still lists \"money sage\", which is stale: use\nsea teal.<\/li>\n<li>In Money, <strong>paid or done uses the room accent, not go\ngreen<\/strong> (241's Money exception). Bills are clay, subscriptions\nteal, savings gold, late wine.<\/li>\n<li><strong>No amount is ever colored as good or bad.<\/strong> A balance\nis never teal, never red.<\/li>\n<\/ul>\n<h3 id=\"rules-that-hold-on-every-money-page\">Rules that hold on every\nMoney page<\/h3>\n<ul>\n<li><strong>The decimal line:<\/strong> words on the left, integers\nright-aligned to one axis, and cents hung one size smaller in ink2. Use\nOutfit tabular figures. Exact amounts are Outfit 300 below 28 pt and 200\nat 28 pt and up; estimates are 200 (138).<\/li>\n<li><strong>One total rule per page<\/strong>, a single fine line above\nthe page's one total. It is Money's one allowed line.<\/li>\n<li><strong>Money converts with \"about\":<\/strong> \"In dollars, about\n1,134\", whole dollars with the cents slot left empty, then \"Rates from\nOct 18.\" in ink2.\n<ul>\n<li>With only one currency, show the exact total with no \"about\".<\/li>\n<li>A currency with no rate: \"Rupees are not in the total.\"<\/li>\n<li>Rates older than 14 days: \"These rates are old.\"<\/li>\n<\/ul><\/li>\n<li>Money has no unit turn. It never uses \"was\", has no charts, no\nbudgets, no \"left to spend\" and no \"cost you more\".<\/li>\n<li>New money (a spend logged, a move made, money in) arrives in the\naccent and settles to ink in 2 s; under Reduce Motion it is plain ink.\nPer the no-fade rule, the change is a color step, not an alpha\nfade.<\/li>\n<li><strong>Undo reads \"Reversed.\"<\/strong> for 10 s (it is the engine\ninverse; tested in Tier1bTests).<\/li>\n<li><strong>No money on Home<\/strong>, the doorway, the Lock Screen,\nwidgets, notices, Live Activities, Siri, Spotlight or the backup log\nline. Notices name the due word only: \"Rent, Friday\". A private bill or\npool reads \"Private bill\" / \"Private pool\" off the phone.<\/li>\n<li><strong>Money actions are never offered to Claude.<\/strong> The\nharness refuses them in lab mode, and strict mode drops the Money agent.\nUnder lab mode, money values in call text are allowed by his choice\n(CODEX.md \u00a77); sheet 223 says money values never reach Claude. See the\nopen questions.<\/li>\n<\/ul>\n<h3 id=\"pools-sheet-133-behind-moneypools\">Pools (sheet 133, behind\n<code>moneyPools<\/code>)<\/h3>\n<ul>\n<li>Pools are <strong>by currency and source<\/strong> (\"US checking\",\n\"India account\", \"Cash\", \"Saving\"). Every spend comes from a pool.\nBalances are derived, never stored.<\/li>\n<li><strong>Pool page:<\/strong> title plus the month knob; a subtitle\nlike \"Dollars, account\"; \"In\" (sources as line words: Paycheck,\nFreelance) and \"Out\" groups; the total rule; \"Kept this month\" (in minus\nout); then \"Balance\" in ink2, one size down. Below zero reads \"Below\nzero by 120.00\" in ink, with no warning.\n<ul>\n<li>A list of more than 5 lines folds into \"Groceries and 31\nothers\".<\/li>\n<li>Swipe a spend to reassign it to a pool in the same currency. A pool\nin another currency answers \"That pool holds rupees.\"<\/li>\n<li>This conflicts with the current swipe rule (left = Not now). Move\nreassign to the action word or a hold (unconfirmed).<\/li>\n<\/ul><\/li>\n<li><strong>Move page:<\/strong> what arrived is the hero (Outfit 200) in\nthe destination currency. Then Sent, Fee, the total rule, \"Left US\nchecking\", and \"Arrived INR 82,650.00\". The rate is computed, never\ntyped: \"Your rate was 82.24 rupees for a dollar after fees.\"<\/li>\n<li><strong>Landing with pools:<\/strong> a line per currency, then the\nrule, then the \"about\" dollar total.<\/li>\n<li>Writing: \"got 3200 paycheck\", \"spent 450 rupees coffee\", \"moved 1000\nto India, got 82650, fee 5\".<\/li>\n<li>Words: In, Out, Kept this month, Balance, Below zero by, Moved to,\nSent, Fee, Left, Arrived, Your rate was, In dollars, about, Rates from.\nWrite \"Rupees\" in prose, \"INR\" in text, and the symbol in the app.<\/li>\n<\/ul>\n<h3\nid=\"month-spend-and-receipt-total-money-pages-money-dial-money-reading-grammar-60\">Month,\nspend and receipt total (money-pages, money-dial, money-reading-grammar\n60)<\/h3>\n<p>The behaviors carry over; the look is old.<\/p>\n<ul>\n<li><strong>Month page:<\/strong> the month sentence \"7 spends. Most went\nto lunch, 24.80, and coffee, 9.00.\" Each other currency gets its own\nline: \"Also \u20ac60.00 in 3 spends.\" Then one line per spend under its day\nlabel, newest first. Amounts show <strong>as typed<\/strong>. Pinch out\nto see the previous month.<\/li>\n<li><strong>Spend page:<\/strong> the amount grows into the hero. Tap the\nword to retag it from recent words. Details read as sentences with value\nwords (\"Typed as spent 12.40 lunch.\").\n<ul>\n<li>The old delete gesture (drag the hero left) conflicts with the Not\nnow rule. Delete should go on the action word's left drag\n(unconfirmed).<\/li>\n<\/ul><\/li>\n<li><strong>Receipt total:<\/strong> \"Groceries total?\" asks after a\nshop. The amount is a scrolling wheel (whole dollars plus cents; tap to\ntype), never -/+. The currency is a value word, stored and never\nconverted. Log, or Skip.<\/li>\n<\/ul>\n<h3 id=\"landing-history-all-superseded-or-pending\">Landing history (all\nsuperseded or pending)<\/h3>\n<ul>\n<li>223's October pixel calendar is superseded by 226 (pixels only on\nHome, and it started weeks on Sunday).<\/li>\n<li>226/228 had \"October so far\" plus a month total at 56 pt, a fine\nmonth line (bills as 4 pt round-capped days: ink once paid, accent while\ndue within 7 days), a brief \"Rent is due Friday. Payday was the 15th.\",\nDue / Spent / Coming, and the action word \"Add a spend\".<\/li>\n<li>Start of month: \"November so far\" over \"$0\" in ink3, with \"Spent:\nNothing yet\".<\/li>\n<li>Next: the word-wall landing system.<\/li>\n<li>Doors that have stood since 131: Due, Spending, Bills, Saving, Cash,\nOwed.<\/li>\n<\/ul>\n<p><strong>Rejected:<\/strong><\/p>\n<ul>\n<li>Red amounts, good/bad color, budgets, charts and \"left to\nspend\".<\/li>\n<li>The pixel calendar.<\/li>\n<li>Sums across currencies without \"about\".<\/li>\n<li>Money on Home.<\/li>\n<li>\"Was\" values on money.<\/li>\n<\/ul>\n<p><strong>Sources:<\/strong> 223, 133, money-pages, money-dial,\nmoney-reading-first, money-reading-grammar, 226, 228, 241, 138.<\/p>\n<hr />\n<h2 id=\"3-measure-and-body-weight\">3. Measure and body weight<\/h2>\n<p><strong>Measure<\/strong> is the engine's one units system (Core). It\nis a set of rules, not a room.<\/p>\n<ul>\n<li>Settings &gt; Units: \"Weight, kg/lb\", \"Distance, km/mi\", \"Food,\ngrams/cups\" (189). Changing a unit rewrites every number shown and\n<strong>never<\/strong> a stored value. A sample line shows the effect:\n\"Bench 82.5 kg is 182 lb.\" Temperature follows the phone, and money\ncurrency is set per pool.<\/li>\n<li><strong>Unit rule (Oct 24):<\/strong> every measured number shows its\nunit at about half the numeral's size, minimum 10 pt, in Figtree 400,\njoined by a no-break space. Core splits number and unit.<\/li>\n<li><strong>Unit turn:<\/strong> tap or swipe the unit word to cycle that\nquantity's units. The digits roll and the unit word swaps (138; current\nrule: no fades, so it clips).<\/li>\n<li>The hung fraction is one role smaller, in ink2.<\/li>\n<li>After a change by hand, the old value shows as \"was 80\" in ink3 for\n2 s. Never on money.<\/li>\n<\/ul>\n<p><strong>Body weight page<\/strong> (body-weight-page 29; behavior\nstands, look old). Reached from Training (the body link) and from\nReview.<\/p>\n<ul>\n<li>Title \"Body weight\". Then a context line: \"78.1 yesterday, 0.3 kg\nless than last week\" (the rate only after 7 days of entries).<\/li>\n<li>The hero is the <strong>trend<\/strong> (one decimal, Outfit, unit at\nhalf size), never the raw weight.<\/li>\n<li>A fine trend line from the first entry to today, with each entry as\na small mark. There are no axes, goal line or BMI. An out-of-range entry\nis pinned at the edge with its value, never red.<\/li>\n<li>The change line: \"1.2 kg less since Sep 3\", \"0.8 kg more\", \"The same\nas on Sep 3\". Never \"lost\", \"gained\", \"good\" or praise. There is no\ncolor for direction.<\/li>\n<li><strong>Logging:<\/strong>\n<ul>\n<li>\"bw 82.4\" or \"weighed 82.4\" commits right away.<\/li>\n<li>A bare \"82.4\" (30-250 kg, nothing running) waits as a ghost, \"Body\nweight 82.4 kg\", until tapped. Tess asks \"82.4 kg as today's weight?\"\nwith Log / Not now.<\/li>\n<li>The trend step is capped at 2 kg.<\/li>\n<li>If the entry is more than 3 kg off the trend, it notes \"4.2 above\ntrend\".<\/li>\n<li>A second entry the same day replaces the first.<\/li>\n<li>Mid-workout, a bare number is never a weigh-in: it goes through the\nlive-workout guard.<\/li>\n<\/ul><\/li>\n<li>Copy: \"Body weight logged. 82.4 kg.\" Undo: \"Body weight taken\nback.\"<\/li>\n<li>Empty: \"No weigh-ins yet.\" in ink2, with no hero and no line.<\/li>\n<li><strong>Privacy:<\/strong> body data never reaches widgets, backups\nbeyond the local store, or logs. Off the phone, Tess and Claude lines\nfollow the lab/strict policy.<\/li>\n<li>Old colors to drop: wet cobalt and sage. Use the Training blue\naccent and go green only for a logged moment (unconfirmed).<\/li>\n<\/ul>\n<hr />\n<h2 id=\"4-day-log-review-shutdown-plan-my-day-upkeep-people-reading\">4.\nDay log, Review, Shutdown, Plan my day, Upkeep, People, Reading<\/h2>\n<p>All of these are from the Oct 15-19 grammar. No room round has\nredrawn them yet. Keep their behavior and copy. Change the look (no\ndabs, uppercase label words or cobalt) when each gets its round.<\/p>\n<ul>\n<li><strong>Day log<\/strong> (day-log-page, day-log-v1 14, daylog-82):\n<ul>\n<li>The day's story as lines: a time column (64 pt), then the text. No\ndabs.<\/li>\n<li>Two tiers: ink for live and finished lines, ink2 for times, past\ndates, the \"Rest day\" row, the faint row (an unfinished workout, text in\nink2, no words like \"not finished\") and the \"Also:\" tail. Six lines per\nday, then a tail.<\/li>\n<li>The day turns over at 4 am; a late night stays on the day\nbefore.<\/li>\n<li>Empty: \"Your days write themselves here.\" Nothing counts, nothing\npraises, and a first entry is not an event.<\/li>\n<li>The side THE DAY lists counts by kind. Money and weight never appear\nthere.<\/li>\n<\/ul><\/li>\n<li><strong>Review<\/strong> (review-week 46, review-first-83,\nreview-week-line 15):\n<ul>\n<li>The whole week on one page: the weekday letters M-S as columns, then\none band per thing that exists (training, tasks done, up to 3 habits,\nweight, money, cooked), then the week's three best day-log lines.<\/li>\n<li>Tap a day to read that day.<\/li>\n<li>First week: no rings for days never planned, and no past weeks\ninvented.<\/li>\n<li>Zero-day week: \"Your first week starts today.\" / \"Nothing to count\nyet.\"<\/li>\n<li>A swipe past the first week rubber-bands 26 pt.<\/li>\n<li>Look to update: there are no dabs or rings now, and the \"\u00b7\" day mark\nis forbidden (it is a middle dot).<\/li>\n<li>Money on Review shows as day totals only inside the phone\n(unconfirmed under the \"no money on Home\" rule; Review is not\nHome).<\/li>\n<\/ul><\/li>\n<li><strong>Shutdown<\/strong> (shutdown 34, shutdown-grammar 63):\n<ul>\n<li>At 9 pm: \"Shutdown\" as the hero; \"3 moving to tomorrow\" with one\nline per rolling row and its value Tomorrow/Later (tap to swap); a\n\"Tomorrow, first\" writing line; then <strong>Close the day<\/strong>\n(hold 0.7 s).<\/li>\n<li>The closed day shows his line as the hero, and Tess: \"Closed. Your\nline is set for 8 am.\" with Undo.<\/li>\n<li>It closes by itself at 10 pm. Under the current rules, Close the day\nbecomes the action word.<\/li>\n<\/ul><\/li>\n<li><strong>Plan my day<\/strong> (plan-home 53):\n<ul>\n<li>A state of Home, not a page.<\/li>\n<li>The hero is the day (\"Four hours free\" with the calendar; \"Three\ntasks, Push A at 6\" without it).<\/li>\n<li>Up to five plan rows, then \"2 more\".<\/li>\n<li>\"Via Claude\" taps through to its receipt, and Claude's sentence is\nTess's line.<\/li>\n<li>The first time, it shows \"Sends your task and calendar titles, never\nnotes, places or health.\" (re-check against lab mode).<\/li>\n<li>A hold on Start with keeps the plan; it never starts anything.<\/li>\n<li>Cobalt is now free for other uses (Ember is Tess), so the wet-cobalt\nrows need a new treatment (unconfirmed).<\/li>\n<\/ul><\/li>\n<li><strong>Upkeep<\/strong> (upkeep, upkeep-people-first,\nupkeep-people-grammar 61):\n<ul>\n<li>Chores where <strong>height is staleness<\/strong>: y follows days\nsince done \u00f7 the usual interval. A Now line marks \"at its interval\", and\na just-done chore sinks to the foot.<\/li>\n<li>Done: \"Clean the bathroom, done. Was 21 days, usually 14.\"<\/li>\n<li>US starters: trash, vacuum, water bill, furnace filter.<\/li>\n<li>The autumn radiator ask is answered once and never comes back.<\/li>\n<li>Empty: \"No chores yet.\"<\/li>\n<\/ul><\/li>\n<li><strong>People<\/strong> (people, upkeep-people-grammar):\n<ul>\n<li>One line per person, with \"when\" as the value (a birthday within 14\ndays wins).<\/li>\n<li>Mentions sit one per line under month words.<\/li>\n<li>\"@\" lifts a line of names above the keyboard.<\/li>\n<li>In Lists, People is a kind colored plum 8A4570/D69CC0 (241 v9).<\/li>\n<\/ul><\/li>\n<li><strong>Reading<\/strong> (reading, reading-layouts-99):\n<ul>\n<li>Resume from Now; a book page with a page wheel (\"p 142 of\n612\").<\/li>\n<li>Finished is held; the shelf groups Reading / Next / Finished / Set\naside.<\/li>\n<li><strong>No counts anywhere<\/strong> and no covers in v1.<\/li>\n<li>Reading layouts 99: a 330 pt reading width and a numeral ladder of\n21/28/44/56, behind the \"Reading layout\" choice (now folded into \"Pages\nturn by\" in 203).<\/li>\n<li>In Notes, Reading is a teal kind.<\/li>\n<\/ul><\/li>\n<\/ul>\n<hr />\n<h2 id=\"5-settings-sheet-203-is-current\">5. Settings (sheet 203 is\ncurrent)<\/h2>\n<p><strong>What it is for:<\/strong> about 20 plain sentences instead of\n65 switches. Board <a\nhref=\"https://claude.ai/artifact/Sm2gKa3mJFAmaGoF356b9K\">https://claude.ai/artifact/Sm2gKa3mJFAmaGoF356b9K<\/a>.\nIt replaces 80/93/100/103/110 Review facet pages and settingsV2. Owner:\nBuilder B (Builder A: transition; Core: FeatureFlags).<\/p>\n<ul>\n<li><strong>On by default:<\/strong> everything approved, asked for or\nrecommended ships On. A one-time migration turns stored default-Offs On,\nbut keeps any Off he set by hand after Oct 23 8:47 AM PT.<\/li>\n<li><strong>A line:<\/strong> the preference written as a sentence on the\nleft, its value right-aligned in ink2. Tap the line to open its choices\nin place as words, with an optional ink3 \"why\" line. Lines with no\nchoices open their own page. Every line is at least 44 pt, sentence\ncase, with no cards, pills or toggles.\n<ul>\n<li>203 marks the chosen word with a 1 pt underline. That breaks the\nno-decorative-underline rule: mark the chosen word with ink 600 and\nleave the others ink2 (the 238 maker pattern). Unconfirmed.<\/li>\n<\/ul><\/li>\n<li><strong>Conflicts are one choice:<\/strong> Home is Mosaic / Home v2;\nPages turn by Slide / Turn / Rotate / Today (Reading layout folded\nin).<\/li>\n<li><strong>The page:<\/strong>\n<ul>\n<li>You: Weights lb/kg; Week starts on <strong>Monday<\/strong> (now the\nfixed rule)/Sunday; Quiet hours (page; 11 pm-7 am); The day turns over\nat (page; 4 am).<\/li>\n<li>Home: The day on Home Lively/Calm/Still; Apps list under Next; Home\nis Mosaic/Home v2.<\/li>\n<li>Tess: Tess asks Claude Off/On; Tess has eyes; Tess names training\ndays.<\/li>\n<li>Training: Rest timer; Swap an exercise Two taps/One tap; Nudge if I\nforget Finish; Calories burned (stays on the phone).<\/li>\n<li>Kitchen: The cook timer speaks; Hands-free while cooking.<\/li>\n<li>Privacy: Words that stay private; Lock Screen shows Masked/Titles\n(private and walled things stay masked whatever is chosen); Health;\nCalendar.<\/li>\n<li>Look: Pages turn by; Font; Depth on wheels (blur, Builder B's\nhandoff).<\/li>\n<li>Safe keeping: Backups (last time; \"A copy holds everything, Private\nnote, weight and money included.\" from 80, re-check against current\nwalls); Undo, everything you did (the op-log page).<\/li>\n<li>About: \"Tessera, build N. Hold for Developer mode.\"<\/li>\n<li>Every change gets the one 10 s Undo.<\/li>\n<\/ul><\/li>\n<li><strong>Developer mode<\/strong> (hold the build line 700 ms, or\nEnter) is <strong>only for turning things off<\/strong>. It lists every\nflag by app (Home, Training, Kitchen, Notes and lists, Tasks and\nroutines, Money, Everywhere), all On. Tools: Sample data (simulator\nonly, through LaunchFlags), Class inspector, Recent changes. It never\nadds features.<\/li>\n<li><strong>The way in:<\/strong> \"Settings\" in ink2 at the top right,\nbeside a 16 pt knob made of 9 screen pixels that turns 90\u00b0 on a spring.\nOn Home, a pull down from the top 40 pt also opens it. The page arrives\nwith the 202 pixel flip; Reduce Motion is a 150 ms crossfade.\n<ul>\n<li>The pixel knob and pixel flip clash with \"pixels only on the Home\nmosaic\". Unconfirmed: keep them only for entry from Home, or redraw\nthem.<\/li>\n<\/ul><\/li>\n<li><strong>Never on this page:<\/strong> the Claude key, money values or\nhealth data.<\/li>\n<\/ul>\n<h3\nid=\"claude-in-settings-claude-gate-106-claude-settings-settings-80\">Claude\nin Settings (claude-gate-106, claude-settings, settings-80)<\/h3>\n<ul>\n<li><strong>The key is never shown<\/strong>: no character, length,\nprefix or dots. 106 overrides claude-settings' \"...a1B2\". The only\nstatus is \"Claude key found.\" / \"No Claude key yet.\" Never copy, log or\necho it.<\/li>\n<li><strong>Gate:<\/strong> a key found on a fresh store asks once: \"Use\nthe Claude key still on this phone?\" with <strong>Yes / No /\nLater<\/strong> as plain words (Yes ink, the others ink2). An unanswered\ngate always reads No. No becomes \"Claude key found. Not used.\" with\n<strong>Use it<\/strong>. Later returns one Now line on the next cold\nlaunch, and never nags within a session.<\/li>\n<li><strong>What was sent:<\/strong> \"38 calls in the last 30 days\", one\nline per job name with its count (no text). Tap a job to open its\nreceipts. The Sent rows show the exact words, in quotes, and a walled\nphrase reads \"Private phrase\". \"3 requests held back on this phone\".\n<strong>Clear what was sent<\/strong> deletes the words and keeps the\nspend, with no Undo. When \"Tess asks Claude\" is off, the list stays as a\nrecord.<\/li>\n<li><strong>willSend:<\/strong> \"Asking Claude.\" with Cancel. It is\ncapped at 8 s, then \"Claude didn't answer in time.\"<\/li>\n<li><strong>Spend:<\/strong> the cap line has no bar and no ring. Text\nnever turns amber: \"Paused until Nov 1.\" The cap is $100/month shared\nper memory, and $50 in-app per CODEX.md (see open questions).<\/li>\n<li><strong>Walls line:<\/strong> must stay true under the current policy\n(lab mode). Do not claim \"never health/money\" while lab mode lets them\ngo.<\/li>\n<li><strong>Rejected:<\/strong> the claude-settings month brushstroke\nline (a bar), a <span class=\"math inline\">5/<\/span>10/$20 drum,\nauto-paste, cobalt Tess text (Tess is Ember now), and\n\"Enabled/Disabled\".<\/li>\n<li><strong>Restore offer:<\/strong> \"A copy from <date> is on this\nphone's iCloud Drive. Restore it?\" with Restore / Not now. It never\nrestores without a tap, and the key never comes back with a copy.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"6-app-icon-app-icon-39--40-stale\">6. App icon (app-icon 39 +\n40), stale<\/h2>\n<ul>\n<li>In the asset catalog (<code>AppIcon<\/code>, project.yml line 72):\nTess's soul, scaled about 16\u00d7, on a Porcelain light ground\n(#FFFFFF\u2192#F5F1EA) / Obsidian #000, with a tinted grayscale variant. No\nletter, badge or word \"Tess\". It follows only the system light and dark\nmodes, with no per-look icon. Icon Composer layers are in\n<code>design/icon/layers/<\/code>. Alternative B was \"the page\": one ink\nline with Tess in her corner.<\/li>\n<li><strong>Stale:<\/strong> the masters use the old three-pigment Tess\n(cobalt 2450D8, vermilion E2432A, cadmium F0A500). Tess is now an Ember\nsmooth uniform cloud with a close-tone palette (215 rev 19-20). The icon\nshould be re-rendered from current Tess (unconfirmed; no sheet). Never\nuse the rejected orb/Sphere skin.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"7-empty-states-empty-states-23-principle-current\">7. Empty\nstates (empty-states 23; principle current)<\/h2>\n<ul>\n<li><strong>One shape:<\/strong> the page keeps its own frame (title,\ncontext). <strong>One quiet line<\/strong> in ink2 sits where the first\nrecord will land, says what is true now, uses under 12 words, and is\nnever a count or a \"0\". Offer <strong>one way in<\/strong> at most: the\npage's writing line, or Tess's Try line (\"Tell me what you spent. Try:\nspent 4.50 coffee.\"). Tapping the example opens capture with an empty\nfield and the example as placeholder.<\/li>\n<li>The first record takes the quiet line's place (it clips in now, not\na fade). After that, the page never shows the empty state again unless\nit empties.<\/li>\n<li><strong>Never:<\/strong> icons, illustrations, SF Symbols, \"Get\nstarted\", button shapes, counted zeros (\"0 of 0\"), empty labels.<\/li>\n<li>Lines:\n<ul>\n<li>Day log: \"Your days write themselves here.\"<\/li>\n<li>Habits: \"No habits yet.\"<\/li>\n<li>Upkeep: \"No chores yet.\"<\/li>\n<li>Money: \"Nothing logged yet.\" / \"Spent: Nothing yet\".<\/li>\n<li>Reading: \"No books yet.\"<\/li>\n<li>Body: \"No weigh-ins yet.\"<\/li>\n<li>Routines quiet day: \"Nothing set for today. Stretch is usually at\n8.\" and, when all are done, \"All done\" / \"the evening is yours\".<\/li>\n<li>Claude: \"Nothing has gone to Claude yet.\"<\/li>\n<\/ul><\/li>\n<li>Settings is never empty.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"8-errors-and-offline-errors-84-principle-current\">8. Errors and\noffline (errors-84; principle current)<\/h2>\n<ul>\n<li><strong>One slot:<\/strong> the receipt/Undo line at the foot (left\nof Tess under the current foot). One notice at a time, never stacked,\nand the layout never changes height.<\/li>\n<li><strong>Words:<\/strong>\n<ul>\n<li>\"Didn't save. Try again.\" (10 s). The live workout names the set:\n\"Set 4 didn't save. Try again.\" A private item gives its name first:\n\"Private note didn't save.\"<\/li>\n<li>\"Kept it for later.\" (4 s), or \"Recipe link, kept for later.\"<\/li>\n<li>\"Claude is busy. Kept it for later.\"<\/li>\n<li>\"Needs a connection.\"<\/li>\n<li>\"No Claude key yet.\"<\/li>\n<li>\"Claude is off.\"<\/li>\n<\/ul><\/li>\n<li><strong>Offline is not a state:<\/strong> no banner, icon or\n\"offline\" word. It speaks only when something needed the\nconnection.<\/li>\n<li><strong>One <code>.warning<\/code> haptic<\/strong> per failed finger\nor voice action, never for background work or a repeated retry.\n<strong>Tap the line to retry.<\/strong> On failure the screen returns to\nthe stored state: a check springs back and typed words stay.<\/li>\n<li><strong>Never shown:<\/strong> \"\u2026\", \"Sorry\", \"Oops\", \"Error\",\n\"Failed\", \"!\", codes (401/429), model names, request ids, key fragments,\nURLs, money or body figures, or private words. Never red or amber.<\/li>\n<li>Widgets keep their last good timeline and never show an error.<\/li>\n<li><strong>Update needed:<\/strong> Tess's own lines were cobalt in 84.\nThey are Ember-voiced now (215), and the slot position follows the\ncurrent foot (224).<\/li>\n<\/ul>\n<hr />\n<h2 id=\"open-questions-and-contradictions\">Open questions and\ncontradictions<\/h2>\n<ol type=\"1\">\n<li>Routines: the landing is now the woodland (248, awaiting his\nverdict). Groves and withering vs \"nothing is owed\" are undecided.<\/li>\n<li>Routines dark accent: 219 says D79AA6, while 238 and 241 say D59AC4.\nUse <strong>D59AC4<\/strong>.<\/li>\n<li>Routines privacy off the phone: 228 says every routine is \"A\nroutine\"; 238 says only private ones read \"Private routine\". 238 is\nnewer.<\/li>\n<li>Money accent: the 241 table still says sage 3F7A62/8DBFA7. 223 and\nREADME say <strong>sea teal 2A7878/7BC0C4<\/strong>. 241's \"paid uses\nroom sage\" now means teal.<\/li>\n<li>Money \"About $40 a day left this month\" (226) contradicts 133's \"no\nleft to spend\".<\/li>\n<li>Money values to Claude: 223 says never; CODEX.md \u00a77 says lab mode\nmay carry money text. Money <em>actions<\/em> are refused in both.<\/li>\n<li>Claude spend cap: $100/mo shared (MEMORY) vs $50 in-app\n(CODEX.md).<\/li>\n<li>Settings 203: the underlined chosen word, the pixel knob and the\npixel flip conflict with the no-underline and pixels-only-on-Home\nrules.<\/li>\n<li>Old left-swipe deletes (routine editor DROP, money spend delete,\npool reassign) conflict with swipe left = Not now.<\/li>\n<li>App icon masters predate Ember Tess. Re-render, or keep as is?<\/li>\n<li>Money round 239 was scheduled but has no sheet.<\/li>\n<\/ol>\n"}, {"id": "p6", "name": "Open questions", "html": "<h1 id=\"06-open-questions-and-contradictions\">06 Open questions and\ncontradictions<\/h1>\n<p>Found while writing this bible. Settle each with Kaushik in one\nquestion with one recommendation.<\/p>\n<h2 id=\"from-his-codex-chat\">From his Codex chat<\/h2>\n<ul>\n<li>Notes door pages: 247 v2 (fixed 354x132 block, no repeats, split\nnames and fillers, ledger list) predates his Codex decisions (354x124\nband, repeats in other colors, Folio page-turn, areas, glass pane).\nReconcile 247 to the Codex decisions before building.<\/li>\n<li>Routines groves (Body, Mind, Home + Borrowed recommended) and\nwithering vs \"nothing is owed\" are undecided.<\/li>\n<\/ul>\n<h2 id=\"training\">Training<\/h2>\n<ul>\n<li>\"Set 1 of 3\" (workout top band) and \"3 of 6 this week\" read like the\nbanned \"N of M\" counters; 230 still has \"Set 1 of 3\".<\/li>\n<li>How much of 230's set-fold animation (written for rep strokes)\nsurvives under stack-and-handle marks.<\/li>\n<li>Right drag option on \"Resume Push A\": \"Start over\" (v3) vs\n\"Pause\"/\"Go on\" (v2, later).<\/li>\n<li>\"New: hill sprints\" green in v3.2, but 241 says new = gold. Streak\nnumber slate (v3.2) vs gold (v20).<\/li>\n<li>Workout weight 80 pt (230) vs 84 pt (handoff).<\/li>\n<li>Live Activity and Watch looks (live-activity, 105, W1/W2) still use\nInter Tight, cobalt washes and \"SET 4 of 5\"; no current redraw.<\/li>\n<li>Best haptic from live-polish not restated in 230.<\/li>\n<li>Sheet 241 lists Ember as 3433D6/D6266E/F2B21B (dark\n9A98FF/FF5C9A/FFD24A), vs FF5A26/FF6B3D elsewhere: reconcile.<\/li>\n<li>Legs plum 8A4570/D69CC0 is near Routines 8E4A78/D59AC4 and Lists\nPeople plum, and the Notes plum proposal.<\/li>\n<li>Training landing (summary + two doors) may need redoing in the\nword-wall direction.<\/li>\n<li>Wheel blur cap: Training 1 pt vs Notes dial 1.8 pt.<\/li>\n<li>Gym visual GIF licence vs \"free GIFs only\".<\/li>\n<\/ul>\n<h2 id=\"kitchen-lists-notes\">Kitchen, Lists, Notes<\/h2>\n<ul>\n<li>Pantry (232) and Recipes (233) are deeper pages that still use\ndials, against \"dials on landings only\" (Oct 24).<\/li>\n<li>\"N of M\" counters remain: \"Step 2 of 6\" in cooking, \"1 of 2\" pagers,\nthe kinds row \"1 of 6\", \"5 of 9 left\".<\/li>\n<li>Kitchen and Lists landings are superseded with no replacement yet;\nthe word wall is the expected base.<\/li>\n<li>Pantry value line 8 pt Light (234 v8) is under the 10 pt\nminimum.<\/li>\n<li>list-remove's left swipe = Remove conflicts with swipe left = Not\nnow.<\/li>\n<li>246/247 say \"Tess blue\" for From Tess while Tess's own color is\nEmber; confirm Tess blue as a separate role.<\/li>\n<li>Plum 8A4570 is used for Notes (unconfirmed), Lists People and\nTraining Legs. Wall colors B5452B / F09A7E need a \u0394E check against\nEmber.<\/li>\n<li>235 sets note bodies in Newsreader, against \"Newsreader only for\nTess's words\".<\/li>\n<li>229 cook-mode bead (a ring) and 132 progress strip may break no\nrings / no bars.<\/li>\n<li>Section labels: slate in Kitchen (234 v5) vs ink 2 in Lists v9.<\/li>\n<\/ul>\n<h2 id=\"system\">System<\/h2>\n<ul>\n<li>Ember hex: 241 measures \u0394E against the old soul palette\n(3433D6/D6266E/F2B21B). Tess's Ember is FF5A26/E5341C/FFA90F light,\nFF6B3D/FF4A33/FFC23D dark (215 final). Re-measure 241's \u0394E column.<\/li>\n<li>Money accent: 241 and code use sage 3F7A62/8DBFA7; README says sea\nteal 2A7878/7BC0C4 (223).<\/li>\n<li>Section labels: hairline under them (page-palette rule) vs none in\n230 and 246.<\/li>\n<li>Time format: Weather 243 \"4 PM\" vs copy rule \"4 pm\".<\/li>\n<li>Code behind sheets: AppAccents.swift still has Training\nC4472A/EE6A4C, Kitchen dark D49A52, Routines dark D79AA6 (sheets:\n0B62AE/8FB0EE, C49A5E, D59AC4).<\/li>\n<li>Moonlight vs Soft dark (\"fine for now\"); brighter light-mode mosaic\n(236 v2.7) unconfirmed.<\/li>\n<\/ul>\n<h2 id=\"routines-money-the-rest\">Routines, Money, the rest<\/h2>\n<ul>\n<li>Routines landing is open (three versions rejected); the Codex\nredesign (sheet 248, being recovered) must be merged with 238.<\/li>\n<li>Routines dark accent: D79AA6 (219) vs D59AC4 (238, 241). The bible\nuses D59AC4.<\/li>\n<li>Routines off the phone: all as \"A routine\" (228) vs only private\nones as \"Private routine\" (238, newer, used here).<\/li>\n<li>Money landing (226) has \"About $40 a day left this month\", against\n133's no \"left to spend\".<\/li>\n<li>Money values to Claude: 223 says never. Kaushik's later lab-mode\nruling lets Claude calls carry money values; money actions are never\noffered. Lab mode wins while it is on.<\/li>\n<li>Claude cap: $100 a month shared (his ruling); CODEX.md says $50\nin-app. The $50 is the in-app runner limit inside the $100.<\/li>\n<li>Settings 203: underlined chosen word, pixel knob and pixel page flip\nclash with no underlines and pixels-only-on-Home.<\/li>\n<li>Old left-swipe actions (routine editor drop, Money spend delete,\npool reassign) clash with swipe left = Not now.<\/li>\n<li>App icon masters use the old three-pigment Tess; needs re-rendering\nin Ember.<\/li>\n<li>Money round 239 was scheduled but never drawn.<\/li>\n<li>Upkeep, People, Reading, Day log, Review, Shutdown, Plan my day have\nno sheet in the current room language.<\/li>\n<\/ul>\n<h2 id=\"home-tess-surfaces\">Home, Tess, surfaces<\/h2>\n<ul>\n<li>Ember in 241 is the old soul palette, so \"Notes violet 5B3FB8 is\n\u0394E00 6 from Ember\" is probably a false alarm. Re-run every 241 \u0394E check\nagainst FF5A26 / FF6B3D.<\/li>\n<li>Home's foot: 236 v2 puts an Undo line at bottom left and Home has no\naction word. Confirm.<\/li>\n<li>\"6 of 14\" in Lists copy and the notice \"Packing, 6 of 14.\" Are data\nvalues allowed as an exception to no counters?<\/li>\n<li>One-thing motion: 213 (nothing moves during a swipe) vs 236 v2.1-2.3\n(1:1 slide with parallax .9/.72/.54). 236 is used.<\/li>\n<li>Mosaic faces: 236 \u00a74 (Gallery, Weather, Place, Workout, Cooking,\nShopping, Today) vs v2.1 (Now, Gallery, Weather, Workout, more\nlater).<\/li>\n<li>Mosaic size: core frame 248 x 160 pt vs per-face widths of 88 tiles\n(352 pt).<\/li>\n<li>Place lookup: bundled coarse table, never CLGeocoder (214) vs\nCLGeocoder on the phone (236 \u00a75).<\/li>\n<li>Weather colors: two (weather.md) vs about 12 condition tokens (236\nv2.4).<\/li>\n<li>Weather Day page has a \"Weather\" back word (against the no-back-word\nruling) and small-caps \"Next hours\".<\/li>\n<li>Show capture (photo/video/file) has no place in the 215 layer.<\/li>\n<li>Tess build gaps: drag-to-ask, her room, room-accent palettes, mouth\nwiring.<\/li>\n<li>docs/DESIGN_MOTION.md still describes Tess as three dabs; update\nit.<\/li>\n<li>Lock Screen, widgets, Live Activities have no confirmed current\ndesign (142 never approved).<\/li>\n<\/ul>\n"}]</script>
<script>
const DOCS=JSON.parse(document.getElementById('data').textContent);
const nav=document.getElementById('nav'),doc=document.getElementById('doc');
let cur=0;
DOCS.forEach((d,i)=>{const b=document.createElement('button');b.innerHTML='<span class="n">'+String(i).padStart(2,'0')+'</span>'+d.name;b.onclick=()=>show(i,true);nav.appendChild(b)});
const toc=document.createElement('div');toc.className='toc';nav.appendChild(toc);
const tb=document.createElement('button');tb.className='theme';tb.textContent='Switch light or dark';tb.onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};nav.appendChild(tb);
function slug(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function show(i,scroll){cur=i;[...nav.querySelectorAll('button:not(.theme)')].forEach((b,j)=>b.setAttribute('aria-current',j===i));
  doc.innerHTML=DOCS[i].html;
  doc.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tbl';t.parentNode.insertBefore(w,t);w.appendChild(t)});
  doc.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});
  toc.innerHTML='';doc.querySelectorAll('h2').forEach((h,k)=>{h.id='s'+i+'-'+k;const a=document.createElement('a');a.href='#';a.textContent=h.textContent;a.onclick=e=>{e.preventDefault();h.scrollIntoView({behavior:'smooth'})};toc.appendChild(a)});
  const f=document.createElement('div');f.className='foot';f.innerHTML=(i>0?'<button data-g="'+(i-1)+'">'+DOCS[i-1].name+'</button>':'<span></span>')+(i<DOCS.length-1?'<button data-g="'+(i+1)+'">'+DOCS[i+1].name+'</button>':'');
  f.querySelectorAll('button').forEach(b=>b.onclick=()=>show(+b.dataset.g,true));doc.appendChild(f);
  try{localStorage.setItem('bible-part',i)}catch(e){}
  if(scroll)window.scrollTo({top:0})}
const h=location.hash.replace('#','');let start=DOCS.findIndex(d=>d.id===h);if(start<0){try{start=+localStorage.getItem('bible-part')||0}catch(e){start=0}}
show(Math.min(Math.max(start,0),DOCS.length-1),false);
</script>
