<canvas id="screen"></canvas>
<script>
// Tess motion lab prototype. A deterministic port of TessSoul (SoulParameters.swift, SoulFrame.swift, TessSoul.swift)
// plus the new motion vocabulary in docs/design/motion/tess-motion.md: work (fade, split, process, gather), roam,
// drag and eyes. `renderAt(t)` draws one frame of the chosen scene, so the recorder can step at exactly 60 fps.

const W = 393, H = 852, CAP = 64;
const params = new URLSearchParams(location.search);
const SCENE = params.get('scene') || 'work';
// ?rm=1: Reduce Motion preview of any scene (tess-quiet-versions.md). Default output is unchanged without it.
const RM = params.get('rm') === '1';
// MARK: - Looks (DesignSystem/Looks.swift; inkSoft is each look's `neutral`)
const LOOKS_BY_NAME = {
  // Recut tables (#367, Design 43). `pale` is SoulPalette.look's rule on master: field pigmentBloom or glaze
  // (so Plein, now flat paper with field pigmentBloom, joins it). `?pale=0|1` overrides it for a look.
  obsidian: { ground: '#000000', ink: '#F5F2EC', inkSoft: '#8E879A', tess: '#86B4FF', live: '#FF5B3A', now: '#FFC23D', context: '#B7A6E0', dark: true, pale: false, field: 'emissive' },
  porcelain: { ground: '#FFFFFF', ink: '#121016', inkSoft: '#9C95A8', tess: '#2450D8', live: '#E2432A', now: '#F0A500', context: '#5A3DAF', dark: false, pale: true, field: 'flat' },
  plein: { ground: '#F3EDE2', ink: '#26201E', inkSoft: '#A89C90', tess: '#2A4FA8', live: '#B9452B', now: '#C98E1B', context: '#7D4E6E', dark: false, pale: true, field: 'flat' },
  lacquer: { ground: '#130A0D', ink: '#F3E8D6', inkSoft: '#9E8F93', tess: '#8FB5FF', live: '#F0583A', now: '#E9B64A', context: '#D9A6B8', dark: true, pale: false, field: 'lacquer', fieldShade: '#050203', fieldSpecular: '#FFF1E0' },
  celadon: { ground: '#E0EAE2', ink: '#0C1E19', inkSoft: '#7E918A', tess: '#2C59BE', live: '#D94B2E', now: '#CF9418', context: '#3A6584', dark: false, pale: true, field: 'glaze' },
};
const LOOK_NAME = params.get('look') || 'obsidian';
const LOOK = { ...LOOKS_BY_NAME[LOOK_NAME], blend: LOOKS_BY_NAME[LOOK_NAME].dark ? 'screen' : 'multiply' };
if (params.has('pale')) LOOK.pale = params.get('pale') === '1';
const LIGHT = !LOOK.dark;
// Drawn at this size, as BottomChrome does (`.scaleEffect(0.72)`, breathing 1 ↔ 1.08 over 3.2 s).
const CHROME = 0.72;
const chromeBreath = t => 1 + .08 * easeInOut(1 - Math.abs(2 * (((t % 6.4) + 6.4) % 6.4) / 6.4 - 1));
// Close-up recordings render one region larger; `zoom` sets the device scale, `focus` the region.
const DPR_PARAM = parseFloat(params.get('dpr') || '2');
const PAINTS = [LOOK.live, LOOK.tess, LOOK.now];
const DPR = DPR_PARAM;

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

// MARK: - Curves (SwiftUI UnitCurve)
function bezier(p1x, p1y, p2x, p2y) {
  const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
  const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t;
  const sy = t => ((ay * t + by) * t + cy) * t;
  const dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t) - x; const d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; }
    let lo = 0, hi = 1;
    if (Math.abs(sx(t) - x) > 1e-4) { t = x; for (let i = 0; i < 30; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; } }
    return sy(t);
  };
}
const easeInOut = bezier(0.42, 0, 0.58, 1);
const easeOut = bezier(0, 0, 0.58, 1);
const easeIn = bezier(0.42, 0, 1, 1);
const doneCurve = bezier(0.4, 0, 0.2, 1);
const travelX = bezier(0.55, 0, 0.15, 1);  // SoulTravel x
const travelY = bezier(0.3, 0, 0.25, 1);   // SoulTravel y
const gatherCurve = bezier(0.55, 0, 0.15, 1);
const splitCurve = bezier(0.4, 0, 0.2, 1);
const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);
const lerp = (a, b, t) => a + (b - a) * t;
const ramp = (t, start, dur, curve = easeInOut) => curve(clamp((t - start) / dur));

// Spring (Theme.Motion.house: duration 0.42, bounce 0.12), step response 0…1 for a target change at t=0.
function spring(t, duration = 0.42, bounce = 0.12) {
  if (t <= 0) return 0;
  const omega = 2 * Math.PI / duration, zeta = 1 - bounce;
  const wd = omega * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * omega * t) * (Math.cos(wd * t) + (zeta * omega / wd) * Math.sin(wd * t));
}

// MARK: - Soul keyframes (SoulMotion)
const K = (time, o) => Object.assign({ time, home: 1, bloom: 0, target: 0, dx: 0, dy: 0, scaleX: o.scale, scaleY: o.scaleY ?? o.scale, blur: 4, opacity: 1 }, o);
const M = {
  drift: [K(0, { dy: -6, scale: .78, blur: 3 }), K(.25, { dx: 6, scale: .9, blur: 5 }), K(.5, { dy: 6, scale: .8, blur: 4 }), K(.75, { dx: -6, scale: .92, blur: 6 }), K(1, { dy: -6, scale: .78, blur: 3 })],
  lift: [K(0, { scale: .78, blur: 4 }), K(.1, { dx: 5, dy: -10, scale: .92, blur: 5.5 }), K(.17, { dx: 7, dy: -7, scale: .86, blur: 4.5 }), K(.24, { dx: 5, dy: -10, scale: .92, blur: 5.5 }), K(.38, { scale: .78, blur: 4 }), K(1, { scale: .78, blur: 4 })],
  pulse: [K(0, { home: .6, scale: .72, blur: 3, opacity: .85 }), K(.3, { home: 1.3, scale: 1.06, blur: 7 }), K(.6, { home: .9, scale: .84, blur: 4, opacity: .92 }), K(1, { home: .6, scale: .72, blur: 3, opacity: .85 })],
  bloom: [K(0, { home: .45, scale: .6, blur: 3 }), K(.4, { home: 0, bloom: 1, scale: 1.15, blur: 6 }), K(.7, { home: .6, scale: .9, blur: 4 }), K(1, { home: .45, scale: .6, blur: 3 })],
  merge: [K(0, { scale: .8, blur: 4 }), K(.3, { home: 0, scale: .9, blur: 5 }), K(.45, { home: 0, scale: 1.35, blur: 9 }), K(.6, { home: 0, scale: 1, blur: 6 }), K(.72, { home: 0, scale: 1, blur: 6 }), K(1, { scale: .8, blur: 4 })],
  splash: [K(0, { home: 0, scale: .4, opacity: 0 }), K(.3, { home: 0, scale: .4, opacity: 0 }), K(.42, { home: 0, scale: .75, opacity: 1 }), K(.88, { home: 0, scale: 2.6, opacity: 0 }), K(1, { home: 0, scale: 2.6, opacity: 0 })],
};
const track = (keys, period, delay = 0, curve = easeInOut) => ({ keys, period, delay, curve });
const LOOKS = { base: { scale: 1, saturation: 1.45, contrast: 1.04, brightness: 0, opacity: 1, satellites: 1 } };
const look = o => Object.assign({}, LOOKS.base, o);

const TABLE = {
  idle: { look: look({ scale: .62 }), mains: [0, -6, -3].map(d => track(M.lift, 9, d)), sats: [[9, -4], [11, -1], [7.5, -5]].map(([p, d]) => track(M.drift, p, d)) },
  listening: { look: look({}), mains: [0, -.8, -1.6].map(d => track(M.bloom, 2.4, d)), sats: [-1.2, -2, -.4].map(d => track(M.bloom, 2.4, d)) },
  thinking: { look: look({ scale: .8 }), mains: [[.9, 0], [.72, -.3], [1.1, -.5]].map(([p, d]) => track(M.pulse, p, d)), sats: [[.8, -.2], [1, -.6], [.66, -.1]].map(([p, d]) => track(M.pulse, p, d)) },
  done: { look: look({}), mains: [0, 0, 0].map(d => track(M.merge, 1.8, d, doneCurve)), sats: [.08, .16, .24].map(d => track(M.merge, 1.8, d, doneCurve)), ring: track(M.splash, 1.8, 0, easeOut), oneShot: 1.8 },
};

function keyAt(tr, p) {
  const c = clamp(p), keys = tr.keys;
  const n = keys.findIndex(k => k.time >= c);
  if (n < 0) return keys[keys.length - 1];
  if (n === 0) return keys[0];
  const a = keys[n - 1], b = keys[n];
  const local = b.time === a.time ? 1 : (c - a.time) / (b.time - a.time);
  const e = tr.curve(local), r = {};
  for (const k in a) r[k] = lerp(a[k], b[k], e);
  return r;
}
const phase = (time, period, delay = 0) => { const v = ((time - delay) % period) / period; return v < 0 ? v + 1 : v; };

// Dab geometry (SoulFrame.swift SoulDab.all), with the spread from soul-explore.md (default if he's silent: 65%).
const SPREAD = parseFloat(params.get('spread') || '0.65');
const CENTROID = { x: 0, y: -1 };
const MAIN = { w: 76, h: 70 }, SAT = { w: 46, h: 42 };
const DABS = [
  { home: [-14, -8], bloom: [18, -10], size: MAIN, paint: 0 },
  { home: [14, -8], bloom: [-16, -12], size: MAIN, paint: 1 },
  { home: [0, 13], bloom: [0, 18], size: MAIN, paint: 2 },
  { home: [-22, 10], bloom: [-20, 14], size: SAT, paint: 0 },
  { home: [20, 12], bloom: [22, 10], size: SAT, paint: 1 },
  { home: [4, -20], bloom: [6, -22], size: SAT, paint: 2 },
].map(d => ({ ...d, home: [CENTROID.x + SPREAD * (d.home[0] - CENTROID.x), CENTROID.y + SPREAD * (d.home[1] - CENTROID.y)] }));

// One mode sampled (SoulFrame.sample): soul-relative poses.
function sampleMode(mode, time, elapsed) {
  const P = TABLE[mode];
  const prog = tr => P.oneShot ? (elapsed - tr.delay) / tr.period : phase(time, tr.period, tr.delay);
  const tracks = P.mains.concat(P.sats);
  const dabs = tracks.map((tr, i) => {
    const k = keyAt(tr, prog(tr)), d = DABS[i];
    return { x: k.home * d.home[0] + k.bloom * d.bloom[0] + k.dx, y: k.home * d.home[1] + k.bloom * d.bloom[1] + k.dy, sx: k.scaleX, sy: k.scaleY, blur: k.blur, opacity: k.opacity };
  });
  let ring = { sx: 0, opacity: 0 };
  if (P.ring) { const k = keyAt(P.ring, prog(P.ring)); ring = { sx: k.scaleX, opacity: k.opacity }; }
  const breath = easeInOut(1 - Math.abs(2 * phase(time, 7) - 1));
  return { dabs, ring, halo: { s: .8 + .2 * breath, opacity: .6 + .4 * breath }, look: { ...P.look } };
}
function mixFrame(a, b, w) {
  const m = (x, y) => { const r = {}; for (const k in x) r[k] = lerp(x[k], y[k], w); return r; };
  return { dabs: a.dabs.map((d, i) => m(d, b.dabs[i])), ring: m(a.ring, b.ring), halo: m(a.halo, b.halo), look: m(a.look, b.look) };
}
// SoulBlend: modes stack, each new one fades in over 0.4 s.
function soulFrame(modes, t) {
  const live = modes.filter(m => m.at <= t);
  let base = 0;
  live.forEach((m, i) => { if (t - m.at >= .4) base = i; });
  let f = null;
  for (const m of live.slice(base)) {
    const next = sampleMode(m.mode, t + 100, t - m.at);
    f = f ? mixFrame(f, next, easeInOut(clamp((t - m.at) / .4))) : next;
  }
  return f;
}

// MARK: - Particles
// Twelve lights. 0-5 are the six dabs as built. 6-11 are hidden children of the three mains (6,7 vermilion;
// 8,9 cobalt; 10,11 cadmium) that only show when she splits. Formed, every child sits inside its parent at alpha 0.
const PARENT = [0, 1, 2, 3, 4, 5, 0, 0, 1, 1, 2, 2];
const PAINT_OF = i => DABS[PARENT[i]].paint;

function formedParticles(frame, C, scale) {
  const L = frame.look.scale * scale;
  return PARENT.map((p, i) => {
    const d = frame.dabs[p], g = DABS[p];
    const sat = p >= 3 ? frame.look.satellites : 1;
    return { x: C.x + L * d.x, y: C.y + L * d.y, rx: L * g.size.w / 2 * d.sx, ry: L * g.size.h / 2 * d.sy, blur: L * d.blur, alpha: i < 6 ? d.opacity * sat : 0 };
  });
}

// MARK: - Work: fade, split, process, gather
// The constellation: each light on its own slow Lissajous loop round a point beside her line, so lights cross and
// mix (screen on dark) without ever lining up. Readers: three lights in a short chain that scan under the rows of
// the thing she's working on, left to right then back, like a finger under a line.
const CONSTELLATION = [
  // index, ax, ay, periodX, periodY, phase, radius
  [0, 26, 14, 6.2, 4.4, 0.0, 15], [2, 20, 18, 7.4, 5.2, 1.7, 15], [3, 34, 12, 8.6, 6.1, 3.1, 11],
  [4, 16, 20, 5.6, 7.8, 4.4, 11], [5, 10, 8, 9.2, 6.6, 2.2, 11], [7, 30, 16, 6.8, 5.7, 5.3, 12],
  [8, 5, 4, 7.9, 4.9, 0.9, 12], [9, 12, 22, 8.3, 6.9, 3.8, 12], [11, 28, 20, 9.7, 7.3, 2.6, 12],
];
const READERS = [[1, 0], [6, .09], [10, .18]]; // cobalt leads, vermilion and cadmium follow

function constellationPose(entry, t, W0) {
  const [i, ax, ay, px, py, ph, r] = entry;
  const breathe = 1 + .14 * Math.sin(2 * Math.PI * t / (3.1 + i * .37) + ph);
  return {
    x: W0.x + ax * Math.sin(2 * Math.PI * t / px + ph),
    y: W0.y + ay * Math.sin(2 * Math.PI * t / py + ph * 1.3),
    rx: r * breathe, ry: r * .9 * breathe, blur: 5, alpha: .55,
  };
}

// A boustrophedon path under each row: [{x,y}] sampled every few points, measured by arc length.
function scanPath(rows) {
  const pts = [];
  rows.forEach((r, i) => {
    const y = r.y + 13, ltr = i % 2 === 0;
    const xs = ltr ? [r.x0, r.x1] : [r.x1, r.x0];
    for (let s = 0; s <= 1.0001; s += .02) pts.push({ x: lerp(xs[0], xs[1], s), y });
    if (i < rows.length - 1) {
      const ny = rows[i + 1].y + 13, cy = (y + ny) / 2, rr = (ny - y) / 2, cx = xs[1];
      for (let a = -Math.PI / 2; a <= Math.PI / 2; a += .2) pts.push({ x: cx + (ltr ? 1 : -1) * rr * Math.cos(a) * .9, y: cy + rr * Math.sin(a) });
    }
  });
  let len = 0; pts[0].s = 0;
  for (let i = 1; i < pts.length; i++) { len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); pts[i].s = len; }
  return { pts, len };
}
function along(path, s) {
  s = clamp(s, 0, path.len);
  const p = path.pts; let i = 1;
  while (i < p.length - 1 && p[i].s < s) i++;
  const a = p[i - 1], b = p[i], u = b.s === a.s ? 0 : (s - a.s) / (b.s - a.s);
  return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u) };
}

// Weight 0…1 of each light's work pose. Split staggers the children out after the fade starts; gather brings the
// far readers home first so every light lands together.
function workWeight(i, t, work) {
  if (!work) return 0;
  const reader = (work.path || work.pathFn) && READERS.some(r => r[0] === i);
  const outDelay = .25 + (i >= 6 ? .08 * (i - 5) : .03 * i) + (reader ? .1 : 0);
  const outDur = reader ? 1.1 : .9;
  const w = ramp(t, work.split + outDelay, outDur, splitCurve);
  if (work.gather === undefined) return w;
  const inDelay = reader ? 0 : .14 + .025 * (i % 6);
  const inDur = reader ? .82 : .68;
  return w * (1 - ramp(t, work.gather + inDelay, inDur, gatherCurve));
}
// The fade: colour drains from her before she splits, and floods back as she gathers.
function workFade(t, work) {
  if (!work) return 0;
  const out = ramp(t, work.split, .5);
  return work.gather === undefined ? out : out * (1 - ramp(t, work.gather + .3, .55));
}

function workParticles(t, work) {
  const res = [];
  const W0 = work.at;
  for (const c of CONSTELLATION) {
    res[c[0]] = constellationPose(c, t, W0);
    if (work.noise) { const n = noiseDrift(c[0], t); res[c[0]] = { ...res[c[0]], x: W0.x + c[1] * n.x, y: W0.y + c[2] * n.y }; }
  }
  for (const [i, lag] of READERS) {
    if (work.pathFn) {
      const p = work.pathFn(t - work.scan - lag);
      res[i] = { x: p.x, y: p.y + (i === 1 ? 0 : 1.5), rx: i === 1 ? 15 : 12, ry: i === 1 ? 11 : 9, blur: 5, alpha: i === 1 ? .5 : .42 };
      continue;
    }
    if (work.path) {
      const tau = t - work.scan - lag;
      const s = work.path.len * clamp(tau / work.scanDur);
      const p = along(work.path, s);
      // The chain tightens as it reads (it's one glint with colour in its tail) and fades a touch on the turns.
      res[i] = { x: p.x, y: p.y + (i === 1 ? 0 : 1.5), rx: i === 1 ? 15 : 12, ry: i === 1 ? 11 : 9, blur: 5, alpha: i === 1 ? .5 : .42 };
      // The page is leaving (a lens hold, section 15): the readers come home to the constellation inside 360 ms.
      if (work.pathUntil !== undefined && t > work.pathUntil) {
        const home = constellationPose([i, 18 + i, 12 + (i % 3) * 4, 6 + i * .3, 5 + i * .2, i, i === 1 ? 15 : 12], t, W0);
        const u = ramp(t, work.pathUntil, .36, gatherCurve);
        res[i] = { x: lerp(res[i].x, home.x, u), y: lerp(res[i].y, home.y, u), rx: lerp(res[i].rx, home.rx, u), ry: lerp(res[i].ry, home.ry, u), blur: lerp(5, home.blur, u), alpha: lerp(res[i].alpha, home.alpha, u) };
      }
    } else {
      res[i] = constellationPose([i, 18 + i, 12 + (i % 3) * 4, 6 + i * .3, 5 + i * .2, i, i === 1 ? 15 : 12], t, W0);
    }
  }
  return res;
}

// Blend a formed light to its work pose along an arc (never a straight slide).
function travel(a, b, w, i) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  const side = i % 2 ? 1 : -1;
  const cx = mx + (-dy / (d || 1)) * d * .22 * side, cy = my + (dx / (d || 1)) * d * .22 * side;
  const u = 1 - w;
  return {
    x: u * u * a.x + 2 * u * w * cx + w * w * b.x,
    y: u * u * a.y + 2 * u * w * cy + w * w * b.y,
    rx: lerp(a.rx, b.rx, w), ry: lerp(a.ry, b.ry, w), blur: lerp(a.blur, b.blur, w),
    alpha: i < 6 ? lerp(a.alpha, b.alpha, w) : b.alpha * clamp(w * 1.6),
  };
}

// MARK: - Drawing
const canvas = document.getElementById('screen');
canvas.width = W * DPR; canvas.height = (H + CAP) * DPR;
canvas.style.width = W + 'px'; canvas.style.height = (H + CAP) + 'px';
const ctx = canvas.getContext('2d');
const off = document.createElement('canvas');
off.width = W * DPR; off.height = H * DPR;
const octx = off.getContext('2d');

function shapePath(h, v) {
  const rx = h.map(x => x / 50), ry = v.map(x => x / 50), k = .5523, p = new Path2D();
  p.moveTo(-1 + rx[0], -1); p.lineTo(1 - rx[1], -1);
  p.bezierCurveTo(1 - rx[1] * (1 - k), -1, 1, -1 + ry[1] * (1 - k), 1, -1 + ry[1]);
  p.lineTo(1, 1 - ry[2]);
  p.bezierCurveTo(1, 1 - ry[2] * (1 - k), 1 - rx[2] * (1 - k), 1, 1 - rx[2], 1);
  p.lineTo(-1 + rx[3], 1);
  p.bezierCurveTo(-1 + rx[3] * (1 - k), 1, -1, 1 - ry[3] * (1 - k), -1, 1 - ry[3]);
  p.lineTo(-1, -1 + ry[0]);
  p.bezierCurveTo(-1, -1 + ry[0] * (1 - k), -1 + rx[0] * (1 - k), -1, -1 + rx[0], -1);
  p.closePath(); return p;
}
const SHAPES = [shapePath([52, 48, 60, 40], [55, 45, 55, 45]), shapePath([45, 55, 40, 60], [50, 60, 40, 50]), shapePath([60, 40, 55, 45], [45, 55, 45, 55])];
const [CORE, MID] = LOOK.pale ? [.58, .42] : [.8, .6];

function drawSoul(parts, frame, C, scale, grade) {
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, off.width, off.height);
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.globalCompositeOperation = 'source-over';
  const L = frame.look.scale * scale;
  // Halo (normal blend), fading out while she works.
  const haloA = frame.halo.opacity * (1 - grade.fade) * grade.haloBoost;
  if (haloA > .01) {
    octx.save(); octx.translate(C.x, C.y); octx.scale(L * frame.halo.s, L * frame.halo.s * 70 / 75);
    const g = octx.createRadialGradient(0, 0, 0, 0, 0, 75);
    const a1 = LIGHT ? .08 : .22, a2 = LIGHT ? .05 : .14;
    const warm = grade.palette ? (grade.palette.reveal[0] >= 1 ? grade.palette.to[0] : grade.palette.from[0]) : LOOK.live;
    g.addColorStop(0, rgba(warm, a1)); g.addColorStop(.55, rgba(LOOK.context, a2)); g.addColorStop(1, rgba(LOOK.context, 0));
    octx.globalAlpha = haloA; octx.fillStyle = g; octx.beginPath(); octx.arc(0, 0, 75, 0, Math.PI * 2); octx.fill(); octx.restore();
  }
  if (frame.ring.opacity > .01) {
    const r = 50 * frame.ring.sx;
    octx.save(); octx.translate(C.x, C.y); octx.scale(L, L);
    const g = octx.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(.52, rgba(LOOK.context, 0)); g.addColorStop(.72, rgba(LOOK.context, .6 * .5)); g.addColorStop(1, rgba(LOOK.context, 0));
    octx.globalAlpha = frame.ring.opacity; octx.fillStyle = g; octx.beginPath(); octx.arc(0, 0, r, 0, Math.PI * 2); octx.fill(); octx.restore();
  }
  octx.globalCompositeOperation = LOOK.blend;
  const pal = grade.palette;
  parts.forEach((p, i) => {
    if (p.alpha < .01 || p.rx < .2 || p.ry < .2) return;
    const paint = PAINT_OF(i);
    const wet = pal ? pal.wet[paint] : 0, reveal = pal ? pal.reveal[paint] : 0;
    octx.save();
    octx.filter = `blur(${(p.blur * DPR).toFixed(2)}px)`;
    octx.globalAlpha = clamp(p.alpha);
    octx.translate(p.x, p.y); octx.scale(p.rx * (1 + .12 * wet), p.ry * (1 + .12 * wet));
    const wash = (hex, lift) => { const g = octx.createRadialGradient(0, 0, 0, 0, 0, 1); g.addColorStop(0, rgba(hex, Math.min(1, CORE * (1 + lift)))); g.addColorStop(.4, rgba(hex, Math.min(1, MID * (1 + lift)))); g.addColorStop(1, rgba(hex, 0)); return g; };
    const oldHex = pal ? pal.from[paint] : PAINTS[paint];
    // The new pigment pools from the centre outward (900 ms, house curve): its wash grows from the centre to the
    // edge while the old wash thins under it, so the edge of the pool is as soft as the dab.
    octx.globalAlpha = clamp(p.alpha) * (1 - reveal);
    octx.fillStyle = wash(oldHex, 0); octx.fill(SHAPES[paint]);
    if (reveal > 0) {
      octx.globalAlpha = clamp(p.alpha);
      const r = Math.max(reveal * 1.15, .01), hex = pal.to[paint], lift = .2 * wet;
      const g = octx.createRadialGradient(0, 0, 0, 0, 0, r);
      // Wet: light looks lift core and mid; dark looks lift only the mid, the core never (Design 58).
      g.addColorStop(0, rgba(hex, Math.min(1, CORE * (1 + (LOOK.dark ? 0 : lift))))); g.addColorStop(.4, rgba(hex, Math.min(1, MID * (1 + lift)))); g.addColorStop(1, rgba(hex, 0));
      octx.fillStyle = g; octx.fill(SHAPES[paint]);
    }
    octx.restore();
  });
  octx.filter = 'none';
  // The group grade: saturation, contrast and opacity over the whole soul, as the SwiftUI view does.
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.filter = `saturate(${grade.saturation.toFixed(3)}) contrast(${grade.contrast.toFixed(3)})`;
  ctx.globalAlpha = grade.opacity;
  ctx.drawImage(off, 0, 0);
  ctx.restore();
}

function drawEyes(C, scale, frame, eyes, t) {
  if (!eyes || eyes.alpha < .01) return;
  const L = frame.look.scale * scale;
  // They sit on the soul's centroid, a touch above it, and ride the dabs' own motion (the mains' mean offset).
  const m = frame.dabs.slice(0, 3).reduce((a, d) => ({ x: a.x + d.x / 3, y: a.y + d.y / 3 }), { x: 0, y: 0 });
  // Values (at soul scale 1): 8.4 pt apart, 3.2 × 3.5 pt, 3 pt above the centroid; a glance moves them up to 3 pt.
  const cx = C.x + L * (m.x + eyes.look.x * 3), cy = C.y + L * (m.y - 3 + eyes.look.y * 2.2);
  const open = eyes.blink;
  ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(LOOK.dark ? LOOK.ground : LOOK.ink, .82 * eyes.alpha); // Design 51: always the dark one
  for (const s of [-1, 1]) {
    const o = s < 0 ? (eyes.blinkL ?? open) : (eyes.blinkR ?? open);
    ctx.beginPath(); ctx.ellipse(cx + s * 4.2 * L, cy, 1.6 * L, Math.max(1.75 * o, .25) * L, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// The mouth (Kaushik, 9:55 AM PT Oct 16: "a small mouth, just a line… so it could get a little more expressive").
// One short stroke under the eyes, in the eyes' dark pigment but lighter (70%), so the eyes still lead. It is a
// line, never a cartoon: `curve` bends it (+1 a small smile; down only to -0.35, only for a miss of her own, never at him), `tilt` lifts one
// corner (thinking, curious), `open` rounds it into a small soft o (listening). It rides the eyes' glance at 70%.
function drawMouth(C, scale, frame, mouth, look) {
  if (!mouth || mouth.alpha < .01) return;
  const L = frame.look.scale * scale;
  const m = frame.dabs.slice(0, 3).reduce((a, d) => ({ x: a.x + d.x / 3, y: a.y + d.y / 3 }), { x: 0, y: 0 });
  const lx = look ? look.x : 0, ly = look ? look.y : 0;
  const cx = C.x + L * (m.x + lx * 3 * .7), cy = C.y + L * (m.y + 2.6 + ly * 2.2 * .7);
  const w = (mouth.width ?? 5.6) / 2, curve = Math.max(-.35, mouth.curve ?? 0), tilt = mouth.tilt ?? 0, open = mouth.open ?? 0;
  const col = LOOK.dark ? LOOK.ground : LOOK.ink;
  ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (open > .01) {
    ctx.fillStyle = rgba(col, .7 * mouth.alpha * open);
    ctx.beginPath(); ctx.ellipse(cx, cy + .5 * L, lerp(w, 1.35, open) * L, lerp(.5, 1.4, open) * L, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (open < .99) {
    ctx.strokeStyle = rgba(col, .7 * mouth.alpha * (1 - open)); ctx.lineWidth = 1.1 * L; ctx.lineCap = 'round';
    ctx.beginPath();
    // `tilt` lifts only the right corner; the left never drops, so no corner sits below the middle unless curve < 0.
    ctx.moveTo(cx - w * L, cy + (-curve * .5) * L);
    ctx.quadraticCurveTo(cx, cy + (curve * 1.7) * L, cx + w * L, cy + (-tilt * .9 - curve * .5) * L);
    ctx.stroke();
  }
  ctx.restore();
}

// MARK: - The page (a plain stand-in for Home, so the motion can be judged against real content)
function font(size, weight = 500) { return `${weight} ${size}px "Inter Tight", system-ui, sans-serif`; }
function text(str, x, y, size, color, weight = 500, align = 'left', alpha = 1) {
  ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = alpha;
  ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(str, x, y); ctx.restore();
}
function width(str, size, weight = 500) { ctx.save(); ctx.font = font(size, weight); const w = ctx.measureText(str).width; ctx.restore(); return w; }

const ROWS = [
  { title: 'Call the bank', when: '9:30 am' },
  { title: 'Push A', when: '12:15 pm' },
  { title: 'Pick up the dry cleaning', when: '' },
  { title: 'Book the dentist', when: '' },
  { title: 'Water the plants', when: '6 pm' },
];
// Sheet 41's frame: the day label at 138, the context line at 186, the hero at 220 (34), NEXT and the rows below.
const ROW_Y0 = 330, ROW_DY = 50;
function rowGeom(scrollY = 0) {
  return ROWS.map((r, i) => {
    const y = ROW_Y0 + i * ROW_DY - scrollY;
    return { y, x0: 24, x1: 24 + width(r.title, 18), titleEnd: 24 + width(r.title, 18) };
  });
}

function drawPage(o = {}) {
  const scroll = o.scroll || 0;
  ground();
  text('7:42', 32, 34, 16, LOOK.ink, 600);
  const nav = ['Review', 'Today', 'Training', 'Kitchen'];
  let x = 24;
  nav.forEach(n => { text(n, x, 82, 16, n === 'Today' ? LOOK.ink : LOOK.inkSoft, n === 'Today' ? 600 : 500); x += width(n, 16) + 22; });
  text(o.day || 'Friday morning', 24, 138 - scroll, 21, LOOK.ink, 500);
  text(o.context || 'nothing due till 9:30 am', 24, 186 - scroll, 21, LOOK.context, 500);
  text(o.header || 'Push A at 12:15 pm', 24, 220 - scroll, 34, LOOK.ink, 600);
  text('NEXT', 24, 290 - scroll, 16, LOOK.inkSoft, 600);
  rowGeom(scroll).forEach((g, i) => {
    const r = ROWS[i];
    if (g.y < 110 || g.y > 700) return;
    const a = o.rowAlpha ? o.rowAlpha(i, g) : 1;
    text(r.title, 24, g.y, 18, LOOK.ink, 500, 'left', a);
    if (r.when) text(r.when, 369, g.y, 16, LOOK.inkSoft, 500, 'right', a);
  });
  if (o.extra) o.extra(scroll);
}

// Tess's line in the ask band (736-820): cobalt, blurred in over 300 ms like a value word.
function drawLine(lines, t) {
  for (const l of lines) {
    const a = ramp(t, l.at, .3) * (l.until ? 1 - ramp(t, l.until, .25) : 1);
    if (a < .01) continue;
    ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.filter = `blur(${((1 - a) * 4 * DPR).toFixed(2)}px)`;
    ctx.globalAlpha = a; ctx.font = font(17, 500); ctx.fillStyle = LOOK.tess; ctx.textAlign = 'left';
    ctx.fillText(l.text, 24, 785); ctx.restore();
  }
}

// The caption strip under the phone names each beat and its haptic; it isn't part of the app.
function drawCaption(caps, t) {
  ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = LIGHT ? '#F2F0F5' : '#111014'; ctx.fillRect(0, H, W, CAP);
  ctx.restore();
  let cur = null;
  for (const c of caps) if (c.at <= t) cur = c;
  if (!cur) return;
  const a = ramp(t, cur.at, .2);
  text(cur.text, 16, H + 27, 16, LOOK.ink, 500, 'left', a);
  if (cur.haptic) text('Haptic: ' + cur.haptic, 16, H + 50, 16, LOOK.inkSoft, 500, 'left', a);
}

function drawFinger(f) {
  if (!f || f.alpha < .01) return;
  ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = f.alpha;
  ctx.fillStyle = LIGHT ? 'rgba(23,20,31,0.10)' : 'rgba(245,242,236,0.14)';
  ctx.strokeStyle = LIGHT ? 'rgba(23,20,31,0.28)' : 'rgba(245,242,236,0.32)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(f.x, f.y, 19 * (f.press || 1), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// MARK: - Compose one frame
const HOME = { x: 346, y: 779 };

function composeSoul(t, s) {
  const frame = soulFrame(s.modes, t);
  const C = s.centre(t);
  const scale = (s.scale ? s.scale(t) : 1) * CHROME * (s.frozen ? 1 : chromeBreath(t)) * (s.beat ? s.beat(t).scale : 1);
  let parts = formedParticles(frame, C, scale);
  const work = s.work;
  if (work) {
    const wp = workParticles(t, work);
    parts = parts.map((p, i) => { const w = workWeight(i, t, work); return w > 0 ? travel(p, wp[i], w, i) : p; });
  }
  // Low Power (section 13): the six children never leave the dabs, so only six lights split.
  if (s.lowPower) parts = parts.map((p, i) => i >= 6 ? { ...p, alpha: 0 } : p);
  if (s.wobble) parts = s.wobble(parts, t, C);
  const beat = s.beat ? s.beat(t) : null;
  if (beat && beat.gather > 0) {
    // The small gather: the satellites (and their children) pull in toward the mains' centre.
    parts = parts.map((p, i) => PARENT[i] >= 3 ? { ...p, x: lerp(p.x, C.x + (p.x - C.x) * .55, beat.gather), y: lerp(p.y, C.y + (p.y - C.y) * .55, beat.gather) } : p);
  }
  const fade = workFade(t, work);
  const reduced = s.reduced ? s.reduced(t) : 0;
  const grade = {
    saturation: lerp(frame.look.saturation, .62, fade) * lerp(1, .5, reduced) + (beat ? beat.sat : 0),
    contrast: lerp(frame.look.contrast, 1, fade),
    opacity: frame.look.opacity * lerp(1, .9, fade) * lerp(1, .6, reduced) * (s.opacityMul ? s.opacityMul(t) : 1),
    fade: Math.max(fade, reduced), haloBoost: s.haloBoost ? s.haloBoost(t) : 1,
    palette: s.palette ? s.palette(t) : null,
  };
  if (reduced > 0) {
    // Reduce Motion: no travel. The three mains loosen apart in place and hold; the satellites fade.
    parts = parts.map((p, i) => {
      const d = i < 3 ? 1.5 : 1;
      return { ...p, x: lerp(p.x, C.x + (p.x - C.x) * d, reduced), y: lerp(p.y, C.y + (p.y - C.y) * d, reduced), alpha: p.alpha * (i >= 3 ? 1 - reduced * .6 : 1) };
    });
  }
  drawSoul(parts, frame, C, scale, grade);
  if (s.eyes) drawEyes(C, scale, frame, s.eyes(t), t);
  if (s.mouth) drawMouth(C, scale, frame, s.mouth(t), s.eyes ? s.eyes(t).look : null);
}

// MARK: - Scenes
const SCENES = {};

// 1. Work: he asks for a plan; she drains, splits, reads the rows, gathers, and Done plays exactly as built.
SCENES.work = () => {
  const S = 1.8, scan = S + 1.25, scanDur = 5.4, G = scan + scanDur + .35, D = G + .78;
  const rows = rowGeom().map(g => ({ y: g.y, x0: 26, x1: Math.max(g.titleEnd, 170) }));
  const work = { split: S, scan, scanDur, gather: G, at: { x: 336, y: 772 }, path: scanPath(rows) };
  const modes = [{ mode: 'idle', at: -10 }, { mode: 'done', at: D }, { mode: 'idle', at: D + 1.8 }];
  return {
    duration: D + 3.4,
    soul: { modes, centre: () => HOME, work },
    lines: [{ text: 'Planning your day.', at: S - .2, until: D }, { text: 'Plan ready. Push A at 12:15 pm.', at: D + .55 }],
    caps: [
      { at: 0, text: 'At rest: idle, as built.' },
      { at: S, text: 'Fade: her colour drains to 60%, the halo goes.' },
      { at: S + .3, text: 'Split: twelve faint lights. Three go to read.' },
      { at: scan, text: 'Process: the lights read under each row.' },
      { at: G, text: 'Gather: the readers fly home first, all land together.' },
      { at: D, text: 'Done: exactly as built.', haptic: 'success (Done’s own, the only one)' },
      { at: D + 1.9, text: 'Back to rest.' },
    ],
  };
};

// 2. Thinking with nothing on screen to work on: no readers, the whole soul loosens into a constellation beside
// her line and gathers back.
SCENES.think = () => {
  const S = 1.4, G = S + 5.2, D = G + .7;
  const work = { split: S, gather: G, at: { x: 336, y: 772 } };
  return {
    duration: D + 3,
    soul: { modes: [{ mode: 'idle', at: -10 }, { mode: 'done', at: D }, { mode: 'idle', at: D + 1.8 }], centre: () => HOME, work },
    lines: [{ text: 'Thinking.', at: S - .2, until: D }, { text: 'Bench is up 5 kg this month.', at: D + .55 }],
    caps: [
      { at: 0, text: 'At rest.' },
      { at: S, text: 'Nothing to read on screen: she loosens in place.' },
      { at: S + 1.4, text: 'Lights orbit beside her line; they never cross it.' },
      { at: G, text: 'Gather.' },
      { at: D, text: 'Done: exactly as built.', haptic: 'success' },
    ],
  };
};

// 3. Roam: she goes to the row she's changing, works there, and comes home. Then the page scrolls and a row she's
// sitting on carries her; when it leaves, she comes home.
SCENES.roam = () => {
  const geo = rowGeom();
  const row = 1, g = geo[row];
  const spot = { x: Math.max(g.titleEnd + 40, 200), y: g.y - 6 };
  const T1 = 1.6, T1d = .76, S = T1 + .7, G = S + 2.4, D = G + .7, back = D + 1.9;
  const T2 = back + 1.6; // second act: he scrolls while she's on a row
  const row2 = 3, spot2 = { x: geo[row2].titleEnd + 40, y: geo[row2].y - 6 };
  const scrollStart = T2 + 1.6, scrollDur = 1.6;
  const scroll = t => 330 * ramp(t, scrollStart, scrollDur, bezier(.3, 0, .2, 1));
  const goes = (t, from, to, at) => {
    const u = clamp((t - at) / T1d);
    return { x: lerp(from.x, to.x, travelX(u)), y: lerp(from.y, to.y, travelY(u)) };
  };
  const centre = t => {
    if (t < back) return t < T1 + T1d ? goes(t, HOME, spot, T1) : goes(t, spot, HOME, back);
    if (t < T2 + T1d) return goes(t, HOME, spot2, T2);
    // Riding the row while it scrolls; when the row passes under the nav (y < 130) she lets go and flies home.
    const s = scroll(t);
    const ride = { x: spot2.x, y: spot2.y - s };
    const leaveAt = scrollStart + .55;
    if (t < leaveAt) return ride;
    const from = { x: spot2.x, y: spot2.y - scroll(leaveAt) };
    return goes(t, from, HOME, leaveAt);
  };
  const work = { split: S, gather: G, at: spot, small: true };
  return {
    duration: scrollStart + scrollDur + 2.2,
    page: t => ({ scroll: scroll(t) }),
    soul: {
      modes: [{ mode: 'idle', at: -10 }, { mode: 'done', at: D }, { mode: 'idle', at: D + 1.8 }],
      centre, work: localWork(work),
      scale: t => 1,
    },
    lines: [{ text: 'Moving Push A to 6 pm.', at: T1 - .1, until: D }, { text: 'Push A moved to 6 pm.', at: D + .5, until: T2 }, { text: 'Book the dentist?', at: T2, until: scrollStart + .6 }],
    caps: [
      { at: 0, text: 'Roam: she goes to what she’s changing.' },
      { at: T1, text: 'An arc to the free space after the row’s words.' },
      { at: S, text: 'She works there, small, never over the words.' },
      { at: D, text: 'Done in place, then home on the same arc.', haptic: 'success' },
      { at: T2, text: 'Sitting on a row, she rides it when the page scrolls.' },
      { at: scrollStart + .55, text: 'Its row is leaving: she lets go and flies home.' },
    ],
  };
};
// A small local work state (no readers): the lights orbit tightly round where she sits.
function localWork(w) {
  return { ...w, at: w.at, small: true };
}

// 4. Drag: a press that moves picks her up; she follows a little above the finger with paint lag; let go and she
// settles at the nearest dock along the throw. A press that holds still is still "hold to talk".
SCENES.drag = () => {
  const DOCKS = [HOME, { x: 47, y: 779 }]; // Design 51: two docks only
  const P = 1.5, pick = P + .12;
  // Finger path keyframes: [t, x, y]
  const F = [[P - .3, 346, 830], [P, 346, 806], [pick, 344, 800], [P + .9, 230, 640], [P + 1.6, 120, 720], [P + 2.0, 80, 770]];
  const rel1 = P + 2.0, settle1 = rel1;
  const P2 = rel1 + 1.6, F2 = [[P2 - .3, 47, 830], [P2, 47, 806], [P2 + .5, 150, 760], [P2 + .75, 230, 780]];
  const rel2 = P2 + .75; // flick: released moving up-right, projected to the right-edge dock
  const fingerAt = (keys, t) => {
    if (t <= keys[0][0]) return { x: keys[0][1], y: keys[0][2] };
    for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
      const [t0, x0, y0] = keys[i - 1], [t1, x1, y1] = keys[i];
      const u = easeInOut((t - t0) / (t1 - t0)); return { x: lerp(x0, x1, u), y: lerp(y0, y1, u) };
    }
    const l = keys[keys.length - 1]; return { x: l[1], y: l[2] };
  };
  const finger = t => {
    if (t < P - .3) return null;
    if (t < rel1 + .25) { const f = fingerAt(F, t); return { ...f, alpha: t < P - .1 ? ramp(t, P - .3, .2) : 1 - ramp(t, rel1, .25), press: 1 - .1 * ramp(t, P, .1) }; }
    if (t < P2 - .3) return null;
    const f = fingerAt(F2, t);
    return { ...f, alpha: t < P2 - .1 ? ramp(t, P2 - .3, .2) : 1 - ramp(t, rel2, .2), press: 1 };
  };
  // She sits 44 pt above the fingertip so the finger never covers her, and follows on the snappy spring.
  const follow = (keys, t, from) => {
    const f = fingerAt(keys, t), lag = fingerAt(keys, t - .06);
    return { x: lerp(lag.x, f.x, .4), y: lerp(lag.y, f.y, .4) - 44 * ramp(t, from, .18) };
  };
  const centre = t => {
    if (t < pick) return HOME;
    if (t < rel1) {
      const c = follow(F, t, pick);
      // Lift from home into the hand: blend from home over 180 ms.
      const u = ramp(t, pick, .18);
      return { x: lerp(HOME.x, c.x, u), y: lerp(HOME.y, c.y, u) };
    }
    const dropFrom = (() => { const f = fingerAt(F, rel1); return { x: f.x, y: f.y - 44 }; })();
    if (t < P2 + .12) { const s = spring(t - rel1); return { x: lerp(dropFrom.x, DOCKS[1].x, s), y: lerp(dropFrom.y, DOCKS[1].y, s) }; }
    if (t < rel2) {
      const c = follow(F2, t, P2 + .12); const u = ramp(t, P2 + .12, .18);
      return { x: lerp(DOCKS[1].x, c.x, u), y: lerp(DOCKS[1].y, c.y, u) };
    }
    const f = fingerAt(F2, rel2), from = { x: f.x, y: f.y - 44 };
    const s = spring(t - rel2, .55, .14);
    return { x: lerp(from.x, DOCKS[0].x, s), y: lerp(from.y, DOCKS[0].y, s) };
  };
  const carried = t => (t > pick && t < rel1 + .1) || (t > P2 + .12 && t < rel2 + .1);
  const scale = t => {
    const up = ramp(t, pick, .16) * (1 - ramp(t, rel1, .3)) + ramp(t, P2 + .12, .16) * (1 - ramp(t, rel2, .3));
    return 1 + .22 * up;
  };
  // Paint lag: while carried, each dab trails its own amount behind the motion, so she stretches a little.
  let prev = null;
  const wobble = (parts, t, C) => {
    const v = prev ? { x: (C.x - prev.x) * 60, y: (C.y - prev.y) * 60 } : { x: 0, y: 0 };
    prev = { ...C };
    const lagK = [0.010, 0.016, 0.022, 0.03, 0.034, 0.026];
    return parts.map((p, i) => {

function ground() {

  if (dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.restore();

  const t20 = find(t => pull(t) >= 20, 1, 3), t90 = find(t => pull(t) >= 90, 1, 3), tPickT = find(t => pickedAt(t) === 2, 1, 3), tPickToday = find(t => pickedAt(t) === 1, 2.2, 3.6), tPickT2 = find(t => t > 2.7 && pickedAt(t) === 2, 2.7, 3.6);
  return {
    duration: 8.6,
    lines: [],
    draw: t => {
      const P = Pf(t), fl = flightOf(t), ar = areaAt(t);
      const nameA = fl ? 0 : 1 - P;
      ground(); (ar === 2 ? pageTraining : pageToday)(nameA);
      if (P > .001) {
        scratch.width = canvas.width; scratch.height = canvas.height; scratch.getContext('2d').drawImage(canvas, 0, 0);
        ground();
        ctx.save(); const s = 1 - .1 * P, ty = 40 * P;
        ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * (W / 2 - s * W / 2), DPR * (H / 2 - s * H / 2 + ty));
        ctx.filter = `blur(${6 * P * DPR}px)`; ctx.drawImage(scratch, 0, 0, W, H + CAP); ctx.restore();
        // ASSUMED: glass fill (the sheet names Liquid Glass but no values)
        ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); const gy = -40 * (1 - P);
        ctx.beginPath(); ctx.roundRect(0, gy - 60, W, GLASS_H + 60, [0, 0, 40, 40]);
        ctx.fillStyle = rgba(LOOK.ground, .92 * P); ctx.fill(); ctx.fillStyle = rgba(LOOK.ink, .07 * P); ctx.fill();
        ctx.lineWidth = 1; ctx.strokeStyle = rgba(LOOK.ink, .14 * P); ctx.stroke(); ctx.restore();
        AREAS.forEach((a, i) => {
          const Pi = Pf(t - STAG * i), top = ROW0 + ROWDY * i + gy * 0 - 40 * (1 - Pi) * 0, pk = pickSm(i, t);
          const here = i === ar, isFly = fl && fl.i === i;
          const baseA = here ? 1 : .42, col = pk > 0 ? (i === 1 ? LOOK.ink : areaCol(i)) : LOOK.ink;
          const alpha = Pi * (isFly ? 0 : lerp(baseA, 1, pk));
          const sc = 1 + .06 * pk, w = i === 1 && pk > 0 ? lerp(600, 700, pk) : 600, y = top + 36 - 40 * (1 - Pi);
          ctx.save(); ctx.translate(24, y); ctx.scale(sc, sc); ctx.translate(-24, -y);
          tx(a, 24, y, 40, col, w, 'left', alpha, -.02); ctx.restore();
          tx(LIVE[i], 24, y + 30, 17, LOOK.ink, 500, 'left', alpha * .7);
        });
        const hint = t >= TAP - .1 ? 'Tap one to open' : 'Let go to open';
        tx(hint, 24, HINT_Y, 15, LOOK.inkSoft, 500, 'left', P);
      }
      if (fl) {
        const sz = lerp(40, 15.2, fl.u), w = lerp(600, 700, fl.u), y = lerp(fl.top, 52, fl.u), trk = lerp(-.02, .08, fl.u);
        tx(AREAS[fl.i], 24, y, sz, fl.i === 2 ? mixHex(LOOK.ink, LOOK.live, .72 * (1 - fl.u)) : LOOK.ink, w, 'left', 1, trk);
      }
    },
    finger: t => {
      if (t > .9 && t < REL1 + .2) return { x: 200, y: fy(Math.min(t, REL1)), alpha: ramp(t, .9, .1) * (1 - ramp(t, REL1, .2)), press: .9 };
      return tapFinger(t, TAP - .15, 52, 48) || tapFinger(t, 6.75, 220, 250);
    },
    soul: calmSoul([]),
    caps: [
      { at: 0, text: 'A tab page at rest: the name, one word at 52.' },
      { at: T0, text: '1.0 pull down at offset 0; the page follows.' },
      { at: t20, text: `${t20} 20 pt: index forms (page 0.9, blur 6, down 40).` },
      { at: t90, text: `${t90} 90 pt: held; the row under the finger is picked.`, haptic: '.selection, once per row' },
      { at: tPickToday, text: `${tPickToday} over TODAY: ink at 700, 1.06×.`, haptic: '.selection' },
      { at: tPickT2, text: `${tPickT2} back on TRAINING: area colour 72%, 1.06×.`, haptic: '.selection' },
      { at: REL1, text: `${REL1} let go: it flies to the name, 0.38× in 460 ms.` },
      { at: REL1 + FLY, text: `${(REL1 + FLY).toFixed(2)} lands as the name; page full size, sharp.`, haptic: '.impact(.soft)' },
      { at: TAP, text: `${TAP} tap the name: the same index. "Tap one to open".` },
      { at: 6.75, text: '6.75 tap TODAY.' },
      { at: REL2, text: `${REL2} TODAY flies up (460 ms); the index closes.` },
      { at: REL2 + FLY, text: `${(REL2 + FLY).toFixed(2)} lands. Tess never moved.`, haptic: '.impact(.soft)' },
    ],
  };
};

// ---- 72 round 2, the title moves
PICKS.accent = () => {
  const SETS = [1.0, 2.2, 3.4], DONE = 4.6, STEP = .6, STRIKE = .42, LIFT = .25, DRY_AT = .9, DRY = 2;
  const pAt = t => { // the thing's count, capped at .85 until done
    let p = 0; SETS.forEach((s, k) => { p = Math.max(p, lerp(.85 * k / 4, .85 * (k + 1) / 4, ramp(t, s, STEP, houseCurve)) * (t >= s ? 1 : 0)); });
    return t >= DONE ? lerp(.85 * 3 / 4, 1, ramp(t, DONE, STEP, houseCurve)) : p;
  };
  const dryU = t => ramp(t, DONE + DRY_AT, DRY, easeInOut);
  const lift = t => ramp(t, DONE + STRIKE, LIFT, easeOut) ;
  const strikeU = t => ramp(t, DONE, STRIKE, easeOut);
  const wordU = t => ramp(t, SETS[0], STEP, houseCurve);
  const LINES = [[['Push A', 0]], [['at ', 0], ['12:15 pm', 1]]];
  const SIZE = 56, Y0 = 250, LH = 64;
  const amt = (t, isWord) => { const p = pAt(t), d = dryU(t); return (isWord ? .72 * wordU(t) : lerp(.6 * p, .72, lift(t))) * (1 - d); };
  return {
    duration: 9.4, lines: [],
    draw: t => {
      ground();
      tx('TRAINING', 24, 52, 15, LOOK.ink, 700, 'left', 1, .08);
      tx('Friday morning', 24, 138, 21, LOOK.ink, 500);
      const p = pAt(t), d = dryU(t), wgt = lerp(500, 640, p) , trk = -.012 * p, fade = lerp(1, .5, d);
      const doneW = lerp(wgt, 500, d) , doneT = lerp(trk, 0, d);
      const stroke = strikeU(t);
      // total width for the strike, which wraps with the lines
      const lw = LINES.map(l => l.reduce((s, [str]) => s + txw(str, SIZE, doneW, doneT), 0));
      const tot = lw[0] + lw[1];
      LINES.forEach((line, li) => {
        let x = 24; const y = Y0 + li * LH;
        line.forEach(([str, isWord]) => {
          tx(str, x, y, SIZE, mixHex(LOOK.ink, LOOK.live, amt(t, isWord)), doneW, 'left', fade, doneT); x += txw(str, SIZE, doneW, doneT);
        });
        // the 3 pt strike through the x-height, left to right across both lines
        const from = li === 0 ? 0 : lw[0], to = from + lw[li];
        const reach = clamp01((stroke * tot - from) / lw[li]);
        if (reach > 0) {
          ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = fade;
          ctx.fillStyle = mixHex(LOOK.ink, LOOK.live, .72 * (1 - d)); ctx.fillRect(24, y - SIZE * .27 - 1.5, lw[li] * reach, 3); ctx.restore();
        }
      });
      tx('SETS', 24, 380, 16, LOOK.inkSoft, 600);
      const done = SETS.filter(s => t >= s).length + (t >= DONE ? 1 : 0);
      tx(`${done} of 4`, 24, 420, 21, LOOK.ink, 500);
      for (let k = 0; k < 4; k++) { ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.beginPath(); ctx.arc(32 + k * 30, 452, 8, 0, 7); ctx.fillStyle = k < done ? LOOK.ink : rgba(LOOK.ink, .18); ctx.fill(); ctx.restore(); }
      tx(`p ${pAt(t).toFixed(2)}`, 369, 420, 16, LOOK.inkSoft, 500, 'right');
    },
    soul: calmSoul([]),
    caps: [
      { at: 0, text: 'At rest: plain ink, weight 500. p 0.' },
      { at: SETS[0], text: '1.0 set 1: p 0.21; weight, lean, the word move (600 ms).' },
      { at: SETS[1], text: '2.2 set 2: p 0.43 (weight 500 to 640, lean to 60%).' },
      { at: SETS[2], text: '3.4 set 3: p 0.64. Capped at 0.85 until done.' },
      { at: DONE, text: '4.6 done: p 1; the 3 pt strike draws in 420 ms.' },
      { at: DONE + STRIKE, text: '5.02 one 250 ms lift to the area colour.' },
      { at: DONE + DRY_AT, text: '5.5 900 ms later: dries over 2 s to ink at 50%.' },
      { at: DONE + DRY_AT + DRY, text: '7.5 dried. The strike stays.' },
    ],
  };
};
// M1 (board 9:50 refill, sheet 84): the error notice. It replaces Tess's line in the UNDO slot; a tap dims it to 60%
// with a 0.5 pt ink line over 150 ms; success crossfades to the receipt. Reduce Motion (?rm=1): crossfades only.
PICKS['error-notice'] = () => {
  const ERR = .6, TAP = 3.2, OK = 5.0, D = 7.4, CF = .22;
  const err = 'Couldn’t save bench 2 × 10 at 80.', rcpt = 'Logged bench 2 × 10 at 80.';
  const fadeIn = (t, at, d) => ramp(t, at, d);
  const blurText = (str, y, a, col, blur, b = a) => {
    if (a < .01) return;
    ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.filter = blur ? `blur(${((1 - b) * 4 * DPR).toFixed(2)}px)` : 'none';
    ctx.globalAlpha = a; ctx.font = font(17, 500); ctx.fillStyle = col; ctx.textAlign = 'left';
    ctx.fillText(str, 24, y); ctx.restore();
  };
  return {
    duration: D,
    draw: t => {
      HOME41.draw();
      // Arrival: 300 ms blur-in (house line), or a 150 ms crossfade in Reduce Motion. Leaves in 220 ms at OK.
      const inA = RM ? fadeIn(t, ERR, .15) : fadeIn(t, ERR, .3);
      const dim = 1 - .4 * ramp(t, TAP, .15, houseCurve);
      const outA = 1 - ramp(t, OK, CF);
      const a = inA * outA;
      blurText(err, 785, a * dim, LOOK.tess, !RM, inA);
      const sa = a * dim;
      if (sa > .01) {
        text('TRY AGAIN', 24, 812, 16, LOOK.ink, 700, 'left', sa * .9);
        stroke(24, 24 + width('TRY AGAIN', 16), 818, 1.5, LOOK.ink, sa);
        // The 0.5 pt ink line draws under her line over 150 ms, left to right.
        const lw = width(err, 17) * ramp(t, TAP, .15, houseCurve);
        if (lw > .5) stroke(24, 24 + lw, 794, .5, LOOK.ink, outA);
      }
      // Success: the receipt and UNDO crossfade in the same slot.
      const rA = ramp(t, OK, CF);
      blurText(rcpt, 785, rA, LOOK.tess, false);
      if (rA > .01) { text('UNDO', 24, 812, 16, LOOK.ink, 700, 'left', rA * .9); stroke(24, 24 + width('UNDO', 16), 818, 1.5, LOOK.ink, rA); }
    },
    finger: t => (t > TAP - .2 && t < TAP + .25) ? { x: 70, y: 806, alpha: 1 - ramp(t, TAP, .25) } : null,
    soul: { modes: [{ mode: 'idle', at: -10 }], centre: () => ({ x: HOME.x, y: HOME.y }) },
    caps: [
      { at: 0, text: 'A save fails. Her line is the only thing that changes.' },
      { at: ERR, text: RM ? '0.6 the notice crossfades in (150 ms), in her slot.' : '0.6 the notice blurs in (300 ms), in the UNDO slot.', haptic: '.warning (the notice’s one)' },
      { at: TAP, text: '3.2 tap: dims to 60%, a 0.5 pt line draws (150 ms).' },
      { at: TAP + 1, text: '4.2 waiting. The page has not moved.' },
      { at: OK, text: '5.0 success: 220 ms crossfade to the receipt. No haptic.' },
    ],
  };
};
for (const [name, make] of Object.entries(PICKS)) SCENES['pick-' + name] = () => { const s = make(); s.lines = s.lines || []; return s; };

// The work state when she's out on a row: tighter constellation, no readers.
const _workParticles = workParticles;
workParticles = function (t, work) {
  if (!work.small) return _workParticles(t, work);
  const res = [];
  CONSTELLATION.concat(READERS.map(([i]) => [i, 14, 9, 5 + i * .3, 4.4 + i * .2, i, i === 1 ? 13 : 11])).forEach(c => {
    const [i, ax, ay, px, py, ph, r] = c;
    res[i] = constellationPose([i, ax * .55, ay * .55, px * .8, py * .8, ph, r * .8], t, work.at);
  });
  return res;
};
// Roam's work follows wherever she is.
const _compose = composeSoul;

let scene = null;
function renderAt(t) {
  if (!scene) scene = SCENES[SCENE]();
  if (scene.segments) {
    const seg = scene.segments.findLast(x => x.start <= t) || scene.segments[0];
    const u = t - seg.start;
    seg.draw(u); drawLine(seg.lines, u); if (!seg.soul.hidden) composeSoul(u, seg.soul); if (seg.finger) drawFinger(seg.finger(u)); drawCaption(seg.caps, u);
    return;
  }
  if (scene.draw) scene.draw(t); else drawPage(scene.page ? scene.page(t) : {});
  drawLine(scene.lines, t);
  let soul = scene.soul;
  if (RM && !soul.frozen) {
    // Soul at idle's still frame: opacity breath and blink only. The look offset, ripple, lean, stretch and beats are dropped.
    const eyes = soul.eyes;
    soul = { modes: [{ mode: 'idle', at: -10 }], centre: soul.centre, frozen: true, reduced: () => 0, eyes: eyes ? t2 => { const e = eyes(t2); return { ...e, look: { x: 0, y: 0 } }; } : undefined };
  }
  if (soul.frozen) {
    // Reduce Motion: the soul's frame is frozen at idle's still phase (no TimelineView ticking).
    // Design (11-13 pass): the breath is opacity only, 0.85 to 1 over 3.2 s, and the blink stays.
    const breath = .85 + .15 * easeInOut(1 - Math.abs(2 * (((t % 3.2) + 3.2) % 3.2) / 3.2 - 1));
    composeSoul(0, { ...soul, modes: [{ mode: 'idle', at: -10 }], reduced: () => soul.reduced(t), opacityMul: () => breath, eyes: soul.eyes ? () => soul.eyes(t) : undefined });
  } else {
    // `tick` holds the soul at that frame rate (Low Power: 30 fps) while the page stays at 60.
    const tt = soul.tick ? Math.floor(t * soul.tick) / soul.tick : t;
    if (scene.timeScale) {
      // A slower soul clock (sleep): her motion runs at a fraction of time, her eyes and overlays on real time.
      let acc = 0; const dt = 1 / 120; for (let u = 0; u < tt; u += dt) acc += scene.timeScale(u) * dt;
      const wrap = f => f ? (() => f(t)) : f;
      composeSoul(acc, { ...soul, eyes: wrap(soul.eyes), beat: wrap(soul.beat), scale: wrap(soul.scale), centre: wrap(soul.centre) });
    } else composeSoul(tt, soul);
  }
  if (scene.finger) drawFinger(scene.finger(t));
  drawCaption(scene.caps, t);
}
window.renderAt = renderAt;
window.sceneDuration = () => { if (!scene) scene = SCENES[SCENE](); return scene.duration; };
window.ready = document.fonts.ready.then(() => document.fonts.load('500 18px "Inter Tight"')).then(() => { scene = SCENES[SCENE](); renderAt(0); return true; });

// Live preview when opened in a browser (not recording): play the scene on a loop.
if (!params.has('record')) {
  window.ready.then(() => {
    const start = performance.now();
    const tick = now => { const t = ((now - start) / 1000) % scene.duration; renderAt(t); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
</script>
