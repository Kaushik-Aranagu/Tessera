name: Pilot
options:
  bundleIdPrefix: com.kaushikaranagu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Pilot:
    type: application
    platform: iOS
    sources:
      - App
      - DesignSystem
      - Core
      - Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaushikaranagu.pilot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Pilot
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  PilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PilotTests
    dependencies:
      - target: Pilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaushikaranagu.pilot.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pilot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Pilot"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Pilot:
    build:
      targets:
        Pilot: all
        PilotTests: [test]
    test:
      targets:
        - PilotTests
