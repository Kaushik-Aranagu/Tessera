name: Tessera
options:
  bundleIdPrefix: com.kaushikaranagu
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Tessera:
    type: application
    platform: iOS
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
    sources:
      - App
      - DesignSystem
      - Core
      - Features
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaushikaranagu.tessera
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Tessera
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  TesseraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TesseraTests
    dependencies:
      - target: Tessera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaushikaranagu.tessera.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tessera.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tessera"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Tessera:
    build:
      targets:
        Tessera: all
        TesseraTests: [test]
    test:
      targets:
        - TesseraTests
