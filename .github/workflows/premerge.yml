name: premerge
# Runs the merge recipe's mechanical checks. No Swift here: the build check stays with QA and test.sh on the Mac.
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  premerge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved by the runner on the #592 run)
        with:
          fetch-depth: 0
      - name: Stale-tree check
        run: scripts/ops/tree_check.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
      - name: Diff scans (secrets, data safety, pin lines, scripts rules)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt"
          git show "origin/${{ github.base_ref }}:docs/product/decisions.md" > "$RUNNER_TEMP/decisions.md"
          git diff --unified=0 --no-color "origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}" | python3 -I scripts/ops/premerge_check.py --pr-body "$RUNNER_TEMP/pr_body.txt" --decisions "$RUNNER_TEMP/decisions.md"
      - name: Pin-ruling tests
        run: python3 -B -I scripts/ops/test_premerge_pin.py
